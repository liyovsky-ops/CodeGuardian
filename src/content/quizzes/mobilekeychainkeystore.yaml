threatId: '15.17'
title:
  en: Keychain / Keystore Misuse -- knowledge check
  pl: Keychain / Keystore Misuse -- sprawdzian wiedzy
passScore: 80
questions:
- id: q1
  type: multiple-choice
  prompt:
    en: All three research passes converged on the same central myth-correction for this entry, backed by the KeyDroid academic study. What is it?
    pl: Wszystkie trzy przejścia badawcze zbiegły się na tej samej centralnej korekcie mitu dla tego wpisu, poparte badaniem akademickim KeyDroid. Jaka to korekta?
  choices:
  - id: a
    label:
      en: Hardware-backed key storage (Secure Enclave/TEE/StrongBox) prevents an attacker from EXTRACTING raw key material, but does nothing to stop the key being USED if it lacks authentication binding -- non-extractable is not the same as unusable
      pl: Przechowywanie kluczy wsparte sprzętowo (Secure Enclave/TEE/StrongBox) zapobiega WYODRĘBNIENIU surowego materiału klucza przez atakującego, ale nic nie robi by powstrzymać UŻYCIE klucza jeśli brakuje mu wiązania uwierzytelnienia -- niewyodrębnialny to nie to samo co nieużywalny
  - id: b
    label:
      en: Hardware-backed key storage is unbreakable under all circumstances, including runtime hooking on a rooted device
      pl: Przechowywanie kluczy wsparte sprzętowo jest niezłamywalne w każdych okolicznościach, włącznie z zahaczaniem w czasie wykonania na zrootowanym urządzeniu
  - id: c
    label:
      en: Software-only key storage is always safer than hardware-backed storage because it avoids StrongBox performance costs
      pl: Przechowywanie kluczy wyłącznie w oprogramowaniu jest zawsze bezpieczniejsze niż wsparte sprzętowo ponieważ unika kosztów wydajnościowych StrongBox
  correctChoiceIds:
  - a
  explanation:
    en: KeyDroid's analysis of 490,119 apps found 56.3% of apps self-reporting sensitive-data processing use no trusted hardware at all, and only 15.84% of Keystore keys require any authentication -- concrete evidence that developers routinely conflate 'stored in the Keystore' with 'safe,' when the auth-binding attribute, not just the storage tier, is what actually gates use.
    pl: Analiza KeyDroid 490119 apek znalazła że 56.3% apek same zgłaszających przetwarzanie wrażliwych danych nie używa żadnego zaufanego sprzętu w ogóle, a tylko 15.84% kluczy Keystore wymaga jakiegokolwiek uwierzytelnienia -- konkretny dowód że deweloperzy rutynowo mylą 'przechowywane w Keystore' z 'bezpieczne', podczas gdy to atrybut wiązania uwierzytelnienia, nie tylko poziom przechowywania, faktycznie bramkuje użycie.
- id: q2
  type: vuln-or-not
  prompt:
    en: An Android app displays a biometric prompt before decrypting sensitive data, but validates the biometric result entirely in its own Kotlin code rather than binding the check to the Keystore key via a BiometricPrompt.CryptoObject. This is exactly the pattern confirmed as the root cause of a real, named CVE. Is this app exposed on a rooted device?
    pl: Apka Android wyświetla monit biometryczny przed odszyfrowaniem wrażliwych danych, ale waliduje wynik biometryczny całkowicie we własnym kodzie Kotlin zamiast wiązać sprawdzenie z kluczem Keystore przez BiometricPrompt.CryptoObject. To dokładnie wzorzec potwierdzony jako pierwotna przyczyna prawdziwego, nazwanego CVE. Czy ta apka jest narażona na zrootowanym urządzeniu?
  isVulnerable: true
  cwe: CWE-522
  explanation:
    en: Yes -- this is precisely the CVE-2021-3145 (Ionic Identity Vault) pattern. If the Keystore key itself does not require authentication, the biometric prompt is purely a UI-layer illusion. A rooted attacker hooks the app's own result-callback function to force a success response, bypassing the prompt entirely without ever touching the fingerprint sensor.
    pl: Tak -- to dokładnie wzorzec CVE-2021-3145 (Ionic Identity Vault). Jeśli sam klucz Keystore nie wymaga uwierzytelnienia, monit biometryczny jest czystą iluzją warstwy UI. Zrootowany atakujący zahacza własną funkcję callback wyniku apki by wymusić odpowiedź sukcesu, całkowicie omijając monit nigdy nie dotykając czytnika linii papilarnych.
- id: q3
  type: multiple-choice
  prompt:
    en: Two of three independent research passes explicitly checked MITRE's own mapping guidance and rejected CWE-320 (Key Management Errors) as this entry's CWE, despite it conceptually describing the right problem area. Why?
    pl: Dwa z trzech niezależnych przejść badawczych jawnie sprawdziły własne wskazówki mapowania MITRE i odrzuciły CWE-320 (Key Management Errors) jako CWE tego wpisu, mimo że koncepcyjnie opisuje właściwy obszar problemu. Dlaczego?
  choices:
  - id: a
    label:
      en: CWE-320 is a Category, not a base weakness, and MITRE's own mapping guidance has discouraged category-level mapping since 2019
      pl: CWE-320 to Category, nie podstawowa słabość, a własne wskazówki mapowania MITRE odradzają mapowanie na poziomie kategorii od 2019
  - id: b
    label:
      en: CWE-320 has been completely removed from the CWE database and no longer exists
      pl: CWE-320 zostało całkowicie usunięte z bazy danych CWE i już nie istnieje
  - id: c
    label:
      en: CWE-320 only applies to web applications and has no relevance to mobile platforms
      pl: CWE-320 dotyczy tylko aplikacji webowych i nie ma znaczenia dla platform mobilnych
  correctChoiceIds:
  - a
  explanation:
    en: 'CWE-320 remains a valid, live entry in the CWE database -- it is simply a Category (an organizational grouping) rather than a Base/Variant weakness, and MITRE''s mapping notes explicitly discourage using categories as the mapped CWE for a specific vulnerability. This is a subtle but important distinction: conceptually relevant is not the same as mapping-eligible.'
    pl: 'CWE-320 pozostaje ważnym, żywym wpisem w bazie danych CWE -- to po prostu Category (grupowanie organizacyjne) zamiast słabości Base/Variant, a notatki mapowania MITRE jawnie odradzają używanie kategorii jako zmapowanego CWE dla konkretnej podatności. To subtelne ale ważne rozróżnienie: koncepcyjnie istotne to nie to samo co kwalifikujące się do mapowania.'
- id: q4
  type: vuln-or-not
  prompt:
    en: A developer stores an authentication token using kSecAttrAccessibleAlways and reasons that since the item is encrypted by the Keychain, it is safe even if the device is stolen while locked. Is this reasoning correct?
    pl: Deweloper przechowuje token uwierzytelniający używając kSecAttrAccessibleAlways i rozumuje że skoro element jest zaszyfrowany przez Keychain, jest bezpieczny nawet jeśli urządzenie zostanie skradzione podczas gdy jest zablokowane. Czy to rozumowanie jest poprawne?
  isVulnerable: true
  cwe: CWE-522
  explanation:
    en: No. kSecAttrAccessibleAlways items are decryptable even in the Before-First-Unlock state -- a locked, freshly rebooted device with no passcode ever entered -- because the item's protection key is not derived from the device passcode at all. This is the exact reason the class is deprecated and is the classic misconfiguration this entry documents.
    pl: Nie. Elementy kSecAttrAccessibleAlways są odszyfrowywalne nawet w stanie Before-First-Unlock -- zablokowanym, świeżo zrestartowanym urządzeniu z nigdy niewprowadzonym kodem dostępu -- ponieważ klucz ochrony elementu w ogóle nie jest wyprowadzony z kodu dostępu urządzenia. To dokładny powód dla którego klasa jest wycofana i klasyczna błędna konfiguracja którą dokumentuje ten wpis.
- id: q5
  type: multiple-choice
  prompt:
    en: Per Android's own documentation, why does research rank short per-operation authentication above long time-based validity windows for Keystore key authentication?
    pl: Zgodnie z własną dokumentacją Android, dlaczego badania klasyfikują krótkie uwierzytelnienie per-operacja wyżej niż długie okna ważności oparte na czasie dla uwierzytelnienia klucza Keystore?
  choices:
  - id: a
    label:
      en: Secure hardware typically lacks an independent, secure real-time clock, so it does not reliably enforce time-based validity windows the way it enforces per-operation authentication checks
      pl: Bezpieczny sprzęt zazwyczaj nie posiada niezależnego, bezpiecznego zegara czasu rzeczywistego, więc nie egzekwuje niezawodnie okien ważności opartych na czasie w sposób w jaki egzekwuje sprawdzenia uwierzytelnienia per-operacja
  - id: b
    label:
      en: Time-based validity windows are always slower to compute than per-operation checks
      pl: Okna ważności oparte na czasie są zawsze wolniejsze do obliczenia niż sprawdzenia per-operacja
  - id: c
    label:
      en: Android does not support time-based validity windows on any device
      pl: Android nie wspiera okien ważności opartych na czasie na żadnym urządzeniu
  correctChoiceIds:
  - a
  explanation:
    en: 'This is a specific, primary-sourced nuance: because secure hardware generally lacks a trustworthy independent clock, a long authentication-validity window is a weaker guarantee than developers typically assume, which is exactly why per-operation binding (auth required for every single use) ranks as the stronger control.'
    pl: 'To konkretny, źródłowany pierwotnie niuans: ponieważ bezpieczny sprzęt zazwyczaj nie posiada wiarygodnego niezależnego zegara, długie okno ważności uwierzytelnienia jest słabszą gwarancją niż deweloperzy zwykle zakładają, co dokładnie dlatego wiązanie per-operacja (uwierzytelnienie wymagane dla każdego pojedynczego użycia) plasuje się jako silniejsza kontrola.'
- id: q6
  type: pick-the-fix
  prompt:
    en: A banking app needs to protect a stored authentication token as strongly as possible using the Android Keystore. Which key configuration actually closes the risk this deep-dive centers on?
    pl: Apka bankowa potrzebuje chronić przechowywany token uwierzytelniający tak silnie jak to możliwe używając Android Keystore. Która konfiguracja klucza faktycznie zamyka ryzyko na którym skupia się ten deep-dive?
  variants:
  - id: v1
    lang: kotlin
    code: "val spec = KeyGenParameterSpec.Builder(\"authKey\", KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)\n    .setBlockModes(KeyProperties.BLOCK_MODE_GCM)\n    .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)\n    .build()\n// no auth requirement at all"
  - id: v2
    lang: kotlin
    code: "val spec = KeyGenParameterSpec.Builder(\"authKey\", KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)\n    .setBlockModes(KeyProperties.BLOCK_MODE_GCM)\n    .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)\n    .setUserAuthenticationRequired(true)\n    .setUserAuthenticationValidityDurationSeconds(3600)  // 1-hour window\n    .build()\n// biometric result checked in app code, not via CryptoObject"
  - id: v3
    lang: kotlin
    code: "val spec = KeyGenParameterSpec.Builder(\"authKey\", KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)\n    .setBlockModes(KeyProperties.BLOCK_MODE_GCM)\n    .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)\n    .setUserAuthenticationRequired(true)\n    .setUserAuthenticationParameters(0, KeyProperties.AUTH_BIOMETRIC_STRONG)\n    .setInvalidatedByBiometricEnrollment(true)\n    .setIsStrongBoxBacked(true)\n    .build()\n// used only via a BiometricPrompt.CryptoObject bound to this key"
  correctVariantId: v3
  explanation:
    en: 'v3 combines every control this deep-dive ranks highest: per-operation authentication (not a time window), invalidation on new biometric enrollment, requested hardware backing, and -- critically -- use only through a CryptoObject that genuinely binds the authentication to the key rather than checking it in app code. v1 has no auth binding at all. v2 is the subtle trap: it looks protected (auth required, a validity window set) but the long time window is weaker than assumed, and if the result is checked in app code rather than via CryptoObject, it remains hookable exactly as in CVE-2021-3145.'
    pl: 'v3 łączy każdą kontrolę którą ten deep-dive klasyfikuje najwyżej: uwierzytelnienie per-operacja (nie okno czasowe), unieważnienie przy nowej rejestracji biometrycznej, żądane wsparcie sprzętowe, i -- kluczowo -- użycie tylko przez CryptoObject który naprawdę wiąże uwierzytelnienie z kluczem zamiast sprawdzać je w kodzie apki. v1 nie ma żadnego wiązania uwierzytelnienia. v2 to subtelna pułapka: wygląda na chronioną (wymagane uwierzytelnienie, ustawione okno ważności) ale długie okno czasowe jest słabsze niż zakładane, a jeśli wynik jest sprawdzany w kodzie apki zamiast przez CryptoObject, pozostaje omijalne dokładnie jak w CVE-2021-3145.'
