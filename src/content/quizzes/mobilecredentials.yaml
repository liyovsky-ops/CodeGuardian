threatId: '15.1'
title:
  en: Improper Credential Usage — knowledge check
  pl: Improper Credential Usage — sprawdzian wiedzy
passScore: 80
questions:
- id: q1
  type: vuln-or-not
  prompt:
    en: A team hardcodes an AWS secret key into their Android app's BuildConfig, but applies heavy ProGuard obfuscation and a commercial code-protection packer before release. Does this make the secret safe?
    pl: Zespół hardkoduje sekretny klucz AWS w BuildConfig apki Android, ale stosuje ciężką obfuskację ProGuard i komercyjny packer ochrony kodu przed wydaniem. Czy to czyni sekret bezpiecznym?
  isVulnerable: true
  cwe: CWE-798
  explanation:
    en: 'No -- this is the central finding all three research passes converged on, grounded directly in CWE-798''s own text: obfuscation raises the time cost of extraction but never changes the fact that the secret ships inside a binary the attacker already possesses. Constants survive symbol renaming, and any string decrypted at runtime for actual use is observable via Frida at the point of use regardless of how it was protected at rest in the binary.'
    pl: 'Nie -- to główne ustalenie do którego zbiegły się wszystkie trzy przejścia badawcze, ugruntowane bezpośrednio we własnym tekście CWE-798: obfuskacja podnosi koszt czasowy ekstrakcji ale nigdy nie zmienia faktu że sekret jest wysyłany wewnątrz binarki którą atakujący już posiada. Stałe przetrwają zmianę nazw symboli, a każdy string odszyfrowany w czasie wykonania do faktycznego użycia jest obserwowalny przez Frida w miejscu użycia niezależnie od tego jak był chroniony w spoczynku w binarce.'
- id: q2
  type: multiple-choice
  prompt:
    en: Why is a hardcoded credential in a mobile app binary considered a more severe risk than the same mistake in server-side code, even though both map to CWE-798?
    pl: Dlaczego zahardkodowane poświadczenie w binarce aplikacji mobilnej jest uważane za poważniejsze ryzyko niż ten sam błąd w kodzie po stronie serwera, mimo że oba mapują się do CWE-798?
  choices:
  - id: a
    label:
      en: The mobile binary is distributed directly to every user, including attackers, with no trust boundary protecting it -- extraction requires no server compromise at all, unlike server-side hardcoded credentials which require first breaching the host
      pl: Binarka mobilna jest dystrybuowana bezpośrednio do każdego użytkownika, włącznie z atakującymi, bez żadnej granicy zaufania która by ją chroniła -- ekstrakcja nie wymaga w ogóle kompromitacji serwera, w przeciwieństwie do zahardkodowanych poświadczeń po stronie serwera które wymagają najpierw naruszenia hosta
  - id: b
    label:
      en: Mobile apps always use weaker encryption algorithms than servers
      pl: Aplikacje mobilne zawsze używają słabszych algorytmów szyfrowania niż serwery
  - id: c
    label:
      en: There is no actual difference in severity -- this is a common misconception
      pl: Nie ma faktycznej różnicy w wadze -- to powszechne błędne przekonanie
  correctChoiceIds:
  - a
  explanation:
    en: 'All three research passes verified this directly against CWE-798''s own MITRE text, which explicitly singles out client-side systems as posing more risk precisely because "the extraction of a password from a binary is usually very simple." The trust-boundary difference -- not encryption strength -- is the structural reason OWASP ranks this the #1 mobile risk.'
    pl: 'Wszystkie trzy przejścia badawcze zweryfikowały to bezpośrednio względem własnego tekstu MITRE CWE-798, który jawnie wyróżnia systemy client-side jako stwarzające większe ryzyko dokładnie dlatego że "wyekstrahowanie hasła z binarki jest zwykle bardzo proste". Różnica granicy zaufania -- nie siła szyfrowania -- to strukturalny powód dla którego OWASP klasyfikuje to jako ryzyko #1 dla mobile.'
- id: q3
  type: vuln-or-not
  prompt:
    en: An app stores its Twitter API consumer key, consumer secret, access token, and access token secret together as hardcoded constants, all four in the same class. Is this a more severe risk than exposing just one of the four?
    pl: Apka przechowuje swój klucz konsumenta API Twitter, sekret konsumenta, token dostępu, i sekret tokenu dostępu razem jako zahardkodowane stałe, wszystkie cztery w tej samej klasie. Czy to poważniejsze ryzyko niż ujawnienie tylko jednego z czterech?
  isVulnerable: true
  cwe: CWE-798
  explanation:
    en: 'Yes -- verified via CloudSEK''s real 2022 research, corroborated by all three research passes: of 3,207 apps leaking at least one valid Twitter API key, 230 leaked all four OAuth credentials together, which is sufficient for full account takeover of the app vendor''s own official account (reading DMs, tweeting, modifying the profile) -- a qualitatively different impact than a single leaked key alone.'
    pl: 'Tak -- zweryfikowane przez prawdziwe badanie CloudSEK z 2022, potwierdzone przez wszystkie trzy przejścia badawcze: z 3207 apek ujawniających co najmniej jeden ważny klucz API Twitter, 230 ujawniło wszystkie cztery poświadczenia OAuth razem, co jest wystarczające do pełnego przejęcia oficjalnego konta dostawcy apki (czytanie DM, tweetowanie, modyfikacja profilu) -- jakościowo inny wpływ niż sam jeden wyciekły klucz.'
- id: q4
  type: multiple-choice
  prompt:
    en: This deep-dive cites both CWE-798 and CWE-522. What is the correct relationship between them?
    pl: Ten deep-dive cytuje zarówno CWE-798 jak i CWE-522. Jaka jest poprawna relacja między nimi?
  choices:
  - id: a
    label:
      en: They are siblings under the authentication umbrella, not parent/child -- CWE-798 covers hardcoding specifically, while CWE-522 covers the broader insecure storage/transmission of credentials
      pl: Są rodzeństwem pod parasolem uwierzytelniania, nie rodzic/dziecko -- CWE-798 pokrywa konkretnie hardkodowanie, podczas gdy CWE-522 pokrywa szersze niebezpieczne przechowywanie/transmisję poświadczeń
  - id: b
    label:
      en: CWE-522 is the parent of CWE-798
      pl: CWE-522 to rodzic CWE-798
  - id: c
    label:
      en: CWE-798 is the parent of CWE-522
      pl: CWE-798 to rodzic CWE-522
  correctChoiceIds:
  - a
  explanation:
    en: 'All three research passes independently verified this directly against MITRE: CWE-798 (Base-level, ChildOf CWE-344/671/1391) and CWE-522 (Class-level, ChildOf CWE-668/1390) are complementary weaknesses under the authentication umbrella, not linked in a parent-child hierarchy with each other -- cite both for the facets they each cover, don''t force one under the other.'
    pl: 'Wszystkie trzy przejścia badawcze niezależnie zweryfikowały to bezpośrednio względem MITRE: CWE-798 (poziom Base, ChildOf CWE-344/671/1391) i CWE-522 (poziom Class, ChildOf CWE-668/1390) to komplementarne słabości pod parasolem uwierzytelniania, niepowiązane hierarchią rodzic-dziecko między sobą -- cytuj oba dla aspektów które każde pokrywa, nie wymuszaj jednego pod drugim.'
- id: q5
  type: vuln-or-not
  prompt:
    en: A security researcher extracts what looks like an AWS access key from a decompiled app but stops there, reporting "hardcoded AWS key found" without testing it. Is this a complete confirmation of real-world risk?
    pl: Badacz bezpieczeństwa wyciąga coś co wygląda jak klucz dostępu AWS z zdekompilowanej apki ale na tym zatrzymuje się, zgłaszając "znaleziono zahardkodowany klucz AWS" bez jego przetestowania.  Czy to kompletne potwierdzenie realnego ryzyka?
  isVulnerable: true
  cwe: CWE-798
  explanation:
    en: No, and marking this vulnerable reflects a real gap in rigor -- a string that looks like a credential is not confirmed as exploitable until validated against the live provider API. This is exactly the step that turned Symantec's raw string-matching into the specific, credible finding that 77% of extracted AWS tokens were still valid and roughly half granted full S3 access -- without that validation step, the finding is unconfirmed.
    pl: Nie, i oznaczenie tego jako podatne odzwierciedla prawdziwą lukę w rzetelności -- string który wygląda jak poświadczenie nie jest potwierdzony jako wykorzystywalny dopóki nie zostanie zweryfikowany względem żywego API dostawcy. To dokładnie ten krok który zamienił surowe dopasowywanie stringów Symantec w konkretne, wiarygodne ustalenie że 77% wyekstrahowanych tokenów AWS wciąż było ważnych a mniej więcej połowa dawała pełny dostęp S3 -- bez tego kroku weryfikacji, ustalenie jest niepotwierdzone.
- id: q6
  type: pick-the-fix
  prompt:
    en: A mobile app needs to upload files to a private S3 bucket on behalf of the logged-in user. Which variant actually closes the hardcoded-credential risk?
    pl: Aplikacja mobilna musi wgrywać pliki do prywatnego zasobnika S3 w imieniu zalogowanego użytkownika. Który wariant faktycznie zamyka ryzyko zahardkodowanego poświadczenia?
  variants:
  - id: v1
    lang: kotlin
    code: "object ApiConfig {\n    const val AWS_ACCESS_KEY = \"AKIA...REDACTED\"\n    const val AWS_SECRET_KEY = \"wJalr...REDACTED\"  // obfuscated with ProGuard before release\n}"
  - id: v2
    lang: kotlin
    code: "suspend fun uploadReceipt(file: ByteArray) {\n    val grant = backend.requestScopedUpload(userToken)  // backend mints short-lived STS creds\n    httpsUpload(grant.url, file)                          // no AWS secret ever ships in the app\n}"
  - id: v3
    lang: kotlin
    code: 'val prefs = EncryptedSharedPreferences.create(context, "secure_prefs", masterKey, ...)

      prefs.edit().putString("aws_secret", "wJalr...REDACTED").apply()  // hardcoded, then re-saved encrypted'
  correctVariantId: v2
  explanation:
    en: 'v2 eliminates the class entirely: no AWS secret is ever compiled into the app, so there is nothing for jadx/apktool to extract regardless of obfuscation. v1''s ProGuard obfuscation is exactly the overrated defense this deep-dive ranks lowest -- the constant is still present and recoverable. v3 is a common but ineffective pattern: the secret is still hardcoded as a literal in source before being saved, so it''s still extractable from the decompiled code that performs the putString() call, even though the runtime storage location is now encrypted.'
    pl: 'v2 całkowicie eliminuje klasę: żaden sekret AWS nigdy nie jest skompilowany do apki, więc nie ma nic do wyekstrahowania przez jadx/apktool niezależnie od obfuskacji. Obfuskacja ProGuard z v1 to dokładnie przereklamowana obrona którą ten deep-dive klasyfikuje najniżej -- stała wciąż jest obecna i odzyskiwalna. v3 to powszechny ale nieskuteczny wzorzec: sekret wciąż jest zahardkodowany jako literał w źródle przed zapisaniem, więc wciąż jest odzyskiwalny ze zdekompilowanego kodu który wykonuje wywołanie putString(), mimo że lokalizacja przechowywania w czasie wykonania jest teraz zaszyfrowana.'
