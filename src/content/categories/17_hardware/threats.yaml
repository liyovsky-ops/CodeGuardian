  - id: "17.25"
    name: "Voltage / Clock Glitching Fault Injection (physical)"
    severity: "High"
    difficulty: "Unknown"
    confidence: "POSSIBLE"
    cwe:
      - "CWE-1247"
    desc: |
      [TŁUMACZENIE OCZEKUJĄCE] Physically injecting brief voltage droops or clock glitches (or EM/laser pulses) at a precise moment causes an embedded CPU/secure element to skip instructions or corrupt computation — used to bypass secure-boot signature checks, escape read-protection, or perform differential fault analysis to recover crypto keys. The classic hardware fault-attack model for smartcards, secure elements, and IoT/embedded devices; distinct from software-only undervolting (Plundervolt).
      
