  - id: "17.4"
    name: "Foreshadow / L1 Terminal Fault (L1TF)"
    severity: "High"
    difficulty: "Unknown"
    confidence: "POSSIBLE"
    cwe:
      - "CWE-1342"
    desc: |
      [TŁUMACZENIE OCZEKUJĄCE] Transient fault handling leaks any data resident in the L1 data cache, defeating Intel SGX enclave confidentiality and — in the L1TF-VMM variant — allowing a malicious guest to read the hypervisor and other VMs. Directly undermines VM isolation and trusted-enclave guarantees in multi-tenant clouds.
      
