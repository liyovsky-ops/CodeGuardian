  - id: "17.23"
    name: "BadUSB (malicious USB firmware reprogramming)"
    severity: "High"
    difficulty: "Unknown"
    confidence: "POSSIBLE"
    cwe:
      - "CWE-1299"
    desc: |
      [TŁUMACZENIE OCZEKUJĄCE] USB device controllers typically lack firmware-authenticity checks, so their firmware can be reflashed to make a benign-looking device covertly emulate a HID keyboard (inject keystrokes/commands), a network card (redirect traffic), or otherwise attack the host. The malice lives in firmware — invisible to antivirus and surviving OS reinstall/file wipe. A hardware trust-boundary attack.
      
