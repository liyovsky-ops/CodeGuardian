  - id: "17.22"
    name: "CLKSCREW (DVFS-based fault injection)"
    severity: "High"
    difficulty: "Unknown"
    confidence: "POSSIBLE"
    cwe:
      - "CWE-1247"
    desc: |
      [TŁUMACZENIE OCZEKUJĄCE] Abuses unprotected software control over a device's dynamic voltage/frequency scaling (energy-management) registers to push clock frequency past safe limits and induce computation faults — with no physical access or lab equipment. Demonstrated extracting AES keys from ARM TrustZone (via differential fault analysis) and loading self-signed code into TrustZone. Software-only fault injection; precursor to Plundervolt.
      
