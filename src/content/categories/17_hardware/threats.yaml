  - id: "17.18"
    name: "Cold Boot Attack"
    severity: "Medium"
    difficulty: "Unknown"
    confidence: "POSSIBLE"
    cwe:
      - "CWE-1300"
    desc: |
      [TŁUMACZENIE OCZEKUJĄCE] DRAM retains contents for seconds to minutes after power loss (longer when chilled), so an attacker with brief physical access can dump RAM and recover disk-encryption keys (e.g. BitLocker/FileVault/LUKS). Undermines full-disk encryption on unattended/lost devices; motivates memory encryption and key scrubbing on suspend.
      
