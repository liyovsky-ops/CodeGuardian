    desc: |
      [TŁUMACZENIE OCZEKUJĄCE] Systemic value extraction by reordering, inserting, or censoring transactions: a searcher observing a victim's pending DEX swap in the public mempool front-runs it to move the price, lets the victim execute at the worsened price, then back-runs to sell — the 'sandwich'. Formalized as MEV, a market-structure phenomenon broader than a single contract's transaction-order-dependence bug.
      
    desc_en: "Systemic value extraction by reordering, inserting, or censoring transactions: a searcher observing a victim's pending DEX swap in the public mempool front-runs it to move the price, lets the victim execute at the worsened price, then back-runs to sell — the 'sandwich'. Formalized as MEV, a market-structure phenomenon broader than a single contract's transaction-order-dependence bug."
