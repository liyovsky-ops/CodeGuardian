    severity: "Medium"
    difficulty: "Hard"
    confidence: "POSSIBLE"
    cwe:
      - "CWE-328"
    desc: |
      MAC oparty na MD5/SHA1(secret||msg) podatny na length extension; słabe hashe na kolizje.

    desc_en: ""
    lang: "python"
    vuln: |
      import hashlib
      def mac(msg): return hashlib.sha1(SECRET + msg).hexdigest()  # length extension

    safe: |
      import hmac, hashlib
      def mac(msg): return hmac.new(SECRET, msg, hashlib.sha256).hexdigest()

