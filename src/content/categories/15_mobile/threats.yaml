- id: '15.21'
  name: Cloak & Dagger (Android overlay + accessibility attack)
  severity: High
  difficulty: Unknown
  confidence: POSSIBLE
  cwe:
  - CWE-1021
  desc: '[TŁUMACZENIE OCZEKUJĄCE] Combines two Android permissions — SYSTEM_ALERT_WINDOW (draw overlays) and BIND_ACCESSIBILITY_SERVICE — to seize control of the UI feedback loop: invisible/clickjacking overlays plus programmatic UI interaction enable stealthy keystroke logging, phishing, silent ''god-mode'' app installation, and PIN theft, with victims noticing nothing. Broader than plain tapjacking (which is overlay-only).

    '
  desc_en: 'Combines two Android permissions — SYSTEM_ALERT_WINDOW (draw overlays) and BIND_ACCESSIBILITY_SERVICE — to seize control of the UI feedback loop: invisible/clickjacking overlays plus programmatic UI interaction enable stealthy keystroke logging, phishing, silent ''god-mode'' app installation, and PIN theft, with victims noticing nothing. Broader than plain tapjacking (which is overlay-only).'
