threats:
- id: '15.1'
  name: Improper Credential Usage
  severity: Critical
  difficulty: Easy
  confidence: POSSIBLE
  cwe:
  - CWE-798
  - CWE-522
  desc: 'Zahardkodowane poświadczenia, klucze API, albo tokeny osadzone w binarce aplikacji, albo niebezpieczna obsługa/transmisja poświadczeń -- wyekstrahowywalne przez dekompilację APK/IPA (jadx, apktool, class-dump) i ponownie użyte przez atakujących. Ranking #1 OWASP Mobile Top 10 2024: binarka jest dystrybuowana bezpośrednio do każdego użytkownika, więc każdy zahardkodowany sekret trzeba traktować jako już publiczny -- obfuskacja podnosi koszt ekstrakcji, nigdy jej nie eliminuje.

    '
  desc_en: 'Hardcoded credentials, API keys, or tokens embedded in the app binary, or insecure credential handling/transmission -- extractable via APK/IPA decompilation (jadx, apktool, class-dump) and reused by attackers. Ranked #1 in OWASP Mobile Top 10 2024: the binary is distributed directly to every user, so any hardcoded secret must be treated as already public -- obfuscation raises the cost of extraction, never eliminates it.'
  lang: kotlin
  vuln: "object ApiConfig {\n    // ANTI-PATTERN: compiled into BuildConfig/DEX, recoverable via jadx in minutes\n    const val AWS_SECRET = \"wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\"\n}\n"
  safe: "// SAFE: no long-lived secret in the client -- backend mints a short-lived, scoped token\nsuspend fun uploadReceipt(file: ByteArray) {\n    val grant = backend.requestScopedUpload(userToken)\n    httpsUpload(grant.url, file)\n}\n"
  note_en: 'Source: OWASP Mobile Top 10 2024, M1. Partially overlaps existing catalog entries (data_exposure desc #218, auth #172) but as the general mobile credential-usage risk it is broader than hardcoded-secret extraction.'
- id: '15.2'
  name: Inadequate Supply Chain Security (Mobile)
  severity: Critical
  difficulty: Hard
  confidence: POSSIBLE
  cwe:
  - CWE-1357
  - CWE-829
  desc: 'Złośliwe albo skompromitowane SDK firm trzecich, biblioteki, albo narzędzia budowania osadzone w aplikacji mobilnej wprowadzają backdoory, eksfiltrację danych, albo podatny kod który trafia na urządzenia użytkowników. Nowość w OWASP Mobile Top 10 2024 -- pojedynczy skompromitowany SDK reklamowy albo trojanizowany kompilator może propagować złośliwy kod do tysięcy niepowiązanych apek jednocześnie (XcodeGhost 2015, SourMint 2020).

    '
  desc_en: Malicious or compromised third-party SDKs, libraries, or build tooling embedded in a mobile app introduce backdoors, data exfiltration, or vulnerable code that ships to end-user devices. New to OWASP Mobile Top 10 2024 -- a single compromised ad SDK or trojanized compiler can propagate malicious code to thousands of unrelated apps simultaneously (XcodeGhost 2015, SourMint 2020).
  lang: groovy
  vuln: "dependencies {\n    implementation 'com.somevendor:ad-sdk:+'   // floating version, no vetting\n}\n"
  safe: "dependencies {\n    implementation('com.somevendor:ad-sdk:5.5.0')   // exact pin, reviewed before adoption\n}\n// dependencyLocking { lockAllConfigurations() } enabled + gradle.lockfile committed\n"
  note_en: 'Source: OWASP Mobile Top 10 2024, M2. Mobile-specific facet distinct from the existing general Supply Chain category (SDK bundling, app store signing).'
- id: '15.3'
  name: Insecure Authentication/Authorization (Mobile)
  severity: Critical
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-602
  - CWE-863
  - CWE-639
  desc: 'Kontrole uwierzytelniania albo autoryzacji tylko po stronie klienta, słabe zarządzanie sesją, albo zaufanie stanowi po stronie urządzenia który atakujący z lokalną kontrolą może ominąć albo sfałszować. OWASP: "zakładaj że wszystkie kontrole client-side mogą zostać ominięte" -- UI aplikacji to tylko jeden dzwoniący prawdziwego API backendu, więc atakujący może wywołać uprzywilejowane endpointy bezpośrednio przez proxy, całkowicie omijając UI.

    '
  desc_en: 'Client-side-only authentication or authorization checks, weak session handling, or trusting device-side state that an attacker with local control can bypass or forge. OWASP: "assume all client-side controls can be bypassed" -- the app UI is only one caller of the real backend API, so an attacker can call privileged endpoints directly via a proxy, bypassing the UI entirely.'
  lang: kotlin
  vuln: "fun onOpenAdminPanel() {\n    val role = prefs.getString(\"role\", \"user\")   // client-controlled, hookable\n    if (role == \"admin\") {\n        api.getAllUsers()                          // endpoint trusts the caller\n    }\n}\n"
  safe: "fun onOpenAdminPanel() {\n    api.getAllUsers()   // Authorization: Bearer <short-lived token>\n    // Backend independently re-verifies role + object-level access on every call\n}\n"
  note_en: 'Source: OWASP Mobile Top 10 2024, M3. Mobile nuance: trust boundary sits on an attacker-controlled device.'
- id: '15.4'
  name: Insufficient Input/Output Validation (Mobile)
  severity: Critical
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-20
  - CWE-89
  desc: 'Brak walidacji albo sanityzacji danych z IPC, deep linków, WebView, plików, albo odpowiedzi sieciowych, umożliwiający wstrzyknięcie, uszkodzenie pamięci, albo nadużycie logiki na urządzeniu. Dane przychodzące przez Intent, wyeksportowany Content Provider, albo niestandardowy schemat URL są tak samo nieufne jak wejście sieciowe, ale rutynowo walidowane z mniejszą rygorystycznością bo wyglądają wewnętrznie -- 2/2 prawdziwe CVE ownCloud i TikTok potwierdzają że to nie teoria.

    '
  desc_en: Failure to validate or sanitize data from IPC, deep links, WebViews, files, or network responses, enabling injection, memory corruption, or logic abuse on the device. Data arriving via an Intent, an exported Content Provider, or a custom URL scheme is exactly as untrusted as network input, but routinely validated with less rigor because it looks internal -- 2 real CVEs (ownCloud, TikTok) confirm this is not theoretical.
  lang: kotlin
  vuln: "override fun query(uri: Uri, projection: Array<String>?, selection: String?,\n                   selectionArgs: Array<String>?, sortOrder: String?): Cursor {\n    val id = uri.lastPathSegment                      // attacker-controlled\n    val sql = \"SELECT * FROM notes WHERE _id = $id\"    // raw concat -> SQLi\n    return db.rawQuery(sql, null)\n}\n"
  safe: "override fun query(uri: Uri, projection: Array<String>?, selection: String?,\n                   selectionArgs: Array<String>?, sortOrder: String?): Cursor {\n    val id = uri.lastPathSegment?.toLongOrNull()\n        ?: throw IllegalArgumentException(\"bad id\")   // strict type validation\n    val qb = SQLiteQueryBuilder().apply { tables = \"notes\"; setProjectionMap(ALLOWED_COLUMNS) }\n    return qb.query(db, projection, \"_id = ?\", arrayOf(id.toString()), null, null, null)\n}\n"
  note_en: 'Source: OWASP Mobile Top 10 2024, M4.'
- id: '15.5'
  name: Insecure Communication (Mobile)
  severity: Critical
  difficulty: Easy
  confidence: POSSIBLE
  cwe:
  - CWE-295
  - CWE-297
  - CWE-319
  desc: 'Dane przesyłane przez cleartext albo z niepoprawną walidacją certyfikatu/hostname TLS, pozwalające na przechwycenie man-in-the-middle w wrogich sieciach. Klasyczny wzorzec: niestandardowy X509TrustManager z pustym checkServerTrusted() akceptuje DOWOLNY certyfikat -- zweryfikowane badanie akademickie z 2012 znalazło 8.0% z 13500 apek potencjalnie podatnych, a kontynuacja z 2021 pokazała że 88.87% niestandardowych Network Security Config faktycznie OSŁABIA bezpieczeństwo.

    '
  desc_en: 'Data transmitted over cleartext or with improper TLS certificate/hostname validation, allowing man-in-the-middle interception on hostile networks. The classic pattern: a custom X509TrustManager with an empty checkServerTrusted() accepts ANY certificate -- a verified 2012 academic study found 8.0% of 13,500 apps potentially vulnerable, and a 2021 follow-up found 88.87% of custom Network Security Configs actually WEAKEN security.'
  lang: kotlin
  vuln: "val trustAll = object : X509TrustManager {\n    override fun checkClientTrusted(chain: Array<X509Certificate>, authType: String) {}\n    override fun checkServerTrusted(chain: Array<X509Certificate>, authType: String) {}  // never throws\n    override fun getAcceptedIssuers() = arrayOf<X509Certificate>()\n}\n"
  safe: '// SAFE: no custom TrustManager, no custom HostnameVerifier --

    // the platform validates chain + hostname against the system trust store.

    val client = OkHttpClient()

    '
  note_en: 'Source: OWASP Mobile Top 10 2024, M5. Related CWE-295 (improper certificate validation) — covers missing certificate pinning.'
- id: '15.6'
  name: Inadequate Privacy Controls
  severity: High
  difficulty: Easy
  confidence: POSSIBLE
  cwe:
  - CWE-359
  - CWE-200
  desc: 'Zbieranie, przechowywanie albo przesyłanie PII, lokalizacji, kontaktów, albo identyfikatorów urządzenia ponad potrzebę albo bez zgody. Zweryfikowany przypadek Grindr: dane GPS, IP, ID reklamowe i sam status użytkownika Grindr (implikujący orientację seksualną) dzielone z partnerami reklamowymi na łącznej zgodzie wszystko-albo-nic -- norweski DPA uznał to za nieważne i nałożył karę GDPR NOK 65 mln (~6.5 mln EUR), utrzymaną w 2023.

    '
  desc_en: 'Collection, storage, or transmission of PII, location, contacts, or device identifiers beyond need or without consent. Verified real case: Grindr shared GPS, IP, advertising ID, and the fact of being a Grindr user itself (implying sexual orientation) with ad partners on bundled, take-it-or-leave-it consent -- Norway''s DPA ruled this invalid and imposed a GDPR fine of NOK 65 million (~€6.5 million), upheld on appeal in 2023.'
  lang: kotlin
  vuln: '<!-- VULNERABLE: permissions requested up front, beyond the single-player game''s needs -->

    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>

    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>

    <uses-permission android:name="android.permission.READ_CONTACTS"/>

    <!-- driven by a bundled ad SDK the developer never audited -->

    '
  safe: "<!-- SAFE: only what the shipped feature genuinely needs, requested just-in-time -->\n<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>\n<!-- requested at the moment the location feature is used, with a contextual rationale;\n     BACKGROUND_LOCATION and READ_CONTACTS omitted -- nothing in the app uses them -->\n"
  note_en: 'Source: OWASP Mobile Top 10 2024, M6.'
- id: '15.7'
  name: Insufficient Binary Protections
  severity: Medium
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-693
  - CWE-656
  - CWE-489
  desc: 'Brak obfuskacji kodu, anty-tamperingu, i anty-debugowania pozwala atakującym poddać apkę inżynierii wstecznej, wyodrębnić sekrety/logikę biznesową, załatać ją, i redystrybuować trojanizowane wersje. OWASP nie cytuje żadnego CWE dla tej kategorii -- zweryfikowane bezpośrednio na oficjalnej stronie. Zweryfikowany akademicki punkt odniesienia: 86% z 1260 próbek malware w Android Malware Genome Project (2012) to przepakowane legalne apki.

    '
  desc_en: 'Lack of code obfuscation, anti-tampering, and anti-debugging lets attackers reverse-engineer the app, extract secrets/business logic, patch it, and repackage trojanized versions. OWASP cites no CWE for this category -- verified directly on the official page. Verified academic benchmark: 86% of 1,260 malware samples in the Android Malware Genome Project (2012) were repackaged legitimate apps.'
  lang: kotlin
  vuln: "// VULNERABLE: purely client-side, no server verification --\n// trivially patched out with apktool or hooked with Frida\nfun unlockPremiumFeature(): Boolean {\n    return LocalLicenseStore.isLicenseValid()\n}\n"
  safe: "// SAFE: the local check is only a UX shortcut; the feature only\n// activates after the backend verifies a signed entitlement token\nsuspend fun unlockPremiumFeature(): Boolean {\n    val token = AccountApi.fetchEntitlementToken()\n    return BackendApi.verifyEntitlement(token)\n}\n"
  note_en: 'Source: OWASP Mobile Top 10 2024, M7. Umbrella for root/jailbreak-detection bypass and repackaging.'
- id: '15.8'
  name: Security Misconfiguration (Mobile)
  severity: High
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-926
  - CWE-276
  desc: 'Niezabezpieczone eksportowane komponenty (aktywności/serwisy/receivery/providery), android:allowBackup="true", cleartext dozwolony w Network Security Config, albo nadmierne uprawnienia osłabiające postawę bezpieczeństwa apki na urządzeniu. OWASP nie cytuje żadnego CWE dla tej kategorii -- zweryfikowane bezpośrednio. Zweryfikowany rzeczywisty incydent: 3046 apek wyciekło ~100 mln rekordów przez błędnie skonfigurowane backendy Firebase (2018).

    '
  desc_en: 'Insecure default settings, debuggable builds, permissive network security config, or over-broad permissions that weaken the app''s security posture on the device. Includes unprotected exported components (activities/services/receivers/providers), android:allowBackup="true", and cleartext-permitted network config. OWASP cites no CWE for this category -- verified directly. Verified real incident: 3,046 apps leaked ~100M records via misconfigured Firebase backends (2018).'
  lang: xml
  vuln: '<!-- VULNERABLE: internal-only activity reachable by any installed app -->

    <activity android:name=".AdminPanelActivity" android:exported="true"/>

    '
  safe: "<!-- SAFE: not exported -- since API 31 this must be explicit;\n     guard with a signature-level permission if it genuinely needs\n     to be reachable by one specific other app -->\n<activity android:name=\".AdminPanelActivity\" android:exported=\"false\"/>\n"
  note_en: 'Source: OWASP Mobile Top 10 2024, M8.'
- id: '15.9'
  name: Insecure Data Storage
  severity: Critical
  difficulty: Easy
  confidence: POSSIBLE
  cwe:
  - CWE-312
  - CWE-921
  desc: 'Wrażliwe dane przechowywane bez szyfrowania w shared preferences, bazach SQLite, plikach plist, pamięci zewnętrznej, logach, albo cache -- odczytywalne na zrootowanych/jailbreakowanych albo zbackupowanych urządzeniach. Zweryfikowane rzeczywiste CVE: Starbucks iOS (CVE-2014-0647, hasła jawnym tekstem w logu awarii, ~10 mln pobrań) i Subway/ZippyYum (CVE-2013-6986, hasła w cache SQLite jawnym tekstem). Ta sama kategoria co M2 z list OWASP 2014/2016, tylko zdegradowana rangą do M9.

    '
  desc_en: 'Sensitive data stored unencrypted in shared preferences, SQLite databases, plist files, external storage, logs, or caches — readable on rooted/jailbroken or backed-up devices. Verified real CVEs: Starbucks iOS (CVE-2014-0647, plaintext passwords in a crash log, ~10M downloads) and Subway/ZippyYum (CVE-2013-6986, passwords in a plaintext SQLite cache). Same category as OWASP''s 2014/2016 M2, just demoted in rank to M9.'
  lang: kotlin
  vuln: '// VULNERABLE: plaintext in SharedPreferences, recoverable from any

    // rooted device, backup, or forensic extraction

    val prefs = getSharedPreferences("app_prefs", Context.MODE_PRIVATE)

    prefs.edit().putString("auth_token", token).apply()

    '
  safe: '// SAFE: token stored encrypted with a key held in Android Keystore

    // (hardware-backed where the device supports it)

    val encryptedToken = KeystoreCipher.encrypt("app_token_key", token)

    prefs.edit().putString("auth_token_enc", encryptedToken).apply()

    '
  note_en: 'Source: OWASP Mobile Top 10 2024, M9. Related CWE-922 (insecure storage of sensitive information).'
- id: '15.10'
  name: Insufficient Cryptography (Mobile)
  severity: High
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-327
  - CWE-330
  - CWE-321
  desc: 'Użycie słabych/złamanych szyfrów, zakodowanych na sztywno albo przewidywalnych kluczy, trybu ECB, albo niepoprawnego zarządzania kluczami na urządzeniu, pozwalające na deszyfrowanie chronionych danych mobilnych. Kluczowa pułapka: Cipher.getInstance("AES") bez trybu po cichu domyślnie ustawia ECB. Zweryfikowane rzeczywiste CVE-2020-11500 (Zoom, pojedynczy klucz AES-128-ECB dzielony przez wszystkich uczestników spotkania) i wada Android SecureRandom z 2013 (przewidywalne nonce ECDSA, ~55 BTC skradzione).

    '
  desc_en: 'Use of weak/broken ciphers, hardcoded or predictable keys, ECB mode, or improper key management on-device, allowing decryption of protected mobile data. Key footgun: Cipher.getInstance("AES") with no mode silently defaults to ECB. Verified real CVE-2020-11500 (Zoom, a single AES-128-ECB key shared by every meeting participant) and the 2013 Android SecureRandom flaw (predictable ECDSA nonces, ~55 BTC stolen).'
  lang: kotlin
  vuln: '// VULNERABLE: no mode specified -- silently resolves to

    // AES/ECB/PKCS5Padding on the default Java/Android provider

    val cipher = Cipher.getInstance("AES")

    '
  safe: '// SAFE: explicit authenticated mode, unique nonce per encryption,

    // key held in Android Keystore

    val cipher = Cipher.getInstance("AES/GCM/NoPadding")

    val iv = ByteArray(12).also { SecureRandom().nextBytes(it) }

    cipher.init(Cipher.ENCRYPT_MODE, keystoreKey, GCMParameterSpec(128, iv))

    '
  note_en: 'Source: OWASP Mobile Top 10 2024, M10. Related CWE-321 (hardcoded cryptographic key).'
- id: '15.11'
  name: WebView JavaScript Bridge Exposure (addJavascriptInterface)
  severity: High
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-749
  - CWE-940
  desc: 'Obiekty natywne wystawione na JavaScript WebView przez addJavascriptInterface są osiągalne przez KAŻDĄ załadowaną stronę, nie tylko własną -- WebView nie ma mechanizmu weryfikacji pochodzenia wywołującej ramki. Przed API 17 (Android 4.2) każda publiczna metoda, włącznie z odziedziczoną getClass(), była osiągalna przez refleksję Java, dając pełne RCE (CVE-2012-6636). Kluczowy mit: adnotacja @JavascriptInterface (API 17+) zamyka tylko tę niezamierzoną refleksję -- NIE dodaje sprawdzenia pochodzenia. Zamierzone, niebezpieczne metody (zwracające tokeny, czytające pliki) wciąż są osiągalne przez dowolną załadowaną stronę albo złośliwy iframe, co potwierdza rzeczywiste CVE-2022-30746 (Samsung SmartThings, 2022, brak sprawdzenia wywołującego w API interfejsu JS).

    '
  desc_en: 'Native objects exposed to WebView JavaScript via addJavascriptInterface are reachable by ANY loaded page, not just the app''s own -- the WebView has no mechanism to verify the origin of the calling frame. Before API 17 (Android 4.2), every public method, including the inherited getClass(), was reachable via Java reflection, yielding full RCE (CVE-2012-6636). Key myth: the @JavascriptInterface annotation (API 17+) only closes that unintended reflection -- it adds NO origin check. Intentionally exposed, dangerous methods (returning tokens, reading files) remain reachable by any loaded page or a malicious iframe, as confirmed by the real CVE-2022-30746 (Samsung SmartThings, 2022, missing caller check in the JS interface API).'
  lang: kotlin
  vuln: "// VULNERABLE: annotated, targetSdkVersion 21+ -- but no origin check,\n// and the WebView loads an attacker-influenceable, deep-link-supplied URL\nclass Bridge(private val session: SessionManager) {\n    @JavascriptInterface\n    fun getAuthToken(): String = session.token\n}\nwebView.addJavascriptInterface(Bridge(session), \"Android\")\nwebView.loadUrl(intent.getStringExtra(\"target_url\"))\n"
  safe: "// SAFE: explicit origin allowlist via WebMessageListener, no raw\n// credential exposed through the bridge, fixed non-attacker URL\nWebViewCompat.addWebMessageListener(\n    webView, \"Android\", setOf(\"https://app.example.com\"),\n) { _, message, sourceOrigin, _, replyProxy ->\n    if (sourceOrigin.toString() != \"https://app.example.com\") return@addWebMessageListener\n    replyProxy.postMessage(handleScopedRequest(message.data))\n}\nwebView.loadUrl(\"https://app.example.com/hybrid\")\n"
  note_en: 'Source: OWASP MASTG-TEST-0033 (Testing for Java Objects Exposed Through WebViews), MASVS-PLATFORM-2. CVE-2012-6636 (platform reflection RCE, API<17), CVE-2022-30746 (Samsung SmartThings, missing caller check, CVSS 7.5 High). Related CWE-940 (missing origin verification).'
- id: '15.12'
  name: Android Intent Redirection / Hijacking
  severity: High
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-940
  - CWE-926
  desc: 'Zaufana apka odbiera Intent, wypakowuje z niego zagnieżdżony Intent (z extras albo z PendingIntent), i ponownie wysyła go przez startActivity/sendBroadcast/startService BEZ walidacji docelowego ComponentName ani wywołującego -- pozwalając atakującej apce wyprać swój Intent przez tożsamość i uprawnienia zaufanego pośrednika ("confused deputy"), osiągając niewyeksportowane wewnętrzne komponenty. Odrębne od prostego spoofingu (bezpośrednie wysłanie do wyeksportowanego komponentu). Blisko powiązany wariant: mutowalny PendingIntent z implicit bazowym Intent pozwala odbiorcy dopełnić brakujący cel. Zweryfikowane rzeczywiste CVE-2024-26131 (Element Android, ominięcie ochrony PIN) i błąd SDK EngageLab (2026, 50M+ instalacji).

    '
  desc_en: 'A trusted app receives an Intent, unparcels a nested Intent from it (from extras or a PendingIntent), and re-dispatches it via startActivity/sendBroadcast/startService WITHOUT validating the target ComponentName or the caller -- letting a malicious app launder its Intent through a trusted deputy''s identity and permissions ("confused deputy"), reaching non-exported internal components. Distinct from simple spoofing (direct send to an exported component). Closely related variant: a mutable PendingIntent with an implicit base Intent lets the receiver fill in the missing target. Verified real CVE-2024-26131 (Element Android, PIN-protection bypass) and the EngageLab SDK bug (2026, 50M+ installs).'
  lang: kotlin
  vuln: '// VULNERABLE: exported proxy blindly forwards whatever Intent

    // arrives in the extra, with no target or caller validation

    val forward = intent.getParcelableExtra<Intent>("next_intent")

    startActivity(forward)  // can reach ANY component, exported or not

    '
  safe: "// SAFE: explicit allowlist via AndroidX IntentSanitizer, dangerous\n// URI-grant flags stripped before dispatch\nval sanitized = IntentSanitizer.Builder()\n    .allowComponent(ComponentName(this, AllowedTarget::class.java))\n    .build()\n    .sanitizeByThrowing(forward)\nsanitized.removeFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)\nstartActivity(sanitized)\n"
  note_en: 'Source: OWASP MASTG-TEST-0026 (Testing Implicit Intents), MASTG-TEST-0030 (PendingIntent). CVE-2024-26131 (Element Android), BlackHat EU 2021 PendingIntent research (CVE-2020-0188/0389/0294). CWE-940 chosen over CWE-927 based on real tooling/CVE mappings (CodeQL, GHSA) -- see deep-dive compliance section for the full rationale.'
- id: '15.13'
  name: Insecure IPC via Exported Components
  severity: High
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-926
  - CWE-925
  - CWE-89
  desc: 'Wyeksportowana Activity/Service/BroadcastReceiver/ContentProvider osiągalna przez DOWOLNĄ apkę na urządzeniu z zerowymi uprawnieniami, bez sprawdzenia wywołującego, wykonująca wrażliwą akcję. Kluczowy mit: API 31 nie zmienił wartości domyślnej exported -- uczynił jej deklarację obowiązkową; ContentProvider miał osobną, wcześniejszą zmianę (API 17). Częsta luka: sparametryzowane selectionArgs chroni tylko selection, NIE projection -- niewhitelistowana projection wciąż pozwala na SQL injection między tabelami. Zweryfikowane rzeczywiste CVE-2021-25337 (Samsung, wykorzystane in-the-wild wg Google Project Zero) i SQL injection w Nextcloud Android (CVE-2019-5454/2021-43863).

    '
  desc_en: 'An exported Activity/Service/BroadcastReceiver/ContentProvider reachable by ANY app on the device with zero privileges, with no caller verification, performing a sensitive action. Key myth: API 31 did not change the default value of exported -- it made declaring it mandatory; ContentProvider had a separate, earlier change (API 17). Common gap: parameterized selectionArgs protects only selection, NOT projection -- an unwhitelisted projection still allows cross-table SQL injection. Verified real CVE-2021-25337 (Samsung, exploited in-the-wild per Google Project Zero) and Nextcloud Android SQL injection (CVE-2019-5454/2021-43863).'
  lang: xml
  vuln: "<!-- VULNERABLE: exported, no permission attribute --\n     any app on the device can reach this at zero cost -->\n<provider\n    android:name=\".NotesProvider\"\n    android:authorities=\"com.victim.app.provider\"\n    android:exported=\"true\" />\n"
  safe: "<!-- SAFE: signature-level permission -- restricts access to callers\n     signed with the same key; also whitelist projection in query() -->\n<provider\n    android:name=\".NotesProvider\"\n    android:authorities=\"com.victim.app.provider\"\n    android:exported=\"true\"\n    android:permission=\"com.victim.app.permission.ACCESS_NOTES\" />\n\n<permission\n    android:name=\"com.victim.app.permission.ACCESS_NOTES\"\n    android:protectionLevel=\"signature\" />\n"
  note_en: 'Source: OWASP MASVS-PLATFORM-1, MASTG-TEST-0029 (split into MASTG-TEST-0364/0365/0366). CVE-2021-25337 (Samsung clipboard, Google Project Zero in-the-wild RCA), CVE-2021-25397 (Samsung TelephonyUI), CVE-2019-5454/CVE-2021-43863 (Nextcloud ContentProvider SQLi). CWE-926 unanimous across all 3 research passes, distinct from CWE-749 (15.11) and CWE-940 (15.12).'
- id: '15.14'
  name: Task Hijacking (StrandHogg)
  severity: High
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-441
  - CWE-451
  desc: 'Złośliwa apka nadużywa Android taskAffinity/allowTaskReparenting/launchMode by wstawić swoją Activity do stosu zadań legalnej apki, wyłudzając dane uwierzytelniające podczas gdy ofiara wierzy że jest w zaufanej apce. Dwa odrębne warianty: StrandHogg 1.0 (deklaratywny w manifeście, brak CVE, mitygowalny po stronie apki) i StrandHogg 2.0/CVE-2020-0096 (błąd refleksji na poziomie platformy, brak sygnatury manifestu, mitygowalny WYŁĄCZNIE łatką OS). Kluczowa korekta: CWE-1021 (poprzednio przypisane) to słabość tapjacking/overlay, nie manipulacji stosem zadań -- poprawiono na CWE-441 (confused deputy).

    '
  desc_en: 'A malicious app abuses Android taskAffinity/allowTaskReparenting/launchMode to insert its Activity into a legitimate app''s task stack, phishing credentials while the victim believes they are in the trusted app. Two distinct variants: StrandHogg 1.0 (manifest-declarative, no CVE, app-side mitigable) and StrandHogg 2.0/CVE-2020-0096 (reflection-based platform bug, no manifest fingerprint, mitigable ONLY by an OS patch). Key correction: CWE-1021 (previously assigned) is a tapjacking/overlay weakness, not task-stack manipulation -- corrected to CWE-441 (confused deputy).'
  lang: xml
  vuln: "<!-- VULNERABLE: default taskAffinity (= package name) plus\n     allowTaskReparenting -- a malicious app can declare a\n     matching taskAffinity and get reparented onto this task -->\n<activity android:name=\".LoginActivity\"\n    android:allowTaskReparenting=\"true\"\n    android:launchMode=\"singleTask\" />\n"
  safe: "<!-- SAFE: empty taskAffinity, singleInstance launch mode,\n     plus targetSdkVersion 30+ in build.gradle for the\n     platform-level Android 11 hardening -->\n<activity android:name=\".LoginActivity\"\n    android:taskAffinity=\"\"\n    android:launchMode=\"singleInstance\" />\n"
  note_en: 'Source: OWASP MASWE-0057 (StrandHogg Attack / Task Affinity Vulnerability), MASVS-PLATFORM. StrandHogg (2019, no CVE) and StrandHogg 2.0 (CVE-2020-0096, CVSS 7.8, patched Android security level 2020-05-01). Foundational research: Ren et al., USENIX Security 2015. CWE corrected from CWE-1021 (unanimous across 3 research passes -- that CWE belongs to the sibling Tapjacking entry, 15.15).'
- id: '15.15'
  name: Tapjacking (UI Overlay Attack)
  severity: Medium
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-1021
  - CWE-451
  desc: 'Złośliwa apka rysuje overlay nad UI innej apki, przechwytując albo przepuszczając dotyki użytkownika by wykonać niezamierzone, wybrane przez atakującego akcje. Pełne przesłonięcie: overlay pokrywa kontrolkę docelową. Częściowe przesłonięcie: kontrolka pozostaje dotykalna, ale otaczający kontekst jest mylący -- Android nie zapewnia domyślnej ochrony przed tym wariantem. Kluczowy niuans: domyślna blokada Android 12 chroni tylko overlaye o nieprzezroczystości >=0.8; prawdziwe trojany bankowe (Cerberus, Anubis) używają przeważnie nieprzezroczystego phishingu przez accessibility, nie klasycznego przezroczystego przejścia. Zweryfikowane CVE-2016-2496 i CVE-2017-0492 (własne przykłady MITRE dla CWE-1021).

    '
  desc_en: 'A malicious app draws an overlay above another app''s UI, capturing or passing through user taps to perform unintended, attacker-chosen actions. Full occlusion: the overlay covers the target control. Partial occlusion: the control stays tappable, but surrounding context is misleading -- Android provides no default protection against this variant. Key nuance: Android 12''s default blocking only protects against overlays at >=0.8 opacity; real banking trojans (Cerberus, Anubis) predominantly use opaque, accessibility-driven phishing, not the classic transparent pass-through. Verified CVE-2016-2496 and CVE-2017-0492 (MITRE''s own demonstrative examples for CWE-1021).'
  lang: kotlin
  vuln: '// VULNERABLE: no touch filtering -- an overlay above this

    // button (opaque or transparent) can capture or pass through

    // the tap with no framework-level rejection

    <Button android:id="@+id/grantPermissionButton" android:text="Allow" />

    '
  safe: "// SAFE: full-occlusion filtering plus manual rejection of\n// partial occlusion, which Android does not cover by default\n<Button android:id=\"@+id/grantPermissionButton\"\n    android:text=\"Allow\"\n    android:filterTouchesWhenObscured=\"true\" />\n\noverride fun onFilterTouchEventForSecurity(event: MotionEvent): Boolean {\n    val obscured = (event.flags and MotionEvent.FLAG_WINDOW_IS_OBSCURED) != 0\n    val partiallyObscured = (event.flags and MotionEvent.FLAG_WINDOW_IS_PARTIALLY_OBSCURED) != 0\n    return if (obscured || partiallyObscured) false else super.onFilterTouchEventForSecurity(event)\n}\n"
  note_en: 'Source: OWASP MASVS-PLATFORM-3, MASTG-TEST-0035 (Testing for Overlay Attacks). CWE-1021 confirmed unanimously across 3 research passes -- correction cross-referenced from this catalog''s Task Hijacking entry (15.14), which found CWE-1021 mis-assigned there. CVE-2016-2496 and CVE-2017-0492 are MITRE''s own demonstrative examples for CWE-1021; CVE-2021-39691 (2021, CVSS ~7.3) confirms the mapping remains live.'
- id: '15.16'
  name: Insecure Deep Link / Custom URL Scheme Handling
  severity: High
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-939
  - CWE-601
  desc: 'Deep linki albo niestandardowe schematy URL obsługiwane bez weryfikacji wywołującego albo własności domeny pozwalają złośliwej apce zgłosić ten sam schemat albo przekazać wrogie parametry by wyzwolić nieautoryzowane akcje albo wyciekać tokeny. Kluczowy mit: App Links/Universal Links rozwiązują TYLKO problem źródła (kto odbiera link), NIE problem zaufania parametrów (czy dane w linku powinny być wykonane bezwarunkowo). OAuth ''custom URI scheme interception'' (RFC 8252 §8.1) to nazwana instancja -- PKCE (RFC 7636) to obowiązkowa naprawa. Zweryfikowane CVE-2026-26123 (Microsoft Authenticator, nieodebrany deep link) i CVE-2022-28799 (TikTok, łańcuch deep link → WebView bridge).

    '
  desc_en: 'Deep links or custom URL schemes handled without verifying the caller or domain ownership let a malicious app claim the same scheme or pass hostile parameters to trigger unauthorized actions or leak tokens. Key myth: App Links/Universal Links solve ONLY the source problem (who receives the link), NOT the parameter-trust problem (whether data in the link should be acted on unconditionally). OAuth ''custom URI scheme interception'' (RFC 8252 §8.1) is the named instance -- PKCE (RFC 7636) is the mandatory fix. Verified CVE-2026-26123 (Microsoft Authenticator, unclaimed deep link) and CVE-2022-28799 (TikTok, deep link -> WebView bridge chain).'
  lang: kotlin
  vuln: '// VULNERABLE: even on a verified, exclusive App Link --

    // the token is trusted unconditionally, with no server-side

    // check that it belongs to the current authenticated user

    val token = intent.data?.getQueryParameter("token")

    val email = intent.data?.getQueryParameter("email")

    resetPasswordFor(email, token)

    '
  safe: "// SAFE: token validated server-side against the authenticated\n// session before any sensitive action is performed\nval token = intent.data?.getQueryParameter(\"token\") ?: return showError()\napi.validateResetToken(token, currentSessionUserId)\n    .onSuccess { proceedWithReset(it) }\n    .onFailure { showError() }\n"
  note_en: 'Source: OWASP MASTG-TEST-0028 (Android, Testing Deep Links), MASTG-TEST-0070/0075 (iOS, Universal Links/Custom URL Schemes). RFC 8252 (OAuth for Native Apps) + RFC 7636 (PKCE). CWE-939 confirmed a direct child of CWE-940 (sibling entry 15.12) -- clean specialization, not overlap. Scoped cross-platform and distinct from the later iOS-specific URL Scheme Hijacking entry (15.22).'
- id: '15.17'
  name: Keychain / Keystore Misuse
  severity: High
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-522
  desc: 'Sekrety przechowywane w iOS Keychain / Android Keystore z użyciem poprawnego API ale słabą klasą dostępności/ochrony (np. kSecAttrAccessibleAlways, brak wiązania uwierzytelnienia, klucze nie wsparte sprzętowo), pozostawiające je wyodrębnialnymi na odblokowanych albo skompromitowanych urządzeniach. Kluczowy mit: wsparcie sprzętowe (Secure Enclave/TEE/StrongBox) zapobiega wyodrębnieniu klucza, NIE jego użyciu -- niezwiązany klucz sprzętowy to wciąż darmowa wyrocznia. Zweryfikowane CVE-2021-3145 (Ionic Identity Vault, brak setUserAuthenticationRequired) i akademickie badanie KeyDroid (490K+ apek: 56.3% apek z wrażliwymi danymi nie używa żadnego zaufanego sprzętu).

    '
  desc_en: 'Secrets stored in the iOS Keychain / Android Keystore using the correct API but with a weak accessibility/protection class (e.g. kSecAttrAccessibleAlways, no auth binding, keys not hardware-backed), leaving them extractable on unlocked or compromised devices. Key myth: hardware backing (Secure Enclave/TEE/StrongBox) prevents key EXTRACTION, NOT key USE -- an unbound hardware key is still a free oracle. Verified CVE-2021-3145 (Ionic Identity Vault, missing setUserAuthenticationRequired) and the academic KeyDroid study (490K+ apps: 56.3% of sensitive-data apps use no trusted hardware at all).'
  lang: kotlin
  vuln: "// VULNERABLE: no authentication binding at all --\n// the key is usable any time the app runs, by any code path\nval spec = KeyGenParameterSpec.Builder(\"authKey\", KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)\n    .setBlockModes(KeyProperties.BLOCK_MODE_GCM)\n    .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)\n    .build()\n"
  safe: "// SAFE: hardware-backed, per-operation biometric auth genuinely\n// bound to the key -- used only via a CryptoObject, never a\n// plain app-code check\nval spec = KeyGenParameterSpec.Builder(\"authKey\", KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)\n    .setBlockModes(KeyProperties.BLOCK_MODE_GCM)\n    .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)\n    .setUserAuthenticationRequired(true)\n    .setUserAuthenticationParameters(0, KeyProperties.AUTH_BIOMETRIC_STRONG)\n    .setInvalidatedByBiometricEnrollment(true)\n    .setIsStrongBoxBacked(true)\n    .build()\n"
  note_en: 'Source: OWASP MASVS-STORAGE (MASTG-TEST-0052), MASVS-CRYPTO (MASTG-KNOW-0043), MASVS-AUTH (MASTG-TEST-0018). CWE-522 unanimous across 3 research passes; CWE-320 explicitly confirmed prohibited for CWE mapping (MITRE category, not a weakness). Scoped distinct from M9 (Insecure Data Storage) and M10 (Insufficient Cryptography) -- this entry covers correct-API-wrong-configuration specifically.'
- id: '15.18'
  name: Root / Jailbreak Detection Bypass
  severity: Medium
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-602
  desc: 'Słaba albo wyłącznie klienckastrona wykrywania root/jailbreak jest trywialnie omijana przez Frida, Magisk (Zygisk + DenyList + Shamiko), albo frameworki zaczepiania, pozwalając apce działać w środowisku w pełni kontrolowanym przez atakującego. Kluczowa korekta: CWE-693 (poprzednio przypisane) to Pillar -- MITRE jawnie odradza mapowanie na ten poziom -- poprawiono na CWE-602 (Client-Side Enforcement of Server-Side Security). Mit: App Attest Apple atestuje binarium apki, NIE status jailbreak -- Apple zaleca przeciwko wykrywaniu jailbreak w ogóle. MagiskHide usunięte w Magisk v24.0 (2022-01-26), zastąpione Zygisk+DenyList.

    '
  desc_en: 'Weak or client-side-only root/jailbreak detection is trivially bypassed with Frida, Magisk (Zygisk + DenyList + Shamiko), or hooking frameworks, allowing the app to run in a fully attacker-controlled environment. Key correction: CWE-693 (previously assigned) is a Pillar -- MITRE explicitly discourages mapping to this level -- corrected to CWE-602 (Client-Side Enforcement of Server-Side Security). Myth: Apple''s App Attest attests the app binary, NOT jailbreak status -- Apple recommends against jailbreak detection entirely. MagiskHide was removed in Magisk v24.0 (2022-01-26), replaced by Zygisk+DenyList.'
  lang: kotlin
  vuln: "// VULNERABLE: purely client-side verdict -- the app itself decides\n// whether to trust the device, and Frida/Zygisk/DenyList/Shamiko\n// can hook or hide every one of these signals\nfun isDeviceRooted(): Boolean {\n    val suExists = File(\"/system/bin/su\").exists()\n    val testKeys = Build.TAGS?.contains(\"test-keys\") == true\n    return suExists || testKeys\n}\nif (!isDeviceRooted()) { unlockSensitiveFeature() }\n"
  safe: "// SAFE: the client-side check is only a fast local signal;\n// the actual trust decision is a server-verified, hardware-backed\n// attestation token the app cannot forge or hook around\nsuspend fun canUnlockSensitiveFeature(): Boolean {\n    val integrityToken = integrityManager.requestIntegrityToken(request)\n    val verdict = backendApi.verifyIntegrityToken(integrityToken)\n    return verdict.deviceIntegrity == \"MEETS_STRONG_INTEGRITY\"\n}\n"
  note_en: 'Source: OWASP MASVS-RESILIENCE, MASTG-TEST-0045 (split into MASTG-TEST-0324/0325 in MASTG v2). Facet of M7 Insufficient Binary Protections, scoped narrowly to the bypass mechanics. CWE-602 unanimous across 3 research passes; CWE-693 retained only as honest umbrella (MITRE''s own guidance discourages Pillar-level mapping).'
