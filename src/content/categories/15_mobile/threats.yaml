- id: '15.22'
  name: iOS URL Scheme Hijacking
  severity: Medium
  difficulty: Unknown
  confidence: POSSIBLE
  cwe:
  - CWE-939
  desc: '[TŁUMACZENIE OCZEKUJĄCE] iOS custom URL schemes are claimed first-come/first-served with no ownership verification, so a malicious app can register the same scheme (e.g. a bank''s) and be launched instead of the legitimate app, intercepting OAuth callbacks/tokens or phishing credentials passed via the URL. Mitigated by Universal Links (domain-verified) rather than custom schemes.

    '
  desc_en: iOS custom URL schemes are claimed first-come/first-served with no ownership verification, so a malicious app can register the same scheme (e.g. a bank's) and be launched instead of the legitimate app, intercepting OAuth callbacks/tokens or phishing credentials passed via the URL. Mitigated by Universal Links (domain-verified) rather than custom schemes.
