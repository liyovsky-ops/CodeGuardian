  - id: "2.26"
    name: "Insecure Password Reset"
    severity: "High"
    difficulty: "Medium"
    confidence: "POSSIBLE"
    cwe:
      - "CWE-640"
    desc: |
      Przewidywalny/niewygasający token resetu lub host header poisoning pozwala przejąć konto.

    desc_en: ""
    lang: "python"
    vuln: |
      token = str(user.id) + str(int(time.time()))  # przewidywalny
      send_reset(user.email, token)

    safe: |
      import secrets
      token = secrets.token_urlsafe(32)
