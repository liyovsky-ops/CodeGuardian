  - id: "2.20"
    name: "Weak Password Policy"
    severity: "Medium"
    difficulty: "Easy"
    confidence: "IRON"
    cwe:
      - "CWE-521"
      - "CWE-1392"
    desc: |
      Zbyt słabe wymagania hasła lub domyślne poświadczenia ułatwiają zgadnięcie/przełamanie konta.

    desc_en: ""
    lang: "python"
    vuln: |
      def set_password(pw):
          if len(pw) >= 4:  # za słabo, brak innych reguł
              user.pw = hash(pw)

    safe: |
      import re
      def set_password(pw):
          if len(pw) < 12 or pw.lower() in COMMON_PW:
              raise ValueError('za słabe hasło')
          user.pw = bcrypt.hash(pw)

