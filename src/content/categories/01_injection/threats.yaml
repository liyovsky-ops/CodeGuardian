  - CWE-502
  - CWE-776
  desc: To nie wstrzyknięcie przez wyłamanie ze składni — to deserializacja (CWE-502) w przebraniu YAML. Wiele parserów (Ruby !ruby/object:, Python !!python/object/apply:, Java SnakeYAML !!javax.script.ScriptEngineManager) tworzy instancje obiektów natywnych języka podczas parsowania niebezpiecznym loaderem — ta konstrukcja obiektu staje się bezpośrednią linią do wykonania kodu. CVE-2013-0156 (Rails) i CVE-2022-1471 (SnakeYAML, CVSS 9.8) to dwa flagowe incydenty.
  desc_en: This isn't syntax-breakout injection — it's deserialization (CWE-502) wearing a YAML label. Many parsers (Ruby !ruby/object:, Python !!python/object/apply:, Java SnakeYAML !!javax.script.ScriptEngineManager) instantiate language-native objects during parsing with an unsafe loader — that object construction becomes a direct line to code execution. CVE-2013-0156 (Rails) and CVE-2022-1471 (SnakeYAML, CVSS 9.8) are the two headline incidents.
  lang: python
  vuln: '# VULNERABLE

    config = yaml.load(uploaded_file.read())

