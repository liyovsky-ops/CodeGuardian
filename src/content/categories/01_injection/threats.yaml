- id: cat_1_research18
  name: Prototype Pollution
  severity: Critical
  difficulty: Unknown
  confidence: POSSIBLE
  cwe:
  - CWE-1321
  - CWE-915
  desc: 'Naiwna rekurencyjna funkcja merge/clone/extend kopiująca niezaufany JSON bez odrzucania kluczy __proto__ i constructor.prototype zapisuje wprost na współdzielonym Object.prototype — zanieczyszczając każdy obiekt w aplikacji. Skutek zależy od dalszego gadżetu: DoS, obejście autoryzacji (odziedziczone isAdmin), albo pełne RCE przez łańcuch gadżetów silnika szablonów (Kibana Timelion CVE-2019-7609, CVSS 10.0).'
  desc_en: 'A naive recursive merge/clone/extend function copying untrusted JSON without rejecting the keys __proto__ and constructor.prototype writes straight onto the shared Object.prototype — polluting every object in the application. Impact depends on the downstream gadget: DoS, authorization bypass (inherited isAdmin), or full RCE via a template-engine gadget chain (Kibana Timelion CVE-2019-7609, CVSS 10.0).'
  lang: javascript
  vuln: "// VULNERABLE — follows any key, including __proto__\nfunction merge(target, source) {\n  for (const key in source) {\n    if (typeof source[key] === 'object' && source[key] !== null) {\n      if (!target[key]) target[key] = {};\n      merge(target[key], source[key]);\n    } else {\n      target[key] = source[key];\n    }\n  }\n  return target;\n}\n"
  safe: "// SECURE — block magic keys, iterate own keys only\nconst BAD = new Set(['__proto__', 'constructor', 'prototype']);\nfunction safeMerge(target, source) {\n  for (const key of Object.keys(source)) {\n    if (BAD.has(key)) continue;\n    const val = source[key];\n    if (val && typeof val === 'object') {\n      if (!Object.hasOwn(target, key)) target[key] = Object.create(null);\n      safeMerge(target[key], val);\n    } else {\n      target[key] = val;\n    }\n  }\n  return target;\n}\n"
