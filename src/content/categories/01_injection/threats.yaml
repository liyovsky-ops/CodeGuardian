threats:
- id: '1.1'
  name: SQL Injection
  severity: Critical
  difficulty: Easy
  confidence: IRON
  cwe:
  - CWE-89
  desc: 'Nieufny input trafia do zapytania SQL przez konkatenację stringów, pozwalając atakującemu zmienić strukturę zapytania (wyciek, modyfikacja, bypass auth).

    '
  desc_en: Untrusted input is concatenated into a SQL query, allowing an attacker to alter the query structure (data leak, modification, auth bypass).
  lang: python
  vuln: "# PODATNE — konkatenacja\ndef get_user(conn, username):\n    q = \"SELECT * FROM users WHERE name = '\" + username + \"'\"\n    return conn.execute(q).fetchall()\n# atak: username = \"' OR '1'='1' --\"\n"
  safe: "# BEZPIECZNE — parametryzacja (prepared statement)\ndef get_user(conn, username):\n    q = \"SELECT * FROM users WHERE name = %s\"\n    return conn.execute(q, (username,)).fetchall()\n"
  note: ORMy nie chronią automatycznie — Model.objects.raw(), .extra(), text() w SQLAlchemy, raw fragmenty nadal są podatne.
  note_en: ORMs do not protect automatically — Model.objects.raw(), .extra(), text() in SQLAlchemy, and raw fragments are still vulnerable.
- id: '1.2'
  name: NoSQL Injection
  severity: High
  difficulty: Medium
  confidence: IRON
  cwe:
  - CWE-943
  desc: 'Wstrzyknięcie operatorów zapytań (np. MongoDB $gt, $ne, $where) gdy input jest deserializowany jako obiekt zapytania. Częste w API przyjmujących JSON.

    '
  desc_en: Injection of query operators (e.g., MongoDB $gt, $ne, $where) when input is deserialized as a query object. Common in APIs accepting JSON.
  lang: python
  vuln: '# PODATNE — JSON body trafia wprost do filtra

    user = db.users.find_one({"user": req.json["user"], "pass": req.json["pass"]})

    # atak: {"user":"admin","pass":{"$ne":null}} -> logowanie bez hasła

    '
  safe: '# BEZPIECZNE — wymuś typy skalarne

    username = str(req.json["user"]); password = str(req.json["pass"])

    user = db.users.find_one({"user": username, "pass": password})

    '
- id: '1.3'
  name: OS Command Injection
  severity: Critical
  difficulty: Easy
  confidence: IRON
  cwe:
  - CWE-78
  desc: 'Nieufny input trafia do polecenia powłoki, pozwalając na wykonanie dowolnych komend systemowych.

    '
  desc_en: Untrusted input reaches a shell command, allowing an attacker to execute arbitrary OS commands.
  lang: python
  vuln: '# PODATNE — shell=True + konkatenacja

    import os, subprocess

    os.system("ping -c 1 " + host)

    subprocess.run("convert " + filename + " out.png", shell=True)

    # atak: host = "8.8.8.8; rm -rf /"

    '
  safe: '# BEZPIECZNE — argv list, bez shella

    subprocess.run(["ping", "-c", "1", host], shell=False)

    '
- id: '1.4'
  name: LDAP Injection
  severity: High
  difficulty: Medium
  confidence: IRON
  cwe:
  - CWE-90
  desc: 'Wstrzyknięcie metaznaków filtra LDAP (*, (, ), \) do zapytania directory, omijając filtry auth.

    '
  desc_en: Injection of LDAP filter metacharacters (*, (, ), \) into a directory query, bypassing authentication filters.
  lang: python
  vuln: '# PODATNE

    flt = "(&(uid=" + user + ")(password=" + pwd + "))"

    # atak: user = "*)(uid=*))(|(uid=*"

    '
  safe: '# BEZPIECZNE — escape wg RFC 4515

    from ldap3.utils.conv import escape_filter_chars

    flt = "(&(uid=%s)(password=%s))" % (escape_filter_chars(user), escape_filter_chars(pwd))

    '
- id: '1.5'
  name: XPath Injection
  severity: High
  difficulty: Medium
  confidence: IRON
  cwe:
  - CWE-643
  desc: 'Wstrzyknięcie składni XPath do zapytania nad XML, pozwalające ominąć logikę lub wyciągnąć cały dokument.

    '
  desc_en: Injection of XPath syntax into an XML query, allowing auth bypass or extraction of the entire document.
  lang: python
  vuln: '# PODATNE

    expr = "//user[name/text()=''" + name + "'' and pass/text()=''" + pwd + "'']"

    # atak: name = "'' or ''1''=''1"

    '
  safe: '# BEZPIECZNE — parametryzowane zapytania (np. lxml z variables) lub whitelist

    '
- id: '1.6'
  name: Template Injection (SSTI)
  severity: Critical
  difficulty: Hard
  confidence: POSSIBLE
  cwe:
  - CWE-1336
  - CWE-94
  desc: 'Nieufny input trafia jako szablon (nie jako dane szablonu) do silnika (Jinja2, Twig, Freemarker), co prowadzi do RCE przez dostęp do obiektów Pythona.

    '
  desc_en: Untrusted input is passed as a template (not as template data) to a template engine (Jinja2, Twig, Freemarker), leading to RCE via access to Python objects.
  lang: python
  vuln: '# PODATNE — input jako string szablonu

    from jinja2 import Template

    Template("Hello " + user_input).render()

    # atak: user_input = "{{ ''''.__class__.__mro__[1].__subclasses__() }}" -> ścieżka do RCE

    '
  safe: '# BEZPIECZNE — input jako dane, nie szablon

    Template("Hello {{ name }}").render(name=user_input)

    '
- id: '1.7'
  name: Log Injection / Log Forging
  severity: Medium
  difficulty: Easy
  confidence: POSSIBLE
  cwe:
  - CWE-117
  desc: 'Nieufny input ze znakami nowej linii / sekwencjami ANSI trafia do logów, pozwalając fałszować wpisy, wstrzykiwać do SIEM, lub XSS w logach. Szczególny przypadek: Log4Shell — interpolacja ${jndi:...}.

    '
  desc_en: 'Untrusted input containing newline characters or ANSI sequences reaches log entries, enabling log forging, SIEM injection, or XSS in log viewers. Special case: Log4Shell — ${jndi:...} interpolation.'
  lang: python
  vuln: '# PODATNE

    logger.info("Login failed for user: " + username)

    # atak: username = "admin\n2026-01-01 INFO Login OK for user: admin"

    '
  safe: '# BEZPIECZNE — sanityzuj newline / loguj strukturalnie

    logger.info("Login failed", extra={"user": username.replace("\n"," ").replace("\r"," ")})

    '
  note: Severity rośnie do High jeśli interpolacja typu Log4Shell.
  note_en: Severity escalates to High if Log4Shell-style interpolation is present.
- id: '1.8'
  name: CRLF / HTTP Response Splitting / Header Injection
  severity: High
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-93
  - CWE-113
  desc: 'Nieufny input ze znakami \r\n trafia do nagłówka HTTP/odpowiedzi, pozwalając wstrzyknąć dodatkowe nagłówki, ciasteczka lub rozbić odpowiedź (cache poisoning, XSS).

    '
  desc_en: Untrusted input with \r\n characters reaches an HTTP header or response, allowing injection of additional headers, cookies, or response splitting (cache poisoning, XSS).
  lang: python
  vuln: '# PODATNE — input do nagłówka bez sanityzacji

    resp.headers["Location"] = "/back?to=" + request.args["to"]

    # atak: to = "x\r\nSet-Cookie: admin=1"

    '
  safe: '# BEZPIECZNE — odrzuć CR/LF, użyj API kodującego nagłówki

    v = request.args["to"]

    if "\r" in v or "\n" in v: abort(400)

    resp.headers["Location"] = "/back?to=" + quote(v)

    '
- id: '1.9'
  name: Host Header Injection
  severity: High
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-644
  desc: 'Aplikacja ufa nagłówkowi Host przy budowie linków (reset hasła) lub routingu — atakujący podstawia własną domenę (password reset poisoning, cache poisoning).

    '
  desc_en: The application trusts the Host header when building links (password reset) or routing — an attacker substitutes their own domain (password reset poisoning, cache poisoning).
  lang: python
  vuln: '# PODATNE — link resetu z nagłówka Host

    link = f"https://{request.headers[''Host'']}/reset?t={token}"

    send_email(user, link)   # atak: Host: evil.com -> token leci do atakującego

    '
  safe: '# BEZPIECZNE — używaj skonfigurowanej zaufanej domeny + allowlist Host

    link = f"https://{settings.CANONICAL_HOST}/reset?t={token}"

    '
- id: '1.10'
  name: Email / SMTP Header Injection
  severity: High
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-93
  desc: 'Wstrzyknięcie nagłówków (Bcc, Cc, To) przez znaki nowej linii w polach formularza — wykorzystanie serwera do spamu/phishingu.

    '
  desc_en: Injection of headers (Bcc, Cc, To) via newline characters in form fields — exploiting the server for spam or phishing.
  lang: python
  vuln: '# PODATNE

    msg["To"] = request.form["to"]

    # atak: to = "a@x.com\r\nBcc: spam@evil.com"

    '
  safe: '# BEZPIECZNE — walidacja adresu + użycie email.message (koduje nagłówki)

    from email.headerregistry import Address

    if "\r" in to or "\n" in to: abort(400)

    '
- id: '1.11'
  name: CSV / Formula Injection
  severity: Medium
  difficulty: Easy
  confidence: POSSIBLE
  cwe:
  - CWE-1236
  desc: 'Eksport do CSV/XLSX z polami zaczynającymi się od =,+,-,@ — Excel/Sheets wykonuje je jako formuły (exfiltracja danych, wywołanie poleceń DDE).

    '
  desc_en: CSV/XLSX export with fields starting with =, +, -, @ — Excel/Sheets executes them as formulas (data exfiltration, DDE command execution).
  lang: python
  vuln: '# PODATNE — pole użytkownika wprost do CSV

    writer.writerow([user.name, user.note])

    # note = "=cmd|''/c calc''!A1"

    '
  safe: "# BEZPIECZNE — prefiksuj komórki zaczynające się od metaznaków\ndef esc(v):\n    return \"'\" + v if v and v[0] in \"=+-@\\t\\r\" else v\nwriter.writerow([esc(user.name), esc(user.note)])\n"
- id: '1.12'
  name: ORM Injection / Second-Order SQLi
  severity: High
  difficulty: Hard
  confidence: POSSIBLE
  cwe:
  - CWE-89
  desc: 'SQLi przez fragmenty raw przekazane do ORM (order_by, filter z raw, annotate) lub second-order: dane zapisane bezpiecznie, ale później użyte w surowym zapytaniu.

    '
  desc_en: 'SQLi via raw fragments passed to ORM (order_by, raw filter, annotate) or second-order: data stored safely but later used in a raw query.'
  lang: python
  vuln: '# PODATNE — nazwa kolumny sortowania z requestu

    User.objects.order_by(request.args["sort"])   # ".extra(where=...)" też podatne

    qs.extra(where=["name = ''%s''" % name])

    '
  safe: '# BEZPIECZNE — allowlist kolumn, parametry zamiast formatowania

    ALLOWED = {"name", "created"}

    col = request.args["sort"]

    if col not in ALLOWED: abort(400)

    User.objects.order_by(col)

    '
- id: '1.13'
  name: GraphQL Injection
  severity: High
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-89
  - CWE-943
  desc: 'Wstrzyknięcie do resolverów GraphQL, które budują zapytania do backendu (SQL/NoSQL) z argumentów, lub konkatenacja argumentów w zapytaniu.

    '
  desc_en: Injection into GraphQL resolvers that build backend queries (SQL/NoSQL) from arguments, or argument concatenation in a query.
  lang: javascript
  vuln: "// PODATNE — argument GraphQL wprost do SQL\nconst user = (args) =>\n  db.query(\"SELECT * FROM users WHERE name='\" + args.name + \"'\");\n"
  safe: "// BEZPIECZNE — parametryzacja w resolverze\nconst user = (args) =>\n  db.query(\"SELECT * FROM users WHERE name = $1\", [args.name]);\n"
- id: '1.14'
  name: SSRF (odsyłacz)
  severity: Critical
  difficulty: Medium
  confidence: POSSIBLE
  cwe:
  - CWE-918
  desc: 'Wymieniony w tej kategorii zgodnie ze strukturą raportu, ale szczegółowo omówiony w 9.1 Infrastructure.

    '
  desc_en: Listed in this category per report structure, but covered in detail in section 9.1 Infrastructure.
  lang: python
  vuln: '# brak przykładu

    '
  safe: '# brak przykładu

    '
  ref: '9.1'
- id: '1.15'
  name: Crlf Injection
  severity: High
  difficulty: Medium
  confidence: IRON
  cwe:
  - CWE-93
  - CWE-113
  desc: 'Niezfiltrowane znaki CR/LF (\r\n) w nagłówkach HTTP/SMTP pozwalają wstrzyknąć dodatkowe nagłówki lub rozdzielić odpowiedź.

    '
  desc_en: Unfiltered CR/LF (\r\n) characters in HTTP/SMTP headers allow injection of additional headers or response splitting.
  lang: python
  vuln: "# PODATNE — surowy input do nagłówka\nfrom flask import request, Response\n@app.route('/r')\ndef r():\n    url = request.args.get('url')\n    resp = Response('', 302)\n    resp.headers['Location'] = url  # url=\"x\\r\\nSet-Cookie: admin=1\"\n    return resp\n"
  safe: "# BEZPIECZNE — walidacja + odrzucenie CR/LF\nfrom flask import request, abort, redirect\n@app.route('/r')\ndef r():\n    url = request.args.get('url', '')\n    if '\\r' in url or '\\n' in url:\n        abort(400)\n    return redirect(url)  # framework dodatkowo sanitizuje\n"
- id: '1.16'
  name: Expression Language Injection
  severity: Critical
  difficulty: Hard
  confidence: IRON
  cwe:
  - CWE-917
  desc: 'Wstrzyknięcie wyrażenia EL/SpEL ewaluowanego przez kontener (np. Spring) prowadzi do wykonania kodu.

    '
  desc_en: Injection of an EL/SpEL expression evaluated by the container (e.g., Spring) leads to code execution.
  lang: java
  vuln: '// PODATNE — input ewaluowany jako SpEL

    ExpressionParser p = new SpelExpressionParser();

    String in = request.getParameter("q");

    Object v = p.parseExpression(in).getValue(); // "T(java.lang.Runtime).getRuntime().exec(...)"

    '
  safe: '// BEZPIECZNE — nie ewaluuj user inputu jako wyrażenia

    String in = request.getParameter("q");

    Map<String,Object> safe = lookupAllowed(in); // tylko whitelist kluczy

    '
- id: '1.17'
  name: Object Graph Navigation Library Injection (OGNL Injection)
  severity: Critical
  difficulty: Hard
  confidence: IRON
  cwe:
  - CWE-917
  desc: 'OGNL injection (np. w Struts) — wyrażenie OGNL z inputu jest wykonywane przez framework, dając RCE.

    '
  desc_en: OGNL injection (e.g., in Struts) — an OGNL expression from user input is executed by the framework, resulting in RCE.
  lang: java
  vuln: '// PODATNE — wartość parametru interpretowana jako OGNL (Struts S2)

    // %{...} w polu name -> wykonanie OGNL

    stack.findValue(userControlledExpression);

    '
  safe: '// BEZPIECZNE — aktualny Struts + brak dynamicznej ewaluacji inputu

    // Wyłącz dynamic method invocation, waliduj parametry do whitelisty

    String name = sanitizeAllowlist(request.getParameter("name"));

    '
- id: '1.18'
  name: Server-Side Template Injection
  severity: Critical
  difficulty: Medium
  confidence: IRON
  cwe:
  - CWE-1336
  - CWE-94
  desc: 'Nieufny input trafia do silnika szablonów jako część szablonu, nie jako dane — atakujący wykonuje kod po stronie serwera.

    '
  desc_en: Untrusted input reaches the template engine as part of the template, not as data — an attacker executes code server-side.
  lang: python
  vuln: "# PODATNE — render_template_string z user inputem\nfrom flask import request, render_template_string\n@app.route('/hi')\ndef hi():\n    name = request.args.get('name')\n    return render_template_string('Hello ' + name)  # {{7*7}} -> 49, RCE\n"
  safe: "# BEZPIECZNE — input jako dane, nie jako szablon\nfrom flask import request, render_template\n@app.route('/hi')\ndef hi():\n    name = request.args.get('name')\n    return render_template('hi.html', name=name)  # autoescape, name to dane\n"
- id: '1.19'
  name: Xquery Injection
  severity: High
  difficulty: Medium
  confidence: IRON
  cwe:
  - CWE-652
  desc: 'Nieufny input konkatenowany do zapytania XQuery zmienia jego strukturę (analogicznie do SQLi dla XML).

    '
  desc_en: Untrusted input concatenated into an XQuery changes its structure — analogous to SQLi for XML databases.
  lang: java
  vuln: 'String q = "for $u in //user[name=''" + name + "''] return $u";

    xqueryEngine.execute(q); // name = "'' or ''1''=''1"

    '
  safe: "// Parametryzowane XQuery (external variables)\nXQPreparedExpression e = conn.prepareExpression(\n    \"declare variable $n external; //user[name=$n]\");\ne.bindString(new QName(\"n\"), name, null);\n"
- id: '1.20'
  name: Code Injection
  severity: Critical
  difficulty: Easy
  confidence: POSSIBLE
  cwe:
  - CWE-94
  - CWE-95
  desc: 'Nieufny input przekazany do eval/exec jest wykonywany jako kod aplikacji.

    '
  desc_en: Untrusted input passed to eval/exec is executed as application code.
  lang: python
  vuln: "def calc(expr):\n    return eval(expr)  # expr=\"__import__('os').system('rm -rf /')\"\n"
  safe: "import ast, operator as op\nOPS={ast.Add:op.add, ast.Sub:op.sub, ast.Mult:op.mul, ast.Div:op.truediv}\ndef calc(expr):\n    def ev(n):\n        if isinstance(n, ast.Constant): return n.value\n        if isinstance(n, ast.BinOp): return OPS[type(n.op)](ev(n.left), ev(n.right))\n        raise ValueError('niedozwolone')\n    return ev(ast.parse(expr, mode='eval').body)\n"
- id: '1.21'
  name: Command Injection (OS Commanding)
  severity: Critical
  difficulty: Easy
  confidence: POSSIBLE
  cwe:
  - CWE-78
  desc: 'Nieufny input trafia do polecenia powłoki — atakujący wykonuje dowolne komendy.

    '
  desc_en: Untrusted input reaches a shell command — an attacker executes arbitrary commands.
  lang: python
  vuln: "import os\ndef ping(host):\n    os.system(\"ping -c1 \" + host)  # host=\"x; rm -rf /\"\n"
  safe: "import subprocess\ndef ping(host):\n    subprocess.run([\"ping\", \"-c1\", host], shell=False, check=True)\n"
