meta:
  id: mobilejanussignaturebypass
  threatId: '15.23'
  severity: High
  color: '#4c0519'
  colorRgb: 76,5,25
  cwe: CWE-347
  cvss: 7.8 (CVSS 3.0, AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H) -- CVE-2017-13156
  standard: OWASP MASVS-CODE / MASVS-RESILIENCE (MASTG-TEST-0224 "Usage of Insecure Signature Version" explicitly names CVE-2017-13156)
hero:
  titleMain: 'Janus -- Android APK '
  titleGrad: Signature Bypass
  titleTail: ''
  topbar: Janus (CVE-2017-13156) -- Android APK Signature Bypass
  lead:
    en: 'All three research passes fetched GuardSquare''s original December 2017 disclosure directly and converged on identical wording for the core mechanism: an APK is a ZIP archive, and ZIP parsers locate the archive by scanning backward from the End-of-Central-Directory record at the file''s tail -- so arbitrary bytes prepended before the first ZIP entry never disrupt ZIP parsing. The legacy v1/JAR signature scheme "only takes into account the zip entries. It ignores any extra bytes when computing or verifying the application''s signature." A DEX file, meanwhile, is identified and parsed by its magic bytes at the very start. An attacker exploits this asymmetry by prepending a malicious DEX to the front of a legitimately, validly v1-signed APK: read from the tail, it''s still the original signed ZIP/APK; read from the head, it''s a valid DEX the Dalvik/ART runtime will load as the app''s code. GuardSquare named it Janus, after the two-faced Roman god of duality, for exactly this reason -- one file, two valid identities. The result is not a fresh-install attack but an update-hijack: because the file still carries the original developer''s valid signature, Android''s package manager accepts it as a legitimate same-certificate update to the already-installed app, so the malicious code silently inherits that app''s existing UID, granted permissions (no new prompts), and private data access. All three research passes independently and identically flagged a genuine discrepancy worth documenting transparently: NVD''s own machine-readable record for CVE-2017-13156 assigns CWE-434 (Unrestricted Upload of File with Dangerous Type) -- a poor conceptual fit, since Janus has nothing to do with a file-upload endpoint. This entry follows all three research passes in keeping CWE-347 as the primary mapping while adding CWE-354 as a documented, more-precise secondary, per the nuance two of three passes raised independently: the v1 signature is cryptographically valid and correctly verified against the bytes it enumerates -- the failure is that its coverage scope doesn''t extend to what actually executes, which is arguably closer to an integrity-check-value scope gap than to a broken signature check.'
    pl: 'Wszystkie trzy przejścia badawcze pobrały bezpośrednio oryginalne ujawnienie GuardSquare z grudnia 2017 i zbiegły się na identycznym sformułowaniu podstawowego mechanizmu: APK to archiwum ZIP, a parsery ZIP lokalizują archiwum skanując wstecz od rekordu End-of-Central-Directory na końcu pliku -- więc dowolne bajty poprzedzające pierwszy wpis ZIP nigdy nie zakłócają parsowania ZIP. Przestarzały schemat podpisu v1/JAR "bierze pod uwagę tylko wpisy zip. Ignoruje wszelkie dodatkowe bajty przy obliczaniu albo weryfikacji podpisu aplikacji". Plik DEX z kolei jest identyfikowany i parsowany po swoich bajtach magicznych na samym początku. Atakujący wykorzystuje tę asymetrię poprzedzając legalnie, poprawnie podpisanego v1 APK złośliwym DEX: czytany od końca, to wciąż oryginalny podpisany ZIP/APK; czytany od początku, to poprawny DEX który środowisko wykonawcze Dalvik/ART załaduje jako kod apki. GuardSquare nazwało to Janus, po dwutwarzowym rzymskim bogu dualności, dokładnie z tego powodu -- jeden plik, dwie ważne tożsamości. Wynikiem nie jest atak świeżej instalacji ale przejęcie aktualizacji: ponieważ plik wciąż niesie ważny podpis oryginalnego dewelopera, menedżer pakietów Android akceptuje go jako legalną aktualizację z tym samym certyfikatem dla już zainstalowanej apki, więc złośliwy kod po cichu dziedziczy istniejące UID tej apki, przyznane uprawnienia (bez nowych monitów), i dostęp do prywatnych danych. Wszystkie trzy przejścia badawcze niezależnie i identycznie oflagowały prawdziwą rozbieżność wartą przejrzystego udokumentowania: własny odczytywalny maszynowo rekord NVD dla CVE-2017-13156 przypisuje CWE-434 (Unrestricted Upload of File with Dangerous Type) -- słabe dopasowanie koncepcyjne, ponieważ Janus nie ma nic wspólnego z punktem końcowym przesyłania plików. Ten wpis podąża za wszystkimi trzema przejściami badawczymi zachowując CWE-347 jako główne mapowanie dodając CWE-354 jako udokumentowany, precyzyjniejszy drugorzędny, zgodnie z niuansem który dwa z trzech przejść podniosły niezależnie: podpis v1 jest kryptograficznie ważny i poprawnie zweryfikowany względem bajtów które wylicza -- awaria polega na tym że jego zakres pokrycia nie rozciąga się na to co faktycznie się wykonuje, co jest bliższe luce zakresu wartości sprawdzania integralności niż złamanemu sprawdzeniu podpisu.'
  metrics:
  - k: CVE-2017-13156
    v:
      en: CVSS 7.8 High, elevation of privilege, affecting Android 5.1.1 through 8.0 -- confirmed identically by all three research passes against the Android Security Bulletin
      pl: CVSS 7.8 High, eskalacja uprawnień, dotyczy Android 5.1.1 do 8.0 -- potwierdzone identycznie przez wszystkie trzy przejścia badawcze względem Android Security Bulletin
  - k: Two-faced by design
    v:
      en: one file is simultaneously a valid, correctly-signed APK (read from the tail) and a valid DEX (read from the head)
      pl: jeden plik jest jednocześnie ważnym, poprawnie podpisanym APK (czytanym od końca) i ważnym DEX (czytanym od początku)
  - k: NVD's own CWE-434
    v:
      en: flagged by all three research passes as a poor mapping fit -- this entry documents the discrepancy and keeps CWE-347/354 instead
      pl: oflagowane przez wszystkie trzy przejścia badawcze jako słabe dopasowanie mapowania -- ten wpis dokumentuje rozbieżność i zachowuje zamiast tego CWE-347/354
  - k: Signature Scheme v2
    v:
      en: introduced in Android 7.0 (Nougat) -- hashes the entire file from offset 0, structurally closing the Janus gap
      pl: wprowadzone w Android 7.0 (Nougat) -- haszuje cały plik od offsetu 0, strukturalnie zamykając lukę Janus
  sources:
  - label: GuardSquare -- New Android vulnerability (Janus)
    url: https://www.guardsquare.com/blog/new-android-vulnerability-allows-attackers-to-modify-apps-without-affecting-their-signatures-guardsquare
  - label: Android Security Bulletin -- December 2017
    url: https://source.android.com/docs/security/bulletin/2017-12-01
  - label: Android -- APK Signature Scheme v2
    url: https://source.android.com/docs/security/features/apksigning/v2
  - label: OWASP MASTG-TEST-0224 -- Usage of Insecure Signature Version
    url: https://mas.owasp.org/MASTG/tests-beta/android/MASVS-RESILIENCE/MASTG-TEST-0224/
