sections:
  attacks:
    title:
      en: Attack types
      pl: Typy ataków
    lead:
      en: 'OWASP''s own three official attack scenarios for M1, all confirmed against the primary source: hardcoded discovery, insecure transmission interception, and on-device extraction. Real incidents cluster overwhelmingly around the first.'
      pl: 'Trzy własne oficjalne scenariusze ataku OWASP dla M1, wszystkie potwierdzone względem źródła pierwotnego: odkrycie zahardkodowanych, przechwycenie niebezpiecznej transmisji, i ekstrakcja na urządzeniu. Prawdziwe incydenty grupują się zdecydowanie wokół pierwszego.'
    items:
    - name: Hardcoded cloud/service credentials in the binary
      sev: critical
      description:
        en: 'AWS access keys, Firebase configs, or third-party API secrets compiled as string constants -- into BuildConfig fields, strings.xml, assets/, or native .so libraries. Verified as the dominant real-world variant: Symantec found 1,859 apps with hardcoded AWS tokens, 77% still valid.'
        pl: 'Klucze dostępu AWS, konfiguracje Firebase, albo sekrety API firm trzecich skompilowane jako stałe stringowe -- w polach BuildConfig, strings.xml, assets/, albo natywnych bibliotekach .so. Zweryfikowane jako dominujący wariant z praktyki: Symantec znalazł 1859 apek z zahardkodowanymi tokenami AWS, 77% wciąż ważnych.'
      payload: const val AWS_SECRET = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"  -- recoverable via jadx in minutes
    - name: Full third-party account takeover via leaked OAuth credential sets
      sev: critical
      description:
        en: 'Verified via CloudSEK''s 2022 research: 3,207 apps leaked valid Twitter/X API keys, and 230 of them leaked all four OAuth credentials (consumer key/secret + access token/secret) together -- enough to read DMs, tweet, and modify the profile of the app vendor''s own official account.'
        pl: 'Zweryfikowane przez badanie CloudSEK z 2022: 3207 apek wyciekło ważne klucze API Twitter/X, a 230 z nich wyciekło wszystkie cztery poświadczenia OAuth (klucz/sekret konsumenta + token/sekret dostępu) razem -- wystarczająco by czytać DM, tweetować, i modyfikować profil oficjalnego konta dostawcy apki.'
      payload: consumer_key + consumer_secret + access_token + access_token_secret all hardcoded together in the same binary
    - name: Tokens transmitted or logged insecurely
      sev: high
      description:
        en: Session/OAuth tokens sent over plain HTTP, or written to Logcat/NSLog/crash-reporter breadcrumbs where any app with log access (older Android) or anyone with a log dump can harvest them.
        pl: Tokeny sesji/OAuth wysyłane przez zwykły HTTP, albo zapisywane do Logcat/NSLog/okruchów crash-reportera gdzie każda apka z dostępem do logów (starszy Android) albo ktoś z dumpem logów może je zebrać.
      payload: 'Log.d("AuthDebug", "Bearer token: $sessionToken")'
    - name: Credentials stored on-device without encryption
      sev: high
      description:
        en: Tokens or passwords in plaintext SharedPreferences XML, NSUserDefaults plist, or unencrypted SQLite -- trivially dumped on a rooted/jailbroken device or via a backup extraction, distinct from M9's broader scope in that the specific object at risk is a credential.
        pl: Tokeny albo hasła w postaci zwykłego tekstu w SharedPreferences XML, NSUserDefaults plist, albo niezaszyfrowanym SQLite -- trywialnie zrzucane na zrootowanym/jailbreaknietym urządzeniu albo przez ekstrakcję backupu, różne od szerszego zakresu M9 tym że konkretnym zagrożonym obiektem jest poświadczenie.
      payload: getSharedPreferences("auth", MODE_PRIVATE).edit().putString("token", rawToken).apply()
    - name: Weak/predictable session-token generation and missing rotation
      sev: medium
      description:
        en: Tokens derived from device ID, timestamp, or a non-CSPRNG source allow prediction or forgery; and tokens never invalidated server-side on logout remain usable indefinitely -- both explicitly part of OWASP's credential-lifecycle framing for M1, not just the hardcoding facet.
        pl: Tokeny wyprowadzone z ID urządzenia, znacznika czasu, albo źródła innego niż CSPRNG pozwalają na przewidzenie albo sfałszowanie; a tokeny nigdy nie unieważnione po stronie serwera po wylogowaniu pozostają użyteczne bezterminowo -- oba jawnie część ramowania cyklu życia poświadczeń OWASP dla M1, nie tylko aspekt hardkodowania.
      payload: val token = "${deviceId}_${System.currentTimeMillis()}"  -- predictable, no server-side CSPRNG
    - name: '"Removed" secrets that survive in the shipped artifact'
      sev: medium
      description:
        en: A key deleted from current source but still present in a native .so library, an older bundled resource, or a shared third-party SDK reused across a vendor's whole app portfolio -- Symantec found 53% of leaking apps reused the SAME token across multiple apps by the same vendor, pointing directly at shared-SDK propagation.
        pl: Klucz usunięty z bieżącego źródła ale wciąż obecny w natywnej bibliotece .so, starszym dołączonym zasobie, albo współdzielonym SDK firmy trzeciej używanym w całym portfolio apek dostawcy -- Symantec znalazł że 53% wyciekających apek ponownie używało TEGO SAMEGO tokenu w wielu apkach tego samego dostawcy, wskazując bezpośrednio na propagację przez współdzielony SDK.
      payload: -- same AWS token found embedded across dozens of unrelated apps sharing one vendor SDK
  code:
    title:
      en: Vulnerable vs Secure
      pl: Podatny vs Bezpieczny
    lead:
      en: 'The architectural fix is always the same: stop shipping long-lived secrets in the client at all. Keystore/Keychain protect what genuinely must persist on-device, but they are not a substitute for that first decision.'
      pl: 'Naprawa architektoniczna jest zawsze taka sama: przestań w ogóle wysyłać długożyjące sekrety w kliencie. Keystore/Keychain chronią to co naprawdę musi przetrwać na urządzeniu, ale nie są substytutem tej pierwszej decyzji.'
    languages:
    - label: Android (Kotlin) -- hardcoded key
      lang: kotlin
      vulnerable: "object ApiConfig {\n    // ANTI-PATTERN: compiled into BuildConfig/DEX, recoverable via jadx in minutes\n    const val AWS_SECRET = \"wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\"\n}\nval client = S3Client(ApiConfig.AWS_SECRET)"
      safe: "// SAFE: no long-lived AWS secret in the client at all.\n// The app authenticates the USER to your backend, which mints\n// short-lived, scoped credentials (e.g. AWS STS) on demand.\nsuspend fun uploadReceipt(file: ByteArray) {\n    val grant = backend.requestScopedUpload(userToken)  // short TTL, scoped\n    httpsUpload(grant.url, file)                          // no AWS secret client-side\n}\n\n// Anything that genuinely must persist on-device goes in the\n// hardware-backed Android Keystore, never raw SharedPreferences:\nval prefs = EncryptedSharedPreferences.create(\n    context, \"secure_prefs\",\n    MasterKey.Builder(context).setKeyScheme(MasterKey.KeyScheme.AES256_GCM).build(),\n    EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,\n    EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM\n)"
    - label: iOS (Swift) -- hardcoded key
      lang: swift
      vulnerable: "struct Secrets {\n    // ANTI-PATTERN: lands in __TEXT/__cstring, recoverable via `strings`/Hopper\n    static let apiKey = \"REDACTED-EXAMPLE-hardcoded-payment-api-key\"\n}"
      safe: "// SAFE: backend-issued short-lived token, Keychain-backed on-device.\nlet token = try await backend.fetchScopedToken(userAuth: userAuth)  // short TTL\n\nlet query: [String: Any] = [\n    kSecClass as String: kSecClassGenericPassword,\n    kSecAttrAccount as String: \"session_token\",\n    kSecValueData as String: Data(token.utf8),\n    kSecAttrAccessible as String: kSecAttrAccessibleWhenUnlockedThisDeviceOnly\n]\nSecItemAdd(query as CFDictionary, nil)\n// Privileged operations happen server-side after validating this token --\n// the app never carries the third-party service secret at all."
  method:
    title:
      en: Attack methodology
      pl: Metodyka ataku
    lead:
      en: 'The workflow that produced every real incident in this deep-dive: acquire the binary, automate a first pass, decompile and grep, then validate what was found against the live service.'
      pl: 'Przepływ pracy który wyprodukował każdy prawdziwy incydent w tym deep-dive: zdobądź binarkę, zautomatyzuj pierwsze przejście, dekompiluj i grep, potem zweryfikuj to co znaleziono względem żywej usługi.'
    steps:
    - title:
        en: Acquire the artifact and run automated triage
        pl: Zdobądź artefakt i uruchom automatyczne rozpoznanie
      description:
        en: Pull the APK (adb/APKMirror) or IPA, then run MobSF for a one-shot report flagging hardcoded secrets, insecure storage, and weak crypto -- the cheap first pass every real study in this deep-dive effectively automated.
        pl: Wyciągnij APK (adb/APKMirror) albo IPA, potem uruchom MobSF dla jednorazowego raportu flagującego zahardkodowane sekrety, niebezpieczne przechowywanie, i słabą kryptografię -- tani pierwszy krok który każde prawdziwe badanie w tym deep-dive efektywnie zautomatyzowało.
    - title:
        en: Decompile and grep for secrets
        pl: Dekompiluj i grep pod kątem sekretów
      description:
        en: apktool + jadx on Android (or class-dump/Hopper/Ghidra on a decrypted iOS Mach-O), then sweep the output with TruffleHog/gitleaks-style entropy and regex scanners across strings.xml, BuildConfig, assets/, and native .so/Mach-O strings.
        pl: apktool + jadx na Androidzie (albo class-dump/Hopper/Ghidra na odszyfrowanym Mach-O iOS), potem przeczesz output skanerami entropii i regex w stylu TruffleHog/gitleaks przez strings.xml, BuildConfig, assets/, i stringi natywnych .so/Mach-O.
    - title:
        en: Validate found credentials against the live service
        pl: Zweryfikuj znalezione poświadczenia względem żywej usługi
      description:
        en: 'The step that turned CloudSEK''s and Symantec''s findings from "we found strings" into "77% are still valid": actually call the provider API (AWS STS get-caller-identity, Twitter API) with the extracted credential to confirm it''s live and determine its scope.'
        pl: 'Krok który zamienił ustalenia CloudSEK i Symantec z "znaleźliśmy stringi" na "77% wciąż ważnych": faktyczne wywołanie API dostawcy (AWS STS get-caller-identity, Twitter API) z wyekstrahowanym poświadczeniem by potwierdzić że jest żywe i ustalić jego zakres.'
    - title:
        en: Dynamic analysis for runtime-only secrets
        pl: Analiza dynamiczna dla sekretów tylko-w-czasie-wykonania
      description:
        en: Frida + objection on a rooted/jailbroken device or emulator to hook crypto/network calls and dump values decrypted only at runtime -- catches secrets that static string-obfuscation hides from a purely static pass.
        pl: Frida + objection na zrootowanym/jailbreaknietym urządzeniu albo emulatorze by zahaczyć wywołania krypto/sieciowe i zrzucić wartości odszyfrowywane tylko w czasie wykonania -- łapie sekrety które statyczna obfuskacja stringów ukrywa przed czysto statycznym przejściem.
  defenses:
    title:
      en: Defense layers, ranked
      pl: Warstwy obrony wg skuteczności
    lead:
      en: 'All three research passes converged on the same top finding, grounded directly in CWE-798''s own text: obfuscation raises the cost of extraction but never removes the secret from an attacker''s possession, since it ships inside the same binary either way.'
      pl: 'Wszystkie trzy przejścia badawcze zbiegły się na tym samym głównym ustaleniu, ugruntowanym bezpośrednio we własnym tekście CWE-798: obfuskacja podnosi koszt ekstrakcji ale nigdy nie usuwa sekretu z posiadania atakującego, bo tak czy inaczej jest wysyłany wewnątrz tej samej binarki.'
    items:
    - rank: 1
      eff: 95
      kind: primary
      label:
        en: Never embed long-lived secrets in the client -- backend-mediated auth
        pl: Nigdy nie osadzaj długożyjących sekretów w kliencie -- uwierzytelnianie zapośredniczone przez backend
      note:
        en: The app authenticates the USER to your backend, which holds the actual service secret and either proxies the privileged call or mints a short-lived, scoped token (e.g. AWS STS). If nothing sensitive is compiled into the binary, decompilation finds nothing to steal -- the only control that removes the class rather than mitigating it.
        pl: Aplikacja uwierzytelnia UŻYTKOWNIKA do twojego backendu, który przechowuje faktyczny sekret usługi i albo pośredniczy w uprzywilejowanym wywołaniu, albo wybija krótkożyjący, zakresowy token (np. AWS STS). Jeśli nic wrażliwego nie jest skompilowane do binarki, dekompilacja nie znajduje niczego do ukradzenia -- jedyna kontrola która usuwa klasę zamiast ją łagodzić.
    - rank: 2
      eff: 85
      kind: primary
      label:
        en: Short-lived, narrowly-scoped tokens with real server-side rotation/revocation
        pl: Krótkożyjące, wąsko zakresowe tokeny z prawdziwą rotacją/unieważnieniem po stronie serwera
      note:
        en: Bounds blast radius when something does leak, and directly addresses the lifecycle failure OWASP's own M1 framing emphasizes -- generation, rotation, and invalidation, not just storage.
        pl: Ogranicza promień rażenia gdy coś jednak wycieknie, i bezpośrednio adresuje awarię cyklu życia którą podkreśla własne ramowanie M1 OWASP -- generację, rotację, i unieważnienie, nie tylko przechowywanie.
    - rank: 3
      eff: 75
      kind: strong
      label:
        en: Hardware-backed storage for what must genuinely persist -- Keystore / Keychain / Secure Enclave
        pl: Przechowywanie oparte na sprzęcie dla tego co naprawdę musi przetrwać -- Keystore / Keychain / Secure Enclave
      note:
        en: Strong against other apps and offline device theft, but does not protect against a runtime attacker on a compromised device -- Frida can still observe the decrypted value at the point of use even when it's Keystore/Keychain-backed at rest.
        pl: Silne przeciw innym apkom i offline kradzieży urządzenia, ale nie chroni przed atakującym runtime na skompromitowanym urządzeniu -- Frida wciąż może zaobserwować odszyfrowaną wartość w miejscu użycia nawet gdy jest oparta na Keystore/Keychain w spoczynku.
    - rank: 4
      eff: 60
      kind: strong
      label:
        en: Certificate/public-key pinning for credential transmission
        pl: Przypinanie certyfikatu/klucza publicznego dla transmisji poświadczeń
      note:
        en: Protects against network-level interception (OWASP's second official attack scenario), but is itself bypassable at runtime with Frida/objection on a controlled device -- real defense against a hostile-network attacker, weak against a determined reverse engineer.
        pl: Chroni przed przechwyceniem na poziomie sieci (drugi oficjalny scenariusz ataku OWASP), ale samo jest omijalne w czasie wykonania przez Frida/objection na kontrolowanym urządzeniu -- prawdziwa obrona przeciw atakującemu z wrogiej sieci, słaba przeciw zdeterminowanemu inżynierowi wstecznemu.
    - rank: 5
      eff: 30
      kind: weak
      label:
        en: Code obfuscation / binary hardening / RASP
        pl: Obfuskacja kodu / utwardzanie binarki / RASP
      note:
        en: 'Consistently verified as the weakest, most overrated control: CWE-798''s own text calls binary extraction "usually very simple," and constants survive renaming/encryption schemes that only decrypt at runtime -- exactly where Frida observes them. Raises attacker time cost; never converts a shipped secret into a safe one.'
        pl: 'Konsekwentnie zweryfikowane jako najsłabsza, najbardziej przereklamowana kontrola: własny tekst CWE-798 nazywa ekstrakcję z binarki "zwykle bardzo prostą", a stałe przetrwają schematy zmiany nazw/szyfrowania które odszyfrowują się tylko w czasie wykonania -- dokładnie tam gdzie obserwuje je Frida. Podnosi koszt czasowy atakującego; nigdy nie zamienia wysłanego sekretu w bezpieczny.'
  incidents:
    title:
      en: Real-world incidents
      pl: Rzeczywiste incydenty
    lead:
      en: A rich, cross-team-corroborated record -- unusually strong for a single vulnerability class, reflecting how easy and common this failure is per OWASP's own EASY/COMMON rating. Two of the CVEs below were each found by only one research pass but independently verified against NVD directly, so both are included with that provenance noted.
      pl: Bogaty, potwierdzony międzyzespołowo rejestr -- niezwykle silny jak na jedną klasę podatności, odzwierciedlający jak łatwa i częsta jest ta awaria wg własnej oceny OWASP EASY/COMMON. Dwa CVE poniżej zostały znalezione tylko przez jedno przejście badawcze każde ale niezależnie zweryfikowane bezpośrednio względem NVD, więc oba są uwzględnione z tą adnotacją pochodzenia.
    items:
    - org: 1,859 mobile apps (Symantec study)
      year: 2022
      impact: Hardcoded AWS credentials, 77% valid, ~47-50% granting full S3 access
      cost: Millions of files exposed in some cases; 53% of leaking apps reused the same token across the same vendor's app portfolio
      description:
        en: 'Confirmed independently by all three research passes: Symantec''s Threat Hunter Team found more than 1,800 Android and iOS apps (later precisely counted at 1,859 by secondary reporting) with hardcoded AWS access tokens embedded in the binary. The vast majority ran valid, and nearly half granted unrestricted S3 bucket access. The token-reuse finding across a shared vendor SDK is a direct, real-world instance of this deep-dive''s "removed secrets survive" attack variant.'
        pl: 'Potwierdzone niezależnie przez wszystkie trzy przejścia badawcze: Threat Hunter Team Symantec znalazł ponad 1800 apek Android i iOS (później dokładnie policzonych na 1859 przez wtórne raportowanie) z zahardkodowanymi tokenami dostępu AWS osadzonymi w binarce. Zdecydowana większość działała jako ważne, a prawie połowa dawała nieograniczony dostęp do zasobnika S3. Ustalenie ponownego użycia tokenu w współdzielonym SDK dostawcy to bezpośredni, prawdziwy przypadek wariantu ataku "usunięte sekrety przetrwają" z tego deep-dive.'
    - org: CloudSEK — Twitter/X API key exposure
      year: 2022
      impact: 3,207 apps leaking valid keys; 230 leaking all four OAuth credentials
      cost: Full account takeover capability (read DMs, tweet, modify profile) for the affected vendor accounts
      description:
        en: 'Confirmed independently by all three research passes: CloudSEK''s scan found 3,207 apps exposing valid Twitter/X API keys, with 230 exposing the complete four-part OAuth credential set (consumer key/secret plus access token/secret) -- sufficient for a full account takeover of the app vendor''s own official Twitter presence.'
        pl: 'Potwierdzone niezależnie przez wszystkie trzy przejścia badawcze: skan CloudSEK znalazł 3207 apek ujawniających ważne klucze API Twitter/X, z 230 ujawniającymi kompletny czteroczęściowy zestaw poświadczeń OAuth (klucz/sekret konsumenta plus token/sekret dostępu) -- wystarczające do pełnego przejęcia konta oficjalnej obecności Twitter dostawcy apki.'
    - org: Selfwealth (iOS)
      year: 2023
      impact: CVE-2023-23132 -- CVSS 7.5 High, CWE-798
      cost: Fixed in a later version
      description:
        en: 'Verified directly against NVD: version 3.3.1 of the Selfwealth iOS app revealed hardcoded API keys, tagged CWE-798 -- a clean, single-app, undisputed example of this deep-dive''s primary weakness classification.'
        pl: 'Zweryfikowane bezpośrednio względem NVD: wersja 3.3.1 apki Selfwealth iOS ujawniała zahardkodowane klucze API, otagowane CWE-798 -- czysty, jednoapkowy, niesporny przykład głównej klasyfikacji słabości tego deep-dive.'
    - org: MobileIron Mobile@Work
      year: 2020
      impact: CVE-2020-35137 -- CVSS 7.5 High, CWE-798 -- DISPUTED
      cost: Vendor declined to change; feature described as opt-in, not default
      description:
        en: 'Verified directly against NVD: Android and iOS MobileIron agents through 2021-03-22 contained a hardcoded API key for the MobileIron SaaS discovery API. Included with its DISPUTED status stated plainly rather than presented as an undisputed breach -- the vendor maintains the affected feature is opt-in, illustrating that not every real CWE-798 CVE reflects universal agreement on severity.'
        pl: 'Zweryfikowane bezpośrednio względem NVD: agenty Android i iOS MobileIron do 2021-03-22 zawierały zahardkodowany klucz API dla API discovery SaaS MobileIron. Uwzględnione z jego statusem DISPUTED stwierdzonym jasno zamiast przedstawione jako niesporny wyciek -- dostawca utrzymuje że dotknięta funkcja jest opt-in, ilustrując że nie każde prawdziwe CVE CWE-798 odzwierciedla powszechną zgodę co do wagi.'
    inlineSources:
    - label: Symantec AWS credentials study (TheHackerNews)
      url: https://thehackernews.com/2022/09/over-1800-android-and-ios-apps-found.html
    - label: CVE-2023-23132 (NVD)
      url: https://nvd.nist.gov/vuln/detail/CVE-2023-23132
    - label: CVE-2020-35137 (NVD)
      url: https://nvd.nist.gov/vuln/detail/CVE-2020-35137
  tools:
    title:
      en: Detection tooling
      pl: Narzędzia wykrywania
    lead:
      en: A mature, well-established tool chain -- every real incident in this deep-dive was found using some combination of the tools below, not custom research infrastructure.
      pl: Dojrzały, dobrze ugruntowany łańcuch narzędzi -- każdy prawdziwy incydent w tym deep-dive został znaleziony przy użyciu jakiejś kombinacji poniższych narzędzi, nie niestandardowej infrastruktury badawczej.
    sast:
    - - MobSF (Mobile Security Framework)
      - Automated static+dynamic analysis for APK/IPA; flags hardcoded secrets, insecure storage, and weak crypto in a single report -- the standard first pass
    - - TruffleHog / gitleaks
      - Entropy and regex-based secret scanners, run over decompiled sources and any bundled build artifacts/git history
    - - Semgrep (mobile rulesets)
      - Static pattern-matching for hardcoded-credential and insecure-storage patterns in Kotlin/Java/Swift source
    dast:
    - - jadx / apktool
      - DEX-to-Java/Kotlin decompilation and APK resource/manifest unpacking -- the primary Android static-extraction path
    - - class-dump / Hopper / Ghidra
      - iOS Objective-C metadata extraction and Mach-O disassembly, used after decrypting an App Store binary on a jailbroken device
    - - Frida + objection
      - Dynamic instrumentation to hook crypto/network calls, dump values decrypted only at runtime, and bypass certificate pinning/root-jailbreak detection -- defeats what static obfuscation alone cannot hide
    note:
      en: <strong>Key signal:</strong> the step that separates a real incident from a theoretical finding is validating an extracted credential against the live provider API (AWS STS, Twitter API) -- this is exactly how Symantec confirmed 77% of found AWS tokens were still valid, not just present as strings.
      pl: <strong>Kluczowy sygnał:</strong> krok który oddziela prawdziwy incydent od teoretycznego znaleziska to zweryfikowanie wyekstrahowanego poświadczenia względem żywego API dostawcy (AWS STS, Twitter API) -- dokładnie tak Symantec potwierdził że 77% znalezionych tokenów AWS wciąż było ważnych, nie tylko obecnych jako stringi.
  compliance:
    title:
      en: Compliance quick-reference
      pl: Szybka zgodność
    lead:
      en: This is the founding entry for CodeGuardian's Mobile Security category, so the standard is deliberately OWASP Mobile Top 10 2024 -- not force-fit into a web OWASP Top 10 (2021) A0X category, which all three research passes flagged as the wrong instinct for mobile-specific threats.
      pl: To fundamentalny wpis dla nowej kategorii Mobile Security CodeGuardian, więc standard jest celowo OWASP Mobile Top 10 2024 -- nie na siłę dopasowany do kategorii A0X webowego OWASP Top 10 (2021), co wszystkie trzy przejścia badawcze oflagowały jako błędny instynkt dla zagrożeń specyficznych dla mobile.
    items:
    - std: CWE (MITRE)
      items:
      - CWE-798 — Use of Hard-coded Credentials (primary). Base-level. Its own text explicitly states client-side hardcoded credentials are especially dangerous because "the extraction of a password from a binary is usually very simple" -- verified directly at cwe.mitre.org, and the founding justification for this whole deep-dive.
      - CWE-522 — Insufficiently Protected Credentials (secondary, for the insecure-storage/transmission facets). Confirmed by all three research passes as a SIBLING of CWE-798 under the authentication umbrella, not its parent or child -- cite both, don't force a hierarchy that doesn't exist.
    - std: OWASP
      items:
      - 'Mobile Top 10 2024 — M1: Improper Credential Usage, ranked #1 of 10. Verified directly against owasp.org: Exploitability EASY, Prevalence COMMON, Detectability EASY, Impact SEVERE.'
      - The official M1 page does not itself enumerate specific CWE numbers -- confirmed by all three research passes by fetching the page directly. The CWE-798/CWE-522 mapping above is the standard analytical alignment, not a quote from OWASP's own text.
      - MASVS-AUTH is the companion OWASP MASVS control area most commonly associated with M1 (with MASVS-STORAGE for the persistence facet) -- flagged by all three passes as widely stated in secondary sources but not confirmed on an official OWASP mapping page, so presented here with that caveat rather than as settled fact.
    inlineSources:
    - label: OWASP Mobile Top 10 2024 — M1
      url: https://owasp.org/www-project-mobile-top-10/2023-risks/m1-improper-credential-usage
    - label: CWE-798 (MITRE)
      url: https://cwe.mitre.org/data/definitions/798.html
    - label: CWE-522 (MITRE)
      url: https://cwe.mitre.org/data/definitions/522.html
  ir:
    title:
      en: Incident response checklist
      pl: Lista kontrolna reagowania
    lead:
      en: If an exposed credential in a shipped mobile app is confirmed, work this list top to bottom.
      pl: Po potwierdzeniu ujawnionego poświadczenia w wydanej aplikacji mobilnej, przejdź tę listę od góry.
    steps:
    - en: Revoke and rotate the exposed credential at the provider immediately -- do not wait for an app update to reach users, since the binary is already public
      pl: Natychmiast unieważnij i zrotuj ujawnione poświadczenie u dostawcy -- nie czekaj na aktualizację apki by dotarła do użytkowników, bo binarka jest już publiczna
    - en: Determine the exposed credential's actual scope (which S3 buckets, which API endpoints, which account) and audit for signs of prior abuse, not just confirm the leak
      pl: Ustal faktyczny zakres ujawnionego poświadczenia (które zasobniki S3, które endpointy API, które konto) i przeaudytuj pod kątem oznak wcześniejszego nadużycia, nie tylko potwierdź wyciek
    - en: Check whether the same credential or SDK is shared across other apps in the same portfolio -- Symantec's finding that 53% of leaks reused a token across a vendor's apps means one leak is rarely isolated
      pl: Sprawdź czy to samo poświadczenie albo SDK jest współdzielone w innych apkach tego samego portfolio -- ustalenie Symantec że 53% wycieków ponownie używało tokenu w apkach dostawcy oznacza że jeden wyciek rzadko jest odizolowany
    - en: Ship an app update that removes the credential from the client entirely (backend-mediated) rather than re-hardcoding a rotated replacement
      pl: Wydaj aktualizację apki która całkowicie usuwa poświadczenie z klienta (zapośredniczone przez backend) zamiast ponownie hardkodować zrotowany zamiennik
    - en: Audit build artifacts and git history for any other secrets that may have shipped alongside the confirmed one
      pl: Przeaudytuj artefakty budowania i historię git pod kątem innych sekretów które mogły zostać wysłane obok potwierdzonego
    - en: Notify per applicable data-breach obligations if the exposed credential granted access to user data
      pl: Powiadom zgodnie z obowiązującymi wymogami dot. naruszenia danych jeśli ujawnione poświadczenie dawało dostęp do danych użytkowników
