meta:
  id: mobilecredentials
  threatId: '15.1'
  severity: Critical
  color: '#059669'
  colorRgb: 5,150,105
  cwe: CWE-798
  cvss: '7.5'
  standard: OWASP Mobile Top 10 2024 (M1)
hero:
  titleMain: 'Improper Credential '
  titleGrad: Usage
  titleTail: ''
  topbar: Improper Credential Usage (OWASP Mobile Top 10 2024, M1)
  lead:
    en: 'Ranked #1 in the OWASP Mobile Top 10 2024, and for a structural reason every research pass converged on independently: a mobile app binary is not a server asset the defender controls -- it is handed directly to every user, including attackers. CWE-798''s own text states it plainly: "the extraction of a password from a binary is usually very simple." Any long-lived secret compiled into an APK or IPA -- an AWS key, a Twitter API secret, a hardcoded token -- must be treated as already public the moment the app ships, regardless of obfuscation. This is the founding deep-dive for CodeGuardian''s new Mobile Security category, distinguishing credential-specific failures (hardcoding, insecure transmission, weak generation) from the separate, broader Insecure Data Storage category (M9) elsewhere in this catalog.'
    pl: 'Sklasyfikowane #1 w OWASP Mobile Top 10 2024, i to ze strukturalnego powodu do którego niezależnie doszło każde przejście badawcze: binarka aplikacji mobilnej to nie zasób serwera kontrolowany przez obrońcę -- jest oddawana bezpośrednio każdemu użytkownikowi, włącznie z atakującymi. Własny tekst CWE-798 mówi to wprost: "wyekstrahowanie hasła z binarki jest zwykle bardzo proste". Każdy długożyjący sekret skompilowany do APK albo IPA -- klucz AWS, sekret API Twittera, zahardkodowany token -- musi być traktowany jako już publiczny w chwili wydania aplikacji, niezależnie od obfuskacji. To fundamentalny deep-dive dla nowej kategorii Mobile Security CodeGuardian, rozdzielający awarie specyficzne dla poświadczeń (hardkodowanie, niebezpieczna transmisja, słaba generacja) od osobnej, szerszej kategorii Insecure Data Storage (M9) gdzie indziej w tym katalogu.'
  metrics:
  - k: CWE-798
    v:
      en: Weakness ID (+ CWE-522)
      pl: ID słabości (+ CWE-522)
  - k: '#1'
    v:
      en: OWASP Mobile Top 10 2024 ranking
      pl: Ranking OWASP Mobile Top 10 2024
  - k: 1,859
    v:
      en: Apps w/ hardcoded AWS creds (Symantec)
      pl: Apek z zahardkodowanymi kredami AWS (Symantec)
  - k: EASY/EASY
    v:
      en: Exploitability / Detectability (OWASP)
      pl: Eksploatowalność / Wykrywalność (OWASP)
  sources:
  - label: 'OWASP Mobile Top 10 2024 — M1: Improper Credential Usage'
    url: https://owasp.org/www-project-mobile-top-10/2023-risks/m1-improper-credential-usage
  - label: CWE-798 (MITRE)
    url: https://cwe.mitre.org/data/definitions/798.html
  - label: Symantec — Hardcoded AWS credentials in mobile apps
    url: https://thehackernews.com/2022/09/over-1800-android-and-ios-apps-found.html
  - label: OWASP MASTG — UnCrackable App Level 1
    url: https://mas.owasp.org/MASTG/apps/android/MASTG-APP-0003/
