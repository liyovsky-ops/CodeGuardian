meta:
  id: yamlinjection
  threatId: cat_1_research05
  severity: Critical
  color: '#d946ef'
  colorRgb: 217,70,239
  cwe: CWE-502
  cvss: '9.8'
  standard: OWASP A08:2021
hero:
  titleMain: 'YAML '
  titleGrad: Injection
  titleTail: ''
  topbar: YAML Injection / Unsafe Deserialization
  lead:
    en: 'This isn''t syntax-breakout injection — it''s deserialization (CWE-502) wearing a YAML label. Many parsers support tags that instantiate language-native objects during parsing: Ruby''s !ruby/object:, Python''s !!python/object/apply:, Java SnakeYAML''s !!javax.script.ScriptEngineManager. When an unsafe loader processes attacker-controlled YAML, that object construction becomes a direct line to Runtime.exec()-equivalent code execution. CVE-2013-0156 (Rails) and CVE-2022-1471 (SnakeYAML, CVSS 9.8) are the two headline incidents — the fix is never escaping, it''s restricting which types the loader is allowed to build.'
    pl: 'To nie wstrzyknięcie przez wyłamanie ze składni — to deserializacja (CWE-502) w przebraniu YAML. Wiele parserów wspiera tagi tworzące instancje obiektów natywnych języka podczas parsowania: !ruby/object: w Ruby, !!python/object/apply: w Pythonie, !!javax.script.ScriptEngineManager w Java SnakeYAML. Gdy niebezpieczny loader przetwarza YAML kontrolowany przez atakującego, ta konstrukcja obiektu staje się bezpośrednią linią do wykonania kodu odpowiadającego Runtime.exec(). CVE-2013-0156 (Rails) i CVE-2022-1471 (SnakeYAML, CVSS 9.8) to dwa flagowe incydenty — naprawa to nigdy escapowanie, tylko ograniczenie jakie typy loader może budować.'
  metrics:
  - k: CWE-502
    v:
      en: Weakness ID
      pl: ID słabości
  - k: '9.8'
    v: CVSS · Critical
  - k: A08:2021
