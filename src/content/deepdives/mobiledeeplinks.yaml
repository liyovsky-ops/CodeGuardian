meta:
  id: mobiledeeplinks
  threatId: '15.16'
  severity: High
  color: '#b45309'
  colorRgb: 180,83,9
  cwe: CWE-939
  cvss: N/A (technique class spanning Android/iOS; flagship modern case CVE-2026-26123 -- Microsoft Authenticator -- rated Important, CVSS ~5.5; TikTok CVE-2022-28799 deep-link-to-WebView chain rated Critical by Microsoft)
  standard: OWASP MASTG-TEST-0028 (Android, Testing Deep Links) / MASTG-TEST-0070 + 0075 (iOS, Universal Links + Custom URL Schemes); RFC 8252 + RFC 7636 (OAuth for native apps + PKCE)
hero:
  titleMain: 'Insecure Deep Link / '
  titleGrad: Custom URL Scheme Handling
  titleTail: ''
  topbar: Insecure Deep Link / Custom URL Scheme Handling (Android + iOS)
  lead:
    en: 'All three research passes independently converged on the same headline correction, stated almost identically: Android App Links and iOS Universal Links solve the SOURCE problem (which app is the domain-verified, exclusive recipient of a link) but do nothing about the PARAMETER-TRUST problem (whether the data carried inside that link -- a token, a redirect URL, a command -- should be acted on unconditionally). A perfectly verified, exclusive App Link handler is still fully exploitable if it trusts `?token=X&email=attacker@evil.com` without checking the token belongs to the authenticated user. Custom schemes (`myapp://` on Android, `CFBundleURLTypes` on iOS) compound this with a second, distinct problem: any app can register the same scheme, since there is no domain-ownership or cryptographic proof behind it -- Apple''s own developer documentation warns plainly that "because URL schemes aren''t unique, other apps can potentially claim the same scheme." The named, standardized instance of the source-interception problem is OAuth "custom URI scheme interception," documented in RFC 8252 Section 8.1: because multiple apps can register the same private-use scheme, it is indeterminate which app receives an authorization code delivered via that redirect -- the mandated fix, per RFC 8252 Section 6, is PKCE (RFC 7636), which makes an intercepted authorization code useless without the code_verifier that never leaves the legitimate app. Two of three research passes independently found and cross-verified the same flagship modern incident, CVE-2026-26123 (Microsoft Authenticator), where a deep link the app itself emitted for QR-based sign-in was never claimed by its own intent-filter, letting any installed app register the scheme and intercept the sign-in code -- a clean, current illustration of the source-problem half of this entry.'
    pl: 'Wszystkie trzy przejścia badawcze niezależnie zbiegły się na tej samej nagłówkowej korekcie, sformułowanej niemal identycznie: Android App Links i iOS Universal Links rozwiązują problem ŹRÓDŁA (która apka jest zweryfikowanym domenowo, wyłącznym odbiorcą linku) ale nic nie robią z problemem ZAUFANIA PARAMETRÓW (czy dane niesione wewnątrz tego linku -- token, URL przekierowania, komenda -- powinny być wykonane bezwarunkowo). Idealnie zweryfikowany, wyłączny handler App Link jest wciąż w pełni eksploatowalny jeśli zaufa `?token=X&email=attacker@evil.com` bez sprawdzenia że token należy do uwierzytelnionego użytkownika. Schematy niestandardowe (`myapp://` na Android, `CFBundleURLTypes` na iOS) potęgują to drugim, odrębnym problemem: dowolna apka może zarejestrować ten sam schemat, ponieważ nie ma za nim dowodu własności domeny ani kryptograficznego -- własna dokumentacja deweloperska Apple ostrzega wprost że "ponieważ schematy URL nie są unikalne, inne apki mogą potencjalnie zgłosić ten sam schemat". Nazwaną, ustandaryzowaną instancją problemu przechwycenia źródła jest "custom URI scheme interception" OAuth, udokumentowane w RFC 8252 Sekcja 8.1: ponieważ wiele apek może zarejestrować ten sam schemat private-use, jest nieokreślone która apka otrzyma kod autoryzacji dostarczony przez to przekierowanie -- obowiązkową naprawą, zgodnie z RFC 8252 Sekcja 6, jest PKCE (RFC 7636), które czyni przechwycony kod autoryzacji bezużytecznym bez code_verifier który nigdy nie opuszcza legalnej apki. Dwa z trzech przejść badawczych niezależnie znalazły i skrzyżowo zweryfikowały ten sam flagowy nowoczesny incydent, CVE-2026-26123 (Microsoft Authenticator), gdzie deep link który sama apka emitowała dla logowania przez QR nigdy nie został zgłoszony przez jej własny intent-filter, pozwalając dowolnej zainstalowanej apce zarejestrować schemat i przechwycić kod logowania -- czysta, aktualna ilustracja połowy problemu źródła tego wpisu.'
  metrics:
  - k: CVE-2026-26123
    v:
      en: 'Microsoft Authenticator: unclaimed ms-msa:// deep link let any installed app register the scheme and intercept sign-in codes'
      pl: 'Microsoft Authenticator: nieodebrany deep link ms-msa:// pozwolił dowolnej zainstalowanej apce zarejestrować schemat i przechwycić kody logowania'
  - k: RFC 8252 §8.1
    v:
      en: 'the IETF''s own name for this attack class: custom URI scheme interception -- multiple apps can register the same scheme'
      pl: 'własna nazwa IETF dla tej klasy ataku: przechwycenie schematu URI custom -- wiele apek może zarejestrować ten sam schemat'
  - k: CWE-939
    v:
      en: confirmed a direct child of CWE-940 (used by sibling entry 15.12) -- a clean specialization, not an overlap
      pl: potwierdzone jako bezpośrednie dziecko CWE-940 (używane przez siostrzany wpis 15.12) -- czysta specjalizacja, nie nakładanie się
  - k: Two problems
    v:
      en: source (who receives the link) and parameter trust (what the app does with it) are distinct and both need fixing
      pl: źródło (kto odbiera link) i zaufanie parametrów (co apka z nim robi) to odrębne i oba wymagają naprawy
  sources:
  - label: Android -- Unsafe use of deep links
    url: https://developer.android.com/privacy-and-security/risks/unsafe-use-of-deeplinks
  - label: Apple -- Defining a custom URL scheme for your app
    url: https://developer.apple.com/documentation/xcode/defining-a-custom-url-scheme-for-your-app
  - label: RFC 8252 -- OAuth 2.0 for Native Apps
    url: https://www.rfc-editor.org/rfc/rfc8252.html
  - label: CWE-939 -- Improper Authorization in Handler for Custom URL Scheme
    url: https://cwe.mitre.org/data/definitions/939.html
