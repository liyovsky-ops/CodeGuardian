hero:
  titleMain: 'OGNL '
  titleGrad: Injection
  titleTail: ''
  topbar: OGNL Injection (Apache Struts)
  lead:
    en: 'OGNL was built to navigate and mutate the full Java object graph — including calling arbitrary static methods via @class@method() syntax. When Apache Struts2 evaluates attacker-controlled input as an OGNL expression instead of treating it as data, that expressiveness becomes a direct line to Runtime.exec(). This is exactly how Equifax was breached in 2017: CVE-2017-5638 let a single malformed Content-Type header execute commands, exposing 147.9 million people''s data. The patch existed for over two months before exploitation — the canonical proof that a WAF is not a substitute for patching.'
    pl: 'OGNL zostało zbudowane, by nawigować i mutować pełny graf obiektów Java — w tym wywoływać dowolne metody statyczne przez składnię @class@method(). Gdy Apache Struts2 ewaluuje kontrolowane przez atakującego wejście jako wyrażenie OGNL zamiast traktować je jako dane, ta ekspresywność staje się bezpośrednią linią do Runtime.exec(). Dokładnie tak zostało skompromitowane Equifax w 2017: CVE-2017-5638 pozwoliło pojedynczemu zniekształconemu nagłówkowi Content-Type wykonać polecenia, ujawniając dane 147.9 miliona osób. Łatka istniała ponad dwa miesiące przed eksploatacją — podręcznikowy dowód że WAF nie zastępuje łatania.'
