meta:
  id: evalinjection
  threatId: '1.20'
  severity: Critical
  color: '#7c3aed'
  colorRgb: 124,58,237
  cwe: CWE-95
  cvss: '9.8'
  standard: OWASP A03:2021
hero:
  titleMain: 'Code / Eval '
  titleGrad: Injection
  titleTail: ''
  topbar: Code Injection / Eval Injection
  lead:
    en: 'No sandbox to escape, no grammar ceiling to hit -- eval() and its siblings (exec(), Function(), create_function(), send with an untrusted method name) hand an attacker the entire host language runtime from the very first character. Where SSTI or Expression Language injection require breaking out of a deliberately restricted sub-language back into the real interpreter, a confirmed eval sink already IS the real interpreter. The most important real-world lesson here: vm2, the most popular JavaScript sandbox library (17M+ monthly downloads), was repeatedly broken and ultimately discontinued in 2023 -- proof that in-process sandboxing is hardening, not a boundary.'
    pl: 'Żaden sandbox do ucieczki, żaden sufit gramatyki do napotkania -- eval() i jego odpowiedniki (exec(), Function(), create_function(), send z niezaufaną nazwą metody) dają atakującemu cały runtime języka hosta od pierwszego znaku. Tam gdzie SSTI czy wstrzyknięcie Expression Language wymagają wyłamania się z celowo ograniczonego pod-języka z powrotem do prawdziwego interpretera, potwierdzony sink eval JUŻ JEST prawdziwym interpreterem. Najważniejsza rzeczywista lekcja tutaj: vm2, najpopularniejsza biblioteka sandboxa JavaScript (17M+ pobrań miesięcznie), była wielokrotnie łamana i ostatecznie zarzucona w 2023 -- dowód że sandboxing w procesie to utwardzenie, nie granica.'
  metrics:
  - k: CWE-95
    v:
      en: Weakness ID (Variant of CWE-94)
      pl: ID słabości (wariant CWE-94)
  - k: '9.8'
    v: CVSS · Critical
  - k: A03:2021
    v: OWASP Top 10
  - k: '6'
    v:
