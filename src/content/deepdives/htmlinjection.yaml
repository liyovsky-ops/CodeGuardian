  - label: CWE-79 (MITRE)
    url: https://cwe.mitre.org/data/definitions/79.html
  - label: CWE-451 (MITRE) — UI Misrepresentation
    url: https://cwe.mitre.org/data/definitions/451.html
  - label: PortSwigger Research — Blind CSS Exfiltration
    url: https://portswigger.net/research/blind-css-exfiltration
