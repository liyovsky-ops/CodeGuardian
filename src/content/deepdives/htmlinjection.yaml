  ir:
    title:
      en: Incident response checklist
      pl: Lista kontrolna reagowania
    lead:
      en: If active exploitation of an HTML injection point is confirmed, work this list top to bottom.
      pl: Po potwierdzeniu aktywnej eksploatacji punktu HTML injection, przejdź tę listę od góry.
    steps:
    - en: Identify the exact sink and whether the filter permits script tags — this determines whether the incident is HTML-injection-only or has already escalated to XSS
      pl: Zidentyfikuj dokładny sink i czy filtr dopuszcza tagi script — to determinuje czy incydent jest wyłącznie HTML injection czy już eskalował do XSS
    - en: Check whether any injected form, meta-refresh, or iframe was live and could have harvested credentials or redirected users — treat any exposed session as potentially phished
      pl: Sprawdź czy jakikolwiek wstrzyknięty formularz, meta-refresh lub iframe był aktywny i mógł zbierać dane logowania lub przekierowywać użytkowników — traktuj każdą narażoną sesję jako potencjalnie wyłudzoną
    - en: Review outbound request logs for CSS-triggered background-image/font-face fetches to unfamiliar hosts — the signature of blind CSS exfiltration
      pl: Przejrzyj logi żądań wychodzących pod kątem wywołanych przez CSS pobrań background-image/font-face do nieznanych hostów — sygnatura ślepej eksfiltracji przez CSS
    - en: Patch the root cause with context-aware output encoding, not a tag denylist — a denylist fix here is the single most common recurrence cause
      pl: Napraw przyczynę źródłową kontekstowym kodowaniem wyjścia, nie denylistą tagów — naprawa denylistą jest tutaj najczęstszą przyczyną nawrotu
    - en: If the injection point is an HTML email template, audit every other user-controlled field feeding that same template, not just the one exploited
      pl: Jeśli punktem wstrzyknięcia jest szablon emaila HTML, przeaudytuj każde inne pole kontrolowane przez użytkownika zasilające ten sam szablon, nie tylko to które zostało wykorzystane
    - en: Notify affected users if a phishing form or credential-harvesting page was confirmed live, per applicable disclosure obligations
      pl: Powiadom dotkniętych użytkowników jeśli potwierdzono aktywny formularz phishingowy lub stronę zbierającą dane logowania, zgodnie z obowiązującymi wymogami ujawnienia
