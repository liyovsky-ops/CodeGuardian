meta:
  id: htmlinjection
  threatId: '1.24'
  severity: High
  color: '#0d9488'
  colorRgb: 13,148,136
  cwe: CWE-79
  cvss: '6.1'
  standard: OWASP A03:2021
hero:
  titleMain: 'HTML '
  titleGrad: Injection
  titleTail: ''
  topbar: HTML Injection
  lead:
    en: 'Markup lands in a response and renders — but no script executes. That''s the textbook boundary separating this from XSS, and all three independent research passes agree it''s a genuinely blurry one: MITRE folds both under CWE-79, most bug-bounty programs triage pure HTML injection as low/informational, and researchers routinely escalate it straight into XSS to maximize impact, which erases the distinction from the incident record. Content spoofing, phishing overlays, meta-refresh redirects, and scriptless CSS/dangling-markup exfiltration are all real, demonstrated impact without a single <script> tag.'
    pl: 'Znacznik trafia do odpowiedzi i się renderuje — ale żaden skrypt się nie wykonuje. To podręcznikowa granica oddzielająca to od XSS, a wszystkie trzy niezależne badania zgadzają się że jest ona naprawdę rozmyta: MITRE zwija oba pod CWE-79, większość programów bug bounty traktuje czyste HTML injection jako niskie/informacyjne, a badacze rutynowo eskalują je wprost do XSS by zmaksymalizować wpływ, co zaciera to rozróżnienie w rejestrze incydentów. Content spoofing, nakładki phishingowe, przekierowania meta-refresh i bezskryptowa eksfiltracja przez CSS/dangling-markup to wszystko realny, udowodniony wpływ bez ani jednego tagu <script>.'
  metrics:
  - k: CWE-79
    v:
      en: Weakness ID (parent, disputed sub-mapping)
      pl: ID słabości (nadrzędne, sporne pod-mapowanie)
  - k: '6.1'
    v: CVSS · Medium (typical reflected case)
  - k: A03:2021
    v: OWASP Top 10
  - k: '7'
    v:
      en: Attack variants
      pl: Warianty ataku
  sources:
