hero:
  titleMain: 'SPARQL '
  titleGrad: Injection
  titleTail: ''
  topbar: SPARQL Injection (RDF Triple Store / Semantic Web Query Injection)
  lead:
    en: 'The semantic-web analogue of SQL injection: when an application string-concatenates untrusted input into a SPARQL query instead of binding it as a parameter, an attacker can break out of a literal or IRI position and inject triple patterns, FILTER, UNION, or OPTIONAL clauses -- widening a graph-pattern match to read data across named graphs the query was never meant to expose. All three independent research passes converged on an honest finding worth stating plainly: the public CVE record for textbook SPARQL injection is genuinely thin, and the single most-cited "SPARQL Injection"-titled CVE is officially classified by NVD as a denial-of-service, not data exfiltration -- a reminder that a vulnerability''s name and its official classification can diverge.'
    pl: 'Semantyczno-webowy odpowiednik wstrzyknięcia SQL: gdy aplikacja skleja stringiem nieufne wejście do zapytania SPARQL zamiast związać je jako parametr, atakujący może wyłamać się z pozycji literału albo IRI i wstrzyknąć wzorce trójki, klauzule FILTER, UNION, albo OPTIONAL -- rozszerzając dopasowanie wzorca grafu by odczytać dane z grafów nazwanych których zapytanie nigdy nie miało ujawniać. Wszystkie trzy niezależne przejścia badawcze zbiegły się na uczciwym ustaleniu wartym jasnego stwierdzenia: publiczny rejestr CVE dla podręcznikowego wstrzyknięcia SPARQL jest naprawdę szczupły, a jedyne najczęściej cytowane CVE zatytułowane "SPARQL Injection" jest oficjalnie sklasyfikowane przez NVD jako denial-of-service, nie eksfiltracja danych -- przypomnienie że nazwa podatności i jej oficjalna klasyfikacja mogą się rozjeżdżać.'
