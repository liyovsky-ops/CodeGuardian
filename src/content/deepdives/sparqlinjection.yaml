  tools:
    title:
      en: Detection tooling
      pl: Narzędzia wykrywania
    lead:
      en: No mainstream, dedicated SPARQL-injection scanner exists -- sqlmap does not understand SPARQL grammar, and all three research passes independently found nothing equivalent. Testing here is predominantly a manual, proxy-driven discipline.
      pl: Nie istnieje żaden główny, dedykowany skaner wstrzyknięcia SPARQL -- sqlmap nie rozumie gramatyki SPARQL, i wszystkie trzy przejścia badawcze niezależnie nie znalazły niczego równoważnego. Testowanie tutaj to głównie manualna dyscyplina oparta na proxy.
    sast:
    - - Generic taint-tracking SAST (Semgrep/CodeQL)
      - Catches the vulnerable shape (untrusted input concatenated into a query string builder) even without a SPARQL-specific rule -- no dedicated SPARQL-injection rule set was found by any research pass
    - - Framework API review
      - Auditing for raw string concatenation into QueryFactory.create()/sparql.setQuery() versus ParameterizedSparqlString/initBindings usage is effectively the practical static check
    dast:
    - - Burp Suite (Repeater + Intruder + Collaborator)
      - Manual payload crafting via Repeater, automated blind character-by-character extraction via Intruder, and out-of-band SERVICE/SSRF confirmation via Collaborator -- none SPARQL-aware, all supplied SPARQL payloads manually
    - - OWASP ZAP
      - Equivalent general-purpose proxy/fuzzing capability, no SPARQL-specific module
    - - Error-based differential probing
      - 'Manually injecting a lone ", }, or # and comparing parser error responses against normal ones -- the practical entry-level confirmation technique'
    note:
      en: <strong>Key signal:</strong> because no automated scanner understands SPARQL grammar, prioritize manual review of any endpoint that visibly builds a query string from request parameters -- this is a DAST/manual-testing finding much like HTTP Parameter Pollution elsewhere in this knowledge base, not something a scan will surface on its own.
      pl: <strong>Kluczowy sygnał:</strong> ponieważ żaden automatyczny skaner nie rozumie gramatyki SPARQL, priorytetyzuj manualny przegląd każdego endpointu który widocznie buduje string zapytania z parametrów żądania -- to znalezisko DAST/testów manualnych podobnie jak HTTP Parameter Pollution gdzie indziej w tej bazie wiedzy, nie coś co skan ujawni samodzielnie.
  compliance:
    title:
      en: Compliance quick-reference
      pl: Szybka zgodność
    lead:
      en: 'CWE-943 is the correct mapping precisely because no SPARQL-specific CWE exists -- verified directly at MITRE, its own page names SQL/LDAP/XQuery/DQL/NoSQL as examples but never SPARQL. All three research passes independently confirmed the same OWASP nuance: CWE-943 is not itself formally enumerated in A03:2021''s mapped-CWE list, though its parent and siblings are.'
      pl: 'CWE-943 jest poprawnym mapowaniem dokładnie dlatego że nie istnieje żaden CWE specyficzny dla SPARQL -- zweryfikowane bezpośrednio na MITRE, jego własna strona wymienia SQL/LDAP/XQuery/DQL/NoSQL jako przykłady ale nigdy SPARQL. Wszystkie trzy przejścia badawcze niezależnie potwierdziły ten sam niuans OWASP: CWE-943 samo w sobie nie jest formalnie wyliczone na liście zmapowanych CWE A03:2021, choć jego rodzic i rodzeństwo są.'
    items:
    - std: CWE (MITRE)
      items:
      - CWE-943 — Improper Neutralization of Special Elements in Data Query Logic (primary). ChildOf CWE-74 (Injection); ParentOf CWE-89 (SQL), CWE-90 (LDAP), CWE-643 (XPath), CWE-652 (XQuery) -- the same shared parent this knowledge base uses for its other non-SQL query-language injection deep-dives. MITRE's own page never names SPARQL, consistent with SPARQL having no dedicated CWE of its own.
      - CVE-2012-5872 (ARC2) is tagged CWE-89 rather than CWE-943, because its confirmed impact is SQL injection against ARC2's backing database, not the SPARQL layer itself -- correct per-incident tagging, not an inconsistency.
      - CVE-2019-6986 is tagged CWE-77 + CWE-400, not CWE-943 -- a reminder, confirmed by all three research passes, that a CVE's title ("SPARQL Injection") and its official weakness classification can genuinely diverge.
    - std: OWASP
      items:
      - 'A03:2021 — Injection, by family/conceptual fit. Verified against MITRE''s CWE-1347 (A03:2021''s official mapped-CWE list): CWE-943 itself is NOT among the enumerated members, but its parent CWE-74 and its siblings (CWE-89, CWE-90, CWE-643, CWE-652) all are -- so the mapping holds through the injection family, not as a direct CWE-943 listing.'
    inlineSources:
    - label: CWE-943 (MITRE)
      url: https://cwe.mitre.org/data/definitions/943.html
    - label: OWASP A03:2021 Injection
      url: https://owasp.org/Top10/2021/A03_2021-Injection/
  ir:
    title:
      en: Incident response checklist
      pl: Lista kontrolna reagowania
    lead:
      en: If active SPARQL injection exploitation is confirmed, work this list top to bottom.
      pl: Po potwierdzeniu aktywnej eksploatacji wstrzyknięcia SPARQL, przejdź tę listę od góry.
    steps:
    - en: Identify the exact injection point and which named graphs the query identity could reach -- treat every graph as potentially read, not just the one confirmed
      pl: Zidentyfikuj dokładny punkt wstrzyknięcia i które grafy nazwane tożsamość zapytania mogła osiągnąć -- traktuj każdy graf jako potencjalnie odczytany, nie tylko potwierdzony
    - en: If the endpoint accepts SPARQL Update, treat every triple the writable credential could reach as potentially modified or deleted
      pl: Jeśli endpoint akceptuje SPARQL Update, traktuj każdą trójkę do której zapisywalne poświadczenie mogło dotrzeć jako potencjalnie zmodyfikowaną lub usuniętą
    - en: If SERVICE federation was enabled, audit outbound request logs from the triple store for connections to unexpected or internal hosts
      pl: Jeśli federacja SERVICE była włączona, przeaudytuj logi żądań wychodzących z magazynu trójek pod kątem połączeń do nieoczekiwanych lub wewnętrznych hostów
    - en: Grep the codebase for every place a query string is built via concatenation rather than ParameterizedSparqlString/initBindings, not just the exploited endpoint
      pl: Przeszukaj bazę kodu pod kątem każdego miejsca gdzie string zapytania jest budowany przez konkatenację zamiast ParameterizedSparqlString/initBindings, nie tylko wykorzystany endpoint
    - en: Disable SPARQL Update and SERVICE federation on the affected endpoint until the injection is fixed, if either is not strictly required
      pl: Wyłącz SPARQL Update i federację SERVICE na dotkniętym endpoincie dopóki wstrzyknięcie nie zostanie naprawione, jeśli którekolwiek nie jest ściśle wymagane
    - en: Notify per applicable data-breach obligations if data outside the intended graph scope was confirmed exfiltrated
      pl: Powiadom zgodnie z obowiązującymi wymogami dot. naruszenia danych jeśli potwierdzono eksfiltrację danych spoza zamierzonego zakresu grafu
