meta:
  id: mobiledataleakage
  threatId: '15.20'
  severity: Medium
  color: '#334155'
  colorRgb: 51,65,85
  cwe: CWE-532
  cvss: N/A (technique class; flagship CVE-2023-21387 -- Android User Backup Manager log leak -- CVSS 4.4)
  standard: OWASP MASVS-STORAGE-2 ("the app prevents leakage of sensitive data" -- explicitly enumerates logs, clipboard, backups, screenshots/task-switcher snapshots) + MASVS-PLATFORM test coverage
hero:
  titleMain: 'Sensitive Data Leakage via '
  titleGrad: Clipboard / Screenshots / Logs
  titleTail: ''
  topbar: Sensitive Data Leakage via Clipboard / Screenshots / Logs (Android + iOS)
  lead:
    en: 'All three research passes converged on treating this as three genuinely distinct OS-level leak surfaces, not one bug: the shared system clipboard (Android ClipboardManager, iOS UIPasteboard), the automatic backgrounded-app snapshot the OS caches for the app switcher, and system logging (Logcat, os_log). One research pass fetched MITRE''s own CWE-200 definition directly and found its mapping guidance explicitly "DISCOURAGED" -- confirmality loss is a technical impact, not a root cause, and MITRE tells mappers to cite the specific error instead. That correction is adopted here: this entry leads with CWE-532 (Insertion of Sensitive Information into Log File) for the logging vector -- a verified, mapping-ALLOWED descendant of CWE-200 -- and treats CWE-359 (Exposure of Private Personal Information) as the tighter fit when clipboard or screenshot leakage exposes PII, keeping bare CWE-200 only as an umbrella label rather than the operative mapping. A second correction, verified identically across all three passes against Android''s own documentation: the Android 13 ClipDescription.EXTRA_IS_SENSITIVE flag is a rendering hint, not a security control -- it suppresses the on-screen clipboard preview, nothing more; the data remains fully readable on the shared clipboard by any focused app. A third finding, uncovered by one research pass via a 2019 Doyensec disclosure with exact fix versions, fills a gap all three passes independently noted (no clean CVE exists for screenshot leakage): three major password managers -- 1Password, Keeper, and Dashlane -- each shipped native UI elements (a "reveal password" toast, an autocomplete fragment) that rendered outside their own FLAG_SECURE window and leaked the cleartext secret anyway, a sharp illustration that FLAG_SECURE protects only the window it is set on, not every pixel the app draws.'
    pl: 'Wszystkie trzy przejścia badawcze zbiegły się na traktowaniu tego jako trzech naprawdę odrębnych powierzchni wycieku na poziomie systemu, nie jednego błędu: współdzielonego schowka systemowego (Android ClipboardManager, iOS UIPasteboard), automatycznego zrzutu ekranu apki w tle który system cache''uje dla przełącznika aplikacji, oraz logowania systemowego (Logcat, os_log). Jedno przejście badawcze pobrało bezpośrednio własną definicję CWE-200 MITRE i znalazło jej wskazówkę mapowania jawnie "ODRADZANĄ" -- utrata poufności to skutek techniczny, nie przyczyna źródłowa, a MITRE mówi mapującym by cytowali konkretny błąd zamiast tego. Ta korekta jest tutaj przyjęta: ten wpis prowadzi CWE-532 (Insertion of Sensitive Information into Log File) dla wektora logowania -- zweryfikowanym, dozwolonym-do-mapowania potomkiem CWE-200 -- i traktuje CWE-359 (Exposure of Private Personal Information) jako ciaśniejsze dopasowanie gdy wyciek schowka albo zrzutu ekranu ujawnia PII, zachowując gołe CWE-200 tylko jako etykietę parasolową zamiast operacyjnego mapowania. Druga korekta, zweryfikowana identycznie we wszystkich trzech przejściach względem własnej dokumentacji Android: flaga ClipDescription.EXTRA_IS_SENSITIVE Android 13 to wskazówka renderowania, nie kontrola bezpieczeństwa -- tłumi podgląd schowka na ekranie, nic więcej; dane pozostają w pełni czytelne na współdzielonym schowku przez dowolną skupioną apkę. Trzecie ustalenie, odkryte przez jedno przejście badawcze przez ujawnienie Doyensec z 2019 z dokładnymi wersjami naprawy, wypełnia lukę którą wszystkie trzy przejścia niezależnie zauważyły (nie istnieje czyste CVE dla wycieku przez zrzut ekranu): trzy główne menedżery haseł -- 1Password, Keeper, i Dashlane -- każdy wysłał natywne elementy UI (toast "pokaż hasło", fragment autouzupełniania) które renderowały się poza własnym oknem FLAG_SECURE i mimo to wyciekły jawny sekret, ostra ilustracja że FLAG_SECURE chroni tylko okno na którym jest ustawiony, nie każdy piksel który apka rysuje.'
  metrics:
  - k: 1Password, Keeper, Dashlane
    v:
      en: major password managers found leaking secrets via FLAG_SECURE-bypassing UI elements (Doyensec, 2019); all three shipped fixes within weeks
      pl: główne menedżery haseł znalezione wyciekające sekrety przez elementy UI omijające FLAG_SECURE (Doyensec, 2019); wszystkie trzy wysłały naprawy w ciągu tygodni
  - k: CVE-2023-21387
    v:
      en: 'Android User Backup Manager: backup confirmation token leaked via plaintext system log, verified directly against NVD'
      pl: 'Android User Backup Manager: token potwierdzenia kopii zapasowej wyciekł przez jawny log systemowy, zweryfikowane bezpośrednio względem NVD'
  - k: CWE-200 = DISCOURAGED
    v:
      en: MITRE's own mapping guidance, verified by direct fetch, discourages bare CWE-200 -- this entry leads with CWE-532/CWE-359 instead
      pl: własna wskazówka mapowania MITRE, zweryfikowana bezpośrednim pobraniem, odradza gołe CWE-200 -- ten wpis prowadzi zamiast tego CWE-532/CWE-359
  - k: Android/Clipper.C
    v:
      en: first crypto-clipper malware to reach official Google Play (Feb 2019), swapped copied wallet addresses while impersonating MetaMask
      pl: pierwsze złośliwe oprogramowanie crypto-clipper które trafiło na oficjalny Google Play (luty 2019), zamieniało skopiowane adresy portfela podszywając się pod MetaMask
  sources:
  - label: Android -- Secure clipboard handling
    url: https://developer.android.com/privacy-and-security/risks/secure-clipboard-handling
  - label: Android -- Log info disclosure
    url: https://developer.android.com/privacy-and-security/risks/log-info-disclosure
  - label: OWASP MASVS-STORAGE-2
    url: https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-2/
  - label: Doyensec -- Modern Android Password Managers and FLAG_SECURE Misuse
    url: https://blog.doyensec.com/2019/08/22/modern-password-managers-flag-secure.html
