meta:
  id: mobileintentredirection
  threatId: '15.12'
  severity: High
  color: '#166534'
  colorRgb: 22,101,52
  cwe: CWE-940
  cvss: N/A (technique class spanning platform PendingIntent CVEs and app-level cases; no single CVSS anchors the whole class)
  standard: OWASP MASTG-TEST-0026 / MASTG-TEST-0030 (Implicit Intents / PendingIntent)
hero:
  titleMain: 'Intent '
  titleGrad: Redirection
  titleTail: ''
  topbar: Intent Redirection / Confused-Deputy Forwarding (Android)
  lead:
    en: 'All three research passes independently surfaced the same headline correction: the founding academic paper on this attack surface, Chin, Felt, Greenwood & Wagner''s "Analyzing Inter-Application Communication in Android" (MobiSys 2011), never uses the phrase "Intent redirection" -- it names "Intent Spoofing" (a malicious app sending a crafted Intent directly to an exported component) and "Unauthorized Intent Receipt" (interception/eavesdropping). "Intent redirection" is a later Google/industry coinage for a specific, narrower sub-case: a trusted app receives an Intent, unparcels a nested Intent from its extras, and re-dispatches it via startActivity/sendBroadcast/startService without validating the target or caller -- letting an attacker launder its Intent through a trusted deputy''s own identity and permissions to reach otherwise-unreachable internal components (a textbook confused deputy). This is distinct from spoofing precisely because a trusted intermediary is tricked into relaying the attack, not merely an exported endpoint being hit directly. A closely related token-based variant, mutable PendingIntent hijacking, lets a recipient fill in an incomplete wrapped Intent and fire it under the creator''s identity -- Android made specifying FLAG_IMMUTABLE or FLAG_MUTABLE mandatory at API 31 (a "must declare" requirement, not an automatic default-to-immutable, a distinction all three teams flagged as commonly misstated), and further restricted mutable-plus-implicit PendingIntents at API 34.'
    pl: 'Wszystkie trzy przejścia badawcze niezależnie ujawniły tę samą nagłówkową korektę: fundamentalna praca akademicka o tej powierzchni ataku, "Analyzing Inter-Application Communication in Android" Chin, Felt, Greenwood i Wagnera (MobiSys 2011), nigdy nie używa frazy "Intent redirection" -- nazywa "Intent Spoofing" (złośliwa apka wysyła spreparowany Intent bezpośrednio do wyeksportowanego komponentu) i "Unauthorized Intent Receipt" (przechwycenie/podsłuch). "Intent redirection" to późniejsze ukucie Google/przemysłu dla konkretnego, węższego podprzypadku: zaufana apka otrzymuje Intent, wypakowuje zagnieżdżony Intent z jego extras, i ponownie wysyła go przez startActivity/sendBroadcast/startService bez walidacji celu albo wywołującego -- pozwalając atakującemu wyprać swój Intent przez własną tożsamość i uprawnienia zaufanego pośrednika by osiągnąć inaczej nieosiągalne komponenty wewnętrzne (podręcznikowy confused deputy). To odrębne od spoofingu dokładnie dlatego że zaufany pośrednik jest oszukany by przekazać atak, nie tylko wyeksportowany endpoint jest bezpośrednio trafiony. Blisko powiązany wariant oparty na tokenie, przejęcie mutowalnego PendingIntent, pozwala odbiorcy wypełnić niekompletny opakowany Intent i wystrzelić go pod tożsamością twórcy -- Android uczynił podanie FLAG_IMMUTABLE albo FLAG_MUTABLE obowiązkowym w API 31 (wymóg "musisz zadeklarować", nie automatyczne domyślne przejście na niemutowalny, rozróżnienie które wszystkie trzy zespoły oflagowały jako powszechnie mylnie przedstawiane), i dalej ograniczył mutowalne-plus-implicit PendingIntent w API 34.'
  metrics:
  - k: MobiSys 2011
    v:
      en: Chin/Felt/Greenwood/Wagner coin "Intent Spoofing" + "Unauthorized Intent Receipt" -- not "Intent redirection", a later industry term
      pl: Chin/Felt/Greenwood/Wagner ukuwają "Intent Spoofing" + "Unauthorized Intent Receipt" -- nie "Intent redirection", późniejszy termin przemysłowy
  - k: CVE-2024-26131
    v:
      en: 'Element Android: third-party app starts arbitrary internal activity, bypasses PIN protection'
      pl: 'Element Android: zewnętrzna apka uruchamia dowolną wewnętrzną aktywność, omija ochronę PIN'
  - k: 50M+
    v:
      en: installs affected by the EngageLab SDK intent-redirection bug (2026), 30M+ in crypto wallets
      pl: instalacji dotkniętych błędem intent redirection SDK EngageLab (2026), 30M+ w portfelach krypto
  - k: API 31 / API 34
    v:
      en: the two real PendingIntent mutability inflection points -- not API 33, a commonly misattributed version
      pl: dwa prawdziwe punkty zwrotne mutowalności PendingIntent -- nie API 33, powszechnie błędnie przypisywana wersja
  sources:
  - label: Android -- Intent redirection
    url: https://developer.android.com/privacy-and-security/risks/intent-redirection
  - label: Android -- Pending intents
    url: https://developer.android.com/privacy-and-security/risks/pending-intent
  - label: CWE-940 -- Improper Verification of Source of a Communication Channel
    url: https://cwe.mitre.org/data/definitions/940.html
  - label: Chin, Felt, Greenwood, Wagner -- Analyzing Inter-Application Communication in Android (MobiSys 2011)
    url: https://dl.acm.org/doi/10.1145/1999995.2000018
