meta:
  id: mobileiosurlschemehijack
  threatId: '15.22'
  severity: High
  color: '#1e3a8a'
  colorRgb: 30,58,138
  cwe: CWE-939
  cvss: N/A (technique class; no CVE exists for the generic collision mechanism, confirmed by all three research passes -- see incidents for named vendor/researcher evidence instead)
  standard: OWASP MASVS-PLATFORM (MASTG-TEST-0075 Testing Custom URL Schemes / MASTG-TEST-0070 Testing Universal Links; MASTG-KNOW-0079 explicitly includes a "Scheme Collision" subsection)
hero:
  titleMain: 'iOS URL Scheme '
  titleGrad: Hijacking
  titleTail: ''
  topbar: iOS URL Scheme Hijacking -- Registration Collision & OAuth Callback Interception
  lead:
    en: 'This catalog''s 15.16 entry already covers general deep-link handling and parameter validation across both platforms; this entry is scoped narrowly to a different, iOS-specific root cause all three research passes confirmed identically: custom URL schemes declared via CFBundleURLTypes/CFBundleURLSchemes in Info.plist are claimed on a first-come basis with no central registry and no ownership verification -- any app, including a malicious one, can register the exact same scheme string as a legitimate app. RFC 8252 (OAuth 2.0 for Native Apps) states the consequence precisely, quoted identically by all three research passes: "multiple apps can typically register the same scheme, which makes it indeterminate as to which app will receive the authorization code." Apple''s own guidance frames the outcome as undefined; empirically, iOS 11+ behaves closer to first-installed-wins per MITRE ATT&CK T1635.001 -- but critically, unlike Android''s chooser dialog, iOS shows no disambiguation picker to warn the user at all. The standard, RFC-endorsed fix is domain-verified Universal Links (an apple-app-site-association file that only the true domain owner can host), which all three research passes confirm cannot be claimed by another app without controlling the domain. A finding independently and identically surfaced by all three research passes deserves particular emphasis: security researcher Evan Connelly demonstrated a modern variant using ASWebAuthenticationSession where the attacker''s own app originates the OAuth flow and therefore controls both the PKCE code_challenge and code_verifier -- meaning PKCE, which RFC 8252 mandates specifically to mitigate authorization-code interception, provides no protection against this particular attack path. One research pass also found that Google''s own native-app OAuth documentation now states plainly: "Custom URI schemes are no longer supported due to the risk of app impersonation."'
    pl: 'Wpis 15.16 tego katalogu obejmuje już ogólną obsługę deep linków i walidację parametrów na obu platformach; ten wpis jest zawężony konkretnie do innej, specyficznej dla iOS przyczyny źródłowej którą wszystkie trzy przejścia badawcze potwierdziły identycznie: niestandardowe schematy URL zadeklarowane przez CFBundleURLTypes/CFBundleURLSchemes w Info.plist są zajmowane na zasadzie kto pierwszy, bez centralnego rejestru i bez weryfikacji własności -- dowolna apka, włącznie ze złośliwą, może zarejestrować dokładnie ten sam ciąg schematu co legalna apka. RFC 8252 (OAuth 2.0 for Native Apps) stwierdza konsekwencję precyzyjnie, cytowaną identycznie przez wszystkie trzy przejścia badawcze: "wiele apek może zazwyczaj zarejestrować ten sam schemat, co czyni nieokreślonym która apka otrzyma kod autoryzacji". Własne wytyczne Apple ramują wynik jako niezdefiniowany; empirycznie, iOS 11+ zachowuje się bliżej zasady kto-zainstalowany-pierwszy-wygrywa według MITRE ATT&CK T1635.001 -- ale kluczowo, w przeciwieństwie do okna wyboru Android, iOS w ogóle nie pokazuje okna dezambiguacji ostrzegającego użytkownika. Standardową, popieraną przez RFC naprawą są zweryfikowane domenowo Universal Links (plik apple-app-site-association który może hostować tylko prawdziwy właściciel domeny), co wszystkie trzy przejścia badawcze potwierdzają jako niemożliwe do przejęcia przez inną apkę bez kontroli nad domeną. Ustalenie niezależnie i identycznie ujawnione przez wszystkie trzy przejścia badawcze zasługuje na szczególne podkreślenie: badacz bezpieczeństwa Evan Connelly zademonstrował współczesny wariant używający ASWebAuthenticationSession gdzie własna apka atakującego inicjuje przepływ OAuth i dlatego kontroluje zarówno code_challenge jak i code_verifier PKCE -- co oznacza że PKCE, które RFC 8252 nakazuje konkretnie by łagodzić przechwycenie kodu autoryzacji, nie zapewnia żadnej ochrony przeciw tej konkretnej ścieżce ataku. Jedno przejście badawcze znalazło też że własna dokumentacja OAuth dla apek natywnych Google stwierdza wprost: "Niestandardowe schematy URI nie są już wspierane ze względu na ryzyko podszywania się pod apkę".'
  metrics:
  - k: '0'
    v:
      en: disambiguation UI -- unlike Android's app chooser, iOS shows no picker or warning when two apps claim the same scheme
      pl: interfejsu dezambiguacji -- w przeciwieństwie do wyboru apki Android, iOS nie pokazuje okna wyboru ani ostrzeżenia gdy dwie apki roszczą sobie ten sam schemat
  - k: '"indeterminate"'
    v:
      en: RFC 8252's own word for which app receives an OAuth authorization code when schemes collide
      pl: własne słowo RFC 8252 na to która apka otrzyma kod autoryzacji OAuth gdy schematy kolidują
  - k: PKCE bypass
    v:
      en: 'confirmed identically by all three research passes: the ASWebAuthenticationSession variant defeats PKCE since the attacker''s app holds both halves of the challenge'
      pl: 'potwierdzone identycznie przez wszystkie trzy przejścia badawcze: wariant ASWebAuthenticationSession pokonuje PKCE ponieważ apka atakującego posiada obie połowy wyzwania'
  - k: Google
    v:
      en: 'own native-app OAuth docs: "Custom URI schemes are no longer supported due to the risk of app impersonation"'
      pl: 'własna dokumentacja OAuth apek natywnych: "Niestandardowe schematy URI nie są już wspierane ze względu na ryzyko podszywania się pod apkę"'
  sources:
  - label: RFC 8252 -- OAuth 2.0 for Native Apps
    url: https://datatracker.ietf.org/doc/html/rfc8252
  - label: CWE-939 -- Improper Authorization in Handler for Custom URL Scheme
    url: https://cwe.mitre.org/data/definitions/939.html
  - label: OWASP MASTG-KNOW-0079 -- Custom URL Schemes (Scheme Collision)
    url: https://mas.owasp.org/MASTG/knowledge/ios/MASVS-PLATFORM/MASTG-KNOW-0079/
  - label: Evan Connelly -- iOS URL Scheme Hijacking Revamped
    url: https://evanconnelly.com/post/ios-oauth/
