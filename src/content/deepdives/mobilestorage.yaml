  tools:
    title:
      en: Detection tooling
      pl: Narzędzia wykrywania
    lead:
      en: All three research passes converged on the same core toolchain, matching this category's own OWASP-stated AVERAGE (not EASY) detectability rating -- finding these findings genuinely requires pulling and inspecting the sandbox, not just a manifest read.
      pl: Wszystkie trzy przejścia badawcze zbiegły się na tym samym podstawowym łańcuchu narzędzi, pasującym do własnej deklarowanej przez OWASP oceny wykrywalności AVERAGE (nie EASY) tej kategorii -- znalezienie tych ustaleń naprawdę wymaga wyciągnięcia i zbadania piaskownicy, nie tylko odczytu manifestu.
    sast:
    - - MobSF (Mobile Security Framework)
      - Static pass flags MODE_WORLD_READABLE/WRITEABLE, plaintext SharedPreferences/plist writes, external-storage APIs, and logging calls; dynamic mode dumps the actual sandbox contents (SharedPreferences, databases, logs) after exercising the app
    - - sqlite3 CLI + plutil
      - Direct inspection of a recovered .db file (an SQLCipher-encrypted database simply fails to open without the key -- itself a useful pass/fail signal) and of iOS plist files for cleartext values
    dast:
    - - Frida / objection
      - objection's ios keychain dump lists every Keychain item along with its kSecAttrAccessible protection class in one command -- the exact signal that catches a weak accessibility attribute; Frida hooks on SharedPreferences/SQLiteDatabase/Keychain APIs observe what's actually written at the moment it happens
    - - adb backup/pull + iOS backup extraction
      - Retrieves the app's private storage directory exactly as a forensic tool or a thief with the device would -- the ground-truth test for this category's local/physical-access threat model
    note:
      en: <strong>Key signal:</strong> open-source forensic parsers (ALEAPP/iLEAPP, Autopsy) operationalize the same checks used by commercial extraction suites -- if a free tool can recover plaintext PII or credentials from a pulled backup, so can anyone who gains physical access to a lost or stolen device.
      pl: <strong>Kluczowy sygnał:</strong> otwartoźródłowe parsery forensyczne (ALEAPP/iLEAPP, Autopsy) realizują te same kontrole co komercyjne zestawy ekstrakcji -- jeśli darmowe narzędzie może odzyskać jawny tekst PII albo poświadczeń z wyciągniętego backupu, może to zrobić każdy kto zdobędzie fizyczny dostęp do zgubionego albo skradzionego urządzenia.
  compliance:
    title:
      en: Compliance quick-reference
      pl: Szybka zgodność
    lead:
      en: 'All three research passes converged on the same honest finding: OWASP''s own M9 page cites no CWE at all, so the mapping here is community best-fit, and the two flagship historical CVEs were themselves tagged with different, older CWEs at the time -- an era artifact worth stating rather than glossing over.'
      pl: 'Wszystkie trzy przejścia badawcze zbiegły się na tym samym uczciwym ustaleniu: własna strona M9 OWASP nie cytuje żadnego CWE, więc mapowanie tutaj jest najlepszym dopasowaniem społeczności, a oba flagowe historyczne CVE zostały same oznaczone innymi, starszymi CWE w swoim czasie -- artefakt epoki wart stwierdzenia zamiast pominięcia.'
    items:
    - std: CWE (MITRE) — community best-fit, not OWASP-cited
      items:
      - 'CWE-312 — Cleartext Storage of Sensitive Information (primary). The most precise fit for the dominant real-world failure mode: plaintext in SQLite/SharedPreferences/logs/plist. Its children CWE-313 (on disk/file) and CWE-316 (in memory) refine it further.'
      - CWE-921 — Storage of Sensitive Data in a Mechanism without Access Control (secondary). Best fit specifically for the external/SD-card storage sub-case -- MITRE's own example text names Android external storage directly.
      - 'Honesty note: the two flagship CVEs anchoring this deep-dive were tagged CWE-255 (Starbucks) and CWE-310 (Subway) in NVD, not CWE-312 -- both predate CWE-312 becoming the standard modern mapping. This is a mapping-era artifact, not an inconsistency to paper over.'
    - std: OWASP
      items:
      - 'Mobile Top 10 2024 — M9: Insecure Data Storage. Verified directly: Exploitability EASY, Prevalence COMMON, Detectability AVERAGE, Technical Impact SEVERE, Business Impact SEVERE. Identically named "M2: Insecure Data Storage" in both the 2014 and 2016 lists -- the cleanest, least-ambiguous lineage case among the Mobile Security entries built so far, simply demoted from rank #2 to #9 as credential-specific concerns split off into the new M1.'
      - 'OWASP MASVS-STORAGE-1 (the app securely stores sensitive data) and MASVS-STORAGE-2 (the app prevents leakage of sensitive data) are the two controls this category maps to directly. Confirmed MASTG test IDs: MASTG-TEST-0001 (Android, Testing Local Storage for Sensitive Data) and MASTG-TEST-0052 (iOS, Testing Local Data Storage) as the primary tests, with MASTG-TEST-0003/0296-0297 (logs) and MASTG-TEST-0009/0058 (backups) as related tests -- all three research passes flagged the MASTG test-ID scheme as mid-migration to a newer atomic numbering, so verify against the current MASTG release before citing a specific ID.'
      - If the app handles cardholder data, storing it unencrypted at rest implicates PCI-DSS Requirement 3 (protect stored account data); if it handles health data, it implicates HIPAA's Security Rule encryption safeguard (45 CFR 164.312(a)(2)(iv)) -- both cited at the requirement-family level, since no research pass could verify the exact sub-clause text against the primary regulatory document this session.
    inlineSources:
    - label: OWASP Mobile Top 10 2024 — M9
      url: https://owasp.org/www-project-mobile-top-10/2023-risks/m9-insecure-data-storage
    - label: OWASP MASVS-STORAGE
      url: https://mas.owasp.org/MASVS/05-MASVS-STORAGE/
    - label: CWE-312 (MITRE)
      url: https://cwe.mitre.org/data/definitions/312.html
  ir:
    title:
      en: Incident response checklist
      pl: Lista kontrolna reagowania
    lead:
      en: If sensitive data is confirmed recoverable from local device storage (a pentest finding, a lost/stolen device report, or a researcher disclosure), work this list top to bottom.
      pl: Po potwierdzeniu że wrażliwe dane są odzyskiwalne z lokalnej pamięci urządzenia (ustalenie pentestu, raport zgubionego/skradzionego urządzenia, albo ujawnienie badacza), przejdź tę listę od góry.
    steps:
    - en: Confirm exactly what is recoverable and from where -- pull the sandbox and inspect with sqlite3/plutil/objection, matching this deep-dive's own methodology, rather than assuming from a code review alone
      pl: Potwierdź dokładnie co jest odzyskiwalne i skąd -- wyciągnij piaskownicę i zbadaj przez sqlite3/plutil/objection, zgodnie z własną metodyką tego deep-dive, zamiast zakładać tylko z przeglądu kodu
    - en: Determine whether the exposed data qualifies as regulated (cardholder data, PHI, credentials) since this changes notification obligations, consistent with this catalog's privacy-controls entry (15.6)
      pl: Ustal czy ujawnione dane kwalifikują się jako regulowane (dane posiadacza karty, PHI, poświadczenia) ponieważ to zmienia obowiązki powiadomienia, spójnie z wpisem kontroli prywatności tego katalogu (15.6)
    - en: Ship the specific fix matching the top-ranked defense for the confirmed finding -- move the secret to Keystore/Keychain, encrypt the database, or mask the sensitive screen from the app-switcher snapshot
      pl: Wydaj konkretną naprawę pasującą do obrony z najwyższą rangą dla potwierdzonego ustalenia -- przenieś sekret do Keystore/Keychain, zaszyfruj bazę danych, albo zamaskuj wrażliwy ekran przed zrzutem przełącznika apek
    - en: If the fix touches a wrapper library, verify its current support status first -- this deep-dive's own myth correction (EncryptedSharedPreferences deprecation) shows a previously-standard recommendation can go stale
      pl: Jeśli naprawa dotyka biblioteki opakowującej, najpierw zweryfikuj jej aktualny status wsparcia -- własna korekcja mitu tego deep-dive (wycofanie EncryptedSharedPreferences) pokazuje że wcześniej standardowa rekomendacja może się zdezaktualizować
    - en: Rotate any credential or token that was confirmed exposed, since a device-level compromise (lost/stolen/forensic) cannot be assumed contained to a single session
      pl: Obróć każde poświadczenie albo token które zostało potwierdzone jako ujawnione, ponieważ kompromitacja na poziomie urządzenia (zgubione/skradzione/forensyczne) nie może być zakładana jako ograniczona do pojedynczej sesji
