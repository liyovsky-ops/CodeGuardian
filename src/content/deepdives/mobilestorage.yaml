meta:
  id: mobilestorage
  threatId: '15.9'
  severity: Critical
  color: '#5b21b6'
  colorRgb: 91,33,182
  cwe: CWE-312
  cvss: N/A (local-storage class -- underlying CVEs are commonly rated Low for a local attack vector despite severe real-world impact, see Incidents)
  standard: OWASP Mobile Top 10 2024 (M9)
hero:
  titleMain: 'Insecure Data '
  titleGrad: Storage
  titleTail: ''
  topbar: Insecure Data Storage (OWASP Mobile Top 10 2024, M9)
  lead:
    en: 'The cleanest lineage case in this catalog''s Mobile Security coverage: all three independent research passes confirmed identically that this is not a new or even a renamed category -- it was M2 "Insecure Data Storage" in BOTH the 2014 and 2016 OWASP Mobile Top 10 lists, under the exact same name, and was simply demoted in rank to M9 in the 2024 revision (credential-specific concerns split off into the new M1). OWASP itself rates this category''s Exploitability EASY alongside SEVERE Technical and Business Impact -- the most dangerous rating combination among M6-M9 in this catalog, and the reason this entry''s own severity is set at Critical. OWASP''s own M9 page cites no CWE at all, confirmed directly by all three teams. All three teams also independently converged on the exact same two flagship historical CVEs, an unusually strong level of cross-team corroboration, and on one sharply-dated myth correction: Android''s EncryptedSharedPreferences, still recommended by many current
      guides, was deprecated by Google around 2024-2025.'
    pl: 'Najczystszy przypadek rodowodu w pokryciu Mobile Security tego katalogu: wszystkie trzy niezależne przejścia badawcze potwierdziły identycznie że to nie jest nowa ani nawet przemianowana kategoria -- była M2 "Insecure Data Storage" zarówno na liście OWASP Mobile Top 10 z 2014 jak i 2016, pod dokładnie tą samą nazwą, i została po prostu zdegradowana rangą do M9 w rewizji 2024 (kwestie specyficzne dla poświadczeń oddzielone do nowej M1). Sam OWASP klasyfikuje Eksploatowalność tej kategorii jako EASY obok SEVERE Wpływu Technicznego i Biznesowego -- najbardziej niebezpieczna kombinacja ocen wśród M6-M9 w tym katalogu, i powód dla którego własna ważność tego wpisu jest ustawiona na Critical. Własna strona M9 OWASP nie cytuje żadnego CWE, potwierdzone bezpośrednio przez wszystkie trzy zespoły. Wszystkie trzy zespoły niezależnie zbiegły się też na dokładnie tych samych dwóch flagowych historycznych CVE, niezwykle silny poziom międzyzespołowej korroboracji, i na jednej ostro datowanej korekcie
      mitu: EncryptedSharedPreferences Androida, wciąż rekomendowane przez wiele aktualnych przewodników, zostało wycofane przez Google około 2024-2025.'
  metrics:
  - k: EASY / SEVERE
    v:
      en: OWASP's own Exploitability / Technical+Business Impact
      pl: Własna Eksploatowalność / Wpływ Techniczny+Biznesowy OWASP
  - k: M2 since 2014
    v:
      en: same name, same category, just demoted in rank to M9
      pl: ta sama nazwa, ta sama kategoria, tylko zdegradowana rangą do M9
  - k: CVE-2014-0647
    v:
      en: 'Starbucks iOS: plaintext creds + GPS in a crash log, ~10M downloads'
      pl: 'Starbucks iOS: hasła jawnym tekstem + GPS w logu awarii, ~10 mln pobrań'
  - k: Deprecated
    v:
      en: Android's EncryptedSharedPreferences, ~2024-2025
      pl: EncryptedSharedPreferences Androida, ~2024-2025
  sources:
  - label: OWASP Mobile Top 10 2024 — M9
    url: https://owasp.org/www-project-mobile-top-10/2023-risks/m9-insecure-data-storage
  - label: OWASP Mobile Top 10 2016 — M2 (direct predecessor)
    url: https://owasp.org/www-project-mobile-top-10/2016-risks/m2-insecure-data-storage
  - label: NVD — CVE-2014-0647 (Starbucks)
    url: https://nvd.nist.gov/vuln/detail/CVE-2014-0647
  - label: CWE-312 — Cleartext Storage of Sensitive Information
    url: https://cwe.mitre.org/data/definitions/312.html
