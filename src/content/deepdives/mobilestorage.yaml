sections:
  attacks:
    title:
      en: Attack types
      pl: Typy ataków
    lead:
      en: 'Every variant here shares the same threat model, confirmed identically by all three research passes: an attacker with local or physical access to the device (lost/stolen phone, forensic extraction, a rooted device, or a malicious co-resident app) reads data the app assumed was private.'
      pl: 'Każdy wariant tutaj dzieli ten sam model zagrożenia, potwierdzony identycznie przez wszystkie trzy przejścia badawcze: atakujący z lokalnym albo fizycznym dostępem do urządzenia (zgubiony/skradziony telefon, ekstrakcja forensyczna, zrootowane urządzenie, albo złośliwa współrezydująca apka) czyta dane które apka zakładała jako prywatne.'
    items:
    - name: Cleartext storage in SharedPreferences / NSUserDefaults / SQLite
      sev: high
      description:
        en: Tokens, session data, or PII written unencrypted to Android's XML SharedPreferences or iOS's plist-based NSUserDefaults, or into a plaintext SQLite database in the app sandbox. Verified as the exact mechanism behind both of this deep-dive's flagship CVEs -- Starbucks (crash log, technically closer to logging) and Subway/ZippyYum (SQLite cache database directly).
        pl: Tokeny, dane sesji, albo PII zapisane bez szyfrowania do XML SharedPreferences Android albo opartego na plist NSUserDefaults iOS, albo do bazy danych SQLite w postaci jawnego tekstu w piaskownicy apki. Zweryfikowane jako dokładny mechanizm stojący za oboma flagowymi CVE tego deep-dive -- Starbucks (log awarii, technicznie bliżej logowania) i Subway/ZippyYum (baza danych cache SQLite bezpośrednio).
      payload: 'sqlite3 /data/data/com.target.app/databases/app.db "SELECT * FROM users;"  # plaintext rows, no key required'
    - name: External/SD-card storage without access control
      sev: high
      description:
        en: Sensitive data written to Android external storage, historically world-readable and accessible to any app holding storage permission -- the exact scenario CWE-921's own example text describes. Verified historically against early WhatsApp, which stored its full chat database on the SD card in cleartext before moving to on-device encryption.
        pl: Wrażliwe dane zapisane do zewnętrznej pamięci Android, historycznie odczytywalne przez cały świat i dostępne dla dowolnej apki posiadającej uprawnienie pamięci -- dokładnie scenariusz który opisuje własny tekst przykładowy CWE-921. Zweryfikowane historycznie względem wczesnego WhatsApp, który przechowywał pełną bazę danych czatu na karcie SD w jawnym tekście zanim przeszedł na szyfrowanie na urządzeniu.
      payload: 'adb pull /sdcard/Android/data/com.target.app/files/chat.db  # readable by any app with storage permission'
    - name: Sensitive data leaked into logs and crash reports
      sev: high
      description:
        en: 'Credentials, tokens, or PII written to Logcat/NSLog, or captured verbatim by a third-party crash-reporting SDK. This is precisely CVE-2014-0647: Starbucks'' iOS app wrote usernames, passwords, and email addresses in cleartext into a Crashlytics log file, extractable from device storage without even the device passcode.'
        pl: 'Poświadczenia, tokeny, albo PII zapisane do Logcat/NSLog, albo przechwycone dosłownie przez SDK raportowania awarii firmy trzeciej. To dokładnie CVE-2014-0647: apka iOS Starbucks zapisywała nazwy użytkowników, hasła, i adresy email jawnym tekstem do pliku logu Crashlytics, wydobywalnego z pamięci urządzenia nawet bez kodu dostępu urządzenia.'
      payload: 'Log.d("AuthDebug", "login attempt: user=" + username + " pass=" + password)  // shipped to a release build'
    - name: App-switcher snapshot and memory leakage
      sev: medium
      description:
        en: iOS caches a screenshot of the current screen to disk whenever the app is backgrounded, for the app-switcher UI (Library/Caches/Snapshots/) -- genuine on-disk data-at-rest, not merely an ephemeral thumbnail as it's sometimes dismissed. Android renders an equivalent Recents thumbnail. A sensitive screen (balance, PIN entry) left unmasked leaks its contents this way even if every other storage control is correct.
        pl: iOS przechowuje w pamięci podręcznej zrzut ekranu bieżącego ekranu na dysku za każdym razem gdy apka jest wysyłana do tła, dla UI przełącznika apek (Library/Caches/Snapshots/) -- prawdziwe dane na dysku w spoczynku, nie tylko efemeryczna miniatura jak jest czasem lekceważone. Android renderuje równoważną miniaturę Recents. Wrażliwy ekran (saldo, wprowadzanie PIN) pozostawiony bez maskowania wycieka swoją zawartość w ten sposób nawet jeśli każda inna kontrola przechowywania jest poprawna.
      payload: // no FLAG_SECURE / no background-blur overlay -- balance screen snapshot persists to Library/Caches/Snapshots/ on backgrounding
  code:
    title:
      en: Vulnerable vs Secure
      pl: Podatny vs Bezpieczny
    lead:
      en: Every fix here routes the secret through the platform's hardware-backed store instead of a plain file -- and, per the myth correction confirmed by all three research passes, through a currently-supported API rather than a deprecated one.
      pl: Każda naprawa tutaj przekierowuje sekret przez wspierany sprzętowo magazyn platformy zamiast zwykły plik -- i, zgodnie z korekcją mitu potwierdzoną przez wszystkie trzy przejścia badawcze, przez aktualnie wspierane API zamiast przestarzałe.
    languages:
    - label: Android Kotlin — storing an auth token
      lang: kotlin
      vulnerable: '// VULNERABLE: plaintext in SharedPreferences, recoverable from any

        // rooted device, backup, or forensic extraction

        val prefs = getSharedPreferences("app_prefs", Context.MODE_PRIVATE)

        prefs.edit().putString("auth_token", token).apply()'
      safe: '// SAFE: token stored in a value encrypted with a key held in

        // Android Keystore (hardware-backed where the device supports it) --

        // note EncryptedSharedPreferences itself is now deprecated by Google;

        // this shows the underlying pattern rather than that specific wrapper

        val keyAlias = "app_token_key"

        val encryptedToken = KeystoreCipher.encrypt(keyAlias, token)

        prefs.edit().putString("auth_token_enc", encryptedToken).apply()'
    - label: iOS Swift — Keychain accessibility attribute
      lang: swift
      vulnerable: "// VULNERABLE: kSecAttrAccessibleAlways -- readable even while the\n// device is locked, with no passcode required\nlet query: [String: Any] = [\n    kSecClass as String: kSecClassGenericPassword,\n    kSecValueData as String: tokenData,\n    kSecAttrAccessible as String: kSecAttrAccessibleAlways\n]"
      safe: "// SAFE: item is inaccessible until the device has been unlocked at\n// least once since boot, and never leaves this specific device\nlet query: [String: Any] = [\n    kSecClass as String: kSecClassGenericPassword,\n    kSecValueData as String: tokenData,\n    kSecAttrAccessible as String: kSecAttrAccessibleWhenUnlockedThisDeviceOnly\n]"
  method:
    title:
      en: Attack methodology
      pl: Metodyka ataku
    lead:
      en: All three research passes agreed this category's OWASP-stated AVERAGE detectability (not EASY, unlike most other Mobile Security entries) reflects that finding the data requires actually pulling the sandbox and reading files, not just a manifest scan.
      pl: Wszystkie trzy przejścia badawcze zgodziły się że deklarowana przez OWASP wykrywalność AVERAGE tej kategorii (nie EASY, w przeciwieństwie do większości innych wpisów Mobile Security) odzwierciedla że znalezienie danych wymaga faktycznego wyciągnięcia piaskownicy i odczytania plików, nie tylko skanu manifestu.
    steps:
    - title:
        en: Pull the app sandbox
        pl: Wyciągnij piaskownicę apki
      description:
        en: adb backup / adb pull / run-as on Android, or an iTunes/idevicebackup2 backup extraction (or full jailbreak filesystem access) on iOS, retrieves the app's private storage directory -- SharedPreferences/plist files, SQLite databases, cache, and logs -- exactly as a forensic tool or a thief with the device would.
        pl: adb backup / adb pull / run-as na Android, albo ekstrakcja backupu iTunes/idevicebackup2 (albo pełny dostęp do systemu plików po jailbreaku) na iOS, wyciąga prywatny katalog przechowywania apki -- pliki SharedPreferences/plist, bazy danych SQLite, cache, i logi -- dokładnie tak jak zrobiłoby narzędzie forensyczne albo złodziej z urządzeniem.
    - title:
        en: Inspect with sqlite3 and plutil
        pl: Zbadaj przez sqlite3 i plutil
      description:
        en: sqlite3 CLI opens any recovered .db file directly -- a database encrypted with SQLCipher simply fails to open without the key, itself a useful pass/fail signal. plutil -p decodes iOS plist files (NSUserDefaults) to check for cleartext values.
        pl: CLI sqlite3 otwiera bezpośrednio dowolny odzyskany plik .db -- baza zaszyfrowana SQLCipher po prostu nie otworzy się bez klucza, sam w sobie użyteczny sygnał zdał/nie zdał. plutil -p dekoduje pliki plist iOS (NSUserDefaults) by sprawdzić wartości jawnego tekstu.
    - title:
        en: Runtime instrumentation with Frida/objection
        pl: Instrumentacja w czasie wykonania przez Frida/objection
      description:
        en: objection's `ios keychain dump` lists every Keychain item along with its kSecAttrAccessible protection class in one command -- the exact signal that catches a weak accessibility attribute like kSecAttrAccessibleAlways. Frida hooks on SharedPreferences.Editor, SQLiteDatabase, and Keychain APIs reveal what's actually written and how, at the moment it happens.
        pl: '`ios keychain dump` z objection wylicza każdy element Keychain wraz z jego klasą ochrony kSecAttrAccessible w jednej komendzie -- dokładny sygnał który wychwytuje słaby atrybut dostępności jak kSecAttrAccessibleAlways. Zahaczki Frida na SharedPreferences.Editor, SQLiteDatabase, i API Keychain ujawniają co jest faktycznie zapisywane i jak, w momencie gdy to się dzieje.'
    - title:
        en: Automated static+dynamic scan with MobSF
        pl: Zautomatyzowany skan statyczny+dynamiczny przez MobSF
      description:
        en: 'MobSF automates the above in one pass: flags MODE_WORLD_READABLE/WRITEABLE, plaintext SharedPreferences writes, external-storage APIs, and logging calls statically, then in dynamic mode dumps the actual sandbox contents after exercising the app -- confirmed by all three research passes as the standard first-pass tool for this category.'
        pl: 'MobSF automatyzuje powyższe w jednym przejściu: statycznie flaguje MODE_WORLD_READABLE/WRITEABLE, zapisy jawnego tekstu SharedPreferences, API pamięci zewnętrznej, i wywołania logowania, potem w trybie dynamicznym zrzuca faktyczną zawartość piaskownicy po przećwiczeniu apki -- potwierdzone przez wszystkie trzy przejścia badawcze jako standardowe narzędzie pierwszego przejścia dla tej kategorii.'
  defenses:
    title:
      en: Defense layers, ranked
      pl: Warstwy obrony wg skuteczności
    lead:
      en: 'All three research passes independently produced a near-identical ranking, and all three flagged the same specific, dated caveat: a widely-recommended Android library in this ranking has since been deprecated.'
      pl: 'Wszystkie trzy przejścia badawcze niezależnie wyprodukowały niemal identyczny ranking, i wszystkie trzy oflagowały to samo konkretne, datowane zastrzeżenie: szeroko rekomendowana biblioteka Android w tym rankingu została od tego czasu wycofana.'
    items:
    - rank: 1
      eff: 90
      kind: primary
      label:
        en: Don't store the secret at all -- minimize + short-lived tokens
        pl: Nie przechowuj sekretu wcale -- minimalizacja + krótkotrwałe tokeny
      note:
        en: 'All three research passes ranked this highest for the same reason as this catalog''s other categories: data that was never persisted cannot be recovered from a lost device, a backup, or a forensic image. Genuinely infeasible for every use case, but the first question to ask before reaching for encryption.'
        pl: 'Wszystkie trzy przejścia badawcze sklasyfikowały to najwyżej z tego samego powodu co inne kategorie tego katalogu: dane które nigdy nie zostały utrwalone nie mogą zostać odzyskane ze zgubionego urządzenia, backupu, albo obrazu forensycznego. Naprawdę niewykonalne dla każdego przypadku użycia, ale pierwsze pytanie do zadania zanim sięgnie się po szyfrowanie.'
    - rank: 2
      eff: 80
      kind: primary
      label:
        en: Hardware-backed Keystore/Keychain with the correct accessibility attribute
        pl: Wsparty sprzętowo Keystore/Keychain z poprawnym atrybutem dostępności
      note:
        en: 'kSecAttrAccessibleWhenUnlockedThisDeviceOnly (iOS) or a StrongBox/TEE-backed key (Android), never the deprecated kSecAttrAccessibleAlways. Real caveats confirmed across all three passes: not every Android device has hardware backing (older/cheaper devices fall back to software-only), and none of this protects against a runtime-instrumented app on an already-rooted/jailbroken device -- it defends the lost-but-not-compromised device, this category''s primary threat model.'
        pl: 'kSecAttrAccessibleWhenUnlockedThisDeviceOnly (iOS) albo klucz wsparty StrongBox/TEE (Android), nigdy przestarzały kSecAttrAccessibleAlways. Prawdziwe zastrzeżenia potwierdzone we wszystkich trzech przejściach: nie każde urządzenie Android ma wsparcie sprzętowe (starsze/tańsze urządzenia spadają do samego oprogramowania), i nic z tego nie chroni przed apką zinstrumentowaną w czasie wykonania na już zrootowanym/jailbreakowanym urządzeniu -- broni zgubionego-ale-nie-skompromitowanego urządzenia, głównego modelu zagrożenia tej kategorii.'
    - rank: 3
      eff: 70
      kind: strong
      label:
        en: Database-at-rest encryption (SQLCipher or equivalent)
        pl: Szyfrowanie bazy danych w spoczynku (SQLCipher albo równoważne)
      note:
        en: 'Directly closes this deep-dive''s own flagship attack (plaintext SQLite, as in the real Subway/ZippyYum CVE). Caveat: only as strong as where the encryption key itself lives -- a key derived from a static string or stored in plain SharedPreferences defeats the whole control.'
        pl: 'Bezpośrednio zamyka własny flagowy atak tego deep-dive (jawny tekst SQLite, jak w prawdziwym CVE Subway/ZippyYum). Zastrzeżenie: tylko tak silne jak to gdzie żyje sam klucz szyfrujący -- klucz wyprowadzony ze statycznego stringa albo przechowywany w zwykłym SharedPreferences pokonuje całą kontrolę.'
    - rank: 4
      eff: 55
      kind: weak
      label:
        en: Wrapper libraries -- with an important caveat
        pl: Biblioteki opakowujące -- z ważnym zastrzeżeniem
      note:
        en: 'All three research passes independently flagged the same specific, dated fact: Android''s EncryptedSharedPreferences (androidx.security:security-crypto), long recommended as the standard wrapper, was deprecated by Google around 2024-2025 with no direct drop-in replacement. Any current guide still presenting it as the recommended approach is citing stale advice -- the underlying pattern (Keystore-backed key + manual encryption) remains correct even as the specific wrapper library''s status changes.'
        pl: 'Wszystkie trzy przejścia badawcze niezależnie oflagowały ten sam konkretny, datowany fakt: EncryptedSharedPreferences Androida (androidx.security:security-crypto), długo rekomendowane jako standardowe opakowanie, zostało wycofane przez Google około 2024-2025 bez bezpośredniego zamiennika. Każdy aktualny przewodnik wciąż prezentujący to jako rekomendowane podejście cytuje nieaktualną poradę -- leżący u podstaw wzorzec (klucz wsparty Keystore + ręczne szyfrowanie) pozostaje poprawny nawet gdy zmienia się status konkretnej biblioteki opakowującej.'
    - rank: 5
      eff: 50
      kind: weak
      label:
        en: App-switcher snapshot masking + log scrubbing
        pl: Maskowanie zrzutu przełącznika apek + czyszczenie logów
      note:
        en: 'FLAG_SECURE (Android) or a background blur overlay (iOS) for sensitive screens, plus stripping Log/NSLog calls and third-party crash-SDK payloads from release builds -- directly the fix for this deep-dive''s own flagship Starbucks incident. Narrower in scope than the top controls: each closes one specific channel.'
        pl: 'FLAG_SECURE (Android) albo nakładka rozmycia w tle (iOS) dla wrażliwych ekranów, plus usunięcie wywołań Log/NSLog i payloadów SDK awarii firm trzecich z buildów release -- bezpośrednio naprawa dla własnego flagowego incydentu Starbucks tego deep-dive. Węższe w zakresie niż główne kontrole: każda zamyka jeden konkretny kanał.'
    - rank: 6
      eff: 30
      kind: weak
      label:
        en: Secure deletion / backup exclusion
        pl: Bezpieczne usuwanie / wykluczenie z backupu
      note:
        en: android:allowBackup="false" and iOS's do-not-backup file attribute close the cloud/iTunes-backup copy vector; secure-delete calls (SQLite VACUUM, overwrite temp files) are best-effort only -- flash wear-leveling means true erasure on mobile storage is not guaranteed, all three passes noted.
        pl: android:allowBackup="false" i atrybut pliku do-not-backup iOS zamykają wektor kopii backupu chmurowego/iTunes; wywołania bezpiecznego usuwania (SQLite VACUUM, nadpisywanie plików tymczasowych) są tylko best-effort -- wyrównywanie zużycia flash oznacza że prawdziwe usunięcie na pamięci mobilnej nie jest gwarantowane, zauważyły wszystkie trzy przejścia.
  incidents:
    title:
      en: Real-world incidents
      pl: Rzeczywiste incydenty
    lead:
      en: 'An unusually strong result for this deep-dive: all three independent research passes converged on the exact same two flagship CVEs, with matching technical details. Both are rated CVSS Low precisely because the attack vector is local/physical -- an honest reminder that a low CVSS score does not mean low real-world consequence for this category.'
      pl: 'Niezwykle silny wynik dla tego deep-dive: wszystkie trzy niezależne przejścia badawcze zbiegły się na dokładnie tych samych dwóch flagowych CVE, z pasującymi szczegółami technicznymi. Oba są klasyfikowane jako CVSS Low dokładnie dlatego że wektor ataku jest lokalny/fizyczny -- uczciwe przypomnienie że niska ocena CVSS nie oznacza niskiej konsekwencji z praktyki dla tej kategorii.'
    items:
    - org: CVE-2014-0647 — Starbucks iOS app v2.6.1
      year: 2014
      impact: ~10 million downloads at time of disclosure
      cost: CVSS v2 2.1 (Low) -- rated low specifically because the attack vector is local device access, not remote
      description:
        en: 'Confirmed identically by all three research passes as this category''s flagship incident: the app wrote usernames, passwords, and email addresses in cleartext to a Crashlytics crash-log file, plus unencrypted GPS location history, both extractable from device storage without even the device passcode. Disclosed January 2014 and fixed shortly after. The clean illustration of this category''s own risk profile: EASY exploitability once you have the device, SEVERE consequence, but a technically local attack vector that CVSS scores as Low.'
        pl: 'Potwierdzone identycznie przez wszystkie trzy przejścia badawcze jako flagowy incydent tej kategorii: apka zapisywała nazwy użytkowników, hasła, i adresy email jawnym tekstem do pliku logu awarii Crashlytics, plus nieszyfrowaną historię lokalizacji GPS, oba wydobywalne z pamięci urządzenia nawet bez kodu dostępu urządzenia. Ujawnione w styczniu 2014 i naprawione wkrótce potem. Czysta ilustracja własnego profilu ryzyka tej kategorii: EASY eksploatowalność gdy tylko masz urządzenie, SEVERE konsekwencja, ale technicznie lokalny wektor ataku który CVSS ocenia jako Low.'
    - org: CVE-2013-6986 — ZippyYum Subway CA Kiosk app v3.4 (iOS)
      year: 2013
      impact: Password elements recoverable directly from local storage
      cost: CVSS v2 2.1 (Low), same local-access rating pattern as the Starbucks case
      description:
        en: 'Confirmed identically by all three research passes: cleartext storage in SQLite cache databases, letting an attacker who obtains the device read password elements directly with a plain SQLite viewer -- no decryption, no exploit chain, just opening the file. The most literal, textbook illustration of this category''s own dominant sub-technique.'
        pl: 'Potwierdzone identycznie przez wszystkie trzy przejścia badawcze: przechowywanie jawnym tekstem w bazach danych cache SQLite, pozwalające atakującemu który zdobędzie urządzenie odczytać elementy hasła bezpośrednio zwykłą przeglądarką SQLite -- bez deszyfrowania, bez łańcucha eksploitów, po prostu otwarcie pliku. Najbardziej dosłowna, podręcznikowa ilustracja własnej dominującej pod-techniki tej kategorii.'
    inlineSources:
    - label: NVD — CVE-2014-0647
      url: https://nvd.nist.gov/vuln/detail/CVE-2014-0647
    - label: NVD — CVE-2013-6986
