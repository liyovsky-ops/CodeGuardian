meta:
  id: httpparameterpollution
  threatId: '1.26'
  severity: High
  color: '#ea580c'
  colorRgb: 234,88,12
  cwe: CWE-235
  cvss: '8.1'
  standard: OWASP A04:2021
hero:
  titleMain: 'HTTP Parameter '
  titleGrad: Pollution
  titleTail: ''
  topbar: HTTP Parameter Pollution (HPP) / Server-Side Parameter Pollution
  lead:
    en: 'The HTTP spec never defined what a server must do when the same parameter name appears twice -- so every framework picked its own rule (first wins, last wins, comma-concatenate, or silently becomes an array), and a request that passes through multiple components (WAF, proxy, app, backend API) can have each one disagree about which copy is real. "HTTP Parameter Injection" is not a separate catalog entry -- all three independent research passes confirmed it is either a loose synonym for HPP, or PortSwigger''s own "Server-Side Parameter Pollution": injecting encoded &, =, or # delimiters into input that gets embedded unencoded into a backend request, letting an attacker add, override, or truncate parameters the application never intended to expose.'
    pl: 'Specyfikacja HTTP nigdy nie zdefiniowała co serwer musi zrobić gdy ta sama nazwa parametru pojawia się dwukrotnie -- więc każdy framework wybrał własną regułę (pierwszy wygrywa, ostatni wygrywa, konkatenacja przecinkiem, albo po cichu staje się tablicą), a żądanie przechodzące przez wiele komponentów (WAF, proxy, aplikacja, backend API) może mieć każdy z nich niezgodny co do tego która kopia jest prawdziwa. "HTTP Parameter Injection" to nie osobny wpis katalogowy -- wszystkie trzy niezależne przejścia badawcze potwierdziły że to albo luźny synonim HPP, albo własne "Server-Side Parameter Pollution" PortSwigger: wstrzyknięcie zakodowanych ograniczników &, =, albo # do wejścia które trafia nieoescapowane do żądania backendowego, pozwalając atakującemu dodać, nadpisać, albo obciąć parametry których aplikacja nigdy nie zamierzała ujawnić.'
