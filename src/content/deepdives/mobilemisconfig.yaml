meta:
  id: mobilemisconfig
  threatId: '15.8'
  severity: High
  color: '#9f1239'
  colorRgb: 159,18,57
  cwe: CWE-926
  cvss: N/A (configuration-hygiene class, not a single scored CVE)
  standard: OWASP Mobile Top 10 2024 (M8)
hero:
  titleMain: 'Security '
  titleGrad: Misconfiguration
  titleTail: ' (Mobile)'
  topbar: Security Misconfiguration (OWASP Mobile Top 10 2024, M8)
  lead:
    en: 'All three independent research passes converged on the same nuanced framing for this category: new label, not new idea. Neither the 2014 nor 2016 OWASP Mobile Top 10 had a category named "Security Misconfiguration" -- but the concepts it now consolidates (exported components, permission hygiene, debug artifacts) were previously scattered mainly under 2016''s M1 ("Improper Platform Usage") and M10 ("Extraneous Functionality"). OWASP''s own page cites no CWE at all, confirmed directly by all three teams -- only a generic link to cwe.mitre.org. Notably, OWASP rates this category''s exploitability DIFFICULT (unlike the EASY rating on M1-M5 and M7) but both Technical and Business Impact SEVERE -- a distinctive profile: harder to pull off than most Mobile Security categories, but worse when it lands, which this deep-dive''s own severity honestly reflects.'
    pl: 'Wszystkie trzy niezależne przejścia badawcze zbiegły się na tym samym niuansowym ramowaniu tej kategorii: nowa etykieta, nie nowa idea. Ani lista OWASP Mobile Top 10 z 2014 ani z 2016 nie miała kategorii nazwanej "Security Misconfiguration" -- ale koncepcje które teraz konsoliduje (eksportowane komponenty, higiena uprawnień, artefakty debugowania) były wcześniej rozproszone głównie pod 2016 M1 ("Improper Platform Usage") i M10 ("Extraneous Functionality"). Własna strona OWASP nie cytuje żadnego CWE, potwierdzone bezpośrednio przez wszystkie trzy zespoły -- tylko generyczny link do cwe.mitre.org. Znacząco, OWASP klasyfikuje eksploatowalność tej kategorii jako DIFFICULT (w przeciwieństwie do oceny EASY na M1-M5 i M7) ale zarówno Wpływ Techniczny jak i Biznesowy jako SEVERE -- odrębny profil: trudniejsza do wykonania niż większość kategorii Mobile Security, ale gorsza gdy się uda, co własna ocena ważności tego deep-dive uczciwie odzwierciedla.'
  metrics:
  - k: SEVERE / SEVERE
    v:
      en: OWASP's own Technical + Business Impact rating
      pl: Własna ocena Wpływu Technicznego + Biznesowego OWASP
  - k: 3,046 apps
    v:
      en: leaked ~100M records via misconfigured Firebase backends (2018)
      pl: wyciekło ~100 mln rekordów przez błędnie skonfigurowane backendy Firebase (2018)
  - k: '36'
    v:
      en: malicious apps exploiting StrandHogg in the wild, targeting top-100 banking apps
      pl: złośliwych apek wykorzystujących StrandHogg w praktyce, celujących w top-100 apek bankowych
  - k: No CWE
    v:
      en: OWASP's own M8 page cites none
      pl: Własna strona M8 OWASP nie cytuje żadnego
  sources:
  - label: OWASP Mobile Top 10 2024 — M8
    url: https://owasp.org/www-project-mobile-top-10/2023-risks/m8-security-misconfiguration
  - label: OWASP Mobile Top 10 2016 — M1 (conceptual predecessor)
    url: https://owasp.org/www-project-mobile-top-10/2016-risks/m1-improper-platform-usage
  - label: SecurityWeek — Firebase misconfiguration exposes 100M+ records
    url: https://www.securityweek.com/thousands-android-apps-leak-data-due-firebase-misconfigurations/
  - label: CWE-926 — Improper Export of Android Application Components
    url: https://cwe.mitre.org/data/definitions/926.html
