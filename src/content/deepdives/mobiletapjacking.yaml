meta:
  id: mobiletapjacking
  threatId: '15.15'
  severity: Medium
  color: '#4d7c0f'
  colorRgb: 77,124,15
  cwe: CWE-1021
  cvss: N/A (technique class; verified platform CVEs include CVE-2016-2496 and CVE-2017-0492, both cited by MITRE itself as CWE-1021's own demonstrative examples, and the modern CVE-2021-39691, CVSS ~7.3 High)
  standard: OWASP MASVS-PLATFORM-3, MASTG-TEST-0035 (Testing for Overlay Attacks)
hero:
  titleMain: 'Tapjacking '
  titleGrad: (UI Overlay Attack)
  titleTail: ''
  topbar: Tapjacking / UI Overlay Attack (Android)
  lead:
    en: 'All three research passes independently confirmed the correction flagged by this catalog''s own Task Hijacking entry (15.14): CWE-1021 (Improper Restriction of Rendered UI Layers or Frames) is the correct primary CWE for tapjacking specifically, not for task-stack manipulation. MITRE''s own text lists "Clickjacking, UI Redress Attack, Tapjacking" as CWE-1021''s alternate terms, and -- unusually strong corroboration -- MITRE''s own demonstrative examples on that CWE page are two real Android tapjacking CVEs (CVE-2016-2496 and CVE-2017-0492), with a third, CVE-2021-39691, independently confirmed as classified CWE-1021 in its own GitHub Security Advisory. The core mechanism, per Android''s own documentation, is either full occlusion (an attacker''s overlay covers the touch area, capturing the tap directly or letting it pass through to a hidden real control while displaying deceptive UI) or partial occlusion (the real control stays tappable, but surrounding context is obscured to mislead the user about what the tap means) -- Android provides no default protection against the partial-occlusion variant at all. All three research passes converged on an important, consistent scoping nuance: the overlay attacks seen in real banking trojans (Cerberus, Anubis, EventBot, TeaBot) are predominantly accessibility-driven, opaque fake-login-screen phishing, not the narrower transparent tap-pass-through that "tapjacking" originally described -- both belong under this entry, but conflating them overstates how exploitable classic tapjacking remains on modern, patched Android. A second unanimous finding, with a very specific technical detail all three teams converged on independently: Android 12''s (API 31) default protection against untrusted obscured touches only blocks overlays whose opacity is at or above roughly 0.8 -- an attacker who keeps their overlay''s opacity below that threshold, or fully transparent, can still slip touches through on a fully patched device.'
    pl: 'Wszystkie trzy przejścia badawcze niezależnie potwierdziły korektę oflagowaną przez własny wpis Task Hijacking tego katalogu (15.14): CWE-1021 (Improper Restriction of Rendered UI Layers or Frames) to poprawne główne CWE konkretnie dla tapjacking, nie dla manipulacji stosem zadań. Własny tekst MITRE wylicza "Clickjacking, UI Redress Attack, Tapjacking" jako alternatywne terminy CWE-1021, a -- niezwykle silne potwierdzenie -- własne przykłady demonstracyjne MITRE na tej stronie CWE to dwa prawdziwe CVE tapjacking Android (CVE-2016-2496 i CVE-2017-0492), z trzecim, CVE-2021-39691, niezależnie potwierdzonym jako sklasyfikowanym CWE-1021 we własnym GitHub Security Advisory. Podstawowy mechanizm, zgodnie z własną dokumentacją Android, to albo pełne przesłonięcie (overlay atakującego pokrywa obszar dotyku, przechwytując tap bezpośrednio albo pozwalając mu przejść do ukrytej prawdziwej kontrolki podczas wyświetlania zwodniczego UI) albo częściowe przesłonięcie (prawdziwa kontrolka pozostaje dotykalna, ale otaczający kontekst jest przesłonięty by zmylić użytkownika co do znaczenia tapu) -- Android nie zapewnia żadnej domyślnej ochrony przed wariantem częściowego przesłonięcia w ogóle. Wszystkie trzy przejścia badawcze zbiegły się na ważnym, spójnym niuansie zakresu: ataki overlay widziane w prawdziwych trojanach bankowych (Cerberus, Anubis, EventBot, TeaBot) to przeważnie phishing przez opartą na accessibility, nieprzezroczystą fałszywą stronę logowania, nie węższe przezroczyste przejście tapu które "tapjacking" pierwotnie opisywał -- oba należą do tego wpisu, ale mylenie ich przecenia jak eksploatowalny pozostaje klasyczny tapjacking na nowoczesnym, załatanym Android. Drugie jednomyślne ustalenie, z bardzo konkretnym szczegółem technicznym na którym wszystkie trzy zespoły zbiegły się niezależnie: domyślna ochrona Android 12 (API 31) przed niezaufanymi przesłoniętymi dotykami blokuje tylko overlaye o nieprzezroczystości na poziomie lub powyżej około 0.8 -- atakujący który utrzymuje nieprzezroczystość swojego overlay poniżej tego progu, albo w pełni przezroczystą, wciąż może przepuścić dotyki na w pełni załatanym urządzeniu.'
  metrics:
  - k: CWE-1021
    v:
      en: MITRE's own demonstrative examples are two real Android tapjacking CVEs (2016-2496, 2017-0492) -- the strongest possible CWE anchor in this catalog
      pl: Własne przykłady demonstracyjne MITRE to dwa prawdziwe CVE tapjacking Android (2016-2496, 2017-0492) -- najsilniejsze możliwe zakotwiczenie CWE w tym katalogu
  - k: 0.8 opacity
    v:
      en: Android 12's default untrusted-touch block only stops overlays at or above this opacity threshold -- lower opacity still slips through
      pl: domyślna blokada niezaufanego dotyku Android 12 zatrzymuje tylko overlaye na poziomie lub powyżej tego progu nieprzezroczystości -- niższa nieprzezroczystość wciąż przechodzi
  - k: CVE-2021-39691
    v:
      en: modern WindowManager tapjacking bug, Android 10/11/12, CVSS ~7.3 High, explicitly classified CWE-1021
      pl: nowoczesny błąd tapjacking WindowManager, Android 10/11/12, CVSS ~7.3 High, jawnie sklasyfikowany CWE-1021
  - k: Not the same
    v:
      en: banking-trojan overlay phishing (opaque, accessibility-driven) is a distinct pattern from classic transparent tap-pass-through
      pl: phishing overlay trojanów bankowych (nieprzezroczysty, oparty na accessibility) to odrębny wzorzec od klasycznego przezroczystego przejścia tapu
  sources:
  - label: Android -- Tapjacking risk page
    url: https://developer.android.com/privacy-and-security/risks/tapjacking
  - label: CWE-1021 -- Improper Restriction of Rendered UI Layers or Frames
    url: https://cwe.mitre.org/data/definitions/1021.html
  - label: Android 12 behavior changes -- untrusted touch blocking
    url: https://developer.android.com/about/versions/12/behavior-changes-all
  - label: OWASP MASTG-TEST-0035 -- Testing for Overlay Attacks
    url: https://mas.owasp.org/MASTG/tests/android/MASVS-PLATFORM/MASTG-TEST-0035/
