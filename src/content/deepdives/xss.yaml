hero:
  titleMain: 'Cross-Site '
  titleGrad: Scripting
  titleTail: ' (XSS)'
  topbar: Cross-Site Scripting (XSS)
  lead:
    en: 'XSS lets an attacker inject script that the victim''s own browser runs as if it came from the trusted site — reading cookies, riding the session, and rewriting the page. Reflected and stored variants are assembled server-side; DOM-based XSS lives entirely in client JavaScript and may never touch the server at all. Mutation XSS (mXSS) is the sharpest edge case: markup that looks clean to a sanitizer mutates into executable code when the browser re-parses it — a real, recurring bypass class against DOMPurify, the exact sanitizer this project uses. Stored XSS with session-takeover impact is commonly scored around CVSS 8.8.'
    pl: 'XSS pozwala atakującemu wstrzyknąć skrypt, który przeglądarka ofiary wykonuje tak, jakby pochodził z zaufanej strony — czytając ciasteczka, jadąc na sesji i przepisując stronę. Warianty reflected i stored są składane po stronie serwera; DOM-based XSS żyje wyłącznie w kliencie i może nigdy nie dotrzeć do serwera. Mutation XSS (mXSS) to najostrzejszy przypadek: znacznik wyglądający czysto dla sanitizera mutuje w wykonywalny kod, gdy przeglądarka parsuje go ponownie — realna, powracająca klasa obejść DOMPurify, dokładnie tego sanitizera którego używa ten projekt. Stored XSS z przejęciem sesji jest zwykle oceniany około CVSS 8.8.'
  metrics:
  - k: CWE-79
    v:
      en: Weakness ID
      pl: ID słabości
  - k: '8.8'
    v: CVSS · Critical
  - k: A03:2021
