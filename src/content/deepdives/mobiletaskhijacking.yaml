meta:
  id: mobiletaskhijacking
  threatId: '15.14'
  severity: High
  color: '#ca8a04'
  colorRgb: 202,138,4
  cwe: CWE-441
  cvss: 7.8 High (CVSS v3.1, AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H) for StrandHogg 2.0 / CVE-2020-0096; the original StrandHogg (1.0) has no assigned CVE and thus no CVSS -- a design-flaw technique class, not a single-CVE bug
  standard: OWASP MASWE-0057 (StrandHogg Attack / Task Affinity Vulnerability), MASVS-PLATFORM
hero:
  titleMain: 'Task '
  titleGrad: Hijacking
  titleTail: ' (StrandHogg)'
  topbar: Task Hijacking (StrandHogg 1.0 / 2.0)
  lead:
    en: 'All three research passes independently made the same significant correction to this entry''s own catalog stub: CWE-1021 (Improper Restriction of Rendered UI Layers or Frames) is mis-assigned here. MITRE''s own text for CWE-1021 lists its alternate terms as "Clickjacking, UI Redress Attack, and Tapjacking" -- it describes overlay/z-order window layering, not task-stack manipulation, and belongs on this catalog''s sibling tapjacking entry (15.15) instead. Task hijacking needs zero permissions, including no overlay permission, and works by a completely different mechanism: a malicious app declares an Activity whose taskAffinity matches a victim app''s package name, combined with allowTaskReparenting="true" or launchMode="singleTask", so Android''s own task-management logic inserts the hostile Activity into -- or reparents it onto -- the victim''s task. The next time the user opens the trusted app, they see the attacker''s phishing screen under the victim''s identity in the task switcher, because the vulnerability lives in Android''s task scheduler, not in the victim app''s code. All three passes independently proposed CWE-441 (Unintended Proxy or Intermediary / Confused Deputy) as the better-fitting primary, since Google and security researchers describe the platform-level StrandHogg 2.0 (CVE-2020-0096) explicitly as a confused-deputy bug in ActivityStartController -- NVD itself assigns CVE-2020-0096 no specific CWE ("NVD-CWE-noinfo"), confirming there was no authoritative mapping to defer to. A second correction all three teams converged on, directly refuting an assumption in their own research brief: StrandHogg 1.0 is NOT eternally unpatched simply because it is manifest-declarative -- Android 11 (API 30) hardened the platform to stop co-locating activities from different-UID packages in the same task by default, so 1.0''s real exploitability today depends on both the device''s OS version and the app''s own targetSdkVersion, not a simple "patched vs unpatched" binary.'
    pl: 'Wszystkie trzy przejścia badawcze niezależnie dokonały tej samej znaczącej korekty własnego stuba katalogu tego wpisu: CWE-1021 (Improper Restriction of Rendered UI Layers or Frames) jest tutaj błędnie przypisane. Własny tekst MITRE dla CWE-1021 wylicza alternatywne terminy jako "Clickjacking, UI Redress Attack, i Tapjacking" -- opisuje warstwowanie okien overlay/z-order, nie manipulację stosem zadań, i należy do siostrzanego wpisu tapjacking tego katalogu (15.15) zamiast. Task hijacking potrzebuje zera uprawnień, włącznie z brakiem uprawnienia overlay, i działa zupełnie innym mechanizmem: złośliwa apka deklaruje Activity której taskAffinity pasuje do nazwy pakietu apki ofiary, połączone z allowTaskReparenting="true" albo launchMode="singleTask", więc własna logika zarządzania zadaniami Android wstawia wrogą Activity do -- albo reparentuje ją na -- zadanie ofiary. Następnym razem gdy użytkownik otwiera zaufaną apkę, widzi ekran phishingowy atakującego pod tożsamością ofiary w przełączniku zadań, ponieważ podatność żyje w harmonogramie zadań Android, nie w kodzie apki ofiary. Wszystkie trzy przejścia niezależnie zaproponowały CWE-441 (Unintended Proxy or Intermediary / Confused Deputy) jako lepiej dopasowane główne, ponieważ Google i badacze bezpieczeństwa opisują platformowy StrandHogg 2.0 (CVE-2020-0096) wprost jako błąd confused-deputy w ActivityStartController -- samo NVD nie przypisuje CVE-2020-0096 żadnego konkretnego CWE ("NVD-CWE-noinfo"), potwierdzając że nie było autorytatywnego mapowania na którym można by się oprzeć. Druga korekta na której zbiegły się wszystkie trzy zespoły, bezpośrednio obalająca założenie z własnego briefu badawczego: StrandHogg 1.0 NIE jest wiecznie niezałatany tylko dlatego że jest deklaratywny w manifeście -- Android 11 (API 30) wzmocnił platformę by przestać współlokować aktywności z pakietów o różnych UID w tym samym zadaniu domyślnie, więc rzeczywista eksploatowalność 1.0 dzisiaj zależy zarówno od wersji systemu urządzenia jak i własnego targetSdkVersion apki, nie od prostej binarnej "załatane vs niezałatane".'
  metrics:
  - k: CVE-2020-0096
    v:
      en: 'StrandHogg 2.0: confused-deputy bug in ActivityStartController, CVSS 7.8 High, patched at Android security level 2020-05-01'
      pl: 'StrandHogg 2.0: błąd confused-deputy w ActivityStartController, CVSS 7.8 High, załatany na poziomie bezpieczeństwa Android 2020-05-01'
  - k: No CVE
    v:
      en: the original StrandHogg (1.0) is a design-flaw technique class, not a single assigned vulnerability
      pl: oryginalny StrandHogg (1.0) to klasa techniki wady projektowej, nie pojedyncza przypisana podatność
  - k: USENIX 2015
    v:
      en: Ren, Zhang, Xue, Wei, Liu first defined task hijacking as an attack class four years before StrandHogg's disclosure
      pl: Ren, Zhang, Xue, Wei, Liu jako pierwsi zdefiniowali task hijacking jako klasę ataku cztery lata przed ujawnieniem StrandHogg
  - k: API 30
    v:
      en: Android 11 is the only fix for StrandHogg 2.0, and also hardens (does not eliminate) 1.0's exploitability by default
      pl: Android 11 to jedyna naprawa dla StrandHogg 2.0, i też wzmacnia (nie eliminuje) eksploatowalność 1.0 domyślnie
