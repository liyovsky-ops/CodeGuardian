hero:
  titleMain: 'Expression Language '
  titleGrad: Injection
  titleTail: ''
  topbar: Expression Language Injection (Java EL / Spring SpEL)
  lead:
    en: 'The same weakness family as OGNL and Log4Shell''s JNDI lookup (CWE-917), but its own distinct technologies: Java''s Unified EL (javax.el/jakarta.el, used by JSP/JSF) and Spring''s SpEL. Both are safe when the expression is a fixed, developer-authored string and only the data varies -- and become RCE the moment attacker input becomes the expression text itself. Spring Cloud Function''s routing-expression header (CVE-2022-22963) and Spring Cloud Gateway''s actuator endpoint (CVE-2022-22947) are the two clean, unambiguous 2022 incidents; Spring4Shell (CVE-2022-22965) is deliberately NOT covered here as a core example, since all three research passes independently confirmed it is a data-binding/ClassLoader issue, not EL evaluation -- a common miscategorization this deep-dive corrects rather than repeats.'
    pl: 'Ta sama rodzina słabości co OGNL i lookup JNDI Log4Shell (CWE-917), ale własne, odrębne technologie: ujednolicone EL Javy (javax.el/jakarta.el, używane przez JSP/JSF) i SpEL Springa. Oba są bezpieczne gdy wyrażenie jest stałym, autorstwa developera stringiem i zmieniają się tylko dane -- i stają się RCE w momencie gdy wejście atakującego staje się samym tekstem wyrażenia. Nagłówek routing-expression Spring Cloud Function (CVE-2022-22963) i endpoint actuator Spring Cloud Gateway (CVE-2022-22947) to dwa czyste, jednoznaczne incydenty z 2022 roku; Spring4Shell (CVE-2022-22965) celowo NIE jest tu omówiony jako podstawowy przykład, bo wszystkie trzy przejścia badawcze niezależnie potwierdziły że to problem data-binding/ClassLoader, nie ewaluacji EL -- częsta błędna kategoryzacja którą ten deep-dive koryguje zamiast powielać.'
