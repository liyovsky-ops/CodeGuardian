  ir:
    title:
      en: Incident response checklist
      pl: Lista kontrolna reagowania
    lead:
      en: If active EL/SpEL exploitation is confirmed, work this list top to bottom.
      pl: Po potwierdzeniu aktywnej eksploatacji EL/SpEL, przejdź tę listę od góry.
    steps:
    - en: Treat the host as fully compromised if RCE is confirmed -- rotate all credentials/secrets reachable from that process
      pl: Traktuj hosta jako w pełni skompromitowanego jeśli RCE jest potwierdzone -- zrotuj wszystkie poświadczenia/sekrety osiągalne z tego procesu
    - en: Identify the exact engine (SpEL vs Java EL vs OGNL) from error messages or the affected component, since the fix and CVE lineage differ per engine
      pl: Zidentyfikuj dokładny silnik (SpEL vs Java EL vs OGNL) z komunikatów błędów lub dotkniętego komponentu, bo naprawa i historia CVE różnią się dla każdego silnika
    - en: Grep the codebase for every SpelExpressionParser/ELProcessor call site where the parsed string traces to HTTP input, not just the one exploited -- this is rarely a single-instance bug
      pl: Przeszukaj kod pod kątem każdego miejsca wywołania SpelExpressionParser/ELProcessor gdzie sparsowany string sięga do wejścia HTTP, nie tylko tego które zostało wykorzystane -- to rzadko jest błąd jednorazowy
    - en: Switch every unavoidable dynamic-evaluation call site to SimpleEvaluationContext and patch to the fixed library version
      pl: Przełącz każde nieuniknione miejsce dynamicznej ewaluacji na SimpleEvaluationContext i zaktualizuj do wersji biblioteki z łatką
    - en: Audit and lock down exposed Actuator/management endpoints regardless of whether CVE-2022-22947 specifically was the entry point
      pl: Przeaudytuj i zablokuj wystawione endpointy Actuator/management niezależnie od tego czy konkretnie CVE-2022-22947 był punktem wejścia
    - en: Check outbound connection and process-execution logs for unexpected exec()/ProcessBuilder activity originating from the application process
      pl: Sprawdź logi połączeń wychodzących i wykonania procesów pod kątem nieoczekiwanej aktywności exec()/ProcessBuilder pochodzącej z procesu aplikacji
    - en: Notify per applicable data-breach obligations if data was exfiltrated
      pl: Powiadom zgodnie z obowiązującymi wymogami dot. naruszenia danych jeśli dane zostały eksfiltrowane
