meta:
  id: mobilebinary
  threatId: '15.7'
  severity: Medium
  color: '#4338ca'
  colorRgb: 67,56,202
  cwe: CWE-693
  cvss: N/A (binary-hardening posture, not a single scored CVE)
  standard: OWASP Mobile Top 10 2024 (M7)
hero:
  titleMain: 'Insufficient Binary '
  titleGrad: Protections
  titleTail: ''
  topbar: Insufficient Binary Protections (OWASP Mobile Top 10 2024, M7)
  lead:
    en: 'Unlike M5 and M6, this is NOT a new concept in the 2024 revision -- all three independent research passes converged on a fact worth stating honestly: the 2014/2016 Mobile Top 10 already had a direct predecessor, "M10: Lack of Binary Protections," defining the same core idea ("a lack of binary protections results in a mobile app that can be analyzed, reverse-engineered, and modified by an adversary in rapid fashion"). What''s new in 2024 is the category''s promotion to rank 7, its consolidation of the old 2016 M8 (Code Tampering) and M9 (Reverse Engineering) into one entry, and its expanded framing to cover modern attestation (Play Integrity, App Attest) and AI/ML model theft. OWASP''s own page cites no CWE at all -- confirmed directly, the only CWE-related content on the page is a generic link to cwe.mitre.org -- so any CWE mapping here is the community''s best-fit inference, not an OWASP-sanctioned one. OWASP itself rates this category Exploitability EASY, Prevalence COMMON, Detectability
      EASY, but both Technical and Business Impact only MODERATE -- notably lower than the Critical/High severities used elsewhere in this Mobile Security category, honestly reflected in this entry''s own severity rating.'
    pl: 'W przeciwieństwie do M5 i M6, to NIE jest nowa koncepcja w rewizji 2024 -- wszystkie trzy niezależne przejścia badawcze zbiegły się na fakcie wartym uczciwego stwierdzenia: Mobile Top 10 z 2014/2016 już miał bezpośredniego poprzednika, "M10: Lack of Binary Protections", definiującego tę samą podstawową ideę ("brak ochrony binarnej skutkuje apką mobilną która może zostać przeanalizowana, poddana inżynierii wstecznej, i zmodyfikowana przez przeciwnika w szybkim tempie"). Co jest nowe w 2024 to awans kategorii na pozycję 7, konsolidacja starych 2016 M8 (Code Tampering) i M9 (Reverse Engineering) w jeden wpis, i rozszerzone ramowanie obejmujące nowoczesną atestację (Play Integrity, App Attest) i kradzież modeli AI/ML. Własna strona OWASP nie cytuje żadnego CWE -- potwierdzone bezpośrednio, jedyna treść związana z CWE na stronie to generyczny link do cwe.mitre.org -- więc dowolne mapowanie CWE tutaj jest wnioskiem społeczności o najlepszym dopasowaniu, nie usankcjonowanym przez OWASP.
      Sam OWASP klasyfikuje tę kategorię jako Exploitability EASY, Prevalence COMMON, Detectability EASY, ale zarówno Wpływ Techniczny jak i Biznesowy tylko MODERATE -- zauważalnie niżej niż poziomy Critical/High używane gdzie indziej w tej kategorii Mobile Security, uczciwie odzwierciedlone we własnej ocenie ważności tego wpisu.'
  metrics:
  - k: No CWE
    v:
      en: OWASP's own M7 page cites none
      pl: Własna strona M7 OWASP nie cytuje żadnego
  - k: 86%
    v:
      en: of malware samples were repackaged apps (Zhou & Jiang 2012)
      pl: próbek malware to przepakowane apki (Zhou i Jiang 2012)
  - k: MODERATE
    v:
      en: OWASP's own Technical + Business Impact rating
      pl: Własna ocena Wpływu Technicznego + Biznesowego OWASP
  - k: '2014'
    v:
      en: year the direct predecessor category (M10) first appeared
      pl: rok gdy bezpośredni poprzednik kategorii (M10) pierwszy raz się pojawił
  sources:
  - label: OWASP Mobile Top 10 2024 — M7
    url: https://owasp.org/www-project-mobile-top-10/2023-risks/m7-insufficient-binary-protection
  - label: OWASP Mobile Top 10 2014 — M10 (predecessor)
    url: https://owasp.org/www-project-mobile-top-10/2014-risks/m10-lack-of-binary-protections
  - label: Zhou & Jiang — Dissecting Android Malware (IEEE S&P 2012)
    url: https://oaklandsok.github.io/papers/zhou2012.pdf
  - label: CWE-693 — Protection Mechanism Failure (MITRE)
    url: https://cwe.mitre.org/data/definitions/693.html
