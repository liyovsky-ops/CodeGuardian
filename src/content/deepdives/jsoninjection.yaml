  cvss: '9.8'
  standard: OWASP A08:2021
hero:
  titleMain: 'JSON '
  titleGrad: Injection
  titleTail: ''
  topbar: JSON Injection
  lead:
    en: 'Two mechanistically different threats sharing one name -- exactly the same split this knowledge base already documented for YAML Injection. Structural JSON injection is a plain data/syntax confusion: an app builds JSON by string concatenation, and a stray quote lets an attacker inject new keys. Polymorphic-deserialization RCE is tag-driven object instantiation: fastjson''s @type, Jackson''s default typing, and Newtonsoft.Json''s $type all let attacker-controlled JSON name the exact class to instantiate -- the same primitive as YAML''s !!tag deserialization, and just as capable of full RCE. A fastjson zero-day in this exact family was under active exploitation as this deep-dive was written.'
    pl: 'Dwa mechanistycznie różne zagrożenia dzielące jedną nazwę -- dokładnie ten sam podział który ta baza wiedzy już udokumentowała dla YAML Injection. Strukturalne wstrzyknięcie JSON to zwykłe pomieszanie danych/składni: aplikacja buduje JSON przez konkatenację stringów, a zabłąkany cudzysłów pozwala atakującemu wstrzyknąć nowe klucze. RCE deserializacji polimorficznej to tworzenie instancji obiektu sterowane tagiem: @type fastjson, domyślne typowanie Jackson, i $type Newtonsoft.Json wszystkie pozwalają JSON kontrolowanemu przez atakującego nazwać dokładną klasę do utworzenia instancji -- ten sam prymityw co deserializacja !!tag YAML, i tak samo zdolny do pełnego RCE. Zero-day fastjson w dokładnie tej rodzinie był aktywnie eksploatowany gdy ten deep-dive był pisany.'
  metrics:
  - k: CWE-502
    v:
      en: Weakness ID (deserialization core, sibling to YAML)
