meta:
  id: mobileprivacy
  threatId: '15.6'
  severity: High
  color: '#a21caf'
  colorRgb: 162,28,175
  cwe: CWE-359
  cvss: N/A (privacy/regulatory violation, not a technical exploit)
  standard: OWASP Mobile Top 10 2024 (M6)
hero:
  titleMain: 'Inadequate Privacy '
  titleGrad: Controls
  titleTail: ''
  topbar: Inadequate Privacy Controls (OWASP Mobile Top 10 2024, M6)
  lead:
    en: 'Genuinely new in the 2024 revision -- the 2016 list''s M6 was an entirely different topic, "Insecure Authorization." All three independent research passes flagged the same important nuance, mirroring a pattern already seen elsewhere in this catalog: OWASP''s own official M6 page is narrower and more storage/transmission-centric (PII in logs, PII in URL parameters, PII in device backups) than the broader "over-collection, disclosure, consent, third-party SDK" framing that dominates industry commentary and this deep-dive''s own scope. That broader framing is real and well-supported -- OWASP''s own text does open with apps collecting "more than they need to fulfill their purpose" -- but it is documented here as the community''s expansion of a terser official page, not misattributed as OWASP''s literal wording. Fittingly, OWASP itself rates this category''s Technical Impact LOW but Business Impact SEVERE: this is fundamentally a disclosure and consent failure, not a traditional technical
      exploit, and the real incidents anchoring this deep-dive are regulatory enforcement actions, not CVEs.'
    pl: 'Naprawdę nowa w rewizji 2024 -- M6 z listy 2016 był zupełnie innym tematem, "Insecure Authorization". Wszystkie trzy niezależne przejścia badawcze oflagowały ten sam ważny niuans, powtarzający wzorzec już widziany gdzie indziej w tym katalogu: własna oficjalna strona M6 OWASP jest węższa i bardziej skoncentrowana na przechowywaniu/transmisji (PII w logach, PII w parametrach URL, PII w backupach urządzenia) niż szersze ramowanie "nadmierne zbieranie, ujawnienie, zgoda, SDK firmy trzeciej" które dominuje w komentarzach branżowych i własnym zakresie tego deep-dive. To szersze ramowanie jest prawdziwe i dobrze poparte -- własny tekst OWASP zaczyna się od apek zbierających "więcej niż potrzebują do spełnienia swojego celu" -- ale jest tutaj udokumentowane jako rozszerzenie społeczności zwięzłej oficjalnej strony, nie błędnie przypisane jako dosłowne brzmienie OWASP. Stosownie, sam OWASP klasyfikuje wpływ techniczny tej kategorii jako NISKI ale wpływ biznesowy jako SEVERE: to fundamentalnie
      awaria ujawnienia i zgody, nie tradycyjny exploit techniczny, a prawdziwe incydenty zakotwiczające ten deep-dive to działania egzekwujące regulatora, nie CVE.'
  metrics:
