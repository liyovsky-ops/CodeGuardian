  tools:
    title:
      en: Detection tooling
      pl: Narzędzia wykrywania
    lead:
      en: The same tooling that surfaced every real incident in this deep-dive is freely available today -- this is a well-solved detection problem once someone actually looks.
      pl: Te same narzędzia które ujawniły każdy prawdziwy incydent w tym deep-dive są dzisiaj swobodnie dostępne -- to dobrze rozwiązany problem wykrywania gdy tylko ktoś faktycznie spojrzy.
    sast:
    - - MobSF (Mobile Security Framework)
      - Statically enumerates declared permissions and bundled third-party SDKs/trackers, the standard first pass for a permission-vs-purpose audit
    - - Exodus Privacy
      - Open-source Android tracker and permission scanner purpose-built for identifying embedded third-party SDK data collection
    dast:
    - - Frida
      - Dynamic instrumentation to hook and log actual runtime calls to privacy-sensitive APIs (location, clipboard, contacts, camera/mic) -- exactly the technique that would have caught the clipboard pattern before iOS 14's banner made it public
    - - mitmproxy / Burp Suite
      - Network interception (with certificate-pinning bypass where needed) to observe what PII actually leaves the device and to which third-party ad/analytics endpoints -- the ground truth behind the real Grindr finding
    note:
      en: <strong>Key signal:</strong> the platform's own review process is self-attested, not independently verified -- Apple's Privacy Nutrition Labels and Google Play's Data Safety section are both developer-declared. A clean label is not proof of clean behavior; the dynamic and network-analysis tools above are what actually establish ground truth.
      pl: <strong>Kluczowy sygnał:</strong> własny proces przeglądu platformy jest samodzielnie deklarowany, nie niezależnie weryfikowany -- zarówno etykiety odżywcze prywatności Apple jak i sekcja Data Safety Google Play są deklarowane przez dewelopera. Czysta etykieta to nie dowód czystego zachowania; powyższe narzędzia dynamiczne i analizy sieciowej to co faktycznie ustala prawdę.
  compliance:
    title:
      en: Compliance quick-reference
      pl: Szybka zgodność
    lead:
      en: 'All three research passes converged on the same honest finding: this category is fundamentally a privacy-compliance/regulatory issue, and no single CWE cleanly captures it -- the closest available mapping is explicitly imperfect, and the real "standards" this deep-dive answers to are regulatory frameworks, not a weakness taxonomy.'
      pl: 'Wszystkie trzy przejścia badawcze zbiegły się na tym samym uczciwym ustaleniu: ta kategoria jest fundamentalnie kwestią zgodności prywatności/regulacyjną, i żadne pojedyncze CWE nie uchwytuje jej czysto -- najbliższe dostępne mapowanie jest jawnie niedoskonałe, a prawdziwe "standardy" którym odpowiada ten deep-dive to ramy regulacyjne, nie taksonomia słabości.'
    items:
    - std: CWE (MITRE)
      items:
      - 'CWE-359 — Exposure of Private Personal Information to an Unauthorized Actor (primary, but explicitly imperfect). Verified at MITRE: its own text references GDPR and CCPA directly, but it centers on disclosure/unauthorized-access to PII, not the over-collection half of this category -- there is no single CWE for "collected more personal data than the feature genuinely needed."'
      - CWE-200 — Exposure of Sensitive Information to an Unauthorized Actor (parent of CWE-359).
      - CWE-532 — Insertion of Sensitive Information into Log File is worth citing for the narrower, storage-centric attack vectors OWASP's own M6 page actually emphasizes (PII in logs/crash reports).
    - std: OWASP
      items:
      - 'Mobile Top 10 2024 — M6: Inadequate Privacy Controls, genuinely new to the 2024 revision (the 2016 list''s M6 was the unrelated "Insecure Authorization"). Verified directly: Exploitability AVERAGE, Prevalence COMMON, Detectability EASY, Technical Impact LOW, Business Impact SEVERE -- an unusually explicit split confirming this is a regulatory/reputational risk more than a traditional exploit.'
      - OWASP's own M6 page text is narrower and more storage/transmission-focused (PII in logs, URL parameters, device backups) than the broader over-collection/disclosure/consent/SDK framing this deep-dive covers -- documented here explicitly as a community expansion of a terser official page, per all three research passes.
      - 'The real standards this category answers to are regulatory frameworks: GDPR (Art. 5 data minimization and purpose limitation, Art. 6-7 lawful basis and consent, Art. 9 special-category data -- the exact basis of the Grindr fine), CCPA/CPRA, Apple App Tracking Transparency, and Google Play''s Data Safety section. Also maps to MASVS-PRIVACY, a dedicated control group in OWASP MASVS.'
    inlineSources:
    - label: OWASP Mobile Top 10 2024 — M6
      url: https://owasp.org/www-project-mobile-top-10/2023-risks/m6-inadequate-privacy-controls
    - label: CWE-359 (MITRE)
      url: https://cwe.mitre.org/data/definitions/359.html
  ir:
    title:
      en: Incident response checklist
      pl: Lista kontrolna reagowania
    lead:
      en: If undisclosed over-collection or improper data sharing is confirmed, work this list top to bottom.
      pl: Po potwierdzeniu nieujawnionego nadmiernego zbierania albo niewłaściwego dzielenia się danymi, przejdź tę listę od góry.
    steps:
    - en: Identify exactly what data was collected/shared beyond disclosure, and to which third parties -- network traffic analysis, not just a manifest review, establishes the actual scope
      pl: Zidentyfikuj dokładnie jakie dane zostały zebrane/udostępnione poza ujawnieniem, i którym stronom trzecim -- analiza ruchu sieciowego, nie tylko przegląd manifestu, ustala faktyczny zakres
    - en: Determine whether any collected data qualifies as special-category/sensitive under applicable regulation (health, sexual orientation, religion, etc.), since this materially changes the regulatory exposure as it did in the real Grindr case
      pl: Ustal czy jakiekolwiek zebrane dane kwalifikują się jako dane specjalnej kategorii/wrażliwe pod obowiązującą regulacją (zdrowie, orientacja seksualna, religia itd.), ponieważ to istotnie zmienia ekspozycję regulacyjną jak w prawdziwym przypadku Grindr
    - en: Audit every third-party SDK bundled in the app for its actual data practices, not just its stated purpose -- TikTok's own explanation shows even an app developer can be genuinely unaware of an SDK's real behavior
      pl: Przeaudytuj każdy SDK firmy trzeciej dołączony do apki pod kątem jego faktycznych praktyk danych, nie tylko zadeklarowanego celu -- własne wyjaśnienie TikTok pokazuje że nawet deweloper apki może być naprawdę nieświadomy faktycznego zachowania SDK
    - en: Correct the privacy nutrition label / Data Safety declaration to match actual observed behavior, not just the intended behavior
      pl: Popraw etykietę odżywczą prywatności / deklarację Data Safety by pasowała do faktycznie obserwowanego zachowania, nie tylko zamierzonego zachowania
    - en: Ship a fix that removes the over-collection at the source (data minimization) rather than only adding disclosure for data that continues to be collected
      pl: Wydaj naprawę która usuwa nadmierne zbieranie u źródła (minimalizacja danych) zamiast tylko dodawać ujawnienie dla danych które nadal są zbierane
    - en: Notify per applicable regulatory obligations (GDPR, CCPA, or the relevant jurisdiction's DPA) -- the real cases in this deep-dive show enforcement can follow years after the practice began
      pl: Powiadom zgodnie z obowiązującymi wymogami regulacyjnymi (GDPR, CCPA, albo odpowiedni DPA jurysdykcji) -- prawdziwe przypadki w tym deep-dive pokazują że egzekwowanie może nastąpić lata po rozpoczęciu praktyki
