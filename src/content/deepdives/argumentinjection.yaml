hero:
  titleMain: 'Argument '
  titleGrad: Injection
  titleTail: ''
  topbar: Argument Injection
  lead:
    en: The defense everyone reaches for first -- pass arguments as an array, never a shell string -- fully stops command injection and does nothing at all against this class. When a program is invoked via execve()/ProcessBuilder with argv, attacker-controlled data still reaches the target program's own option parser, which happily treats a value starting with - as a flag rather than data. git's --upload-pack=, tar's --checkpoint-action=exec=, and ssh's -oProxyCommand= turn a filename or URL field into remote code execution, with zero shell metacharacters involved.
    pl: Obrona po którą wszyscy sięgają najpierw -- przekazuj argumenty jako tablicę, nigdy jako string powłoki -- w pełni zatrzymuje wstrzyknięcie polecenia i nic nie robi przeciw tej klasie. Gdy program jest wywoływany przez execve()/ProcessBuilder z argv, dane kontrolowane przez atakującego wciąż trafiają do własnego parsera opcji programu docelowego, który chętnie potraktuje wartość zaczynającą się od - jako flagę zamiast danych. --upload-pack= gita, --checkpoint-action=exec= tara i -oProxyCommand= ssh zamieniają pole nazwy pliku lub URL w zdalne wykonanie kodu, bez ani jednego metaznaku powłoki.
  metrics:
  - k: CWE-88
    v:
      en: Weakness ID
      pl: ID słabości
  - k: '9.8'
    v: CVSS · Critical (CVE-2024-4577)
