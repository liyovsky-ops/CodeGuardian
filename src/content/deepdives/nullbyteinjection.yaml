  tools:
    title:
      en: Detection tooling
      pl: Narzędzia wykrywania
    lead:
      en: General SAST catches the taint-flow shape (unvalidated input reaching a file/socket/LDAP sink); dedicated null-byte checks are mostly a DAST/fuzzing discipline.
      pl: Generyczny SAST łapie kształt przepływu skażenia (niezwalidowane wejście docierające do ujścia plik/socket/LDAP); dedykowane kontrole null-byte to głównie dyscyplina DAST/fuzzingu.
    sast:
    - - FindSecBugs / SpotBugs (WEAK_FILENAMEUTILS)
      - Java-specific rule flagging filename/path handling weak to null-byte and related manipulation
    - - Semgrep / CodeQL / SonarQube taint rules
      - General taint-tracking from request parameters to file/native sinks catches the vulnerable shape even without a null-byte-specific rule
    - - NIST SAMATE / Juliet test suite
      - Includes Java null-byte-injection test cases, useful for validating any of the above detectors
    dast:
    - - Burp Suite (Intruder + active scanner)
      - Fuzz path/filename/hostname parameters with %00 payload sets; multipart filenames need a raw 0x00 byte, not the literal text %00
    - - OWASP ZAP
      - Equivalent fuzzing capability with null-byte payload lists
    note:
      en: <strong>Key signal:</strong> an "embedded null byte" / "Invalid file path" / ERR_INVALID_ARG_VALUE error on a probe is good news for the filesystem sink (it proves the runtime is patched) but tells you nothing about sockets, LDAP, XPath, or native extensions the same input might also reach -- test those sinks independently.
      pl: <strong>Kluczowy sygnał:</strong> błąd "embedded null byte" / "Invalid file path" / ERR_INVALID_ARG_VALUE na sondzie to dobra wiadomość dla ujścia systemu plików (dowodzi że środowisko jest załatane) ale nic nie mówi o socketach, LDAP, XPath, czy rozszerzeniach natywnych które to samo wejście może również osiągnąć -- testuj te ujścia niezależnie.
  compliance:
    title:
      en: Compliance quick-reference
      pl: Szybka zgodność
    lead:
      en: 'The most important compliance finding here, verified independently by all three research passes by fetching MITRE''s own CWE-to-category mapping data directly: neither of the two null-byte-specific CWEs is directly listed under OWASP A03:2021-Injection. One rolls up to it indirectly through its parent; the flagship real-world CVE was tagged with neither.'
      pl: 'Najważniejsze ustalenie zgodności tutaj, zweryfikowane niezależnie przez wszystkie trzy przejścia badawcze przez pobranie bezpośrednio danych mapowania CWE-na-kategorię OWASP MITRE: żaden z dwóch CWE specyficznych dla null-byte nie jest bezpośrednio wymieniony pod OWASP A03:2021-Injection. Jeden rolluje się do niej pośrednio przez swojego rodzica; flagowe rzeczywiste CVE nie zostało otagowane żadnym z nich.'
    items:
    - std: CWE (MITRE)
      items:
      - 'CWE-158 — Improper Neutralization of Null Byte or NUL Character (primary here; Variant, ChildOf CWE-138 Improper Neutralization of Special Elements). The neutralization-failure framing: "the filter didn''t strip the NUL." Directly matches CVE-2026-41256''s own NVD tag.'
      - 'CWE-626 — Null Byte Interaction Error / Poison Null Byte (Variant, ChildOf CWE-147 Improper Neutralization of Input Terminators AND CWE-436 Interpretation Conflict). The cross-layer framing: "two components disagree on where the string ends" -- arguably the more precise mechanistic fit for the managed-vs-C truncation scenario this deep-dive covers. Confirmed by all three research passes as a SIBLING of CWE-158, not its parent or child.'
      - MITRE's own CWE-626 page cites CVE-2005-4155 and CVE-2005-3153 as demonstrative examples -- both PHP/regex allowlist bypasses via an injected NUL byte.
      - CVE-2006-7243 itself was tagged CWE-20 (Improper Input Validation) by NVD, not either null-byte-specific CWE -- real-world tagging is often coarser than the ideal classification.
    - std: OWASP
      items:
      - Neither CWE-158 nor CWE-626 is directly enumerated in the official A03:2021-Injection mapped-CWE list (CWE-1347), verified by fetching that data directly. CWE-158 rolls up to A03:2021 only indirectly, through its parent CWE-138, which IS a listed member.
      - 'CWE-626 is murkier still: one parent path (CWE-147 -> CWE-138) leads into A03; the other (CWE-436 Interpretation Conflict) does not. Treat any flat "this is A03:2021 Injection" statement about null byte injection as an oversimplification.'
      - 'The impact frequently lands elsewhere depending on the sink: CVE-2025-1220''s real-world manifestation was tagged CWE-918 (SSRF), which is OWASP A10:2021 -- proof that a null-byte bug''s OWASP home depends on the sink it reaches, not on the presence of a NUL byte itself.'
    inlineSources:
    - label: CWE-158 (MITRE)
      url: https://cwe.mitre.org/data/definitions/158.html
    - label: CWE-626 (MITRE)
      url: https://cwe.mitre.org/data/definitions/626.html
    - label: OWASP A03:2021 Injection
      url: https://owasp.org/Top10/2021/A03_2021-Injection/
  ir:
    title:
      en: Incident response checklist
      pl: Lista kontrolna reagowania
    lead:
      en: If active exploitation of a null-byte truncation bug is confirmed, work this list top to bottom.
      pl: Po potwierdzeniu aktywnej eksploatacji błędu obcięcia null-byte, przejdź tę listę od góry.
    steps:
    - en: Identify the exact validation check and the sink it was protecting -- filesystem, socket/hostname, LDAP, XPath, native extension -- since the fix differs per sink
      pl: Zidentyfikuj dokładną kontrolę walidacji i ujście które chroniła -- system plików, socket/hostname, LDAP, XPath, rozszerzenie natywne -- ponieważ naprawa różni się per ujście
    - en: If a file was written/read via the bypass, treat every file the process had access to as potentially exposed, not just the one confirmed
      pl: Jeśli plik został zapisany/odczytany przez obejście, traktuj każdy plik do którego proces miał dostęp jako potencjalnie narażony, nie tylko potwierdzony
    - en: If the sink was a socket/hostname (SSRF-style), audit every downstream service reachable from that egress path for what an attacker-redirected connection could have reached
      pl: Jeśli ujściem był socket/hostname (w stylu SSRF), przeaudytuj każdą usługę downstream osiągalną z tej ścieżki wyjścia pod kątem tego co połączenie przekierowane przez atakującego mogło osiągnąć
    - en: Confirm the runtime version and whether it already rejects embedded NUL at the filesystem layer -- if so, the entry point was necessarily a non-filesystem sink
      pl: Potwierdź wersję środowiska i czy już odrzuca ono osadzony NUL na warstwie systemu plików -- jeśli tak, punkt wejścia był z konieczności ujściem innym niż system plików
    - en: Grep the codebase for every validate-then-concatenate pattern feeding a native/C-backed API, not just the exploited one
      pl: Przeszukaj bazę kodu pod kątem każdego wzorca waliduj-potem-konkatenuj zasilającego API oparte na natywnym/C, nie tylko wykorzystanego
    - en: Upgrade the runtime to a patched version AND add explicit NUL/control-character rejection at every input boundary before considering the incident closed
      pl: Zaktualizuj środowisko do załatanej wersji ORAZ dodaj jawne odrzucenie NUL/znaków kontrolnych na każdej granicy wejścia zanim uznasz incydent za zamknięty
  labs:
    title:
      en: Practice labs
      pl: Laboratoria praktyczne
    lead:
      en: PortSwigger has no lab combining a null byte with a file-upload web shell (their upload-bypass lab actually teaches a .htaccess override technique, not %00 -- verified directly, not assumed), but its path-traversal track has one genuine, verified lab covering exactly the truncation mechanism this deep-dive centers on.
      pl: PortSwigger nie ma laboratorium łączącego null byte z web shellem przez upload (ich laboratorium obejścia uploadu w rzeczywistości uczy techniki nadpisania .htaccess, nie %00 -- zweryfikowane bezpośrednio, nie założone), ale jego ścieżka path traversal ma jedno prawdziwe, zweryfikowane laboratorium pokrywające dokładnie mechanizm obcięcia na którym skupia się ten deep-dive.
    items:
