meta:
  id: nullbyteinjection
  threatId: cat_1_research25
  severity: High
  color: '#78350f'
  colorRgb: 120,53,15
  cwe: CWE-158
  cvss: '7.5'
  standard: OWASP A03:2021 (indirect, via CWE-138)
hero:
  titleMain: 'Null Byte '
  titleGrad: Injection
  titleTail: ''
  topbar: Null Byte / %00 Injection (Poison Null Byte)
  lead:
    en: 'Managed languages (PHP, Java, Python, Node.js) track string length explicitly, so an embedded NUL byte (0x00) is just another character -- a check like filename.endsWith(''.jpg'') evaluates the whole string and passes. The C/POSIX API underneath is NUL-terminated, so the moment that string reaches open()/fopen()/a socket call, everything after the first NUL silently vanishes. The gap between what was validated and what actually got opened is the entire vulnerability. All three independent research passes converged on the same honest framing: this was fixed at the language level in every mainstream runtime''s filesystem API years ago, but a genuine 2025 PHP CVE (fsockopen hostname validation) and a 2026 jq CVE prove the underlying class is not dead -- it just moved to sinks (sockets, LDAP, XPath, custom native code) that were never hardened.'
    pl: 'Języki zarządzane (PHP, Java, Python, Node.js) śledzą długość stringa jawnie, więc osadzony bajt NUL (0x00) jest po prostu kolejnym znakiem -- kontrola jak filename.endsWith(''.jpg'') ewaluuje cały string i przechodzi. Leżące pod spodem API C/POSIX jest zakończone NUL, więc w chwili gdy ten string dotrze do open()/fopen()/wywołania socketu, wszystko po pierwszym NUL po cichu znika. Luka między tym co zostało zwalidowane a tym co faktycznie zostało otwarte to cała ta podatność. Wszystkie trzy niezależne przejścia badawcze zbiegły się na tym samym uczciwym ramowaniu: to zostało naprawione na poziomie języka w API systemu plików każdego głównego środowiska uruchomieniowego lata temu, ale prawdziwe CVE PHP z 2025 (walidacja hostname w fsockopen) i CVE jq z 2026 dowodzą że leżąca u podstaw klasa nie jest martwa -- po prostu przeniosła się do ujść (sockety, LDAP, XPath, własny kod natywny) które nigdy nie zostały utwardzone.'
  metrics:
  - k: CWE-158
    v:
      en: Weakness ID (+ CWE-626)
      pl: ID słabości (+ CWE-626)
  - k: '2010'
    v:
      en: PHP 5.3.4 -- filesystem fix (incomplete until 2015)
      pl: PHP 5.3.4 -- naprawa systemu plików (niepełna do 2015)
  - k: 2025-26
    v:
      en: Modern CVEs -- fsockopen, jq
      pl: Nowoczesne CVE -- fsockopen, jq
  - k: No 2021 slot
    v:
      en: Direct OWASP mapping (verified absent)
      pl: Bezpośrednie mapowanie OWASP (potwierdzony brak)
  sources:
  - label: CWE-158 (MITRE)
    url: https://cwe.mitre.org/data/definitions/158.html
  - label: CWE-626 (MITRE)
    url: https://cwe.mitre.org/data/definitions/626.html
  - label: CVE-2006-7243 (NVD)
    url: https://nvd.nist.gov/vuln/detail/CVE-2006-7243
  - label: PHP manual — Null bytes related issues
    url: https://www.php.net/manual/en/security.filesystem.nullbytes.php
