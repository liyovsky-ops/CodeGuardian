sections:
  attacks:
    title:
      en: Attack types
      pl: Typy ataków
    lead:
      en: 'Every variant is the same trick applied to a different sink: get validation to see the full, safe-looking string while a lower layer only sees the truncated prefix.'
      pl: 'Każdy wariant to ta sama sztuczka zastosowana na innym ujściu: sprawić by walidacja widziała pełny, bezpiecznie wyglądający string podczas gdy niższa warstwa widzi tylko obcięty prefiks.'
    items:
    - name: File-upload extension bypass
      sev: critical
      description:
        en: An upload filter checks the trailing extension of the full filename and approves it; the underlying filesystem write only sees the prefix. On a runtime old enough not to reject embedded NUL, shell.php%00.jpg is written/served as shell.php.
        pl: Filtr uploadu sprawdza końcowe rozszerzenie pełnej nazwy pliku i zatwierdza ją; leżący pod spodem zapis systemu plików widzi tylko prefiks. Na środowisku uruchomieniowym wystarczająco starym by nie odrzucać osadzonego NUL, shell.php%00.jpg jest zapisywany/serwowany jako shell.php.
      payload: 'upload filename: shell.php%00.jpg   ->   validator sees ".jpg" (pass), filesystem write sees "shell.php"'
    - name: Path traversal + extension-append truncation
      sev: critical
      description:
        en: Code that appends a fixed extension to a user-controlled path (include($_GET['page'].'.php')) can be defeated by placing the NUL before the traversal sequence's intended suffix -- the append happens on the full managed string, but the file open truncates at the NUL.
        pl: Kod dołączający stałe rozszerzenie do ścieżki kontrolowanej przez użytkownika (include($_GET['page'].'.php')) może zostać pokonany przez umieszczenie NUL przed zamierzonym sufiksem sekwencji przejścia -- dołączenie zachodzi na pełnym stringu zarządzanym, ale otwarcie pliku obcina na NUL.
      payload: ?page=../../../etc/passwd%00   ->   include('../../../etc/passwd%00'.'.php')  opens /etc/passwd
    - name: LDAP filter truncation
      sev: high
      description:
        en: 'Verified via PortSwigger''s own research against Microsoft ADAM: .NET''s System.DirectoryServices does not strip NUL from filter strings, so a NUL truncates the query as seen by the native LDAP layer, dropping a trailing restrictive clause the application intended to enforce.'
        pl: 'Zweryfikowane przez własne badanie PortSwigger względem Microsoft ADAM: System.DirectoryServices .NET nie usuwa NUL ze stringów filtra, więc NUL obcina zapytanie widziane przez natywną warstwę LDAP, usuwając końcową restrykcyjną klauzulę którą aplikacja zamierzała wymusić.'
      payload: (&(displayName=*))%00)(department=Marketing))  -- trailing department restriction dropped at the NUL
    - name: XPath query truncation
      sev: medium
      description:
        en: 'Also documented by PortSwigger: System.Xml.XPath historically did not block embedded NUL either, allowing the same truncation trick against XPath predicates that restrict which nodes a query is allowed to return.'
        pl: 'Również udokumentowane przez PortSwigger: System.Xml.XPath historycznie też nie blokował osadzonego NUL, pozwalając na tę samą sztuczkę obcięcia przeciw predykatom XPath ograniczającym które węzły zapytanie może zwrócić.'
      payload: //user[name=$name and role!='admin']%00  -- trailing role restriction truncated away
    - name: Hostname/SSRF allowlist bypass (modern, 2025)
      sev: high
      description:
        en: 'Verified via CVE-2025-1220: PHP''s fsockopen()/stream_socket_client() validated a hostname string against an allowlist, but the C socket layer connected using only the pre-NUL prefix -- a genuinely modern proof that the class survives wherever a non-filesystem sink was never hardened.'
        pl: 'Zweryfikowane przez CVE-2025-1220: fsockopen()/stream_socket_client() PHP walidowały string hostname względem allowlisty, ale warstwa socketu C łączyła się używając tylko prefiksu przed NUL -- naprawdę współczesny dowód że klasa przeżywa gdziekolwiek ujście inne niż system plików nigdy nie zostało utwardzone.'
      payload: fsockopen("trusted-host.example\0.evil.example", 80)  -- allowlist check passes on the full string, socket connects to the truncated prefix
    - name: Structured-file truncation (modern, 2026)
      sev: medium
      description:
        en: 'Verified via CVE-2026-41256: jq (versions <=1.8.1) truncates a top-level program loaded from a file via -f at the first embedded NUL byte, so the compiled filter can silently diverge from the full file content the operator believes they are running.'
        pl: 'Zweryfikowane przez CVE-2026-41256: jq (wersje <=1.8.1) obcina program najwyższego poziomu wczytany z pliku przez -f na pierwszym osadzonym bajcie NUL, więc skompilowany filtr może po cichu odbiegać od pełnej zawartości pliku którą operator wierzy że uruchamia.'
      payload: jq -f program.jq   where program.jq contains an embedded 0x00 partway through -- only the prefix before it is compiled and run
  code:
    title:
      en: Vulnerable vs Secure
      pl: Podatny vs Bezpieczny
    lead:
      en: Modern filesystem APIs already reject embedded NUL in every mainstream language -- the residual risk is code on an old runtime, or a modern runtime's non-filesystem sink that was never hardened the same way.
      pl: Nowoczesne API systemu plików już odrzucają osadzony NUL w każdym głównym języku -- pozostałe ryzyko to kod na starym środowisku uruchomieniowym, albo ujście inne niż system plików nowoczesnego środowiska które nigdy nie zostało utwardzone w ten sam sposób.
    languages:
    - label: PHP -- legacy (pre-5.3.4)
      lang: php
      vulnerable: "$page = $_GET['page'];\nif (file_exists($page . '.php')) {   // full string checked, NUL included\n    include($page . '.php');          // native fopen() truncates at the NUL\n}"
      safe: '$page = $_GET[''page''] ?? ''home'';

        $allowed = [''home'' => 1, ''about'' => 1, ''contact'' => 1];

        if (!isset($allowed[$page])) { http_response_code(400); exit; }

        include __DIR__ . "/pages/{$page}.php";  // allowlist -- input never becomes a raw path

        // (PHP >=5.3.4 also rejects embedded NUL in the filesystem layer itself as defense-in-depth)'
    - label: PHP -- modern non-filesystem sink (fsockopen)
      lang: php
      vulnerable: "$host = $_POST['host'];\nif (in_array($host, $allowedHosts)) {     // full string checked\n    $fp = fsockopen($host, 80);           // pre-8.1.33/8.2.29/8.3.23/8.4.10: truncates at NUL\n}"
      safe: '$host = $_POST[''host''];

        if (strpos($host, "\0") !== false) { http_response_code(400); exit; }

        if (!in_array($host, $allowedHosts, true)) { http_response_code(400); exit; }

        $fp = fsockopen($host, 80);  // patched PHP also rejects NUL in the hostname itself'
    - label: Java -- allowlist bypass on a native-backed check
      lang: java
      vulnerable: "String name = request.getParameter(\"file\");   // \"secret.txt\\0.jpg\"\nif (name.endsWith(\".jpg\")) {                    // TRUE -- managed string, full length\n    return new FileInputStream(new File(baseDir, name));  // legacy JRE: opens \"secret.txt\"\n}"
      safe: 'String name = request.getParameter("file");

        if (name.indexOf(''\0'') >= 0) throw new IllegalArgumentException("NUL in name");

        Path base = Paths.get(baseDir).toRealPath();

        Path target = base.resolve(name).normalize();   // NIO throws InvalidPathException on embedded NUL

        if (!target.startsWith(base)) throw new SecurityException("traversal");

        return Files.newInputStream(target);'
    - label: Python -- the safe default (and its limit)
      lang: python
      vulnerable: "import ctypes\nname = user_input                      # \"../secret\\x00.txt\"\nif name.endswith(\".txt\"):              # check passes on the full string\n    libc = ctypes.CDLL(\"libc.so.6\")\n    fd = libc.open(name.encode(), 0)   # C open() truncates at \\x00 -> ../secret"
      safe: "# Python's own open()/os/pathlib already refuse embedded NUL:\nopen(name)   # raises ValueError: embedded null byte\n# The residual risk is exactly what's shown above: bypassing that guard\n# by handing the raw string to ctypes/a C extension/subprocess instead.\nif \"\\x00\" in name or not re.fullmatch(r\"[\\w.-]+\", name):\n    raise ValueError(\"invalid name\")"
  method:
    title:
      en: Attack methodology
      pl: Metodyka ataku
    lead:
      en: On a current mainstream runtime the classic file-open vector is mostly dead -- the practical 2026 hunting ground is legacy stacks and non-filesystem sinks that were never hardened the same way.
      pl: Na aktualnym głównym środowisku uruchomieniowym klasyczny wektor otwarcia pliku jest w większości martwy -- praktycznym terenem łowieckim 2026 są przestarzałe stosy i ujścia inne niż system plików które nigdy nie zostały utwardzone w ten sam sposób.
    steps:
    - title:
        en: Fingerprint the runtime and its patch level
        pl: Rozpoznaj środowisko uruchomieniowe i jego poziom łatek
      description:
        en: The vector is entirely version-gated. Identify the PHP/Java/Python/Node version in play -- a maintained, current runtime blocks the classic filesystem variant outright.
        pl: Wektor jest całkowicie zależny od wersji. Zidentyfikuj wersję PHP/Java/Python/Node w grze -- utrzymywane, aktualne środowisko uruchomieniowe blokuje klasyczny wariant systemu plików wprost.
    - title:
        en: Locate validate-then-truncate flows
        pl: Zlokalizuj przepływy waliduj-potem-obetnij
      description:
        en: Look for extension-allowlist checks on upload filenames, path-plus-fixed-extension concatenation, and any string validated in the app then handed to a lower layer -- sockets/hostnames, LDAP/XPath filters, native extensions, subprocess arguments.
        pl: Szukaj kontroli allowlisty rozszerzenia na nazwach plików uploadu, konkatenacji ścieżki plus stałego rozszerzenia, i każdego stringa zwalidowanego w aplikacji a potem oddanego niższej warstwie -- sockety/hostname, filtry LDAP/XPath, rozszerzenia natywne, argumenty subprocess.
    - title:
        en: Confirm with a differential test
        pl: Potwierdź testem różnicowym
      description:
        en: Send the value once clean and once with an injected NUL placed before the part the validator inspects -- %00 on URL/urlencoded channels, a raw 0x00 byte on multipart filenames and binary channels. Different content served, a different host reached, or an error string like "embedded null byte" / "Invalid file path" (which ironically proves the runtime is patched) confirms the sink's handling.
        pl: Wyślij wartość raz czystą i raz z wstrzykniętym NUL umieszczonym przed częścią którą inspekcjonuje walidator -- %00 na kanałach URL/urlencoded, surowy bajt 0x00 na nazwach plików multipart i kanałach binarnych. Inna serwowana treść, inny osiągnięty host, albo string błędu jak "embedded null byte" / "Invalid file path" (co ironicznie dowodzi że środowisko jest załatane) potwierdza obsługę ujścia.
    - title:
        en: Pivot to non-filesystem sinks when the filesystem is hardened
        pl: Przerzuć się na ujścia inne niż system plików gdy system plików jest utwardzony
      description:
        en: An "embedded null byte" error confirms the runtime blocks NUL in file paths -- but says nothing about sockets, LDAP, XPath, or custom native code the same request might also reach. CVE-2025-1220 is the canonical example of this pivot paying off.
        pl: Błąd "embedded null byte" potwierdza że środowisko blokuje NUL w ścieżkach plików -- ale nic nie mówi o socketach, LDAP, XPath, czy własnym kodzie natywnym które to samo żądanie może również osiągnąć. CVE-2025-1220 to kanoniczny przykład że ten przerzut się opłaca.
  defenses:
    title:
      en: Defense layers, ranked
      pl: Warstwy obrony wg skuteczności
    lead:
      en: Front-door rejection of NUL is the only defense that covers every sink at once -- runtime-level filesystem protections are strong but sink-specific, and stop at the filesystem boundary.
      pl: Odrzucenie NUL na wejściu to jedyna obrona pokrywająca każde ujście naraz -- ochrony na poziomie środowiska uruchomieniowego są silne ale specyficzne dla ujścia, i kończą się na granicy systemu plików.
    items:
    - rank: 1
      eff: 95
      kind: primary
      label:
        en: Reject NUL and control characters at input validation, fail-closed
        pl: Odrzuć NUL i znaki kontrolne przy walidacji wejścia, fail-closed
      note:
        en: The only control that covers every sink -- filesystem, sockets, LDAP, XPath, native extensions -- at once, since it stops the byte before it reaches any of them. MITRE's own recommended mitigation for CWE-158. Reject outright rather than strip (stripping can itself introduce a different bypass).
        pl: Jedyna kontrola pokrywająca każde ujście -- system plików, sockety, LDAP, XPath, rozszerzenia natywne -- naraz, bo zatrzymuje bajt zanim dosięgnie któregokolwiek z nich. Własne zalecane łagodzenie MITRE dla CWE-158. Odrzuć wprost zamiast usuwać (usuwanie może samo wprowadzić inne obejście).
    - rank: 2
      eff: 90
      kind: primary
      label:
        en: Allowlist the whole value; never let user input become a raw path/host string
        pl: Allowlistuj całą wartość; nigdy nie pozwól by wejście użytkownika stało się surowym stringiem ścieżki/hosta
      note:
        en: Structurally immune to truncation because attacker input never reaches the sink verbatim -- an indirection map (id -> known-good filename) sidesteps the entire class regardless of runtime patch level.
        pl: Strukturalnie odporne na obcięcie ponieważ wejście atakującego nigdy nie dociera do ujścia dosłownie -- mapa pośrednia (id -> znana dobra nazwa pliku) omija całą klasę niezależnie od poziomu łatek środowiska.
    - rank: 3
      eff: 80
      kind: strong
      label:
        en: Current, patched runtime filesystem APIs
        pl: Aktualne, załatane API systemu plików środowiska
      note:
        en: 'PHP >=5.6.9/5.5.25/5.4.41 (full closure, after two incomplete-fix follow-ups), Python 3''s open()/os (ValueError: embedded null byte), Java NIO Paths.get (InvalidPathException), Node.js fs (ERR_INVALID_ARG_VALUE) all reject embedded NUL today -- strong but scoped strictly to the filesystem sink.'
        pl: 'PHP >=5.6.9/5.5.25/5.4.41 (pełne zamknięcie, po dwóch niepełnych naprawach), Python 3 open()/os (ValueError: embedded null byte), Java NIO Paths.get (InvalidPathException), Node.js fs (ERR_INVALID_ARG_VALUE) wszystkie dziś odrzucają osadzony NUL -- silne ale ściśle ograniczone do ujścia systemu plików.'
    - rank: 4
      eff: 75
      kind: strong
      label:
        en: Canonicalize then verify base-directory containment
        pl: Kanonikalizuj potem zweryfikuj zawieranie w katalogu bazowym
      note:
        en: realpath()/toRealPath() + a startsWith(base) check closes the path-traversal facet directly, and canonicalization tends to surface an embedded NUL as a side effect on most runtimes.
        pl: realpath()/toRealPath() + kontrola startsWith(base) zamyka aspekt przejścia przez ścieżki bezpośrednio, a kanonikalizacja ma tendencję do ujawniania osadzonego NUL jako efekt uboczny na większości środowisk.
    - rank: 5
      eff: 35
      kind: weak
      label:
        en: WAF / edge filtering of %00
        pl: Filtrowanie %00 na WAF / krawędzi
      note:
        en: Misses raw-NUL channels entirely (multipart filenames, binary bodies) and is bypassable via double-encoding -- defense-in-depth at best, never the primary control.
        pl: Całkowicie pomija kanały surowego NUL (nazwy plików multipart, ciała binarne) i jest omijalne przez podwójne kodowanie -- co najwyżej obrona w głąb, nigdy główna kontrola.
  incidents:
    title:
      en: Real-world incidents
      pl: Rzeczywiste incydenty
    lead:
      en: 'A rich, honestly-dated record spanning 20 years: the flagship 2010-era PHP fix took two more CVEs across 2015 to actually finish, and two independently-verified CVEs from 2025 and 2026 prove the class is alive wherever a non-filesystem sink was never hardened.'
      pl: 'Bogaty, uczciwie datowany rejestr rozciągający się na 20 lat: flagowa naprawa PHP z ok. 2010 potrzebowała jeszcze dwóch CVE w 2015 by faktycznie się zakończyć, a dwa niezależnie zweryfikowane CVE z 2025 i 2026 dowodzą że klasa żyje gdziekolwiek ujście inne niż system plików nigdy nie zostało utwardzone.'
    items:
    - org: PHP (language-level)
      year: 2010
      impact: CVE-2006-7243 -- NVD CWE-20, CVSSv2 5.0
      cost: Fixed in PHP 5.3.4
      description:
        en: PHP before 5.3.4 accepted \0 in pathnames, letting an attacker append a safe-looking extension after the NUL (e.g. .php\0.jpg to file_exists()) to bypass extension checks. The flagship, best-known case -- and NVD tagged it CWE-20 (Improper Input Validation), not a null-byte-specific CWE, a reminder that real-world CVE tagging is often coarser than the ideal classification.
        pl: PHP przed 5.3.4 akceptował \0 w nazwach ścieżek, pozwalając atakującemu dołączyć bezpiecznie wyglądające rozszerzenie po NUL (np. .php\0.jpg do file_exists()) by ominąć kontrole rozszerzenia. Flagowy, najlepiej znany przypadek -- a NVD otagował go CWE-20 (Improper Input Validation), nie CWE specyficznym dla null-byte, przypomnienie że rzeczywiste tagowanie CVE jest często zgrubsze niż idealna klasyfikacja.
    - org: 'PHP (incomplete-fix follow-up #1)'
      year: 2015
      impact: CVE-2015-2348
      cost: Fixed in 5.4.39 / 5.5.23 / 5.6.7
      description:
        en: move_uploaded_file() specifically still truncated pathnames at \x00 five years after the 2010 fix -- NVD explicitly describes this as existing "because of an incomplete fix for CVE-2006-7243." Verified directly against the NVD record.
        pl: move_uploaded_file() konkretnie wciąż obcinał nazwy ścieżek na \x00 pięć lat po naprawie z 2010 -- NVD jawnie opisuje to jako istniejące "z powodu niepełnej naprawy CVE-2006-7243." Zweryfikowane bezpośrednio względem rekordu NVD.
    - org: 'PHP (incomplete-fix follow-up #2)'
      year: 2015
      impact: CVE-2015-4025
      cost: Fixed in 5.4.41 / 5.5.25 / 5.6.9
      description:
        en: A separate, later 2015 fix for the SAME root cause -- set_include_path(), tempnam(), rmdir(), and readlink() all still truncated at an embedded NUL. Verified directly against the NVD record as a second, distinct incomplete-fix CVE for different functions than CVE-2015-2348 -- the 2010 language-level fix genuinely took multiple releases across five years to finish closing.
        pl: Osobna, późniejsza naprawa z 2015 dla TEJ SAMEJ przyczyny źródłowej -- set_include_path(), tempnam(), rmdir(), i readlink() wszystkie wciąż obcinały na osadzonym NUL. Zweryfikowane bezpośrednio względem rekordu NVD jako drugie, odrębne CVE niepełnej naprawy dla innych funkcji niż CVE-2015-2348 -- naprawa na poziomie języka z 2010 naprawdę potrzebowała wielu wydań na przestrzeni pięciu lat by faktycznie się zamknąć.
    - org: PHP (modern, non-filesystem sink)
      year: 2025
      impact: CVE-2025-1220 -- SSRF via hostname allowlist bypass
      cost: Fixed in 8.1.33 / 8.2.29 / 8.3.23 / 8.4.10
      description:
        en: fsockopen()/stream_socket_client() validated a hostname against an allowlist on the full managed string, but the underlying C socket layer connected using only the truncated prefix -- a genuinely modern (2025) proof this class survives in any sink that was never hardened the same way the filesystem functions were.
        pl: fsockopen()/stream_socket_client() walidowały hostname względem allowlisty na pełnym stringu zarządzanym, ale leżąca pod spodem warstwa socketu C łączyła się używając tylko obciętego prefiksu -- naprawdę współczesny (2025) dowód że ta klasa przeżywa w każdym ujściu które nigdy nie zostało utwardzone w ten sam sposób co funkcje systemu plików.
    - org: jq (jqlang)
      year: 2026
      impact: CVE-2026-41256 -- NVD CWE-158, versions <=1.8.1
      cost: Confirmed directly against the live NVD record (not an aggregator)
      description:
        en: A top-level jq program loaded from a file via -f is truncated at the first embedded NUL byte -- the operator believes the full file is running, but only the prefix before the NUL was ever compiled. NVD tags this CWE-158 directly, matching this deep-dive's primary CWE exactly.
        pl: Program jq najwyższego poziomu wczytany z pliku przez -f jest obcinany na pierwszym osadzonym bajcie NUL -- operator wierzy że działa pełny plik, ale tylko prefiks przed NUL kiedykolwiek został skompilowany. NVD tagguje to bezpośrednio jako CWE-158, dokładnie pasując do głównego CWE tego deep-dive.
    inlineSources:
