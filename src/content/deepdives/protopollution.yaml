meta:
  id: protopollution
  threatId: cat_1_research18
  severity: Critical
  color: '#f43f5e'
  colorRgb: 244,63,94
  cwe: CWE-1321
  cvss: '9.1'
  standard: OWASP A08:2021
hero:
  titleMain: 'Prototype '
  titleGrad: Pollution
  titleTail: ''
  topbar: Prototype Pollution
  lead:
    en: 'Every plain JavaScript object shares one Object.prototype. A naive recursive merge/clone/extend function that copies attacker-controlled JSON without rejecting the keys __proto__ and constructor.prototype writes straight onto that shared prototype — polluting every object in the application, including ones created later. Impact depends entirely on the downstream "gadget" that reads an inherited property it didn''t expect: DoS, authorization bypass, or full RCE via a template-engine gadget chain (Kibana''s Timelion CVE-2019-7609 scored CVSS 10.0). The base lodash CVE-2019-10744 scores 9.1.'
    pl: 'Każdy zwykły obiekt JavaScript dzieli jeden Object.prototype. Naiwna rekurencyjna funkcja merge/clone/extend, kopiująca niezaufany JSON bez odrzucania kluczy __proto__ i constructor.prototype, zapisuje wprost na tym współdzielonym prototypie — zanieczyszczając każdy obiekt w aplikacji, także te tworzone później. Skutek zależy całkowicie od dalszego "gadżetu", który odczytuje odziedziczoną właściwość, której się nie spodziewał: DoS, obejście autoryzacji, albo pełne RCE przez łańcuch gadżetów silnika szablonów (Kibana Timelion CVE-2019-7609 oceniono na CVSS 10.0). Bazowe lodash CVE-2019-10744 ocenia się na 9.1.'
  metrics:
  - k: CWE-1321
    v:
      en: Weakness ID
      pl: ID słabości
  - k: '9.1'
    v: CVSS · Critical
  - k: A08:2021
    v: OWASP Top 10
