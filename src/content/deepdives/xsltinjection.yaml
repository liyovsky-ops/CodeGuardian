meta:
  id: xsltinjection
  threatId: cat_1_research02
  severity: Critical
  color: '#be123c'
  colorRgb: 190,18,60
  cwe: CWE-91
  cvss: '9.8'
  standard: OWASP A03:2021
hero:
  titleMain: 'XSLT '
  titleGrad: Injection
  titleTail: ''
  topbar: XSLT Injection (XSL Injection)
  lead:
    en: The "SSTI of the XML world." XXE tops out at file read, SSRF, and DoS; XSLT is a full transformation language with vendor-specific extension mechanisms that reach directly into the host runtime, so the same attacker control that gives XXE its ceiling gives XSLT injection a floor of RCE. Xalan's http://xml.apache.org/xalan/java/java.lang.Runtime namespace binds a stylesheet prefix directly to the JVM's Runtime class -- rt:getRuntime() and rt:exec(...) call the real methods, no gadget chain required. PHP's registerPHPFunctions() and .NET's msxsl:script are the equivalent escape hatches for their runtimes.
    pl: '"SSTI świata XML." XXE osiąga sufit przy odczycie pliku, SSRF i DoS; XSLT to pełny język transformacji z mechanizmami rozszerzeń specyficznymi dla dostawcy które sięgają bezpośrednio do runtime hosta, więc ta sama kontrola atakującego która daje XXE jego sufit, daje wstrzyknięciu XSLT podłogę w postaci RCE. Przestrzeń nazw Xalana http://xml.apache.org/xalan/java/java.lang.Runtime wiąże prefiks arkusza stylów bezpośrednio z klasą Runtime JVM -- rt:getRuntime() i rt:exec(...) wywołują prawdziwe metody, bez potrzeby łańcucha gadżetów. registerPHPFunctions() PHP i msxsl:script .NET to równoważne furtki ucieczki dla ich runtime.'
  metrics:
  - k: CWE-91
    v:
      en: Weakness ID (shared with generic XML Injection)
      pl: ID słabości (dzielone z generycznym XML Injection)
  - k: '9.8'
    v: CVSS · Critical (CVE-2023-49093)
  - k: A03:2021
    v: OWASP Top 10
  - k: '6'
    v:
      en: Attack variants
      pl: Warianty ataku
  sources:
