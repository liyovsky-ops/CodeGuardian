      url: https://owasp.org/Top10/2021/A03_2021-Injection/
  ir:
    title:
      en: Incident response checklist
      pl: Lista kontrolna reagowania
    lead:
      en: If active XSLT injection exploitation is confirmed, work this list top to bottom.
      pl: Po potwierdzeniu aktywnej eksploatacji wstrzyknięcia XSLT, przejdź tę listę od góry.
    steps:
    - en: Treat the host as fully compromised if RCE is confirmed -- rotate all credentials/secrets reachable from that process
      pl: Traktuj hosta jako w pełni skompromitowanego jeśli RCE jest potwierdzone -- zrotuj wszystkie poświadczenia/sekrety osiągalne z tego procesu
    - en: Identify the exact processor (Xalan/Saxon/libxslt/.NET) from error messages or the affected component, since each has its own secure-processing flag and fix
      pl: Zidentyfikuj dokładny procesor (Xalan/Saxon/libxslt/.NET) z komunikatów błędów lub dotkniętego komponentu, bo każdy ma własną flagę bezpiecznego przetwarzania i naprawę
    - en: Grep the codebase for every TransformerFactory/XSLTProcessor/XslCompiledTransform instantiation, not just the one exploited -- check each for the secure-processing/registerPHPFunctions/TrustedXslt pattern
      pl: Przeszukaj kod pod kątem każdej instancji TransformerFactory/XSLTProcessor/XslCompiledTransform, nie tylko tej która została wykorzystana -- sprawdź każdą pod kątem wzorca bezpieczne-przetwarzanie/registerPHPFunctions/TrustedXslt
    - en: Stop accepting user-supplied stylesheets entirely where feasible; otherwise enable the processor's secure-processing flag and patch to the fixed library version
      pl: Przestań całkowicie akceptować dostarczone przez użytkownika arkusze stylów tam gdzie to wykonalne; w innym przypadku włącz flagę bezpiecznego przetwarzania procesora i zaktualizuj do wersji biblioteki z łatką
    - en: Check outbound connection logs for unexpected document()-driven fetches to unfamiliar hosts
      pl: Sprawdź logi połączeń wychodzących pod kątem nieoczekiwanych pobrań napędzanych przez document() do nieznanych hostów
    - en: Notify per applicable data-breach obligations if data was exfiltrated
      pl: Powiadom zgodnie z obowiązującymi wymogami dot. naruszenia danych jeśli dane zostały eksfiltrowane
