meta:
  id: perlopeninjection
  threatId: cat_1_research22
  severity: Critical
  color: '#166534'
  colorRgb: 22,101,52
  cwe: CWE-78
  cvss: '9.1'
  standard: OWASP A03:2021
hero:
  titleMain: 'Perl '
  titleGrad: open()
  titleTail: ' Injection'
  topbar: Perl open() Injection (2-argument "magic open")
  lead:
    en: 'Perl''s 2-argument open(FH, EXPR) is "magic": it inspects the single string argument itself to infer the mode -- a leading or trailing <code>|</code> makes Perl hand the rest of the string to <code>/bin/sh -c</code> as a command. A function whose obvious job is opening a file becomes full OS command execution the moment an attacker controls what looks like a "filename" -- no system(), no backticks, nothing a code reviewer scanning for the usual injection sinks would flag. All three independent research passes converged on the same fix (the 3-argument open() form, added in Perl 5.6.0 in 2000) and the same nuance: it is the definitive fix for command injection, but not for path traversal.'
    pl: 'Dwuargumentowy open(FH, EXPR) w Perlu jest "magiczny": inspekcjonuje sam pojedynczy string argumentu by wywnioskować tryb -- wiodący albo końcowy <code>|</code> sprawia że Perl oddaje resztę stringa do <code>/bin/sh -c</code> jako komendę. Funkcja której oczywistym zadaniem jest otwarcie pliku staje się pełnym wykonaniem komend systemowych w chwili gdy atakujący kontroluje coś co wygląda jak "nazwa pliku" -- brak system(), brak backticków, nic czego recenzent kodu skanujący pod kątem typowych ujść wstrzyknięcia by nie zauważył. Wszystkie trzy niezależne przejścia badawcze zbiegły się na tej samej naprawie (trójargumentowa forma open(), dodana w Perlu 5.6.0 w 2000) i tym samym niuansie: to definitywna naprawa dla wstrzyknięcia komend, ale nie dla przejścia przez ścieżki.'
  metrics:
  - k: CWE-78
    v:
      en: Weakness ID (+ CWE-73)
      pl: ID słabości (+ CWE-73)
  - k: '9.1'
    v: CVSS · Critical (CVE-2026-8450, HTTP::Daemon)
  - k: A03:2021
    v:
      en: OWASP Top 10 (verified mapping)
      pl: OWASP Top 10 (zweryfikowane mapowanie)
  - k: '2000'
    v:
      en: 3-arg open() fix, Perl 5.6.0
      pl: Naprawa open() 3-arg, Perl 5.6.0
