meta:
  id: odatainjection
  threatId: cat_1_research29
  severity: Critical
  color: '#1e3a8a'
  colorRgb: 30,58,138
  cwe: CWE-943
  cvss: '9.8'
  standard: OWASP A03:2021 (via CWE-74 family)
hero:
  titleMain: 'OData '
  titleGrad: Injection
  titleTail: ''
  topbar: OData Injection (Open Data Protocol Query Injection)
  lead:
    en: 'OData exposes data through a URL-based query language ($filter, $orderby, $expand, $select) built into an OASIS/ISO standard widely used across Microsoft technologies (ASP.NET Web API OData, SAP Gateway, Dynamics, Power Platform) and Apache Olingo. All three independent research passes converged on a genuinely reassuring nuance most SQL-injection-trained instincts get wrong: in a properly wired OData service, the framework parses $filter into an AST and lowers it to a parameterized LINQ query -- classic string-concatenation SQL injection is NOT the default risk. Injection becomes real specifically when a developer bypasses that safe path -- hand-concatenating a filter, or a provider translating OData into backend SQL/LDAP by string-splicing rather than binding -- and the strongest real-world proof of exactly that escalation is a 2024 CVE against F5''s own BIG-IP management API.'
    pl: 'OData wystawia dane przez oparty na URL język zapytań ($filter, $orderby, $expand, $select) wbudowany w standard OASIS/ISO szeroko używany w technologiach Microsoft (ASP.NET Web API OData, SAP Gateway, Dynamics, Power Platform) i Apache Olingo. Wszystkie trzy niezależne przejścia badawcze zbiegły się na naprawdę pocieszającym niuansie który instynkty wytrenowane na SQL injection zwykle łapią błędnie: w poprawnie okablowanej usłudze OData framework parsuje $filter do AST i sprowadza go do sparametryzowanego zapytania LINQ -- klasyczne wstrzyknięcie SQL przez konkatenację stringów NIE jest domyślnym ryzykiem. Wstrzyknięcie staje się prawdziwe konkretnie gdy deweloper omija tę bezpieczną ścieżkę -- ręcznie sklejając filtr, albo dostawca tłumaczy OData na backendowy SQL/LDAP przez sklejanie stringów zamiast wiązania -- a najsilniejszym dowodem z praktyki dokładnie tej eskalacji jest CVE z 2024 przeciw własnemu API zarządzania BIG-IP firmy F5.'
  metrics:
  - k: CWE-943
    v:
      en: Weakness ID (query-logic class)
      pl: ID słabości (klasa logiki zapytań)
  - k: 7.5-9.8
    v: CVSS · High-Critical (CVE-2024-21793 F5 / CVE-2016-11023 odata4j)
  - k: A03:2021
    v:
      en: OWASP Top 10 (via injection family)
      pl: OWASP Top 10 (przez rodzinę injection)
  - k: Safe by default
    v:
      en: AST->LINQ->parameterized (mainstream stacks)
      pl: AST->LINQ->sparametryzowane (główne stosy)
