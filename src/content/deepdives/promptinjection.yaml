meta:
  id: promptinjection
  threatId: cat_1_research03
  severity: Critical
  color: '#06b6d4'
  colorRgb: 6,182,212
  cwe: CWE-1427
  cvss: '9.3'
  standard: OWASP LLM01:2025
hero:
  titleMain: 'Prompt '
  titleGrad: Injection
  titleTail: ''
  topbar: Prompt Injection (LLM Applications)
  lead:
    en: 'An LLM receives developer instructions, user input, retrieved documents, and tool output as one flat token stream — it has no cryptographic boundary to tell trusted intent from untrusted content. Direct injection means the attacker types the override themselves; indirect injection plants it in a document, email, or webpage that someone else''s AI agent later reads and obeys. EchoLeak (CVE-2025-32711, CVSS 9.3) proved this can be zero-click: one crafted email caused Microsoft 365 Copilot to exfiltrate internal files with no user interaction at all. Unlike SQL injection, there is no parameterized-query equivalent — no fully reliable technical fix exists as of this writing.'
    pl: 'LLM otrzymuje instrukcje deweloperskie, wejście użytkownika, pobrane dokumenty i wynik narzędzi jako jeden płaski strumień tokenów — nie ma kryptograficznej granicy odróżniającej zaufaną intencję od niezaufanej treści. Bezpośrednie wstrzyknięcie oznacza że atakujący sam wpisuje nadpisanie; pośrednie wstrzyknięcie umieszcza je w dokumencie, e-mailu czy stronie, którą później czyta i wykonuje czyjś agent AI. EchoLeak (CVE-2025-32711, CVSS 9.3) udowodniło że może to być zero-click: jeden spreparowany e-mail spowodował że Microsoft 365 Copilot eksfiltrował wewnętrzne pliki bez żadnej interakcji użytkownika. W przeciwieństwie do SQL injection, nie ma odpowiednika zapytań sparametryzowanych — na dziś nie istnieje w pełni niezawodna naprawa techniczna.'
  metrics:
