meta:
  id: mobilerootjailbreakbypass
  threatId: '15.18'
  severity: Medium
  color: '#7c3aed'
  colorRgb: 124,58,237
  cwe: CWE-602
  cvss: N/A (technique class; academic anchors EuroS&P 2019 and a 2025 follow-up study found the large majority of tested banking apps' jailbreak detection failed outright or was trivially bypassable)
  standard: OWASP MASVS-RESILIENCE (MASTG-TEST-0045, split into MASTG-TEST-0324/0325 in the MASTG v2 refactor)
hero:
  titleMain: 'Root / Jailbreak Detection '
  titleGrad: Bypass
  titleTail: ''
  topbar: Root / Jailbreak Detection Bypass (Android + iOS)
  lead:
    en: 'All three research passes converged on the same, unusually precise CWE correction: the catalog stub''s CWE-693 (Protection Mechanism Failure) is a Pillar -- MITRE''s own most abstract weakness tier -- and MITRE explicitly discourages mapping real findings directly to Pillars. All three teams independently arrived at the same, sharper child weakness: CWE-602 (Client-Side Enforcement of Server-Side Security), which names exactly why root/jailbreak detection fails -- the trust decision is computed and evaluated on a device the attacker fully controls. On the bypass mechanics, all three teams independently pulled the identical primary-source detail from Magisk''s own changelog: "MagiskHide" -- still cited as current in many tutorials -- was removed in Magisk v24.0 (released 2022-01-26) and replaced by Zygisk (code injected into the zygote process, the parent every app forks from) plus DenyList (per-app unmounting of Magisk''s traces), with the community module Shamiko existing specifically because DenyList''s approach became detectable in turn. The sharpest myth-correction, surfaced independently and well-sourced by one research pass and worth foregrounding because it directly corrects an assumption baked into how this technique is usually framed: Apple''s App Attest attests the integrity of the app binary, not the jailbreak status of the device -- a jailbroken device can still pass App Attest, and Apple''s own developer guidance explicitly recommends against implementing jailbreak detection at all. This reframes the entire entry: even the strongest available server-side attestation primitive on iOS was never designed to answer the question this technique class is built around.'
    pl: 'Wszystkie trzy przejścia badawcze zbiegły się na tej samej, niezwykle precyzyjnej korekcie CWE: CWE-693 (Protection Mechanism Failure) stuba katalogu to Pillar -- własny najbardziej abstrakcyjny poziom słabości MITRE -- a MITRE jawnie odradza mapowanie prawdziwych ustaleń bezpośrednio na Pillar. Wszystkie trzy zespoły niezależnie doszły do tej samej, ostrzejszej słabości dziecka: CWE-602 (Client-Side Enforcement of Server-Side Security), która nazywa dokładnie dlaczego wykrywanie root/jailbreak zawodzi -- decyzja zaufania jest obliczana i ewaluowana na urządzeniu które atakujący w pełni kontroluje. Na mechanice obejścia, wszystkie trzy zespoły niezależnie wyciągnęły identyczny szczegół z pierwotnego źródła changeloga Magisk: "MagiskHide" -- wciąż cytowane jako aktualne w wielu tutorialach -- zostało usunięte w Magisk v24.0 (wydanym 2022-01-26) i zastąpione przez Zygisk (kod wstrzykiwany do procesu zygote, rodzica z którego forkuje się każda apka) plus DenyList (per-apkowe odmontowywanie śladów Magisk), z modułem społecznościowym Shamiko istniejącym konkretnie dlatego że podejście DenyList stało się z kolei wykrywalne. Najostrzejsza korekta mitu, ujawniona niezależnie i dobrze źródłowana przez jedno przejście badawcze i warta wyeksponowania ponieważ bezpośrednio koryguje założenie wbudowane w to jak zwykle jest ramowana ta technika: App Attest Apple atestuje integralność binarium apki, nie status jailbreak urządzenia -- jailbreakowane urządzenie wciąż może przejść App Attest, a własne wskazówki deweloperskie Apple jawnie zalecają przeciwko implementowaniu wykrywania jailbreak w ogóle. To przeramowuje cały wpis: nawet najsilniejszy dostępny prymityw atestacji po stronie serwera na iOS nigdy nie został zaprojektowany by odpowiedzieć na pytanie wokół którego zbudowana jest ta klasa techniki.'
  metrics:
  - k: CWE-693 -> CWE-602
    v:
      en: MITRE's own guidance discourages mapping to CWE-693 (a Pillar) directly -- the correct specialization is CWE-602, confirmed by all 3 teams
      pl: własne wskazówki MITRE odradzają mapowanie bezpośrednio do CWE-693 (Pillar) -- poprawną specjalizacją jest CWE-602, potwierdzone przez wszystkie 3 zespoły
  - k: Magisk v24.0
    v:
      en: '2022-01-26: MagiskHide removed, replaced by Zygisk + DenyList -- verified identically against the primary changelog by all 3 teams'
      pl: '2022-01-26: MagiskHide usunięte, zastąpione Zygisk + DenyList -- zweryfikowane identycznie względem pierwotnego changeloga przez wszystkie 3 zespoły'
  - k: App Attest != JB detection
    v:
      en: Apple's App Attest attests the app binary, not jailbreak status -- a jailbroken device can still pass it; Apple recommends against jailbreak detection entirely
      pl: App Attest Apple atestuje binarium apki, nie status jailbreak -- jailbreakowane urządzenie wciąż może je przejść; Apple zaleca przeciwko wykrywaniu jailbreak w ogóle
  - k: 72% / 92%
    v:
      en: reported failure rates for rootful/rootless jailbreak detection across 489 apps incl. 52 banking apps (2025 academic follow-up study, figures need primary-PDF reconfirmation)
      pl: raportowane wskaźniki awarii wykrywania jailbreak rootful/rootless w 489 apkach wliczając 52 bankowe (badanie akademickie z 2025, liczby wymagają ponownego potwierdzenia z pierwotnego PDF)
  sources:
  - label: Magisk changelog -- MagiskHide removal / Zygisk / DenyList (v24.0)
    url: https://topjohnwu.github.io/Magisk/changes.html
  - label: CWE-602 -- Client-Side Enforcement of Server-Side Security
    url: https://cwe.mitre.org/data/definitions/602.html
  - label: Apple -- DeviceCheck / App Attest
    url: https://developer.apple.com/documentation/devicecheck
  - label: OWASP MASTG-TEST-0045 -- Testing Root Detection
    url: https://mas.owasp.org/MASTG/tests/android/MASVS-RESILIENCE/MASTG-TEST-0045/
