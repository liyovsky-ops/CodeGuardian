meta:
  id: xmlinjection
  threatId: '1.28'
  severity: Critical
  color: '#65a30d'
  colorRgb: 101,163,13
  cwe: CWE-91
  cvss: '10.0'
  standard: OWASP A03:2021
hero:
  titleMain: 'XML '
  titleGrad: Injection
  titleTail: ''
  topbar: XML Injection (generic markup injection, distinct from XXE)
  lead:
    en: 'Not XXE, and not XPath injection -- both already covered elsewhere in this knowledge base. This is the plain data/structure confusion at the heart of every injection class: an application builds an XML document by string concatenation, and attacker input containing <, ]]>, or <!-- is interpreted as markup rather than text. The same root cause, applied against a signed document, becomes XML Signature Wrapping (XSW) -- a genuinely critical, CVE-heavy class where a validator verifies one element''s signature while business logic silently processes a different, attacker-forged one. CVE-2024-45409 (ruby-saml/GitLab, CVSS 10.0) is the flagship modern incident.'
    pl: 'Nie XXE, i nie wstrzyknięcie XPath -- oba już omówione gdzie indziej w tej bazie wiedzy. To zwykłe pomieszanie danych/struktury leżące u podstaw każdej klasy wstrzyknięcia: aplikacja buduje dokument XML przez konkatenację stringów, a wejście atakującego zawierające <, ]]>, albo <!-- jest interpretowane jako znacznik zamiast tekst. Ta sama przyczyna źródłowa, zastosowana przeciw podpisanemu dokumentowi, staje się XML Signature Wrapping (XSW) -- naprawdę krytyczna, bogata w CVE klasa gdzie walidator weryfikuje podpis jednego elementu podczas gdy logika biznesowa po cichu przetwarza inny, sfałszowany przez atakującego. CVE-2024-45409 (ruby-saml/GitLab, CVSS 10.0) to flagowy współczesny incydent.'
  metrics:
  - k: CWE-91
    v:
      en: Weakness ID (parent of CWE-643/CWE-652)
      pl: ID słabości (rodzic CWE-643/CWE-652)
  - k: '10.0'
    v: CVSS · Critical (XSW ceiling, CVE-2024-45409)
  - k: A03:2021
    v: OWASP Top 10 (structural variants)
  - k: '5'
