  ir:
    title:
      en: Incident response checklist
      pl: Lista kontrolna reagowania
    lead:
      en: If active exploitation of an IPC/deep-link input-validation gap is confirmed, work this list top to bottom.
      pl: Po potwierdzeniu aktywnej eksploatacji luki walidacji wejścia IPC/deep-link, przejdź tę listę od góry.
    steps:
    - en: Identify the exact IPC channel exploited -- Content Provider, Intent, deep link, or Broadcast Receiver -- since detection and remediation differ per channel
      pl: Zidentyfikuj dokładny kanał IPC który został wykorzystany -- Content Provider, Intent, deep link, albo Broadcast Receiver -- ponieważ wykrywanie i naprawa różnią się per kanał
    - en: If a Content Provider SQLi was exploited, assume every table reachable by that provider's underlying database connection was accessible, not just the table the exploit targeted
      pl: Jeśli wykorzystano SQLi Content Provider, załóż że każda tabela osiągalna przez leżące pod spodem połączenie bazy danych tego providera była dostępna, nie tylko tabela którą celował exploit
    - en: If a deep link steered a WebView to attacker content, treat every JavaScript bridge method exposed to that WebView as potentially invoked, and audit for follow-on actions taken through the bridge
      pl: Jeśli deep link skierował WebView do treści atakującego, traktuj każdą metodę mostu JavaScript udostępnioną temu WebView jako potencjalnie wywołaną, i przeaudytuj pod kątem dalszych akcji podjętych przez most
    - en: Grep the app's manifest for every exported=true component and re-verify each one's need to be exported, not just the one exploited
      pl: Przeszukaj manifest apki pod kątem każdego komponentu exported=true i ponownie zweryfikuj potrzebę eksportu każdego z nich, nie tylko wykorzystanego
    - en: Ship a fix that parameterizes the affected query AND audits every other Content Provider/query in the app for the same string-concatenation anti-pattern
      pl: Wydaj naprawę która parametryzuje dotknięte zapytanie ORAZ audytuje każdy inny Content Provider/zapytanie w apce pod kątem tego samego antywzorca konkatenacji stringów
    - en: Notify per applicable data-breach obligations if on-device data was confirmed exfiltrated by a co-installed malicious app
      pl: Powiadom zgodnie z obowiązującymi wymogami dot. naruszenia danych jeśli potwierdzono eksfiltrację danych na urządzeniu przez współzainstalowaną złośliwą apkę
