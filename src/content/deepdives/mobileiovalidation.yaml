meta:
  id: mobileiovalidation
  threatId: '15.4'
  severity: Critical
  color: '#155e75'
  colorRgb: 21,94,117
  cwe: CWE-20
  cvss: '8.8'
  standard: OWASP Mobile Top 10 2024 (M4)
hero:
  titleMain: 'Insufficient Input/Output '
  titleGrad: Validation
  titleTail: ''
  topbar: Insufficient Input/Output Validation (OWASP Mobile Top 10 2024, M4)
  lead:
    en: 'An honest scoping note all three independent research passes converged on and insisted be stated plainly: OWASP''s own official M4 page is framed generically around SQL injection, command injection, XSS, and path traversal -- the same families this knowledge base already covers extensively in its Injection category -- and does NOT itself foreground Inter-Process Communication (IPC), Intents, Content Providers, or deep links by name. This deep-dive deliberately narrows M4 to the genuinely mobile-specific slice of that broader category: untrusted data crossing an IPC boundary that ANY other app on the device (or a malicious webpage, or a QR code) can reach -- an Android Intent, an exported Content Provider, a custom URL scheme -- which is exactly as untrusted as network input but routinely validated with far less rigor because it "looks internal." This is a curatorial scoping choice made to avoid duplicating existing content, stated explicitly rather than presented as OWASP''s literal
      wording.'
    pl: 'Uczciwa notatka o zakresie do której zbiegły się wszystkie trzy niezależne przejścia badawcze i nalegały by jasno stwierdzić: własna oficjalna strona M4 OWASP jest ramowana generycznie wokół wstrzyknięcia SQL, wstrzyknięcia komend, XSS, i przejścia przez ścieżki -- te same rodziny które ta baza wiedzy już obszernie pokrywa w swojej kategorii Injection -- i sama NIE wysuwa na pierwszy plan Inter-Process Communication (IPC), Intentów, Content Providerów, ani deep linków po nazwie. Ten deep-dive celowo zawęża M4 do naprawdę specyficznego dla mobile wycinka tej szerszej kategorii: nieufnych danych przekraczających granicę IPC do której DOWOLNA inna apka na urządzeniu (albo złośliwa strona web, albo kod QR) może dosięgnąć -- Intent Android, wyeksportowany Content Provider, niestandardowy schemat URL -- co jest dokładnie tak nieufne jak wejście sieciowe ale rutynowo walidowane ze znacznie mniejszą rygorystycznością bo wygląda wewnętrznie. To celowy wybór zakresu dokonany by uniknąć duplikacji
      istniejącej treści, jawnie stwierdzony zamiast przedstawiony jako dosłowne brzmienie OWASP.'
  metrics:
  - k: CWE-20
    v:
      en: Weakness ID (+ CWE-89)
      pl: ID słabości (+ CWE-89)
  - k: '8.8'
    v: CVSS · High (CVE-2022-28799, TikTok deeplink->WebView)
  - k: Curated scope
    v:
      en: IPC/deep-link angle, not OWASP's literal M4 text
