meta:
  id: svginjection
  threatId: cat_1_research14
  severity: High
  color: '#db2777'
  colorRgb: 219,39,119
  cwe: CWE-79
  cvss: '6.4'
  standard: OWASP A03:2021
hero:
  titleMain: 'SVG '
  titleGrad: Injection
  titleTail: ''
  topbar: SVG Injection (SVG as an XSS delivery vector)
  lead:
    en: 'SVG is not a picture -- it''s a live XML document, and browsers treat it that way. The single most-misunderstood fact in this class: an <img src="evil.svg"> is genuinely safe (the spec mandates a script-free "secure static mode" for that context), but the exact same file served inline, through <object>/<embed>/<iframe>, or opened by direct navigation runs its embedded script in the serving origin''s session -- full stored XSS. File-upload features that accept SVG avatars, logos, and attachments have produced a steady stream of real CVEs across WordPress plugins, bug trackers, and SaaS platforms, right through this year.'
    pl: 'SVG to nie obrazek -- to żywy dokument XML, i przeglądarki tak go traktują. Najbardziej błędnie rozumiany fakt w tej klasie: <img src="evil.svg"> jest naprawdę bezpieczny (specyfikacja wymusza wolny-od-skryptów "bezpieczny tryb statyczny" dla tego kontekstu), ale dokładnie ten sam plik podany inline, przez <object>/<embed>/<iframe>, albo otwarty przez bezpośrednią nawigację uruchamia osadzony skrypt w sesji domeny serwującej -- pełne stored XSS. Funkcje uploadu akceptujące awatary, logo, i załączniki SVG produkowały stały strumień realnych CVE w pluginach WordPress, trackerach błędów, i platformach SaaS, jeszcze w tym roku.'
  metrics:
  - k: CWE-79
    v:
      en: Weakness ID (co-mapped with CWE-434)
      pl: ID słabości (współ-mapowane z CWE-434)
  - k: '6.4'
    v: CVSS · Medium-High (representative real CVE)
  - k: A03:2021
    v: OWASP Top 10
  - k: '6'
    v:
      en: Attack variants
      pl: Warianty ataku
  sources:
  - label: SVG 2 — Security Considerations
    url: https://www.w3.org/TR/SVG/security.html
  - label: PortSwigger — File upload vulnerabilities
    url: https://portswigger.net/web-security/file-upload
  - label: NVD — CVE-2024-10222 (WordPress SVG Support)
    url: https://nvd.nist.gov/vuln/detail/CVE-2024-10222
  - label: W3C Wiki — SVG Security
    url: https://www.w3.org/wiki/SVG_Security
