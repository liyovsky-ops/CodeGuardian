meta:
  id: mobilecrypto
  threatId: '15.10'
  severity: High
  color: '#0e2a47'
  colorRgb: 14,42,71
  cwe: CWE-327
  cvss: N/A (crypto-misuse class spanning many mechanisms; flagship CVE-2020-11500 scored 7.5 High)
  standard: OWASP Mobile Top 10 2024 (M10)
hero:
  titleMain: 'Insufficient '
  titleGrad: Cryptography
  titleTail: ''
  topbar: Insufficient Cryptography (OWASP Mobile Top 10 2024, M10)
  lead:
    en: 'Another clean lineage case, confirmed identically by all three research passes: M10 carries the exact title of 2016''s M5 "Insufficient Cryptography," itself descended from 2014''s M6 "Broken Cryptography" -- the same pattern already established for M9/Insecure Data Storage. The single most important finding, independently caught by all three teams and directly verified by one against MobSF''s own scanner source code: on Java/Android, calling Cipher.getInstance("AES") with no mode specified silently defaults to AES/ECB/PKCS5Padding. A developer who believes they "used AES" can still ship broken cryptography without ever choosing ECB explicitly. This entry is distinct from M9 (Insecure Data Storage, about WHETHER data is protected at all) and M5 (Insecure Communication, transport-layer) -- M10 is specifically about the cryptography itself being weak, broken, or misused, even when the developer genuinely did try to encrypt something.'
    pl: 'Kolejny czysty przypadek rodowodu, potwierdzony identycznie przez wszystkie trzy przejścia badawcze: M10 niesie dokładny tytuł M5 z 2016 "Insufficient Cryptography", samo pochodzące od M6 z 2014 "Broken Cryptography" -- ten sam wzorzec już ustalony dla M9/Insecure Data Storage. Pojedyncze najważniejsze ustalenie, niezależnie wychwycone przez wszystkie trzy zespoły i bezpośrednio zweryfikowane przez jeden względem własnego kodu źródłowego skanera MobSF: na Java/Android wywołanie Cipher.getInstance("AES") bez podanego trybu po cichu domyślnie ustawia AES/ECB/PKCS5Padding. Deweloper który wierzy że "użył AES" wciąż może wysłać złamaną kryptografię nigdy jawnie nie wybierając ECB. Ten wpis jest odrębny od M9 (Insecure Data Storage, o TYM CZY dane są w ogóle chronione) i M5 (Insecure Communication, warstwa transportowa) -- M10 dotyczy konkretnie samej kryptografii będącej słabą, złamaną, albo niewłaściwie użytą, nawet gdy deweloper naprawdę próbował coś zaszyfrować.'
  metrics:
  - k: 88%
    v:
      en: of 11,748 audited apps made a crypto mistake (Egele et al., CCS 2013)
      pl: z 11748 audytowanych apek popełniło błąd kryptograficzny (Egele i in., CCS 2013)
  - k: CVE-2020-11500
    v:
      en: 'Zoom: single AES-128-ECB key shared by all meeting participants'
      pl: 'Zoom: pojedynczy klucz AES-128-ECB dzielony przez wszystkich uczestników spotkania'
  - k: ~55 BTC
    v:
      en: stolen via the 2013 Android SecureRandom / ECDSA nonce-reuse flaw
      pl: skradzione przez wadę SecureRandom Android / ponownego użycia nonce ECDSA z 2013
  - k: No CWE
    v:
      en: OWASP's own M10 page cites none
      pl: Własna strona M10 OWASP nie cytuje żadnego
  sources:
  - label: OWASP Mobile Top 10 2024 — M10
    url: https://owasp.org/www-project-mobile-top-10/2023-risks/m10-insufficient-cryptography
  - label: OWASP Mobile Top 10 2016 — M5 (direct predecessor)
    url: https://owasp.org/www-project-mobile-top-10/2016-risks/m5-insufficient-cryptography
