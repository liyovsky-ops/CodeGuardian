      url: https://bitcoin.org/en/alert/2013-08-11-android
  tools:
    title:
      en: Detection tooling
      pl: Narzędzia wykrywania
    lead:
      en: All three research passes converged on the same core toolchain -- and one team directly verified a real, currently-shipping detection rule, confirming this deep-dive's own central ECB-default finding against production scanner code.
      pl: Wszystkie trzy przejścia badawcze zbiegły się na tym samym podstawowym łańcuchu narzędzi -- i jeden zespół bezpośrednio zweryfikował prawdziwą, aktualnie działającą regułę wykrywania, potwierdzając własne centralne ustalenie domyślnego ECB tego deep-dive względem kodu skanera produkcyjnego.
    sast:
    - - MobSF / mobsfscan
      - 'Verified directly against its actual source (rule aes_ecb.yaml): matches both explicit AES/ECB/... and bare Cipher.getInstance("AES") -- catching the exact silent-default footgun this deep-dive centers on -- tagged internally with CWE-327 and MASVS crypto-2. Also flags MD5/SHA-1 usage, weak PRNG, and hardcoded keys'
    - - QARK (Quick Android Review Kit)
      - Static scanner flagging weak crypto patterns and insecure API usage during APK/source review
    dast:
    - - Frida
      - Runtime hooks on Cipher.getInstance/doFinal, SecretKeySpec, IvParameterSpec, SecureRandom, and MessageDigest.getInstance observe the actual algorithm/mode/key/IV values in use at runtime -- catches obfuscated or dynamically-built transformation strings that static analysis alone misses
    - - OWASP MASTG crypto test procedures
      - Manual/tooling test procedures enumerating every javax.crypto.*/java.security.*/android.security.* call and checking algorithm, mode, key source, and randomness source against the MASVS-CRYPTO control group
    note:
      en: <strong>Key signal:</strong> a bare algorithm name like "AES" in a static scan result is not an incomplete finding -- it IS the finding, since the platform default it silently resolves to is exactly the broken mode this category's flagship real incident was built on.
      pl: <strong>Kluczowy sygnał:</strong> sama nazwa algorytmu jak "AES" w wyniku skanu statycznego to nie niekompletne ustalenie -- to JEST ustalenie, ponieważ domyślne ustawienie platformy do którego się po cichu rozwiązuje to dokładnie złamany tryb na którym zbudowany był flagowy prawdziwy incydent tej kategorii.
  compliance:
    title:
      en: Compliance quick-reference
      pl: Szybka zgodność
    lead:
      en: 'All three research passes converged on the same honest finding: OWASP''s own M10 page cites no CWE at all, so the mapping here is community best-fit -- but this deep-dive''s primary mapping (CWE-327) is unusually well-corroborated, since real production tooling (MobSF''s own scanner) independently tags its findings with that exact CWE.'
      pl: 'Wszystkie trzy przejścia badawcze zbiegły się na tym samym uczciwym ustaleniu: własna strona M10 OWASP nie cytuje żadnego CWE, więc mapowanie tutaj jest najlepszym dopasowaniem społeczności -- ale główne mapowanie tego deep-dive (CWE-327) jest niezwykle dobrze poparte, ponieważ prawdziwe narzędzie produkcyjne (własny skaner MobSF) niezależnie oznacza swoje ustalenia dokładnie tym CWE.'
    items:
    - std: CWE (MITRE) — community best-fit, not OWASP-cited
      items:
      - CWE-327 — Use of a Broken or Risky Cryptographic Algorithm (primary). Best overall fit and the CWE real tooling (MobSF's mobsfscan) actually tags its ECB-detection rule with -- unusually strong tooling corroboration for a community-inferred mapping.
      - CWE-326 — Inadequate Encryption Strength (secondary, for insufficient key length). CWE-330 — Use of Insufficiently Random Values (secondary, for the weak-PRNG sub-case, directly matching this deep-dive's flagship Bitcoin incident). CWE-321 — Use of Hard-coded Cryptographic Key (secondary, for the hardcoded-key sub-case). CWE-1240 — Use of a Cryptographic Primitive with a Risky Implementation (secondary, for homegrown/custom crypto).
    - std: OWASP
      items:
      - 'Mobile Top 10 2024 — M10: Insufficient Cryptography. Verified directly: Exploitability AVERAGE, Prevalence COMMON, Detectability AVERAGE, Technical Impact SEVERE, Business Impact SEVERE. Carries the identical title of 2016''s M5 "Insufficient Cryptography," itself descended from 2014''s M6 "Broken Cryptography" -- notably, 2016 rated Exploitability EASY where 2024 downgraded it to AVERAGE, an editorial change rather than evidence the underlying risk changed.'
      - OWASP MASVS-CRYPTO-1 (current strong cryptography, used per industry best practice) and MASVS-CRYPTO-2 (key management across the full lifecycle) are the two controls this category maps to directly. Confirmed MASTG test IDs include the classic MASTG-TEST-0013 through -0016 (symmetric crypto, algorithm config, key purposes, random number generation) alongside newer atomic tests (-0204 insecure random API, -0212 hardcoded keys, -0221 broken algorithms, -0232 broken modes) -- all three research passes flagged that MASTG is actively migrating to a new MASWE weakness-enumeration scheme (announced July 2024), so verify current IDs before citing one in an audit.
      - 'NIST SP 800-131A sets concrete, dated thresholds worth citing directly rather than vaguely: SHA-1 deprecated for signatures through 2030 then disallowed; two-key 3DES encryption disallowed since 2015; three-key 3DES key-wrapping disallowed since 2023. PCI-DSS v4.0 Requirement 3 (stored account data) and Requirement 4 (data in transit) both mandate "strong cryptography" per these same industry standards for any payment-handling app.'
    inlineSources:
    - label: OWASP Mobile Top 10 2024 — M10
      url: https://owasp.org/www-project-mobile-top-10/2023-risks/m10-insufficient-cryptography
    - label: OWASP MASVS-CRYPTO
      url: https://mas.owasp.org/MASVS/06-MASVS-CRYPTO/
    - label: CWE-327 (MITRE)
      url: https://cwe.mitre.org/data/definitions/327.html
  ir:
    title:
      en: Incident response checklist
      pl: Lista kontrolna reagowania
    lead:
      en: If weak, broken, or misused cryptography is confirmed in a shipped app, work this list top to bottom.
      pl: Po potwierdzeniu słabej, złamanej, albo niewłaściwie użytej kryptografii w wysłanej apce, przejdź tę listę od góry.
    steps:
    - en: Identify the exact mechanism (algorithm, mode, key source, randomness source) rather than assuming from the algorithm name alone -- matching this deep-dive's own methodology, since "uses AES" says almost nothing on its own
      pl: Zidentyfikuj dokładny mechanizm (algorytm, tryb, źródło klucza, źródło losowości) zamiast zakładać z samej nazwy algorytmu -- zgodnie z własną metodyką tego deep-dive, ponieważ "używa AES" mówi prawie nic samo w sobie
    - en: Determine whether the flaw is per-install (hardcoded key/predictable value, affecting all users identically) or per-session (weak randomness affecting individual sessions) -- this changes the blast radius and urgency
      pl: Ustal czy wada jest per-instalacja (zakodowany klucz/przewidywalna wartość, dotykająca wszystkich użytkowników identycznie) czy per-sesja (słaba losowość dotykająca poszczególnych sesji) -- to zmienia promień rażenia i pilność
    - en: If a hardcoded or shared key is confirmed, treat every historical ciphertext protected by it as potentially compromised, not just future traffic -- rotating the key going forward does not retroactively protect already-captured data
      pl: Jeśli zakodowany albo dzielony klucz jest potwierdzony, traktuj każdy historyczny szyfrogram chroniony przez niego jako potencjalnie skompromitowany, nie tylko przyszły ruch -- rotacja klucza na przyszłość nie chroni retroaktywnie już przechwyconych danych
    - en: 'Ship the fix matching this deep-dive''s top-ranked defenses: move to a vetted library call with an explicit authenticated mode (AES-GCM), move key generation/storage into Keystore/Keychain, and replace any non-CSPRNG randomness source'
      pl: 'Wydaj naprawę pasującą do głównych obron tego deep-dive: przejdź na wywołanie sprawdzonej biblioteki z jawnym uwierzytelnionym trybem (AES-GCM), przenieś generowanie/przechowywanie klucza do Keystore/Keychain, i zastąp dowolne źródło losowości nie będące CSPRNG'
    - en: Re-scan with the same static (MobSF/mobsfscan) and dynamic (Frida) tooling used to find the original flaw to confirm the fix actually changed the resolved algorithm/mode, not just the visible source string
      pl: Przeskanuj ponownie tymi samymi narzędziami statycznymi (MobSF/mobsfscan) i dynamicznymi (Frida) użytymi do znalezienia oryginalnej wady by potwierdzić że naprawa faktycznie zmieniła rozwiązany algorytm/tryb, nie tylko widoczny string źródłowy
