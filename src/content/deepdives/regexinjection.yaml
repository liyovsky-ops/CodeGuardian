  tools:
    title:
      en: Detection tooling
      pl: Narzędzia wykrywania
    lead:
      en: Static ReDoS detection is a genuinely different discipline from generic SAST -- purpose-built regex-complexity analyzers exist and materially outperform generic taint-tracking rules for this specific class.
      pl: Statyczne wykrywanie ReDoS to naprawdę inna dyscyplina niż generyczny SAST -- istnieją dedykowane analizatory złożoności regex które materialnie przewyższają generyczne reguły śledzenia skażenia dla tej konkretnej klasy.
    sast:
    - - regexploit (Doyensec)
      - Extracts regexes from a codebase and generates a concrete, working malicious input for each vulnerable one -- skips manual fuzzing entirely
    - - recheck / redos-detector
      - Static + fuzzing hybrid analyzers; rated strongest in independent comparisons among open-source ReDoS tools
    - - eslint-plugin-security (detect-unsafe-regex) / safe-regex
      - Lightweight heuristic (star-height) checks, good as a fast CI gate but with real false negatives/positives
    - - CodeQL (js/redos, py/redos, java/regex-injection)
      - Google's/GitHub's SAST engine has dedicated queries for both ReDoS and the pattern-construction injection variant
    dast:
    - - Timing-based fuzzing (custom or Burp/ffuf)
      - Send inputs of increasing length built as <repeat><breaking-char> and measure response latency for superlinear growth
    - - SlowFuzz
      - Academic fuzzer purpose-built for discovering algorithmic-complexity (including ReDoS) vulnerabilities
    - - regex101 / debuggex
      - Interactive regex debuggers that visualize the backtracking steps and flag catastrophic patterns during development
    note:
      en: <strong>Key signal:</strong> because ReDoS detection is provably undecidable in the general case, no single tool catches everything -- combine a purpose-built static analyzer (regexploit/recheck) in CI with dependency scanning (Snyk/Dependabot), since most real-world ReDoS ships via a transitive dependency, not first-party code.
      pl: <strong>Kluczowy sygnał:</strong> ponieważ wykrywanie ReDoS jest dowodliwie nierozstrzygalne w ogólnym przypadku, żadne pojedyncze narzędzie nie łapie wszystkiego -- połącz dedykowany analizator statyczny (regexploit/recheck) w CI ze skanowaniem zależności (Snyk/Dependabot), ponieważ większość realnego ReDoS trafia przez tranzytywną zależność, nie kod własny.
  compliance:
    title:
      en: Compliance quick-reference
      pl: Szybka zgodność
    lead:
      en: 'The most important compliance finding here, verified independently by all three research passes and confirmed directly against OWASP''s own official CWE-to-category mapping data: CWE-1333 (ReDoS) has no home in the OWASP Top 10:2021 at all -- not A03 Injection, not any other category. Do not blanket-tag this class as A03.'
      pl: 'Najważniejsze ustalenie zgodności tutaj, zweryfikowane niezależnie przez wszystkie trzy przejścia badawcze i potwierdzone bezpośrednio względem oficjalnych danych mapowania CWE-na-kategorię OWASP: CWE-1333 (ReDoS) nie ma żadnego miejsca w OWASP Top 10:2021 -- ani A03 Injection, ani żadnej innej kategorii. Nie tagguj tej klasy hurtowo jako A03.'
    items:
    - std: CWE (MITRE)
      items:
      - CWE-1333 — Inefficient Regular Expression Complexity (primary, for ReDoS). ChildOf CWE-407 Inefficient Algorithmic Complexity; related attack pattern CAPEC-492 Regular Expression Exponential Blowup. Verified directly against cwe.mitre.org by all three research passes.
      - 'Regex-injection-proper has no single dedicated CWE. Closest, all confirmed to exist at MITRE: CWE-625 (Permissive Regular Expression), CWE-777 (Regular Expression without Anchors), CWE-185 (Incorrect Regular Expression). CodeQL''s own "Regular expression injection" query tags it CWE-730 + CWE-400 instead.'
      - 'CWE-624 — Executable Regular Expression Error (historical: PHP preg_replace() /e modifier, removed in PHP 7.0).'
    - std: OWASP
      items:
      - 'CWE-1333 is confirmed ABSENT from the official A03:2021-Injection mapped-CWE list -- one research pass fetched OWASP''s own CWE-Guidance.md mapping data directly and enumerated all 33 CWEs mapped to A03: CWE-1333 is not among them, nor is it mapped to any other 2021 category (2021 has no dedicated DoS/resource-consumption slot).'
      - Regex-injection-proper is conceptually an injection issue (untrusted data becomes part of an interpreted mini-language) and is reasonably associated with A03:2021 by analogy, but none of its closest CWEs (625/777/185) are on A03's official mapped list either -- so even this association is interpretive, not an official MITRE mapping.
      - OWASP's 2004 Top 10 had an explicit "A9 Denial of Service" category (the lineage of CWE-730) that was dropped in later editions -- ReDoS had a home once, and lost it, rather than never having had one.
    inlineSources:
    - label: CWE-1333 (MITRE)
      url: https://cwe.mitre.org/data/definitions/1333.html
    - label: CWE-625 — Permissive Regular Expression (MITRE)
      url: https://cwe.mitre.org/data/definitions/625.html
    - label: OWASP A03:2021 Injection
      url: https://owasp.org/Top10/2021/A03_2021-Injection/
  ir:
    title:
      en: Incident response checklist
      pl: Lista kontrolna reagowania
    lead:
      en: If an active ReDoS or regex-injection exploitation is suspected, work this list top to bottom.
      pl: Po podejrzeniu aktywnej eksploatacji ReDoS lub wstrzyknięcia regex, przejdź tę listę od góry.
    steps:
    - en: Identify the specific regex and endpoint causing CPU exhaustion (thread dumps / flame graphs pointing at a regex-match frame are the fastest signal)
      pl: Zidentyfikuj konkretny regex i endpoint powodujący wyczerpanie CPU (zrzuty wątków / flame graphs wskazujące na klatkę dopasowania regex to najszybszy sygnał)
    - en: Kill or rate-limit the offending requests/IPs immediately to restore availability, then roll back or disable the specific rule/pattern if it was a recent deploy (as both real incidents in this deep-dive were)
      pl: Natychmiast zabij lub ogranicz częstotliwość szkodliwych żądań/IP by przywrócić dostępność, potem wycofaj lub wyłącz konkretną regułę/wzorzec jeśli był świeżym wdrożeniem (jak oba prawdziwe incydenty w tym deep-dive)
    - en: If the endpoint doubles as a health check or load-balancer probe, verify the health check itself did not cascade the outage across the fleet
      pl: Jeśli endpoint pełni też funkcję health check albo sondy load balancera, zweryfikuj czy sam health check nie rozprzestrzenił awarii na całą flotę
    - en: Grep the codebase and its dependency tree for the same ambiguous-pattern shape (nested quantifiers, overlapping alternation), not just the one exploited endpoint
      pl: Przeszukaj bazę kodu i drzewo zależności pod kątem tego samego niejednoznacznego kształtu wzorca (zagnieżdżone kwantyfikatory, nakładająca się alternacja), nie tylko jednego wykorzystanego endpointu
    - en: If regex-injection-proper was the entry point, audit every place user input is concatenated into a pattern rather than escaped
      pl: Jeśli punktem wejścia było regex-injection-proper, przeaudytuj każde miejsce gdzie wejście użytkownika jest sklejane do wzorca zamiast escapowane
    - en: Add a length cap and/or migrate the pattern to a non-backtracking engine before considering the incident closed
      pl: Dodaj limit długości i/lub przenieś wzorzec na silnik bez nawrotów zanim uznasz incydent za zamknięty
