hero:
  titleMain: 'Regex Injection '
  titleGrad: / ReDoS
  titleTail: ''
  topbar: Regex Injection & ReDoS (Regular Expression Denial of Service)
  lead:
    en: 'Two distinct mechanisms share this catalog entry, and all three independent research passes insisted on keeping them separate: <strong>regex-injection-proper</strong>, where an attacker controls part of the *pattern* itself (string-concatenated into a RegExp/Pattern.compile call, changing match semantics for a filter/allowlist bypass), and <strong>ReDoS</strong>, the far more common real-world case, where an attacker controls the *input* matched against an already-ambiguous pattern, forcing a backtracking engine through exponential or polynomial work. The research brief for this topic itself contained an error that all three teams caught and corrected: "the 2016 Cloudflare/Stack Exchange ReDoS outage" is not one incident -- Stack Exchange (2016, quadratic) and Cloudflare (2019, PCRE catastrophic backtracking) are two separate, unrelated events.'
    pl: 'Dwa odrębne mechanizmy dzielą ten wpis katalogowy, i wszystkie trzy niezależne przejścia badawcze nalegały na ich rozdzielenie: <strong>regex-injection-proper</strong>, gdzie atakujący kontroluje część *wzorca* (sklejonego do wywołania RegExp/Pattern.compile, zmieniając semantykę dopasowania dla obejścia filtra/allowlisty), oraz <strong>ReDoS</strong>, znacznie częstszy w praktyce przypadek, gdzie atakujący kontroluje *wejście* dopasowywane do już niejednoznacznego wzorca, zmuszając silnik z nawrotami do wykładniczej albo wielomianowej pracy. Sam brief badawczy dla tego tematu zawierał błąd który wszystkie trzy zespoły wychwyciły i poprawiły: "incydent ReDoS Cloudflare/Stack Exchange z 2016" to nie jedno zdarzenie -- Stack Exchange (2016, wielomianowe) i Cloudflare (2019, katastrofalne nawroty PCRE) to dwa osobne, niepowiązane wydarzenia.'
