  tools:
    title:
      en: Detection tooling
      pl: Narzędzia wykrywania
    lead:
      en: This is fundamentally a DAST/manual-testing discipline for the dominant variant -- the vulnerability lives in what a server-side renderer fetches at runtime, which static analysis of application code alone cannot see.
      pl: To fundamentalnie dyscyplina DAST/testów manualnych dla dominującego wariantu -- podatność żyje w tym co renderer server-side pobiera w czasie wykonania, czego sama analiza statyczna kodu aplikacji nie może zobaczyć.
    sast:
    - - SCA / dependency scanning (Snyk, Dependabot)
      - Flags known-vulnerable or abandoned PDF libraries (wkhtmltopdf, outdated DomPDF/TCPDF) by version -- the practical static check given the dynamic nature of the core vulnerability
    - - Manual config review
      - Auditing for isRemoteEnabled=true (DomPDF), missing --disable-local-file-access (wkhtmltopdf), or missing request-interception allowlists (Puppeteer) is effectively the static-analysis equivalent here
    dast:
    - - Burp Suite + Collaborator (or interactsh)
      - The primary confirmation tool for the dominant SSRF/LFI variant -- plant an out-of-band canary in the injectable field and watch for a server-side callback
    - - exiftool / pdfinfo
      - Fingerprints the /Producer and /Creator metadata of a generated PDF to identify the renderer and choose the right payload family
    - - pdfid.py / pdf-parser.py (Didier Stevens) / peepdf
      - Inspect a target/generated PDF's object structure for /OpenAction, /AA, /JavaScript, /Launch -- the relevant tools for confirming the PDF-object-injection variant
    note:
      en: <strong>Key signal:</strong> checking the generated PDF's own /Producer metadata is often the fastest way to identify the exact library and jump straight to its known CVE-specific payloads (font-cache RCE for DomPDF, phar deserialization for TCPDF, iframe SSRF for wkhtmltopdf) rather than testing blind.
      pl: <strong>Kluczowy sygnał:</strong> sprawdzenie własnych metadanych /Producer wygenerowanego PDF jest często najszybszym sposobem zidentyfikowania dokładnej biblioteki i przejścia wprost do jej znanych ładunków specyficznych dla CVE (RCE przez font-cache dla DomPDF, deserializacja phar dla TCPDF, SSRF przez iframe dla wkhtmltopdf) zamiast testowania na ślepo.
  compliance:
    title:
      en: Compliance quick-reference
      pl: Szybka zgodność
    lead:
      en: 'The most important compliance finding here, confirmed independently by all three research passes: the dominant real-world variant of "PDF injection" is officially an SSRF issue (CWE-918, OWASP A10:2021), not an Injection-category (A03) finding -- exactly the kind of instinct-defying mapping this knowledge base insists on stating plainly rather than defaulting to A03 because the threat''s name contains the word "injection."'
      pl: 'Najważniejsze ustalenie zgodności tutaj, potwierdzone niezależnie przez wszystkie trzy przejścia badawcze: dominujący wariant "wstrzyknięcia PDF" z praktyki jest oficjalnie problemem SSRF (CWE-918, OWASP A10:2021), nie znaleziskiem kategorii Injection (A03) -- dokładnie ten rodzaj mapowania przeczącego instynktowi który ta baza wiedzy nalega jasno stwierdzać zamiast domyślnie przyjmować A03 bo nazwa zagrożenia zawiera słowo "wstrzyknięcie".'
    items:
    - std: CWE (MITRE)
      items:
      - CWE-918 — Server-Side Request Forgery (primary, for the dominant HTML-to-PDF variant). Verified directly assigned to CVE-2022-35583 on its GitHub Security Advisory.
      - CWE-94 — Improper Control of Generation of Code (Code Injection) — applies to the DomPDF/TCPDF RCE escalations and, per PortSwigger's own framing, the PDF object/structure injection variant (though all three research passes noted no single MITRE entry cleanly covers the latter -- a genuine judgment call, not a settled fact).
      - CWE-502 — Deserialization of Untrusted Data — applies specifically to the phar:// deserialization chains in DomPDF and TCPDF.
      - CWE-79 — Improper Neutralization of Input During Web Page Generation (XSS) — applies to the PDF.js viewer variant, with a root-cause type-confusion classification (CWE-843) alongside it.
      - CWE-1236 (Improper Neutralization of Formula Elements, i.e. CSV/spreadsheet formula injection) is explicitly NOT applicable here — confirmed by two of three research passes as a sibling threat belonging to CSV export, not PDF generation. Do not conflate the two.
    - std: OWASP
      items:
      - A10:2021 — Server-Side Request Forgery (SSRF), for the dominant variant. This is the category the CWE-918 mapping requires, not A03.
      - A03:2021 — Injection, for the code/structure-injection sub-variants specifically (RCE escalations, PDF object injection, PDF.js viewer XSS) — a genuine multi-mapping across this single catalog entry, similar in spirit to this knowledge base's SVG Injection deep-dive.
      - 'A06:2021 — Vulnerable and Outdated Components, worth flagging separately: simply choosing to depend on wkhtmltopdf at all is itself an A06 finding, independent of any specific injection payload, given its unfixable critical CVE and archived status.'
    inlineSources:
    - label: CVE-2022-35583 (GitHub Advisory)
      url: https://github.com/advisories/GHSA-v2fj-q75c-65mr
    - label: OWASP A10:2021 SSRF
      url: https://owasp.org/Top10/2021/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
    - label: OWASP A03:2021 Injection
      url: https://owasp.org/Top10/2021/A03_2021-Injection/
  ir:
    title:
      en: Incident response checklist
      pl: Lista kontrolna reagowania
    lead:
      en: If active PDF-injection exploitation is confirmed, work this list top to bottom.
      pl: Po potwierdzeniu aktywnej eksploatacji wstrzyknięcia PDF, przejdź tę listę od góry.
    steps:
    - en: Identify which variant was exploited -- HTML-to-PDF SSRF/LFI, a library-specific RCE chain, PDF object injection, or a PDF-viewer bug -- since remediation differs completely per variant
      pl: Zidentyfikuj który wariant został wykorzystany -- SSRF/LFI HTML-to-PDF, łańcuch RCE specyficzny dla biblioteki, wstrzyknięcie obiektu PDF, albo błąd przeglądarki PDF -- ponieważ naprawa całkowicie różni się per wariant
    - en: If SSRF/LFI, audit what internal services or cloud metadata the PDF-generation process could reach, and rotate any credentials that may have been exposed via 169.254.169.254
      pl: Jeśli SSRF/LFI, przeaudytuj jakie usługi wewnętrzne albo metadane chmury proces generowania PDF mógł osiągnąć, i zrotuj wszelkie poświadczenia które mogły zostać ujawnione przez 169.254.169.254
    - en: If an RCE chain (DomPDF font-cache, phar deserialization) was reached, treat the PDF-generation process as fully compromised and rebuild it rather than attempting in-place cleanup
      pl: Jeśli osiągnięto łańcuch RCE (font-cache DomPDF, deserializacja phar), traktuj proces generowania PDF jako w pełni skompromitowany i przebuduj go zamiast próbować sprzątania w miejscu
    - en: Check whether the affected library is wkhtmltopdf -- if so, plan migration rather than waiting for a patch that will never come
      pl: Sprawdź czy dotknięta biblioteka to wkhtmltopdf -- jeśli tak, zaplanuj migrację zamiast czekać na łatkę która nigdy nie nadejdzie
    - en: Grep the codebase for every PDF-export/report-generation feature, not just the exploited one, and confirm each has HTML/CSS sanitization plus network-isolated generation
      pl: Przeszukaj bazę kodu pod kątem każdej funkcji eksportu PDF/generowania raportu, nie tylko wykorzystanej, i potwierdź że każda ma sanityzację HTML/CSS oraz izolowane sieciowo generowanie
    - en: Notify per applicable data-breach obligations if internal data or cloud credentials were confirmed exfiltrated
      pl: Powiadom zgodnie z obowiązującymi wymogami dot. naruszenia danych jeśli potwierdzono eksfiltrację danych wewnętrznych lub poświadczeń chmury
