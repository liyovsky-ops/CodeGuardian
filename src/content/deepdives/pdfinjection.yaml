meta:
  id: pdfinjection
  threatId: cat_1_research28
  severity: Critical
  color: '#701a75'
  colorRgb: 112,26,117
  cwe: CWE-918
  cvss: '9.8'
  standard: OWASP A10:2021
hero:
  titleMain: 'PDF '
  titleGrad: Injection
  titleTail: ''
  topbar: PDF Injection (HTML-to-PDF SSRF/LFI, PDF Object Injection, PDF.js XSS)
  lead:
    en: '"PDF injection" is not one vulnerability -- it''s an umbrella over three genuinely distinct mechanisms that all three independent research passes insisted on separating rather than merging. By far the dominant real-world case, confirmed against the strongest incident record: an app renders untrusted HTML/CSS through a server-side PDF generator (wkhtmltopdf, DomPDF, TCPDF, Puppeteer/headless Chrome) that is really a full resource-fetching browser engine running with the SERVER''s network position and filesystem access -- turning an injected &lt;iframe&gt; or &lt;img&gt; into Server-Side Request Forgery or local file disclosure. The other two variants -- injecting raw PDF object syntax to smuggle a JavaScript action into the file itself, and exploiting a PDF viewer''s own parsing bugs -- are real, documented by name-brand research (Gareth Heyes/PortSwigger, Black Hat EU 2020) and a landmark PDF.js CVE, but have a far thinner incident record.'
    pl: '"Wstrzyknięcie PDF" to nie jedna podatność -- to parasol nad trzema naprawdę odrębnymi mechanizmami które wszystkie trzy niezależne przejścia badawcze nalegały rozdzielić zamiast łączyć. Zdecydowanie dominujący przypadek z praktyki, potwierdzony najsilniejszym rejestrem incydentów: aplikacja renderuje nieufny HTML/CSS przez generator PDF po stronie serwera (wkhtmltopdf, DomPDF, TCPDF, Puppeteer/headless Chrome) który jest w rzeczywistości pełnym silnikiem przeglądarki pobierającym zasoby, działającym z pozycją sieciową i dostępem do systemu plików SERWERA -- zamieniając wstrzyknięty &lt;iframe&gt; albo &lt;img&gt; w Server-Side Request Forgery albo ujawnienie lokalnego pliku. Pozostałe dwa warianty -- wstrzyknięcie surowej składni obiektu PDF by przemycić akcję JavaScript do samego pliku, i eksploatacja błędów parsowania samej przeglądarki PDF -- są prawdziwe, udokumentowane przez badanie z nazwiskiem (Gareth Heyes/PortSwigger, Black Hat EU 2020) i flagowe CVE PDF.js, ale mają znacznie
      szczuplejszy rejestr incydentów.'
  metrics:
  - k: CWE-918
    v:
      en: Weakness ID (dominant variant)
      pl: ID słabości (dominujący wariant)
  - k: '9.8'
    v: CVSS · Critical (CVE-2022-35583, wkhtmltopdf)
  - k: A10:2021
