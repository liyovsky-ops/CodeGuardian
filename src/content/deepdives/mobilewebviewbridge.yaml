meta:
  id: mobilewebviewbridge
  threatId: '15.11'
  severity: High
  color: '#c2410c'
  colorRgb: 194,65,12
  cwe: CWE-749
  cvss: N/A (technique class spanning platform and app-level cases; flagship modern CVE-2022-30746 scored 7.5 High, foundational platform CVE-2012-6636 scored 6.8 Medium under CVSSv2)
  standard: OWASP MASVS-PLATFORM (MASTG-TEST-0033)
hero:
  titleMain: 'WebView JavaScript '
  titleGrad: Bridge Exposure
  titleTail: ''
  topbar: WebView JavaScript Bridge Exposure (addJavascriptInterface)
  lead:
    en: 'All three research passes converged tightly on the same shape of this technique: WebView.addJavascriptInterface() binds a Java/Kotlin object to a JavaScript global, and that binding belongs to the WebView instance, not to any specific page -- Android''s own official risk page states plainly that "there is no mechanism for the application to verify the origin of the calling frame within the WebView." Before API 17 (JELLY_BEAN_MR1, Android 4.2), every public method of the bound object -- including the inherited getClass() -- was reachable, letting attacker JavaScript pivot via Java reflection into Runtime.exec() for full remote code execution (CVE-2012-6636). API 17+ closes that specific reflection path by requiring an explicit @JavascriptInterface annotation, gated on the app''s targetSdkVersion (not minSdkVersion -- a precision error all three teams flagged as common). The single most important corrective finding, confirmed identically by all three passes: "API 17+ makes it safe" is a dangerous myth. The annotation narrows *which* methods are reachable, not *who* may call them -- any page the WebView ever loads, including a malicious iframe embedded in an otherwise-trusted page (CWE-749''s own Example 4), can still invoke every annotated method. The 2022 Samsung SmartThings case (CVE-2022-30746) shows this is not historical: a modern, fully-patched app shipped a missing-caller-check bridge that leaked sensitive data to remote content a decade after the reflection fix.'
    pl: 'Wszystkie trzy przejścia badawcze zbiegły się ściśle na tym samym kształcie tej techniki: WebView.addJavascriptInterface() wiąże obiekt Java/Kotlin z globalną zmienną JavaScript, a to wiązanie należy do instancji WebView, nie do konkretnej strony -- własna oficjalna strona ryzyka Android stwierdza wprost że "nie ma mechanizmu dla aplikacji by zweryfikować pochodzenie wywołującej ramki wewnątrz WebView". Przed API 17 (JELLY_BEAN_MR1, Android 4.2), każda publiczna metoda związanego obiektu -- włącznie z odziedziczoną getClass() -- była osiągalna, pozwalając atakującemu JavaScript przejść przez refleksję Java do Runtime.exec() dla pełnego zdalnego wykonania kodu (CVE-2012-6636). API 17+ zamyka tę konkretną ścieżkę refleksji wymagając jawnej adnotacji @JavascriptInterface, uzależnionej od targetSdkVersion apki (nie minSdkVersion -- błąd precyzji który wszystkie trzy zespoły oflagowały jako powszechny). Pojedyncze najważniejsze ustalenie korygujące, potwierdzone identycznie przez wszystkie trzy przejścia: "API 17+ czyni to bezpiecznym" to niebezpieczny mit. Adnotacja zawęża KTÓRE metody są osiągalne, nie KTO może je wywołać -- dowolna strona którą WebView kiedykolwiek załaduje, włącznie ze złośliwym iframe osadzonym w skądinąd zaufanej stronie (własny Przykład 4 CWE-749), wciąż może wywołać każdą oznaczoną metodę. Przypadek Samsung SmartThings z 2022 (CVE-2022-30746) pokazuje że to nie historia: nowoczesna, w pełni załatana apka wysłała bridge z brakującym sprawdzeniem wywołującego który wyciekał wrażliwe dane do zdalnej zawartości dekadę po naprawie refleksji.'
  metrics:
  - k: API 17
    v:
      en: targetSdkVersion boundary (JELLY_BEAN_MR1) closing reflection RCE -- not a full fix
      pl: granica targetSdkVersion (JELLY_BEAN_MR1) zamykająca RCE refleksji -- nie pełna naprawa
  - k: CVE-2012-6636
    v:
      en: 'foundational platform RCE: Java Reflection API abuse of addJavascriptInterface'
      pl: 'fundamentalne RCE platformy: nadużycie Java Reflection API na addJavascriptInterface'
  - k: CVE-2022-30746
    v:
      en: 'Samsung SmartThings, 2022: missing caller check in JS interface API, CVSS 7.5 High'
      pl: 'Samsung SmartThings, 2022: brak sprawdzenia wywołującego w API interfejsu JS, CVSS 7.5 High'
  - k: 62/100
    v:
      en: top Google Play apps flagged "potentially vulnerable" by MWR's 2013 audit -- a dated snapshot, not current prevalence
      pl: czołowych apek Google Play oflagowanych jako "potencjalnie podatne" przez audyt MWR z 2013 -- datowany zrzut, nie aktualna powszechność
  sources:
  - label: Android WebView guide -- addJavascriptInterface security warning
    url: https://developer.android.com/develop/ui/views/layout/webapps/webview
  - label: Android official risk page -- Insecure WebView native bridges
    url: https://developer.android.com/privacy-and-security/risks/insecure-webview-native-bridges
  - label: CWE-749 -- Exposed Dangerous Method or Function
    url: https://cwe.mitre.org/data/definitions/749.html
  - label: OWASP MASTG-TEST-0033 -- Testing for Java Objects Exposed Through WebViews
    url: https://mas.owasp.org/MASTG/tests/android/MASVS-PLATFORM/MASTG-TEST-0033/
