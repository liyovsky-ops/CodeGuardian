hero:
  titleMain: 'Path '
  titleGrad: Traversal
  titleTail: ''
  topbar: Path Traversal / Directory Traversal
  lead:
    en: 'Path traversal happens when untrusted input is used to build a filesystem path without verifying the resolved path stays inside an intended base directory — a dot-dot-slash sequence or an absolute path climbs out of the sandbox to read, write, or execute arbitrary files. The root cause is a canonicalization gap: the string a filter inspects is not the same path the OS ultimately resolves. Unauthenticated, pre-auth instances (like Pulse Connect Secure, CVE-2019-11510) rate CVSS 10.0 — full arbitrary file read with no login required.'
    pl: 'Path traversal zdarza się, gdy niezaufane wejście jest używane do budowy ścieżki plikowej bez weryfikacji, że rozwiązana ścieżka pozostaje wewnątrz zamierzonego katalogu bazowego — sekwencja dot-dot-slash lub ścieżka absolutna wychodzi z piaskownicy, by czytać, zapisywać lub wykonywać dowolne pliki. Przyczyną źródłową jest luka kanonizacji: string sprawdzany przez filtr nie jest tą samą ścieżką, którą finalnie rozwiązuje system. Nieuwierzytelnione instancje pre-auth (jak Pulse Connect Secure, CVE-2019-11510) oceniane są na CVSS 10.0 — pełny odczyt dowolnego pliku bez logowania.'
  metrics:
  - k: CWE-22
    v:
      en: Weakness ID
      pl: ID słabości
  - k: '10.0'
    v: CVSS · Critical
  - k: A01:2021
    v: OWASP Top 10
  - k: '7'
    v:
      en: Attack variants
      pl: Warianty ataku
  sources:
