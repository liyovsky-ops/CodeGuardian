meta:
  id: mobilesupplychain
  threatId: '15.2'
  severity: Critical
  color: '#0f766e'
  colorRgb: 15,118,110
  cwe: CWE-1357
  cvss: '10.0'
  standard: OWASP Mobile Top 10 2024 (M2)
hero:
  titleMain: 'Inadequate Supply Chain '
  titleGrad: Security
  titleTail: ''
  topbar: Inadequate Supply Chain Security (OWASP Mobile Top 10 2024, M2)
  lead:
    en: 'New to the OWASP Mobile Top 10 in its 2024 revision, and for good reason: a third-party SDK embedded in a mobile app runs inside the app''s own process with the app''s own permissions -- there is generally no per-library sandboxing on mobile the way a defender might isolate a server-side dependency. All three independent research passes converged on the same structural consequence: a single compromised ad SDK, analytics library, or build toolchain can propagate malicious code to thousands of unrelated apps and hundreds of millions of devices simultaneously, and this is not theoretical -- it is this deep-dive''s strongest-documented incident record of any topic researched in this knowledge base so far, anchored by three separate, primary-source-verified real-world cases spanning a trojanized compiler, two malicious ad SDKs, and a critical registry-infrastructure vulnerability.'
    pl: 'Nowość w OWASP Mobile Top 10 w rewizji 2024, i to z dobrego powodu: SDK firmy trzeciej osadzony w aplikacji mobilnej działa wewnątrz własnego procesu aplikacji z własnymi uprawnieniami aplikacji -- generalnie nie ma na mobile piaskownicy per-biblioteka w sposób w jaki obrońca mógłby izolować zależność po stronie serwera. Wszystkie trzy niezależne przejścia badawcze zbiegły się na tej samej strukturalnej konsekwencji: pojedynczy skompromitowany SDK reklamowy, biblioteka analityczna, albo łańcuch narzędzi budowania może propagować złośliwy kod do tysięcy niepowiązanych apek i setek milionów urządzeń jednocześnie, i to nie jest teoretyczne -- to najlepiej udokumentowany rejestr incydentów spośród wszystkich tematów zbadanych w tej bazie wiedzy do tej pory, zakotwiczony trzema osobnymi, zweryfikowanymi względem źródeł pierwotnych prawdziwymi przypadkami obejmującymi trojanizowany kompilator, dwa złośliwe SDK reklamowe, i krytyczną podatność infrastruktury rejestru.'
