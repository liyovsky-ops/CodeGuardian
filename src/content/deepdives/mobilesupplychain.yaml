  tools:
    title:
      en: Detection tooling
      pl: Narzędzia wykrywania
    lead:
      en: SBOM tooling for mobile is real and OWASP-backed, but dynamic SDK-behavior detection is fundamentally an arms race -- exactly the class of analysis SourMint was purpose-built to evade.
      pl: Narzędzia SBOM dla mobile są prawdziwe i wspierane przez OWASP, ale wykrywanie dynamicznego zachowania SDK to fundamentalnie wyścig zbrojeń -- dokładnie ta klasa analizy którą SourMint był zbudowany by unikać.
    sast:
    - - CycloneDX (cyclonedx-gradle-plugin, CocoaPods support, cdxgen)
      - OWASP's own SBOM standard and tooling, with explicit Gradle/Android and CocoaPods/iOS support -- verified as the standard path for mobile SBOM generation
    - - OWASP Dependency-Check + Dependency-Track
      - Dependency-Check officially supports Gradle; Dependency-Track ingests CycloneDX SBOMs for continuous vulnerability monitoring across an app portfolio
    - - OWASP MASTG-TECH-0130
      - The official MASTG technique for Software Composition Analysis of Android dependencies via SBOM
    dast:
    - - mitmproxy / Burp Suite
      - TLS-intercepting proxies to observe exactly what an embedded SDK sends over the network -- the method that surfaced SourMint's exfiltration
    - - Frida + objection
      - Runtime instrumentation to hook and observe SDK behavior directly, including behavior an SDK tries to suppress when it detects a proxy
    - - MobSF (Mobile Security Framework)
      - Static + dynamic analysis of APK/IPA including third-party library enumeration and behavior flagging
    note:
      en: <strong>Key signal:</strong> a clean result from a single dynamic-analysis pass is not proof of safety -- SourMint specifically detected the analysis environment (proxy, debugger, jailbreak) and suppressed its malicious behavior only under those exact conditions, undetected for over a year as a direct result.
      pl: <strong>Kluczowy sygnał:</strong> czysty wynik z pojedynczego przejścia analizy dynamicznej to nie dowód bezpieczeństwa -- SourMint konkretnie wykrywał środowisko analizy (proxy, debugger, jailbreak) i tłumił swoje złośliwe zachowanie tylko w tych dokładnych warunkach, pozostając niewykrytym przez ponad rok jako bezpośredni skutek.
  compliance:
    title:
      en: Compliance quick-reference
      pl: Szybka zgodność
    lead:
      en: All three research passes independently verified that OWASP's own M2 page publishes no specific CWE number -- the mapping below is the standard analytical alignment against MITRE, not a quote from OWASP's text.
      pl: Wszystkie trzy przejścia badawcze niezależnie zweryfikowały że własna strona M2 OWASP nie publikuje konkretnego numeru CWE -- poniższe mapowanie to standardowe dopasowanie analityczne względem MITRE, nie cytat z tekstu OWASP.
    items:
    - std: CWE (MITRE)
      items:
      - CWE-1357 — Reliance on Insufficiently Trustworthy Component (primary, Class-level). Verified directly at MITRE as the best conceptual fit for embedding a third-party component whose trustworthiness can't be fully assessed. ParentOf CWE-1104 (Use of Unmaintained Third Party Components), CWE-1395 (Dependency on Vulnerable Third-Party Component), and CWE-1329 (Reliance on Component That is Not Updateable) -- use these three for more precise sub-case citations.
      - CWE-829 — Inclusion of Functionality from Untrusted Control Sphere (secondary, for the build-toolchain-injection variant specifically). Confirmed as a SEPARATE lineage from CWE-1357, not its parent or child -- the better fit for XcodeGhost-style compiler compromise, where the app itself never chose to trust the injected functionality.
    - std: OWASP
      items:
      - 'Mobile Top 10 2024 — M2: Inadequate Supply Chain Security, new to the 2024 revision. Verified directly against owasp.org: Exploitability AVERAGE, Prevalence COMMON, Detectability DIFFICULT, Impact SEVERE.'
      - OWASP's own M2 attack scenario explicitly names signing-key/certificate compromise as a core vector -- directly matching this deep-dive's leaked-OEM-certificate incident.
      - 'The nearest web OWASP Top 10 (2021) analogs, for context only and not the correct mapping: A06:2021 Vulnerable and Outdated Components (for the outdated-dependency facet) and A08:2021 Software and Data Integrity Failures (for the build/signing-integrity facet).'
    inlineSources:
    - label: OWASP Mobile Top 10 2024 — M2
      url: https://owasp.org/www-project-mobile-top-10/2023-risks/m2-inadequate-supply-chain-security
    - label: CWE-1357 (MITRE)
      url: https://cwe.mitre.org/data/definitions/1357.html
    - label: CWE-829 (MITRE)
      url: https://cwe.mitre.org/data/definitions/829.html
  ir:
    title:
      en: Incident response checklist
      pl: Lista kontrolna reagowania
    lead:
      en: If a compromised dependency, SDK, or signing key is confirmed in a shipped mobile app, work this list top to bottom.
      pl: Po potwierdzeniu skompromitowanej zależności, SDK, albo klucza podpisującego w wydanej aplikacji mobilnej, przejdź tę listę od góry.
    steps:
    - en: Identify the exact entry point -- compromised SDK, build toolchain, registry package, or signing key -- since remediation differs completely per vector
      pl: Zidentyfikuj dokładny punkt wejścia -- skompromitowany SDK, łańcuch narzędzi budowania, pakiet rejestru, albo klucz podpisujący -- ponieważ naprawa całkowicie różni się per wektor
    - en: If a signing key is confirmed compromised, revoke and rotate it immediately, and treat every artifact ever signed with it as potentially malicious, not just the one confirmed
      pl: Jeśli klucz podpisujący jest potwierdzony jako skompromitowany, natychmiast go unieważnij i zrotuj, i traktuj każdy artefakt kiedykolwiek nim podpisany jako potencjalnie złośliwy, nie tylko potwierdzony
    - en: If an SDK is confirmed malicious, audit for its evasion behavior first -- test in an environment it cannot detect as an analysis context, not just a standard proxy/debugger setup
      pl: Jeśli SDK jest potwierdzony jako złośliwy, najpierw przeaudytuj pod kątem jego zachowania unikającego -- testuj w środowisku którego nie może wykryć jako kontekstu analizy, nie tylko standardowego ustawienia proxy/debuggera
    - en: Check whether the same SDK or dependency is embedded in other apps in the same portfolio -- a compromised widely-embedded component rarely affects only one app
      pl: Sprawdź czy ten sam SDK albo zależność jest osadzona w innych apkach tego samego portfolio -- skompromitowany szeroko osadzony komponent rzadko dotyka tylko jednej apki
    - en: Rebuild from a verified, hermetic toolchain and republish, rather than patching the existing compromised build artifact
      pl: Przebuduj z zweryfikowanego, hermetycznego łańcucha narzędzi i wydaj ponownie, zamiast łatać istniejący skompromitowany artefakt builda
    - en: Notify per applicable data-breach obligations if the compromised component had access to user data
      pl: Powiadom zgodnie z obowiązującymi wymogami dot. naruszenia danych jeśli skompromitowany komponent miał dostęp do danych użytkowników
