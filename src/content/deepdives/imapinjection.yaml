hero:
  titleMain: 'IMAP '
  titleGrad: Injection
  titleTail: ''
  topbar: IMAP Injection (IMAP Command Injection)
  lead:
    en: 'The SMTP header injection of the IMAP world -- and a genuinely live threat, not a historical footnote: the newest confirmed incident is from this year. A webmail backend that string-concatenates a search term or message UID into a raw IMAP command line lets an attacker embed a CRLF that terminates the intended command early and starts an entirely new, fully attacker-controlled command in the same authenticated session. RFC 3501''s own literal syntax ({<byte-count>}\r\n<data>) is the protocol''s built-in fix -- explicitly designed to carry arbitrary octets, including embedded CRLF, as inert data. The catalog''s previous content for this entry described unrelated OS command injection; this deep-dive corrects the scope.'
    pl: 'SMTP header injection świata IMAP -- i naprawdę żywe zagrożenie, nie historyczny przypis: najnowszy potwierdzony incydent pochodzi z tego roku. Backend webmail który konkatenuje string termin wyszukiwania albo UID wiadomości w surową linię polecenia IMAP pozwala atakującemu osadzić CRLF które wcześnie kończy zamierzone polecenie i zaczyna zupełnie nowe, w pełni kontrolowane przez atakującego polecenie w tej samej uwierzytelnionej sesji. Własna składnia literału RFC 3501 ({<liczba-bajtów>}\r\n<dane>) to wbudowana naprawa protokołu -- jawnie zaprojektowana by nosić dowolne oktety, włącznie z osadzonym CRLF, jako obojętne dane. Poprzednia treść tego wpisu katalogowego opisywała niepowiązane wstrzyknięcie polecenia OS; ten deep-dive koryguje zakres.'
  metrics:
