  ir:
    title:
      en: Incident response checklist
      pl: Lista kontrolna reagowania
    lead:
      en: If active IMAP command injection exploitation is confirmed, work this list top to bottom.
      pl: Po potwierdzeniu aktywnej eksploatacji wstrzyknięcia polecenia IMAP, przejdź tę listę od góry.
    steps:
    - en: Check for destructive commands first (STORE +FLAGS (\Deleted), EXPUNGE) -- deleted mail may be recoverable only briefly depending on the mail server's retention behavior
      pl: Sprawdź najpierw polecenia destrukcyjne (STORE +FLAGS (\Deleted), EXPUNGE) -- usunięta poczta może być odzyskiwalna tylko krótko w zależności od zachowania retencji serwera pocztowego
    - en: Check IMAP ACLs on affected mailboxes/folders for unexpected grants (SETACL abuse) -- revoke any unrecognized standing access
      pl: Sprawdź ACL IMAP na dotkniętych skrzynkach/folderach pod kątem nieoczekiwanych nadań (nadużycie SETACL) -- odwołaj wszelki nierozpoznany stały dostęp
    - en: Grep the codebase for every place user input reaches a raw IMAP command (search/filter/UID/folder-name parameters), not just the one exploited
      pl: Przeszukaj kod pod kątem każdego miejsca gdzie wejście użytkownika dociera do surowego polecenia IMAP (parametry wyszukiwania/filtra/UID/nazwy folderu), nie tylko tego które zostało wykorzystane
    - en: Verify the IMAP client library version against known CVEs (net-imap, Roundcube, or equivalent) and patch immediately regardless of whether it was the confirmed vector
      pl: Zweryfikuj wersję biblioteki klienta IMAP względem znanych CVE (net-imap, Roundcube, albo równoważne) i natychmiast załataj niezależnie od tego czy była potwierdzonym wektorem
    - en: Switch every unavoidable dynamic-argument call site to IMAP literal syntax rather than a tighter blacklist
      pl: Przełącz każde nieuniknione miejsce dynamicznego argumentu na składnię literału IMAP zamiast ciaśniejszej blacklisty
    - en: Notify per applicable data-breach obligations if mail contents were exfiltrated or destroyed
      pl: Powiadom zgodnie z obowiązującymi wymogami dot. naruszenia danych jeśli zawartość poczty została wyeksfiltrowana lub zniszczona
