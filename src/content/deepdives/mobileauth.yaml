meta:
  id: mobileauth
  threatId: '15.3'
  severity: Critical
  color: '#0284c7'
  colorRgb: 2,132,199
  cwe: CWE-602
  cvss: '9.1'
  standard: OWASP Mobile Top 10 2024 (M3)
hero:
  titleMain: 'Insecure Authentication / '
  titleGrad: Authorization
  titleTail: ''
  topbar: Insecure Authentication/Authorization (OWASP Mobile Top 10 2024, M3)
  lead:
    en: 'The 2024 merger of the old 2016 Mobile Top 10''s separate Insecure Authentication (M4) and Insecure Authorization (M6) categories. All three independent research passes converged on OWASP''s own blunt framing: developers should "assume all client-side controls can be bypassed." A mobile app''s binary and every check it performs run entirely on a device the attacker controls, so any auth/authz decision the client makes and merely reports to itself -- a boolean flag, a role string, a biometric prompt that only gates local UI -- is not a security boundary at all. Mobile''s client-heavy, API-backed architecture adds a distinctive twist beyond the general principle: an attacker doesn''t even need to use the app''s UI to exploit this, since the UI is only one possible caller of the real backend API, and a proxy can call any endpoint directly.'
    pl: 'Fuzja z 2024 dawnych osobnych kategorii Mobile Top 10 z 2016: Insecure Authentication (M4) i Insecure Authorization (M6). Wszystkie trzy niezależne przejścia badawcze zbiegły się na własnym dosadnym ramowaniu OWASP: deweloperzy powinni "zakładać że wszystkie kontrole client-side mogą zostać ominięte". Binarka aplikacji mobilnej i każda kontrola którą wykonuje działają całkowicie na urządzeniu które kontroluje atakujący, więc jakakolwiek decyzja uwierzytelniania/autoryzacji którą podejmuje klient i tylko sam sobie zgłasza -- flaga boolowska, string roli, prompt biometryczny który tylko bramkuje lokalny UI -- to w ogóle nie granica bezpieczeństwa. Architektura mobile ciężka po stronie klienta, oparta na API, dodaje odrębny zwrot ponad ogólną zasadę: atakujący nawet nie musi używać UI aplikacji by to wykorzystać, bo UI to tylko jeden możliwy dzwoniący prawdziwego API backendu, a proxy może wywołać dowolny endpoint bezpośrednio.'
  metrics:
  - k: CWE-602
    v:
      en: Weakness ID (+ CWE-863, CWE-639)
      pl: ID słabości (+ CWE-863, CWE-639)
  - k: '9.1'
    v: CVSS · Critical (CVE-2020-7692, missing PKCE)
  - k: RFC 8252
    v:
      en: PKCE mandatory for native app OAuth
      pl: PKCE obowiązkowe dla OAuth apek natywnych
  - k: ~3M
    v:
      en: Users affected by Peloton API IDOR (2021)
      pl: Użytkowników dotkniętych IDOR API Peloton (2021)
  sources:
  - label: 'OWASP Mobile Top 10 2024 — M3: Insecure Authentication/Authorization'
    url: https://owasp.org/www-project-mobile-top-10/2023-risks/m3-insecure-authentication-authorization
  - label: RFC 8252 — OAuth 2.0 for Native Apps
    url: https://www.rfc-editor.org/rfc/rfc8252.html
  - label: CWE-602 (MITRE)
    url: https://cwe.mitre.org/data/definitions/602.html
  - label: Pen Test Partners — Tour de Peloton
    url: https://www.pentestpartners.com/security-blog/tour-de-peloton-exposed-user-data/
