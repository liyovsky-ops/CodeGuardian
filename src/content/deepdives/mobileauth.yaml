sections:
  attacks:
    title:
      en: Attack types
      pl: Typy ataków
    lead:
      en: OWASP's own two named attack methods -- calling the backend directly, or authenticating legitimately then reaching hidden endpoints -- plus the specific OAuth/PKCE variant all three research passes verified against RFC 8252.
      pl: Dwie własne nazwane metody ataku OWASP -- bezpośrednie wywołanie backendu, albo legalne uwierzytelnienie a potem dosięgnięcie ukrytych endpointów -- plus konkretny wariant OAuth/PKCE który wszystkie trzy przejścia badawcze zweryfikowały względem RFC 8252.
    items:
    - name: Local "logged in" / role flag bypass via Frida
      sev: critical
      description:
        en: An app stores an authentication or role state locally (SharedPreferences, a static field, a method return value) and trusts it without server re-verification. Frida hooks the check and forces it to return the privileged value, unlocking gated screens with no valid credential at all.
        pl: Apka przechowuje stan uwierzytelnienia albo roli lokalnie (SharedPreferences, pole statyczne, wartość zwracana metody) i ufa mu bez ponownej weryfikacji serwera. Frida zahaczaja kontrolę i wymusza zwrócenie uprzywilejowanej wartości, odblokowując bramkowane ekrany bez żadnego ważnego poświadczenia.
      payload: 'Interceptor.attach(AuthManager.isLoggedIn.implementation, { onLeave: r => r.replace(true) })'
    - name: Direct API replay bypassing client-side authorization
      sev: critical
      description:
        en: 'OWASP''s own first named attack method: the app''s UI is only one caller of the backend API. An attacker proxies traffic and calls a privileged or hidden endpoint the current user''s screens never expose -- if the server assumed the UI would gate access, the assumption is void.'
        pl: 'Własna pierwsza nazwana metoda ataku OWASP: UI aplikacji to tylko jeden dzwoniący API backendu. Atakujący proxuje ruch i wywołuje uprzywilejowany albo ukryty endpoint którego ekrany bieżącego użytkownika nigdy nie ujawniają -- jeśli serwer zakładał że UI będzie bramkować dostęp, założenie jest nieważne.'
      payload: POST /api/admin/users  -- called directly via Burp Repeater, never reachable through this user's own app UI
    - name: IDOR / broken object-level authorization via API
      sev: critical
      description:
        en: An authenticated user swaps a resource identifier in a captured request and receives another user's data or performs an action on another user's object -- the canonical CWE-639 case, and the exact mechanism verified in the real Peloton API incident.
        pl: Uwierzytelniony użytkownik zamienia identyfikator zasobu w przechwyconym żądaniu i otrzymuje dane innego użytkownika albo wykonuje akcję na obiekcie innego użytkownika -- klasyczny przypadek CWE-639, i dokładny mechanizm zweryfikowany w prawdziwym incydencie API Peloton.
      payload: GET /api/users/1234/profile  ->  GET /api/users/1235/profile  -- returns another user's private data
    - name: Missing PKCE in mobile OAuth -- authorization-code interception
      sev: critical
      description:
        en: 'Verified directly against RFC 8252: a public native OAuth client without PKCE is vulnerable because a private-use URI scheme redirect can be registered by more than one app on the device -- a malicious app can receive the authorization code and exchange it for tokens, since no client secret exists to stop it.'
        pl: 'Zweryfikowane bezpośrednio względem RFC 8252: publiczny natywny klient OAuth bez PKCE jest podatny bo przekierowanie schematu URI do prywatnego użytku może być zarejestrowane przez więcej niż jedną apkę na urządzeniu -- złośliwa apka może otrzymać kod autoryzacji i wymienić go na tokeny, bo nie istnieje żaden sekret klienta który by to zatrzymał.'
      payload: GET /authorize?response_type=code&client_id=APP&redirect_uri=com.app://cb  -- no code_challenge present
    - name: Insecure custom URL scheme / embedded WebView in OAuth redirect
      sev: high
      description:
        en: 'RFC 8252 explicitly names both risks: custom URI schemes are not exclusively owned by one app on the OS, and using an embedded WebView (rather than the OS browser/ASWebAuthenticationSession/Custom Tabs) lets the host app itself capture credentials, bypass consent, or copy session cookies -- verified as an explicit RFC recommendation, not a hypothetical concern.'
        pl: 'RFC 8252 jawnie nazywa oba ryzyka: schematy URI do prywatnego użytku nie są wyłącznie własnością jednej apki na systemie, a użycie osadzonego WebView (zamiast przeglądarki systemowej/ASWebAuthenticationSession/Custom Tabs) pozwala samej apce-hostowi przechwycić poświadczenia, ominąć zgodę, albo skopiować ciasteczka sesji -- zweryfikowane jako jawna rekomendacja RFC, nie hipotetyczna obawa.'
      payload: WKWebView / android.webkit.WebView used to render the OAuth login page inside the app, instead of the OS-provided authentication session
  code:
    title:
      en: Vulnerable vs Secure
      pl: Podatny vs Bezpieczny
    lead:
      en: The fix is never a better client-side check -- it's removing the client from the trust decision entirely and letting the server independently authorize every privileged action.
      pl: Naprawa nigdy nie jest lepszą kontrolą client-side -- to całkowite usunięcie klienta z decyzji zaufania i pozwolenie serwerowi niezależnie autoryzować każdą uprzywilejowaną akcję.
    languages:
    - label: Android (Kotlin) -- role check
      lang: kotlin
      vulnerable: "// VULNERABLE: authorization decided on-device and trusted\nfun onOpenAdminPanel() {\n    val role = prefs.getString(\"role\", \"user\")   // client-controlled, hookable\n    if (role == \"admin\") {\n        api.getAllUsers()                          // endpoint trusts the caller\n    }\n}"
      safe: "// SAFE: client never decides; server re-validates on every call\nfun onOpenAdminPanel() {\n    api.getAllUsers()   // Authorization: Bearer <short-lived token>\n    // Backend: verify token -> load role from server-side store ->\n    // authorize -> else 403. Client only reacts to the server's answer.\n}"
    - label: iOS (Swift) -- biometric gate
      lang: swift
      vulnerable: "// VULNERABLE: \"success\" is a local boolean, no server-bound credential\ncontext.evaluatePolicy(.deviceOwnerAuthenticationWithBiometrics, ...) { ok, _ in\n    if ok { self.showAccountBalance() }   // Frida-hookable, nothing to validate server-side\n}"
      safe: "// SAFE: biometric releases a Keychain item bound to .biometryCurrentSet,\n// which the SERVER then validates as a real credential -- not a UI boolean.\ncontext.evaluatePolicy(.deviceOwnerAuthenticationWithBiometrics,\n                        localizedReason: \"Authorize payment\") { ok, _ in\n    guard ok else { return }\n    let token = try? Keychain.read(\"session\", context: context)\n    self.api.authorizePayment(token: token)   // server re-verifies the token itself\n}"
    - label: OAuth mobile flow -- PKCE
      lang: kotlin
      vulnerable: "// VULNERABLE: no code_challenge -- intercepted code is directly exchangeable\nval authUrl = \"$AUTH_ENDPOINT?response_type=code&client_id=$CLIENT_ID\" +\n    \"&redirect_uri=com.app://cb\""
      safe: "// SAFE, per RFC 8252 / RFC 7636:\nval verifier = randomUrlSafe(64)\nval challenge = base64Url(sha256(verifier))\nval authUrl = \"$AUTH_ENDPOINT?response_type=code&client_id=$CLIENT_ID\" +\n    \"&redirect_uri=$CLAIMED_HTTPS_REDIRECT\" +   // App Links, not a custom scheme\n    \"&code_challenge=$challenge&code_challenge_method=S256\"\n// Token exchange must present the original verifier -- an intercepted\n// code alone is useless without it. Use the OS browser/ASWebAuthenticationSession/\n// Custom Tabs, never an embedded WebView."
  method:
    title:
      en: Attack methodology
      pl: Metodyka ataku
    lead:
      en: OWASP names two attack methods directly on its official M3 page; the tooling below maps precisely onto each.
      pl: OWASP nazywa dwie metody ataku bezpośrednio na własnej oficjalnej stronie M3; poniższe narzędzia mapują się precyzyjnie na każdą z nich.
    steps:
    - title:
        en: Static recon of client-side auth logic
        pl: Statyczny rekonesans logiki uwierzytelniania client-side
      description:
        en: Decompile with JADX/apktool (Android) or class-dump/Hopper (iOS), or run MobSF for automated triage, to locate auth/role checks, hardcoded endpoints, and OAuth configuration.
        pl: Dekompiluj przez JADX/apktool (Android) albo class-dump/Hopper (iOS), albo uruchom MobSF dla zautomatyzowanego rozpoznania, by zlokalizować kontrole uwierzytelniania/roli, zahardkodowane endpointy, i konfigurację OAuth.
    - title:
        en: Hook and force local auth checks with Frida/objection
        pl: Zahaczaj i wymuszaj lokalne kontrole uwierzytelniania przez Frida/objection
      description:
        en: Hook the method or flag deciding local auth state and force the privileged value; objection provides one-line bypasses for root/jailbreak detection and certificate pinning that would otherwise block the next step.
        pl: Zahaczaj metodę albo flagę decydującą o lokalnym stanie uwierzytelnienia i wymuś uprzywilejowaną wartość; objection dostarcza jednolinijkowe obejścia dla wykrywania root/jailbreak i przypinania certyfikatu które inaczej zablokowałyby następny krok.
    - title:
        en: Call the backend directly, bypassing the app's UI entirely
        pl: Wywołaj backend bezpośrednio, całkowicie omijając UI apki
      description:
        en: 'OWASP''s own first named attack method: proxy the app''s real traffic via Burp/mitmproxy, then replay or hand-craft requests to endpoints the current user''s UI never exposes -- privileged actions, hidden admin routes, or another user''s data.'
        pl: 'Własna pierwsza nazwana metoda ataku OWASP: proxuj prawdziwy ruch apki przez Burp/mitmproxy, potem powtórz albo ręcznie skonstruuj żądania do endpointów których UI bieżącego użytkownika nigdy nie ujawnia -- uprzywilejowane akcje, ukryte trasy admina, albo dane innego użytkownika.'
    - title:
        en: Test for IDOR by swapping identifiers
        pl: Testuj IDOR zamieniając identyfikatory
      description:
        en: With two test accounts, send account A's token against account B's resource ID and observe whether the server returns the data anyway -- the exact technique that surfaced the real Peloton API incident.
        pl: Z dwoma kontami testowymi, wyślij token konta A przeciw ID zasobu konta B i obserwuj czy serwer i tak zwraca dane -- dokładna technika która ujawniła prawdziwy incydent API Peloton.
    - title:
        en: Inspect the OAuth flow for missing PKCE and unsafe redirect handling
        pl: Zbadaj przepływ OAuth pod kątem brakującego PKCE i niebezpiecznej obsługi przekierowania
      description:
        en: Check the authorization request for a code_challenge parameter, and check whether the redirect URI is a custom scheme (hijackable) versus a claimed HTTPS App Link/Universal Link, and whether the flow uses the OS browser or a capturable embedded WebView.
        pl: Sprawdź żądanie autoryzacji pod kątem parametru code_challenge, i sprawdź czy URI przekierowania to schemat niestandardowy (przechwytywalny) w porównaniu do zastrzeżonego HTTPS App Link/Universal Link, i czy przepływ używa przeglądarki systemowej czy przechwytywalnego osadzonego WebView.
  defenses:
    title:
      en: Defense layers, ranked
      pl: Warstwy obrony wg skuteczności
    lead:
      en: 'All three research passes independently converged on the same top principle, quoting OWASP''s own text: the server is the only trust boundary, and certificate pinning is explicitly demoted to defense-in-depth, never a primary control.'
      pl: 'Wszystkie trzy przejścia badawcze niezależnie zbiegły się na tej samej głównej zasadzie, cytując własny tekst OWASP: serwer jest jedyną granicą zaufania, a przypinanie certyfikatu jest jawnie zdegradowane do obrony w głąb, nigdy głównej kontroli.'
    items:
    - rank: 1
      eff: 95
      kind: primary
      label:
        en: Server-side re-validation of every privileged action, never trusting client-reported auth state
        pl: Ponowna walidacja po stronie serwera każdej uprzywilejowanej akcji, nigdy nie ufając stanowi uwierzytelnienia zgłoszonemu przez klienta
      note:
        en: 'OWASP''s own central instruction, verified verbatim: "assume all client-side controls can be bypassed" and backend systems must "independently verify the roles and permissions of the authenticated user." Addresses the root cause directly -- without this, no other control matters.'
        pl: 'Własna centralna instrukcja OWASP, zweryfikowana dosłownie: "zakładaj że wszystkie kontrole client-side mogą zostać ominięte" a systemy backendowe muszą "niezależnie weryfikować role i uprawnienia uwierzytelnionego użytkownika". Adresuje przyczynę źródłową bezpośrednio -- bez tego żadna inna kontrola nie ma znaczenia.'
    - rank: 2
      eff: 90
      kind: primary
      label:
        en: Robust server-side object-level authorization (BOLA/IDOR prevention)
        pl: Solidna autoryzacja na poziomie obiektu po stronie serwera (zapobieganie BOLA/IDOR)
      note:
        en: Every object access checks that the authenticated principal specifically owns or may access THAT object, independent of what the client UI shows -- the direct, verified fix for the Peloton-class incident.
        pl: Każdy dostęp do obiektu sprawdza że uwierzytelniony podmiot konkretnie posiada albo może uzyskać dostęp do TEGO obiektu, niezależnie od tego co pokazuje UI klienta -- bezpośrednia, zweryfikowana naprawa dla incydentu klasy Peloton.
    - rank: 3
      eff: 85
      kind: primary
      label:
        en: OAuth 2.0 + PKCE per RFC 8252, claimed-HTTPS redirects, OS browser (never embedded WebView)
        pl: OAuth 2.0 + PKCE wg RFC 8252, zastrzeżone przekierowania HTTPS, przeglądarka systemowa (nigdy osadzony WebView)
      note:
        en: Directly closes the authorization-code-interception and custom-scheme-hijack classes -- a verified RFC MUST requirement for public native clients, not an optional hardening step.
        pl: Bezpośrednio zamyka klasy przechwycenia kodu autoryzacji i przejęcia schematu niestandardowego -- zweryfikowany wymóg MUST RFC dla publicznych klientów natywnych, nie opcjonalny krok utwardzania.
    - rank: 4
      eff: 75
      kind: strong
      label:
        en: Short-lived, server-validated, revocable tokens checked per request
        pl: Krótkożyjące, zweryfikowane przez serwer, unieważnialne tokeny sprawdzane per żądanie
      note:
        en: Bounds the blast radius of any stolen or forged client state and forces the server to make the real decision on every single call, not just at login.
        pl: Ogranicza promień rażenia jakiegokolwiek skradzionego albo sfałszowanego stanu klienta i zmusza serwer do podjęcia prawdziwej decyzji przy każdym pojedynczym wywołaniu, nie tylko przy logowaniu.
    - rank: 5
      eff: 65
      kind: strong
      label:
        en: Biometric authentication bound to a server-validated credential, not a UI gate
        pl: Uwierzytelnianie biometryczne związane ze zweryfikowanym przez serwer poświadczeniem, nie bramką UI
      note:
        en: Turns a bypassable local boolean into a real credential the server independently checks -- effective for its specific scope, but only ever a complement to server-side authorization, never a substitute.
        pl: Zamienia omijalną lokalną wartość boolowską w prawdziwe poświadczenie które serwer niezależnie sprawdza -- skuteczne dla swojego konkretnego zakresu, ale zawsze tylko uzupełnienie autoryzacji server-side, nigdy substytut.
    - rank: 6
      eff: 35
      kind: weak
      label:
        en: Certificate/public-key pinning
        pl: Przypinanie certyfikatu/klucza publicznego
      note:
        en: 'Explicitly demoted to defense-in-depth by all three research passes: raises the cost of trivial proxy interception but is routinely bypassed on a controlled device via Frida/objection, and does nothing to stop a properly authenticated attacker performing IDOR.'
        pl: 'Jawnie zdegradowane do obrony w głąb przez wszystkie trzy przejścia badawcze: podnosi koszt trywialnego przechwycenia przez proxy ale jest rutynowo omijane na kontrolowanym urządzeniu przez Frida/objection, i nic nie robi by zatrzymać poprawnie uwierzytelnionego atakującego wykonującego IDOR.'
  incidents:
    title:
      en: Real-world incidents
      pl: Rzeczywiste incydenty
    lead:
      en: 'A strong, well-documented record spanning both halves of this category: a famous SSO authentication failure, a widely-covered IDOR/authorization incident corroborated by two independent research passes, and an NVD-verified CVE for the missing-PKCE variant.'
      pl: 'Silny, dobrze udokumentowany rejestr obejmujący obie połowy tej kategorii: słynna awaria uwierzytelniania SSO, szeroko relacjonowany incydent IDOR/autoryzacji potwierdzony przez dwa niezależne przejścia badawcze, i zweryfikowane przez NVD CVE dla wariantu brakującego PKCE.'
    items:
    - org: Peloton API
      year: 2021
      impact: Broken object-level authorization -- ~3 million+ users' private profile data (age, gender, city, weight, workout stats)
      cost: Fixed roughly 7 days after Pen Test Partners' disclosure and press coverage
      description:
        en: 'Confirmed independently by two research passes against Pen Test Partners'' primary research (with TechCrunch/Threatpost/Infosecurity Magazine corroboration): Peloton''s GraphQL API enabled authentication but never enforced proper object-level authorization -- any authenticated (initially even unauthenticated) request could pull another user''s private profile data regardless of that user''s own privacy settings. A textbook real-world instance of this deep-dive''s IDOR attack variant, mapped by researchers directly to OWASP API1 Broken Object Level Authorization.'
        pl: 'Potwierdzone niezależnie przez dwa przejścia badawcze względem podstawowego badania Pen Test Partners (z potwierdzeniem TechCrunch/Threatpost/Infosecurity Magazine): API GraphQL Peloton umożliwiało uwierzytelnienie ale nigdy nie wymuszało właściwej autoryzacji na poziomie obiektu -- każde uwierzytelnione (początkowo nawet nieuwierzytelnione) żądanie mogło pobrać prywatne dane profilu innego użytkownika niezależnie od własnych ustawień prywatności tego użytkownika. Podręcznikowy prawdziwy przypadek wariantu ataku IDOR tego deep-dive, zmapowany przez badaczy bezpośrednio na OWASP API1 Broken Object Level Authorization.'
    - org: '"Sign in with Apple" SSO'
      year: 2020
      impact: Full third-party account takeover -- $100,000 bug bounty
      cost: Fixed by Apple; named affected relying parties included Dropbox, Spotify, Airbnb, Giphy
      description:
        en: 'Verified via researcher Bhavuk Jain''s own writeup: Apple''s SSO server generated a validly-signed JWT for ANY email address a client requested, without verifying the requester actually owned that email. Because the JWT verified correctly against Apple''s own public key, any third-party service trusting "Sign in with Apple" could be silently impersonated -- a server-side authentication-validation failure reachable entirely through the mobile SSO flow this deep-dive covers.'
        pl: 'Zweryfikowane przez własne ujawnienie badacza Bhavuka Jaina: serwer SSO Apple generował poprawnie podpisany JWT dla DOWOLNEGO adresu email o który klient poprosił, bez weryfikacji czy żądający faktycznie posiadał ten email. Ponieważ JWT poprawnie weryfikował się względem własnego klucza publicznego Apple, każda usługa firmy trzeciej ufająca "Sign in with Apple" mogła zostać po cichu podszyta -- awaria walidacji uwierzytelnienia po stronie serwera osiągalna całkowicie przez przepływ SSO mobile który pokrywa ten deep-dive.'
    - org: Google OAuth Client Library for Java
      year: 2020
      impact: CVE-2020-7692 -- CVSS 9.1 Critical, CWE-863
      cost: Fixed in 1.31.0
      description:
        en: 'Verified directly against NVD: versions before 1.31.0 did not implement PKCE in accordance with RFC 8252 for OAuth 2.0 on native apps, enabling exactly the authorization-code-interception attack this deep-dive''s attack-types section describes. A clean, primary-source-verified anchor for the missing-PKCE variant.'
        pl: 'Zweryfikowane bezpośrednio względem NVD: wersje przed 1.31.0 nie implementowały PKCE zgodnie z RFC 8252 dla OAuth 2.0 na apkach natywnych, umożliwiając dokładnie atak przechwycenia kodu autoryzacji który opisuje sekcja typów ataków tego deep-dive. Czysty, zweryfikowany względem źródła pierwotnego przypadek zakotwiczający wariant brakującego PKCE.'
    inlineSources:
    - label: Pen Test Partners — Tour de Peloton
      url: https://www.pentestpartners.com/security-blog/tour-de-peloton-exposed-user-data/
    - label: Bhavuk Jain — Sign in with Apple account takeover
      url: https://bhavukjain.com/blog/2020/05/30/zeroday-signin-with-apple/
