      url: https://nvd.nist.gov/vuln/detail/CVE-2020-7692
  tools:
    title:
      en: Detection tooling
      pl: Narzędzia wykrywania
    lead:
      en: 'OWASP''s own two named attack methods map directly onto two tool categories: runtime hooking to defeat local checks, and API-layer proxying to bypass the UI entirely.'
      pl: 'Dwie własne nazwane metody ataku OWASP mapują się bezpośrednio na dwie kategorie narzędzi: haczenie w czasie wykonania by pokonać lokalne kontrole, i proxowanie na poziomie API by całkowicie ominąć UI.'
    sast:
    - - JADX / apktool (+ class-dump/Hopper on iOS)
      - Decompile to locate and review client-side auth/role logic, hardcoded endpoints, and OAuth configuration
    - - MobSF (Mobile Security Framework)
      - Automated static+dynamic triage flagging insecure auth patterns and exported/hidden components
    dast:
    - - Frida + objection
      - Hook and force local auth/role checks to return privileged values; objection's one-line bypasses for root/jailbreak detection and certificate pinning unblock the next step
    - - Burp Suite / mitmproxy
      - 'The primary M3 tool: intercept, replay, and hand-craft requests to endpoints the app''s own UI never exposes to the current user -- directly implements OWASP''s first named attack method'
    - - Burp Autorize / Intruder for IDOR enumeration
      - Systematically swap resource identifiers across two authenticated test accounts to detect object-level authorization gaps
    note:
      en: <strong>Key signal:</strong> if a security review only ever exercises an app's own UI, it will miss this entire category by construction -- the defining characteristic of M3 is that the vulnerable path is reachable only by bypassing the UI, not by using it.
      pl: <strong>Kluczowy sygnał:</strong> jeśli przegląd bezpieczeństwa zawsze tylko ćwiczy własny UI aplikacji, ominie tę całą kategorię z definicji -- cechą definiującą M3 jest że podatna ścieżka jest osiągalna tylko przez ominięcie UI, nie przez jego użycie.
  compliance:
    title:
      en: Compliance quick-reference
      pl: Szybka zgodność
    lead:
      en: This category genuinely spans multiple CWEs -- all three research passes independently converged on the same conclusion that a single CWE (the catalog stub's original CWE-287 alone) is insufficient, and that CWE-602 is the single best conceptual fit for the client-side-trust root cause.
      pl: Ta kategoria naprawdę obejmuje wiele CWE -- wszystkie trzy przejścia badawcze niezależnie zbiegły się na tym samym wniosku że pojedyncze CWE (oryginalne samo CWE-287 stuba katalogowego) jest niewystarczające, i że CWE-602 jest pojedynczym najlepszym dopasowaniem koncepcyjnym dla przyczyny źródłowej zaufania client-side.
    items:
    - std: CWE (MITRE)
      items:
      - 'CWE-602 — Client-Side Enforcement of Server-Side Security (primary). Verified directly at MITRE: explicitly lists Mobile as an applicable platform, and is the single best conceptual fit for "the attacker controls the device the check runs on."'
      - CWE-287 — Improper Authentication (authentication half). Verified as MITRE-marked DISCOURAGED for direct mapping in favor of more specific children -- kept here as the authentication anchor, not the sole classification.
      - CWE-863 — Incorrect Authorization and CWE-862 — Missing Authorization (authorization half, checks flawed vs. absent respectively). CWE-863 is what NVD actually assigned to the real CVE-2020-7692.
      - CWE-639 — Authorization Bypass Through User-Controlled Key (the canonical IDOR CWE, ChildOf CWE-863) — the exact fit for the Peloton-class incident.
    - std: OWASP
      items:
      - 'Mobile Top 10 2024 — M3: Insecure Authentication/Authorization, merging the 2016 list''s separate M4 (Insecure Authentication) and M6 (Insecure Authorization). Verified directly against owasp.org: Exploitability EASY, Prevalence COMMON, Detectability AVERAGE, Impact SEVERE.'
      - Maps to the MASVS-AUTH control group; the OWASP MAS project's MASWE weakness catalog names this precisely as MASWE-0041 (Authentication Enforced Only Locally Instead of on the Server-side) and MASWE-0042 (the authorization equivalent).
      - OWASP's own M3 page does not itself enumerate specific CWE numbers -- confirmed by all three research passes fetching the page directly -- so the CWE mapping above is the standard analytical alignment, not an OWASP quote.
      - 'Web analogs for context only, not the correct mapping: OWASP Top 10 2021 A01 Broken Access Control and A07 Identification and Authentication Failures, and OWASP API Top 10 2023 API1 Broken Object Level Authorization -- the most directly relevant analog given how often mobile auth/authz failures manifest at the API layer, as in the Peloton incident.'
    inlineSources:
    - label: OWASP Mobile Top 10 2024 — M3
      url: https://owasp.org/www-project-mobile-top-10/2023-risks/m3-insecure-authentication-authorization
    - label: CWE-602 (MITRE)
      url: https://cwe.mitre.org/data/definitions/602.html
    - label: CWE-639 (MITRE)
      url: https://cwe.mitre.org/data/definitions/639.html
  ir:
    title:
      en: Incident response checklist
      pl: Lista kontrolna reagowania
    lead:
      en: If active exploitation of a mobile authentication or authorization bypass is confirmed, work this list top to bottom.
      pl: Po potwierdzeniu aktywnej eksploatacji ominięcia uwierzytelniania albo autoryzacji mobile, przejdź tę listę od góry.
    steps:
    - en: Identify whether the exploited path was authentication (proving identity) or authorization (enforcing permissions) -- the fix differs completely, and this category frequently involves both at once
      pl: Zidentyfikuj czy wykorzystana ścieżka to uwierzytelnianie (dowodzenie tożsamości) czy autoryzacja (wymuszanie uprawnień) -- naprawa całkowicie się różni, a ta kategoria często obejmuje oba naraz
    - en: If IDOR/object-level authorization was exploited, audit how many other objects the same technique could reach, not just the one confirmed -- this is rarely a single-record bug
      pl: Jeśli wykorzystano IDOR/autoryzację na poziomie obiektu, przeaudytuj ile innych obiektów ta sama technika mogła osiągnąć, nie tylko ten potwierdzony -- to rzadko błąd pojedynczego rekordu
    - en: If the app itself was bypassed via Frida/patching, remember the server-side endpoint remains reachable directly regardless of any client-side fix -- patch the server-side authorization gap, not just the app
      pl: Jeśli sama apka została ominięta przez Frida/patching, pamiętaj że endpoint server-side pozostaje osiągalny bezpośrednio niezależnie od jakiejkolwiek naprawy client-side -- załataj lukę autoryzacji server-side, nie tylko apkę
    - en: If a missing-PKCE OAuth flow was exploited, revoke and rotate any tokens issued through that flow during the exposure window
      pl: Jeśli wykorzystano przepływ OAuth bez PKCE, unieważnij i zrotuj wszelkie tokeny wydane przez ten przepływ w oknie ekspozycji
    - en: Grep the codebase and API surface for every other endpoint following the same anti-pattern (client-trusted role, missing object-level check), not just the exploited one
      pl: Przeszukaj bazę kodu i powierzchnię API pod kątem każdego innego endpointu podążającego za tym samym antywzorcem (rola zaufana przez klienta, brakująca kontrola na poziomie obiektu), nie tylko wykorzystanego
    - en: Notify per applicable data-breach obligations if another user's data was confirmed accessed
      pl: Powiadom zgodnie z obowiązującymi wymogami dot. naruszenia danych jeśli potwierdzono dostęp do danych innego użytkownika
  labs:
    title:
      en: Practice labs
      pl: Laboratoria praktyczne
    lead:
      en: PortSwigger's Web Security Academy has no mobile-specific track (verified elsewhere in this knowledge base's Mobile Security category), and OWASP's MAS Crackmes are all hidden-secret-extraction exercises rather than local-auth-bypass ones (verified) -- but the MASTG's own technique guide for biometric bypass is real, on-topic, and directly usable.
      pl: PortSwigger Web Security Academy nie ma ścieżki specyficznej dla mobile (zweryfikowane gdzie indziej w kategorii Mobile Security tej bazy wiedzy), a MAS Crackmes OWASP to wszystko ćwiczenia ekstrakcji ukrytego sekretu zamiast ominięcia lokalnego uwierzytelnienia (zweryfikowane) -- ale własny przewodnik techniczny MASTG dla ominięcia biometrii jest prawdziwy, na temat, i bezpośrednio użyteczny.
    items:
    - variant: Local biometric authentication bypass
      provider: OWASP MASTG
      label: MASTG-TECH-0135 -- Bypassing Biometric Authentication
      url: https://mas.owasp.org/MASTG/techniques/ios/MASTG-TECH-0135/
      difficulty: Intermediate
