meta:
  id: mobilecommunication
  threatId: '15.5'
  severity: Critical
  color: '#1d4ed8'
  colorRgb: 29,78,216
  cwe: CWE-295
  cvss: '9.1'
  standard: OWASP Mobile Top 10 2024 (M5)
hero:
  titleMain: 'Insecure '
  titleGrad: Communication
  titleTail: ''
  topbar: Insecure Communication (OWASP Mobile Top 10 2024, M5)
  lead:
    en: 'Was M3 in the 2016 Mobile Top 10, renumbered M5 in 2024. All three independent research passes converged on the same root mechanism, verified directly against Android''s own official documentation: a custom X509TrustManager whose checkServerTrusted() method has an empty body -- never throwing on an untrusted chain -- accepts ANY certificate, including an attacker''s self-signed one. This is the canonical "temporary fix" for a self-signed dev/staging certificate that gets copied from Stack Overflow, silences the error, and ships to production because HTTPS still visibly "works" -- there is no functional signal that validation is gone. The class is unusually well-studied academically: the same 13,500-app, 8.0%-vulnerable, 41-of-100-MITM''d findings from a 2012 study were independently confirmed by all three research passes, and a 2021 follow-up study found the problem far from solved a decade later.'
    pl: 'Był M3 w Mobile Top 10 z 2016, przenumerowany na M5 w 2024. Wszystkie trzy niezależne przejścia badawcze zbiegły się na tym samym mechanizmie źródłowym, zweryfikowanym bezpośrednio względem własnej oficjalnej dokumentacji Android: niestandardowy X509TrustManager którego metoda checkServerTrusted() ma pustą treść -- nigdy nie rzucając na nieufnym łańcuchu -- akceptuje DOWOLNY certyfikat, włącznie z własnoręcznie podpisanym certyfikatem atakującego. To klasyczna "tymczasowa naprawa" dla własnoręcznie podpisanego certyfikatu dev/staging która jest kopiowana ze Stack Overflow, wycisza błąd, i trafia do produkcji bo HTTPS wciąż widocznie "działa" -- nie ma żadnego funkcjonalnego sygnału że walidacja zniknęła. Ta klasa jest niezwykle dobrze zbadana akademicko: te same ustalenia 13500 apek, 8.0% podatnych, 41 z 100 zmuszonych do MITM z badania z 2012 zostały niezależnie potwierdzone przez wszystkie trzy przejścia badawcze, a badanie kontynuacyjne z 2021 znalazło że problem jest daleki
      od rozwiązanego dekadę później.'
  metrics:
  - k: CWE-295
    v:
      en: Weakness ID (+ CWE-297, CWE-319)
      pl: ID słabości (+ CWE-297, CWE-319)
  - k: 8.0%
    v: Apps potentially MITM-vulnerable (Fahl et al., CCS 2012)
  - k: 88.87%
    v:
      en: Custom Network Security Configs that WEAKEN security (USENIX 2021)
      pl: Niestandardowych Network Security Config które OSŁABIAJĄ bezpieczeństwo (USENIX 2021)
  - k: No CWE listed
    v:
      en: OWASP's own M5 page (verified)
      pl: Własna strona M5 OWASP (zweryfikowane)
  sources:
