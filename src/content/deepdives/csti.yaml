hero:
  titleMain: 'Client-Side Template '
  titleGrad: Injection
  titleTail: ''
  topbar: Client-Side Template Injection (CSTI)
  lead:
    en: 'PortSwigger titled the paper that named this class "XSS without HTML" — and that''s the whole story. Untrusted input reflected into a client-side templating engine''s own expression syntax (AngularJS''s {{ }}) gets evaluated as code by the framework itself, bypassing HTML-encoding entirely since the payload never contains a < or >. AngularJS 1.x is the canonical case: its pre-1.6 "sandbox" was never a real security boundary (Google''s own words), researchers broke it repeatedly, and Google simply deleted it in 1.6.0 — meaning the only real fix for AngularJS specifically is migrating off a framework that reached end-of-life in December 2021.'
    pl: 'PortSwigger nazwał artykuł który ukuł tę klasę "XSS bez HTML" — i to cała historia. Niezaufane wejście odbite we własnej składni wyrażeń silnika szablonów po stronie klienta (AngularJS {{ }}) jest ewaluowane jako kod przez sam framework, całkowicie omijając kodowanie HTML, bo ładunek nigdy nie zawiera < ani >. AngularJS 1.x to kanoniczny przypadek: jego "sandbox" sprzed 1.6 nigdy nie był prawdziwą granicą bezpieczeństwa (własnymi słowami Google), badacze wielokrotnie go łamali, a Google po prostu go usunął w 1.6.0 — co oznacza że jedyną prawdziwą naprawą dla AngularJS konkretnie jest migracja z frameworka który osiągnął koniec wsparcia w grudniu 2021.'
  metrics:
  - k: CWE-1336
    v:
      en: Weakness ID (dedicated)
      pl: ID słabości (dedykowane)
  - k: '8.8'
    v: CVSS · Critical (typical full-compromise case)
  - k: A03:2021
    v: OWASP Top 10
  - k: '6'
    v:
      en: Attack variants
      pl: Warianty ataku
  sources:
