meta:
  id: mobilekeychainkeystore
  threatId: '15.17'
  severity: High
  color: '#0e7490'
  colorRgb: 14,116,144
  cwe: CWE-522
  cvss: N/A (technique class; flagship named-product case CVE-2021-3145, Ionic Identity Vault; academic KeyDroid study of 490,119 apps found the majority of sensitive-data apps use no trusted hardware at all)
  standard: OWASP MASVS-STORAGE (MASTG-TEST-0052) + MASVS-CRYPTO (MASTG-KNOW-0043); MASVS-AUTH (MASTG-TEST-0018) for the biometric-binding sub-case
hero:
  titleMain: 'Keychain / Keystore '
  titleGrad: Misuse
  titleTail: ''
  topbar: iOS Keychain / Android Keystore Misconfiguration
  lead:
    en: 'All three research passes converged on the same precise scoping: this is not about failing to use secure storage (that''s this catalog''s M9 entry) or choosing a weak algorithm (M10) -- it''s about a developer correctly reaching for the platform''s dedicated secure-storage API and then configuring it in a way that quietly undermines the protection it''s supposed to provide. On iOS, the classic misconfiguration is storing a sensitive item with the deprecated kSecAttrAccessibleAlways class, which -- confirmed identically by all three teams -- remains decryptable even Before First Unlock (BFU), on a freshly rebooted, still-locked device, because its protection key is not derived from the passcode at all. On Android, the equivalent is generating a Keystore key without setUserAuthenticationRequired(true), which is the exact, verified root cause of CVE-2021-3145 (Ionic Identity Vault): the key was fully usable with no biometric or PIN gate at all, and a rooted attacker simply hooked the app''s own biometric-result callback to force success. All three teams independently converged on the same central myth-correction, reinforced by hard data: hardware-backed key storage (Secure Enclave, TEE, StrongBox) prevents an attacker from EXTRACTING the raw key material, but does nothing to stop an attacker from USING the key if it lacks authentication binding -- non-extractable is not the same as unusable. The academic anchor for this, found and cited near-identically by all three teams, is KeyDroid (Blessing, Anderson, Beresford, University of Cambridge, arXiv 2507.07927): a static analysis of 490,119 Android apps found that 56.3% of apps that self-report processing sensitive user data use no trusted hardware key storage at all, only 15.84% of Keystore keys require any user authentication, and just 2.78% require biometric authentication specifically -- hard evidence that the "it''s in the Keystore, therefore it''s safe" assumption this entry corrects is not a hypothetical developer error but the empirical majority case.'
    pl: 'Wszystkie trzy przejścia badawcze zbiegły się na tym samym precyzyjnym zakresie: to nie jest o niewykorzystaniu bezpiecznego przechowywania (to własny wpis M9 tego katalogu) ani o wyborze słabego algorytmu (M10) -- to o deweloperze poprawnie sięgającym po dedykowane API bezpiecznego przechowywania platformy a następnie konfigurującym je w sposób który po cichu podważa ochronę którą ma zapewniać. Na iOS, klasyczną błędną konfiguracją jest przechowywanie wrażliwego elementu z wycofaną klasą kSecAttrAccessibleAlways, która -- potwierdzone identycznie przez wszystkie trzy zespoły -- pozostaje odszyfrowywalna nawet Before First Unlock (BFU), na świeżo zrestartowanym, wciąż zablokowanym urządzeniu, ponieważ jej klucz ochrony w ogóle nie jest wyprowadzony z kodu dostępu. Na Android, odpowiednikiem jest generowanie klucza Keystore bez setUserAuthenticationRequired(true), co jest dokładną, zweryfikowaną pierwotną przyczyną CVE-2021-3145 (Ionic Identity Vault): klucz był w pełni użyteczny bez żadnej bramki biometrycznej albo PIN, a zrootowany atakujący po prostu zahaczył własny callback wyniku biometrycznego apki by wymusić sukces. Wszystkie trzy zespoły niezależnie zbiegły się na tej samej centralnej korekcie mitu, wzmocnionej twardymi danymi: przechowywanie kluczy wsparte sprzętowo (Secure Enclave, TEE, StrongBox) zapobiega WYODRĘBNIENIU surowego materiału klucza przez atakującego, ale nic nie robi by powstrzymać atakującego od UŻYCIA klucza jeśli brakuje mu wiązania uwierzytelnienia -- niewyodrębnialny to nie to samo co nieużywalny. Akademickim zakotwiczeniem tego, znalezionym i cytowanym niemal identycznie przez wszystkie trzy zespoły, jest KeyDroid (Blessing, Anderson, Beresford, University of Cambridge, arXiv 2507.07927): analiza statyczna 490119 apek Android znalazła że 56.3% apek które same zgłaszają przetwarzanie wrażliwych danych użytkownika nie używa żadnego zaufanego sprzętowego przechowywania kluczy, tylko 15.84% kluczy Keystore wymaga jakiegokolwiek uwierzytelnienia użytkownika, a jedynie 2.78% wymaga konkretnie uwierzytelnienia biometrycznego -- twardy dowód że założenie "jest w Keystore, więc jest bezpieczne" które ten wpis koryguje to nie hipotetyczny błąd dewelopera ale empiryczny przypadek większościowy.'
  metrics:
  - k: CVE-2021-3145
    v:
      en: 'Ionic Identity Vault: Android Keystore key generated with no setUserAuthenticationRequired -- biometric gate was purely decorative'
      pl: 'Ionic Identity Vault: klucz Android Keystore wygenerowany bez setUserAuthenticationRequired -- bramka biometryczna była czysto dekoracyjna'
  - k: 56.3%
    v:
      en: of apps self-reporting sensitive-data processing use NO trusted hardware key storage at all (KeyDroid, 490K+ apps)
      pl: apek same zgłaszających przetwarzanie wrażliwych danych nie używa ŻADNEGO zaufanego sprzętowego przechowywania kluczy (KeyDroid, 490K+ apek)
  - k: BFU extraction
    v:
      en: kSecAttrAccessibleAlways items are decryptable on a locked, freshly-rebooted device -- before the passcode is ever entered
      pl: elementy kSecAttrAccessibleAlways są odszyfrowywalne na zablokowanym, świeżo zrestartowanym urządzeniu -- zanim kod dostępu zostanie w ogóle wprowadzony
  - k: Non-extractable ≠ unusable
    v:
      en: hardware backing stops key extraction, not key use -- the core myth-correction confirmed unanimously across all 3 teams
      pl: wsparcie sprzętowe zatrzymuje wyodrębnienie klucza, nie jego użycie -- centralna korekta mitu potwierdzona jednomyślnie przez wszystkie 3 zespoły
  sources:
  - label: Apple -- Keychain data protection
    url: https://support.apple.com/guide/security/keychain-data-protection-secb0694df1a/web
  - label: Android -- Android Keystore system
    url: https://developer.android.com/privacy-and-security/keystore
  - label: KeyDroid -- A Large-Scale Analysis of Secure Key Storage in Android Apps (arXiv 2507.07927)
    url: https://arxiv.org/abs/2507.07927
  - label: Compass Security / Full-Disclosure -- CVE-2021-3145
    url: https://seclists.org/fulldisclosure/2021/Sep/11
