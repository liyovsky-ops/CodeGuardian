sections:
  attacks:
    title:
      en: Attack types
      pl: Typy ataków
    lead:
      en: 'Each variant shares the same shape all three research passes converged on: the secure API was used, but a specific configuration choice quietly reopened exactly the exposure the API exists to close.'
      pl: 'Każdy wariant dzieli ten sam kształt na którym zbiegły się wszystkie trzy przejścia badawcze: bezpieczne API zostało użyte, ale konkretny wybór konfiguracji po cichu ponownie otworzył dokładnie tę ekspozycję którą API ma zamknąć.'
    items:
    - name: iOS -- deprecated kSecAttrAccessibleAlways on sensitive data
      sev: high
      description:
        en: An item stored with the deprecated kSecAttrAccessibleAlways (or AlwaysThisDeviceOnly) class is decryptable even in the Before-First-Unlock state -- a locked, freshly rebooted device with no passcode entered -- because its protection key is not derived from the passcode. This is the single most-cited misconfiguration across all three research passes.
        pl: Element przechowywany z wycofaną klasą kSecAttrAccessibleAlways (albo AlwaysThisDeviceOnly) jest odszyfrowywalny nawet w stanie Before-First-Unlock -- zablokowanym, świeżo zrestartowanym urządzeniu bez wprowadzonego kodu dostępu -- ponieważ jego klucz ochrony nie jest wyprowadzony z kodu dostępu. To pojedyncza najczęściej cytowana błędna konfiguracja we wszystkich trzech przejściach badawczych.
      payload: "let query: [String: Any] = [\n    kSecClass as String: kSecClassGenericPassword,\n    kSecAttrAccount as String: \"authToken\",\n    kSecValueData as String: tokenData,\n    kSecAttrAccessible as String: kSecAttrAccessibleAlways  // decryptable even on a locked, rebooted device\n]"
    - name: Android -- Keystore key generated without setUserAuthenticationRequired
      sev: high
      description:
        en: 'A key is generated with no authentication binding at all -- it is fully usable by any code path that can reach it, at any time the app runs, with no biometric or PIN gate. Confirmed unanimously as the exact, verified root cause of CVE-2021-3145: an apparent biometric gate was purely a UI-layer check, hook-bypassable because the key itself never required authentication.'
        pl: 'Klucz jest generowany bez żadnego wiązania uwierzytelnienia -- jest w pełni użyteczny przez dowolną ścieżkę kodu która może go osiągnąć, w dowolnym momencie gdy apka działa, bez żadnej bramki biometrycznej albo PIN. Potwierdzone jednomyślnie jako dokładna, zweryfikowana pierwotna przyczyna CVE-2021-3145: pozorna bramka biometryczna była czysto sprawdzeniem warstwy UI, omijalna przez zahaczenie ponieważ sam klucz nigdy nie wymagał uwierzytelnienia.'
      payload: "val keyGenParameterSpec = KeyGenParameterSpec.Builder(\"authKey\", KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)\n    .setBlockModes(KeyProperties.BLOCK_MODE_GCM)\n    .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)\n    // .setUserAuthenticationRequired(true) -- OMITTED: key usable with no auth at all\n    .build()"
    - name: Auth-in-app-code instead of auth-bound-to-key
      sev: high
      description:
        en: Even when a biometric prompt exists, if the app validates the result in its own code rather than requiring the underlying key to be genuinely bound to a fresh per-operation authentication (CryptoObject on Android, SecAccessControl-gated access on iOS), a rooted or jailbroken attacker hooks the check itself and forces a success result -- the hardware never actually enforced anything.
        pl: Nawet gdy istnieje monit biometryczny, jeśli apka waliduje wynik we własnym kodzie zamiast wymagać by leżący u podstaw klucz był naprawdę związany ze świeżym uwierzytelnieniem per-operacja (CryptoObject na Android, dostęp bramkowany SecAccessControl na iOS), zrootowany albo jailbreakowany atakujący zahacza samo sprawdzenie i wymusza wynik sukcesu -- sprzęt nigdy faktycznie niczego nie egzekwował.
      payload: "// VULNERABLE pattern: biometric result checked in app code,\n// not bound to the key itself -- hookable via Frida:\nfun onBiometricActivityResult(resultCode: Int) {\n    if (resultCode == SUCCESS) { useKeyRegardlessOfHowItWasVerified() }\n}"
    - name: Silent software fallback when hardware backing is unavailable
      sev: medium
      description:
        en: A developer requests StrongBox or assumes TEE-backing but never verifies it actually succeeded (via KeyInfo.isInsideSecureHardware()/getSecurityLevel() or Key Attestation) -- if StrongBoxUnavailableException is caught and silently regenerated in software, or hardware-backing is simply assumed, the key ends up fully extractable under root with the developer believing otherwise.
        pl: Deweloper żąda StrongBox albo zakłada wsparcie TEE ale nigdy nie weryfikuje że faktycznie się powiodło (przez KeyInfo.isInsideSecureHardware()/getSecurityLevel() albo Key Attestation) -- jeśli StrongBoxUnavailableException jest przechwycone i po cichu ponownie wygenerowane w oprogramowaniu, albo wsparcie sprzętowe jest po prostu zakładane, klucz kończy w pełni wyodrębnialny pod rootem podczas gdy deweloper wierzy inaczej.
      payload: "try {\n    keyGenerator.init(specWithStrongBox)\n    keyGenerator.generateKey()\n} catch (e: StrongBoxUnavailableException) {\n    keyGenerator.init(specWithoutStrongBox)  // silent software fallback, never surfaced to the developer\n    keyGenerator.generateKey()\n}"
  code:
    title:
      en: Vulnerable vs Secure
      pl: Podatny vs Bezpieczny
    lead:
      en: 'The correction confirmed by all three research passes: the fix is not just moving to a hardware-backed key, but binding its use to a fresh, per-operation authentication that the secure hardware itself enforces -- an unbound hardware key is still a free decryption oracle.'
      pl: 'Korekta potwierdzona przez wszystkie trzy przejścia badawcze: naprawa to nie tylko przejście na klucz wsparty sprzętowo, ale związanie jego użycia ze świeżym uwierzytelnieniem per-operacja które sam bezpieczny sprzęt egzekwuje -- niezwiązany klucz sprzętowy to wciąż darmowa wyrocznia deszyfrująca.'
    languages:
    - label: Swift -- iOS Keychain accessibility
      lang: swift
      vulnerable: "// VULNERABLE: deprecated, decryptable even before first unlock,\n// on a locked device, with no auth prompt at all\nlet query: [String: Any] = [\n    kSecClass as String: kSecClassGenericPassword,\n    kSecAttrAccount as String: \"authToken\",\n    kSecValueData as String: tokenData,\n    kSecAttrAccessible as String: kSecAttrAccessibleAlways\n]\nSecItemAdd(query as CFDictionary, nil)"
      safe: "// SAFE: device-bound (never backed up/synced), unlock-gated,\n// PLUS a live biometric required at access time via SecAccessControl\nlet access = SecAccessControlCreateWithFlags(\n    kCFAllocatorDefault,\n    kSecAttrAccessibleWhenPasscodeSetThisDeviceOnly,\n    .biometryCurrentSet,  // invalidated if the enrolled biometric set changes\n    nil\n)!\nlet query: [String: Any] = [\n    kSecClass as String: kSecClassGenericPassword,\n    kSecAttrAccount as String: \"authToken\",\n    kSecValueData as String: tokenData,\n    kSecAttrAccessControl as String: access\n]\nSecItemAdd(query as CFDictionary, nil)"
    - label: Kotlin -- Android Keystore key generation
      lang: kotlin
      vulnerable: "// VULNERABLE: no authentication binding at all --\n// the key is usable any time the app runs, by any code path\nval spec = KeyGenParameterSpec.Builder(\"authKey\", KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)\n    .setBlockModes(KeyProperties.BLOCK_MODE_GCM)\n    .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)\n    .build()"
      safe: "// SAFE: hardware-backed where available, per-operation biometric\n// auth genuinely bound to the key (not just checked in app code),\n// invalidated if the enrolled biometric set changes\nval spec = KeyGenParameterSpec.Builder(\"authKey\", KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)\n    .setBlockModes(KeyProperties.BLOCK_MODE_GCM)\n    .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)\n    .setUserAuthenticationRequired(true)\n    .setUserAuthenticationParameters(0, KeyProperties.AUTH_BIOMETRIC_STRONG)  // per-operation, not time-windowed\n    .setInvalidatedByBiometricEnrollment(true)\n    .setIsStrongBoxBacked(true)  // catch StrongBoxUnavailableException explicitly -- never fall back silently\n    .build()\n// use only via a BiometricPrompt.CryptoObject bound to this key -- never check the\n// biometric result in app code alone"
  method:
    title:
      en: Attack methodology
      pl: Metodyka ataku
    lead:
      en: 'All three research passes converged on the same review sequence: check the configuration attributes first, then separately verify hardware-backing actually succeeded, since a declared intention (StrongBox requested, auth required) does not guarantee the runtime outcome.'
      pl: 'Wszystkie trzy przejścia badawcze zbiegły się na tej samej sekwencji przeglądu: sprawdź najpierw atrybuty konfiguracji, następnie osobno zweryfikuj że wsparcie sprzętowe faktycznie się powiodło, ponieważ zadeklarowana intencja (żądany StrongBox, wymagane uwierzytelnienie) nie gwarantuje wyniku w czasie wykonania.'
    steps:
    - title:
        en: Grep for the specific misconfiguration signatures
        pl: Grepuj pod kątem konkretnych sygnatur błędnej konfiguracji
      description:
        en: 'iOS: search for kSecAttrAccessibleAlways/AlwaysThisDeviceOnly and the absence of kSecAttrAccessControl on sensitive items. Android: search KeyGenParameterSpec.Builder call sites for a missing setUserAuthenticationRequired(true), an excessively long setUserAuthenticationValidityDurationSeconds, or setInvalidatedByBiometricEnrollment(false) -- mobsfscan ships dedicated rules (ios_keychain_weak_accessibility_value, ios_keychain_weak_acl_device_passcode) for exactly the iOS side of this check.'
        pl: 'iOS: szukaj kSecAttrAccessibleAlways/AlwaysThisDeviceOnly i braku kSecAttrAccessControl na wrażliwych elementach. Android: szukaj miejsc wywołania KeyGenParameterSpec.Builder pod kątem brakującego setUserAuthenticationRequired(true), nadmiernie długiego setUserAuthenticationValidityDurationSeconds, albo setInvalidatedByBiometricEnrollment(false) -- mobsfscan dostarcza dedykowane reguły (ios_keychain_weak_accessibility_value, ios_keychain_weak_acl_device_passcode) dokładnie dla strony iOS tego sprawdzenia.'
    - title:
        en: Dump the Keychain/Keystore at runtime and observe what comes out unauthenticated
        pl: Zrzuć Keychain/Keystore w czasie wykonania i obserwuj co wychodzi bez uwierzytelnienia
      description:
        en: objection's ios keychain dump and android keystore list enumerate every item/key with its actual accessibility attribute or auth requirement -- directly exposing which entries would be returned with no auth prompt on a compromised device, without needing to read source code at all.
        pl: ios keychain dump i android keystore list objection wyliczają każdy element/klucz z jego faktycznym atrybutem dostępności albo wymogiem uwierzytelnienia -- bezpośrednio ujawniając które wpisy zostałyby zwrócone bez monitu uwierzytelnienia na skompromitowanym urządzeniu, bez potrzeby czytania kodu źródłowego w ogóle.
    - title:
        en: Verify hardware-backing actually succeeded, don't trust the declared intent
        pl: Zweryfikuj że wsparcie sprzętowe faktycznie się powiodło, nie ufaj zadeklarowanej intencji
      description:
        en: Check KeyInfo.isInsideSecureHardware()/getSecurityLevel() (Android) or confirm Secure-Enclave-generated key types (iOS) at runtime rather than trusting that setIsStrongBoxBacked(true) or a documentation comment means the key actually ended up in hardware -- a caught-and-silently-regenerated StrongBoxUnavailableException is the specific gap this step catches.
        pl: Sprawdź KeyInfo.isInsideSecureHardware()/getSecurityLevel() (Android) albo potwierdź typy kluczy generowanych przez Secure Enclave (iOS) w czasie wykonania zamiast ufać że setIsStrongBoxBacked(true) albo komentarz w dokumentacji oznacza że klucz faktycznie wylądował w sprzęcie -- przechwycone-i-po-cichu-ponownie-wygenerowane StrongBoxUnavailableException to konkretna luka którą ten krok łapie.
    - title:
        en: Attempt runtime interception regardless of storage tier
        pl: Spróbuj przechwycenia w czasie wykonania niezależnie od poziomu przechowywania
      description:
        en: On a rooted/jailbroken test device, hook Cipher.doFinal() (Android) or SecItemAdd/SecItemCopyMatching (iOS) with Frida to confirm whether plaintext is interceptable at the API boundary regardless of hardware-backing -- this is the check that reveals hardware-backing alone was never going to be sufficient without genuine per-operation auth binding.
        pl: Na zrootowanym/jailbreakowanym urządzeniu testowym, zahacz Cipher.doFinal() (Android) albo SecItemAdd/SecItemCopyMatching (iOS) przez Frida by potwierdzić czy jawny tekst jest przechwytywalny na granicy API niezależnie od wsparcia sprzętowego -- to sprawdzenie które ujawnia że samo wsparcie sprzętowe nigdy nie miało być wystarczające bez prawdziwego wiązania uwierzytelnienia per-operacja.
  defenses:
    title:
      en: Defense layers, ranked
      pl: Warstwy obrony wg skuteczności
    lead:
      en: 'All three research passes converged on the same top control and, critically, on the same hard limit for it: hardware-backing alone stops extraction, not use -- it must be paired with genuine per-operation authentication binding to matter against a compromised device.'
      pl: 'Wszystkie trzy przejścia badawcze zbiegły się na tej samej najwyższej kontroli i, kluczowo, na tym samym twardym ograniczeniu dla niej: samo wsparcie sprzętowe zatrzymuje wyodrębnienie, nie użycie -- musi być połączone z prawdziwym wiązaniem uwierzytelnienia per-operacja by miało znaczenie przeciw skompromitowanemu urządzeniu.'
    items:
    - rank: 1
      eff: 80
      kind: primary
      label:
        en: Genuine per-operation authentication bound to the key itself
        pl: Prawdziwe uwierzytelnienie per-operacja związane z samym kluczem
      note:
        en: 'iOS: SecAccessControl with .biometryCurrentSet, evaluated inside the Secure Enclave. Android: setUserAuthenticationRequired(true) + setUserAuthenticationParameters(0, ...) via a BiometricPrompt.CryptoObject, never a plain app-code check. Confirmed as the exact fix for the CVE-2021-3145 pattern -- the auth must be enforced by the hardware releasing the key, not validated in app code that a rooted attacker can hook.'
        pl: 'iOS: SecAccessControl z .biometryCurrentSet, ewaluowane wewnątrz Secure Enclave. Android: setUserAuthenticationRequired(true) + setUserAuthenticationParameters(0, ...) przez BiometricPrompt.CryptoObject, nigdy zwykłe sprawdzenie w kodzie apki. Potwierdzone jako dokładna naprawa dla wzorca CVE-2021-3145 -- uwierzytelnienie musi być egzekwowane przez sprzęt zwalniający klucz, nie walidowane w kodzie apki który zrootowany atakujący może zahaczyć.'
    - rank: 2
      eff: 65
      kind: primary
      label:
        en: Hardware-backed keys (Secure Enclave / TEE / StrongBox), verified not assumed
        pl: Klucze wsparte sprzętowo (Secure Enclave / TEE / StrongBox), zweryfikowane nie zakładane
      note:
        en: 'Prevents raw key extraction even under root/jailbreak -- confirmed unanimously as real, meaningful protection. Critical caveat, confirmed identically by all three teams: this stops extraction, not use -- an unbound hardware key remains a fully usable oracle on a compromised, unlocked device. Must be verified via KeyInfo.isInsideSecureHardware()/getSecurityLevel() or Key Attestation, since a silently-caught StrongBoxUnavailableException is a real, documented failure mode.'
        pl: 'Zapobiega wyodrębnieniu surowego klucza nawet pod rootem/jailbreakiem -- potwierdzone jednomyślnie jako prawdziwa, znacząca ochrona. Krytyczne zastrzeżenie, potwierdzone identycznie przez wszystkie trzy zespoły: to zatrzymuje wyodrębnienie, nie użycie -- niezwiązany klucz sprzętowy pozostaje w pełni użyteczną wyrocznią na skompromitowanym, odblokowanym urządzeniu. Musi być zweryfikowane przez KeyInfo.isInsideSecureHardware()/getSecurityLevel() albo Key Attestation, ponieważ po cichu przechwycone StrongBoxUnavailableException to prawdziwy, udokumentowany tryb awarii.'
    - rank: 3
      eff: 55
      kind: strong
      label:
        en: Correct iOS accessibility class as the baseline
        pl: Poprawna klasa dostępności iOS jako podstawa
      note:
        en: 'kSecAttrAccessibleWhenUnlockedThisDeviceOnly as the strong default for most secrets; kSecAttrAccessibleWhenPasscodeSetThisDeviceOnly for the most sensitive (requires a passcode, self-deletes if the passcode is removed). Caveat: this governs lock-state and backup exposure only -- it adds no auth prompt and does nothing against an attacker with the device already unlocked or jailbroken.'
        pl: 'kSecAttrAccessibleWhenUnlockedThisDeviceOnly jako silny domyślny wybór dla większości sekretów; kSecAttrAccessibleWhenPasscodeSetThisDeviceOnly dla najbardziej wrażliwych (wymaga kodu dostępu, samousuwa się jeśli kod dostępu zostanie usunięty). Zastrzeżenie: to reguluje tylko stan blokady i ekspozycję kopii zapasowej -- nie dodaje żadnego monitu uwierzytelnienia i nic nie robi przeciw atakującemu z już odblokowanym albo jailbreakowanym urządzeniem.'
    - rank: 4
      eff: 45
      kind: strong
      label:
        en: ThisDeviceOnly / avoid iCloud Keychain sync for device-specific secrets
        pl: ThisDeviceOnly / unikaj synchronizacji iCloud Keychain dla sekretów specyficznych dla urządzenia
      note:
        en: 'Defeats the backup-extraction path specifically -- ThisDeviceOnly items are protected with a device-UID-derived key and cannot appear in decryptable backups or migrate to another device. Caveat, with a counter-intuitive nuance one team flagged: a password-protected iOS backup can actually expose MORE keychain data than an unencrypted one, since non-ThisDeviceOnly items decrypt with the backup password while an unencrypted backup re-wraps them under the device UID.'
        pl: 'Pokonuje konkretnie ścieżkę wyodrębnienia z kopii zapasowej -- elementy ThisDeviceOnly są chronione kluczem wyprowadzonym z UID urządzenia i nie mogą pojawić się w odszyfrowywalnej kopii zapasowej ani migrować na inne urządzenie. Zastrzeżenie, z kontrintuicyjnym niuansem który jeden zespół oflagował: kopia zapasowa iOS chroniona hasłem może faktycznie ujawnić WIĘCEJ danych keychain niż nieszyfrowana, ponieważ elementy nie-ThisDeviceOnly odszyfrowują się hasłem kopii zapasowej podczas gdy nieszyfrowana kopia zapasowa ponownie owija je pod UID urządzenia.'
    - rank: 5
      eff: 30
      kind: weak
      label:
        en: Short, per-operation validity windows rather than time-based auth
        pl: Krótkie okna ważności per-operacja zamiast uwierzytelnienia opartego na czasie
      note:
        en: 'Prefer setUserAuthenticationParameters(0, ...) over a long setUserAuthenticationValidityDurationSeconds. Caveat, sourced directly from Android''s own documentation: secure hardware does not usually enforce time-based validity windows reliably, since it typically lacks an independent secure real-time clock -- a time-window auth is weaker than developers commonly assume, which is exactly why per-operation binding ranks above it.'
        pl: 'Preferuj setUserAuthenticationParameters(0, ...) zamiast długiego setUserAuthenticationValidityDurationSeconds. Zastrzeżenie, źródłowane bezpośrednio z własnej dokumentacji Android: bezpieczny sprzęt zwykle nie egzekwuje niezawodnie okien ważności opartych na czasie, ponieważ zazwyczaj brakuje mu niezależnego bezpiecznego zegara czasu rzeczywistego -- uwierzytelnienie w oknie czasowym jest słabsze niż deweloperzy zwykle zakładają, co dokładnie dlatego wiązanie per-operacja plasuje się powyżej niego.'
  incidents:
    title:
      en: Real-world incidents
      pl: Rzeczywiste incydenty
    lead:
      en: All three research passes independently converged on the same flagship named-product CVE and the same large-scale academic study -- unusually strong triple corroboration on both the qualitative mechanism and the quantitative scale of this problem.
      pl: Wszystkie trzy przejścia badawcze niezależnie zbiegły się na tym samym flagowym CVE nazwanego produktu i tym samym badaniu akademickim na dużą skalę -- niezwykle silna potrójna korporacja zarówno na jakościowym mechanizmie jak i ilościowej skali tego problemu.
    items:
    - org: CVE-2021-3145 -- Ionic Identity Vault (<= v4.7)
      year: 2021
      impact: 'Biometric authentication was fully bypassable: the underlying Android Keystore key was generated without setUserAuthenticationRequired, so it never actually required biometric or PIN authentication to use'
      cost: Disclosed by Compass Security; fixed in Identity Vault v5; a rooted attacker could force the app's own biometric-result callback to report success with no user interaction
      description:
        en: 'Confirmed identically and independently by all three research passes as the textbook incident for this entire catalog entry: the app displayed a biometric prompt to the user, but the Keystore key itself imposed no authentication requirement at all, so the "security" was purely a UI-layer illusion a rooted attacker could hook and bypass without ever touching a fingerprint sensor.'
        pl: 'Potwierdzone identycznie i niezależnie przez wszystkie trzy przejścia badawcze jako podręcznikowy incydent dla całego tego wpisu katalogu: apka wyświetlała monit biometryczny użytkownikowi, ale sam klucz Keystore nie nakładał żadnego wymogu uwierzytelnienia w ogóle, więc "bezpieczeństwo" było czystą iluzją warstwy UI którą zrootowany atakujący mógł zahaczyć i ominąć nigdy nie dotykając czytnika linii papilarnych.'
    - org: KeyDroid -- large-scale academic analysis of Android key storage
      year: 2025
      impact: Static analysis of 490,119 Android apps found 56.3% of apps self-reporting sensitive-data processing use no trusted hardware key storage at all; only 15.84% of Keystore keys require any user authentication and only 2.78% require biometric authentication specifically
      cost: Blessing, Anderson, Beresford (University of Cambridge), arXiv 2507.07927
      description:
        en: 'Confirmed with closely matching figures by all three independent research passes -- unusually strong corroboration for an academic source. This transforms the entry''s central myth-correction from a plausible developer error into an empirically dominant pattern: most apps that should be using hardware-backed, auth-bound key storage for sensitive data simply are not, and a large fraction of Keystore API calls originate in third-party libraries the app developer may not have deliberately configured at all.'
        pl: 'Potwierdzone z blisko pasującymi liczbami przez wszystkie trzy niezależne przejścia badawcze -- niezwykle silna korporacja dla źródła akademickiego. To przekształca centralną korektę mitu tego wpisu z prawdopodobnego błędu dewelopera w empirycznie dominujący wzorzec: większość apek które powinny używać wspartego sprzętowo, związanego uwierzytelnieniem przechowywania kluczy dla wrażliwych danych po prostu tego nie robi, a duża część wywołań API Keystore pochodzi z bibliotek zewnętrznych które deweloper apki mógł nigdy celowo nie skonfigurować.'
    inlineSources:
    - label: Compass Security -- CVE-2021-3145 advisory
      url: https://www.compass-security.com/fileadmin/Research/Advisories/2021-13_CSNC-2021-001_Ionic_Identity_Vault_Biometric_Authentication_Bypass.txt
    - label: KeyDroid (arXiv 2507.07927)
      url: https://arxiv.org/abs/2507.07927
    - label: Elcomsoft -- Extracting and decrypting iOS Keychain
      url: https://blog.elcomsoft.com/2020/08/extracting-and-decrypting-ios-keychain-physical-logical-and-cloud-options-explored/
  tools:
    title:
      en: Detection tooling
      pl: Narzędzia wykrywania
    lead:
      en: All three research passes converged on objection as the primary dynamic tool for this exact bug class -- it directly enumerates what a compromised device would actually see, independent of what the source code claims.
      pl: Wszystkie trzy przejścia badawcze zbiegły się na objection jako podstawowym narzędziu dynamicznym dla dokładnie tej klasy błędu -- bezpośrednio wylicza co skompromitowane urządzenie faktycznie by zobaczyło, niezależnie od tego co twierdzi kod źródłowy.
    sast:
    - - mobsfscan -- ios_keychain_weak_accessibility_value / ios_keychain_weak_acl_device_passcode
      - Dedicated semgrep-based rules flagging weak kSecAttrAccessible values and missing/weak SecAccessControl configuration
    - - Static grep for KeyGenParameterSpec.Builder call sites
      - Flags missing setUserAuthenticationRequired(true), excessively long setUserAuthenticationValidityDurationSeconds, or setInvalidatedByBiometricEnrollment(false)
    - - MobSF
      - Surfaces Keychain/Keystore API usage and configuration during static manifest/plist and code analysis
    dast:
    - - objection -- ios keychain dump / android keystore list
      - Enumerates every Keychain item with its actual accessibility attribute, or every Keystore key with its actual auth requirement -- directly exposing what would be returned with no auth prompt on a compromised device
    - - keychain-dumper (jailbroken iOS)
      - Dumps every currently-accessible Keychain item and its protection class in seconds
    - - Frida -- hooking SecItemAdd/SecItemCopyMatching (iOS) or Cipher.doFinal (Android)
      - Confirms whether plaintext is interceptable at the API boundary regardless of storage tier, and whether an auth check is enforced by hardware or merely validated in app code
    note:
      en: <strong>Key signal:</strong> a key or item that objection/Frida can access with no auth prompt on a test device is exploitable regardless of whether the source code declares hardware-backing was requested -- verify the runtime outcome, not the declared configuration intent.
      pl: <strong>Kluczowy sygnał:</strong> klucz albo element do którego objection/Frida może uzyskać dostęp bez monitu uwierzytelnienia na urządzeniu testowym jest eksploatowalny niezależnie od tego czy kod źródłowy deklaruje że wsparcie sprzętowe było żądane -- weryfikuj wynik w czasie wykonania, nie zadeklarowaną intencję konfiguracji.
  compliance:
    title:
      en: Compliance quick-reference
      pl: Szybka zgodność
    lead:
      en: All three research passes converged on CWE-522 as primary, and two of three explicitly verified against MITRE's own mapping guidance that CWE-320 (Key Management Errors) cannot be used as a mapping target at all -- it is a category, not a weakness.
      pl: Wszystkie trzy przejścia badawcze zbiegły się na CWE-522 jako głównym, a dwa z trzech jawnie zweryfikowały względem własnych wskazówek mapowania MITRE że CWE-320 (Key Management Errors) nie może być w ogóle użyte jako cel mapowania -- to kategoria, nie słabość.
    items:
    - std: CWE (MITRE)
      items:
      - 'CWE-522 -- Insufficiently Protected Credentials (primary, unanimous). Fits precisely: the credential IS stored via the correct mechanism, but that mechanism''s protection method (accessibility class, auth binding) is insufficient -- exactly CWE-522''s own definition of "an insecure method susceptible to unauthorized interception and/or retrieval."'
      - 'CWE-320 -- Key Management Errors (explicitly rejected as a mapping target by two of three research passes). Verified at MITRE: this is a Category, and MITRE''s own mapping guidance has discouraged category-level mapping since 2019. Do not cite it as this entry''s CWE despite conceptually describing the right problem area.'
      - 'CWE-311 (Missing Encryption) and CWE-921 (Storage Without Access Control) considered and rejected as poor fits: the data in this entry''s scope IS encrypted and IS stored in an access-controlled mechanism -- the defect is specifically in how that mechanism''s protection was configured, not in its absence.'
    - std: OWASP
      items:
      - MASVS-STORAGE (primary) -- MASTG-TEST-0052 "Testing Local Data Storage" (iOS), covering Keychain accessibility-class analysis; MASTG-KNOW-0043 "Android KeyStore" for the Android side.
      - 'MASVS-CRYPTO (secondary) -- governs key-management proper: generation attributes, hardware-backing verification, key attestation (MASTG-KNOW-0044).'
      - MASVS-AUTH (for the biometric-binding sub-case) -- MASTG-TEST-0018 "Testing Biometric Authentication", directly relevant to the CVE-2021-3145 pattern where the auth check itself is the vulnerable component. All three teams flagged that MASTG is mid-refactor and exact test-ID numbering may shift -- verify current IDs before citing in an audit.
    inlineSources:
    - label: CWE-522 (MITRE)
      url: https://cwe.mitre.org/data/definitions/522.html
    - label: OWASP MASTG-TEST-0052
      url: https://mas.owasp.org/MASTG/tests/ios/MASVS-STORAGE/MASTG-TEST-0052/
    - label: OWASP MASTG-KNOW-0043
      url: https://mas.owasp.org/MASTG/knowledge/android/MASVS-STORAGE/MASTG-KNOW-0043/
  ir:
    title:
      en: Incident response checklist
      pl: Lista kontrolna reagowania
    lead:
      en: If a Keychain/Keystore misconfiguration is confirmed in a shipped app, work this list top to bottom.
      pl: Po potwierdzeniu błędnej konfiguracji Keychain/Keystore w wysłanej apce, przejdź tę listę od góry.
    steps:
    - en: 'Identify which layer failed: accessibility class/backup exposure, missing auth-binding on the key itself, or auth validated in app code instead of bound to the key -- each needs a different specific fix'
      pl: 'Zidentyfikuj która warstwa zawiodła: klasa dostępności/ekspozycja kopii zapasowej, brakujące wiązanie uwierzytelnienia na samym kluczu, albo uwierzytelnienie walidowane w kodzie apki zamiast związane z kluczem -- każda potrzebuje innej konkretnej naprawy'
    - en: Enumerate every Keychain item / Keystore key with objection or Frida to determine exactly what data is exposed and under what conditions (locked device, backup, root/jailbreak) -- don't assume the fix scope from source code alone
      pl: Wylicz każdy element Keychain / klucz Keystore przez objection albo Frida by ustalić dokładnie jakie dane są eksponowane i pod jakimi warunkami (zablokowane urządzenie, kopia zapasowa, root/jailbreak) -- nie zakładaj zakresu naprawy tylko z kodu źródłowego
    - en: Treat every historical secret protected by the misconfigured entry as potentially compromised if the app has been in the wild -- rotating keys/tokens going forward does not retroactively protect data already extracted via backup or a prior jailbreak dump
      pl: Traktuj każdy historyczny sekret chroniony przez błędnie skonfigurowany element jako potencjalnie skompromitowany jeśli apka była w obiegu -- rotacja kluczy/tokenów na przyszłość nie chroni retroaktywnie danych już wyodrębnionych przez kopię zapasową albo wcześniejszy zrzut jailbreak
    - en: 'Ship the fix matching this deep-dive''s top-ranked defenses: bind key use to genuine per-operation authentication first (CryptoObject/SecAccessControl, not an app-code check), then verify hardware-backing actually succeeded rather than assuming it did'
      pl: 'Wydaj naprawę pasującą do najwyżej sklasyfikowanych obron tego deep-dive: najpierw zwiąż użycie klucza z prawdziwym uwierzytelnieniem per-operacja (CryptoObject/SecAccessControl, nie sprawdzenie w kodzie apki), następnie zweryfikuj że wsparcie sprzętowe faktycznie się powiodło zamiast to zakładać'
    - en: Re-verify with objection/Frida on a rooted or jailbroken test device that the fix actually enforces authentication at the hardware layer, not just that a biometric prompt now appears somewhere in the UI
      pl: Zweryfikuj ponownie przez objection/Frida na zrootowanym albo jailbreakowanym urządzeniu testowym że naprawa faktycznie egzekwuje uwierzytelnienie na warstwie sprzętowej, nie tylko że monit biometryczny teraz gdzieś pojawia się w UI
