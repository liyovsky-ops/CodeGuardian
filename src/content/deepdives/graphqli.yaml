meta:
  id: graphqli
  threatId: "1.13"
  severity: High
  color: "#e10098"
  colorRgb: 225,0,152
  cwe: CWE-89
  cvss: "9.3"
  standard: OWASP A03:2021
hero:
  titleMain: GraphQL
  titleGrad: Injection
  titleTail: ""
  topbar: GraphQL Injection
  lead:
    en: "GraphQL validates the shape of a query against its schema, but performs zero sanitization of the argument values a client supplies. When a resolver forwards an attacker-controlled argument into a SQL query, a NoSQL filter, a shell command, or an outbound request — via string concatenation instead of a parameterized/safe API — the classic injection classes apply unchanged. The schema's type system creates a false sense of safety: a String-typed argument can still carry ' OR '1'='1, and a permissive JSON-typed filter argument can carry a raw MongoDB operator."
    pl: "GraphQL waliduje kształt zapytania względem schematu, ale nie sanityzuje wartości argumentów podawanych przez klienta. Gdy resolver przekazuje argument kontrolowany przez atakującego do zapytania SQL, filtra NoSQL, polecenia powłoki lub żądania wychodzącego — przez konkatenację stringów zamiast bezpiecznego API — klasyczne klasy wstrzyknięć działają bez zmian. System typów schematu daje fałszywe poczucie bezpieczeństwa: argument typu String może wciąż nieść ' OR '1'='1, a permisywny argument typu JSON może nieść surowy operator MongoDB."
  metrics:
    - k: CWE-89
      v:
        en: Weakness ID
        pl: ID słabości
    - k: "9.3"
      v: CVSS · Critical (CVE-2024-37843)
    - k: A03:2021
      v: OWASP Top 10
    - k: "3+3"
      v:
        en: Core + adjacent variants
        pl: Warianty rdzenne + pokrewne
  sources:
    - label: OWASP GraphQL Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/GraphQL_Cheat_Sheet.html
    - label: CWE-89 (MITRE)
      url: https://cwe.mitre.org/data/definitions/89.html
    - label: CWE-943 (MITRE)
      url: https://cwe.mitre.org/data/definitions/943.html
    - label: PortSwigger — GraphQL
      url: https://portswigger.net/web-security/graphql
    - label: CVE-2024-37843 (Craft CMS)
      url: https://github.com/advisories/GHSA-hq4f-mv3q-8wcv
