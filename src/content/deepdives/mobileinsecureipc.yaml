meta:
  id: mobileinsecureipc
  threatId: '15.13'
  severity: High
  color: '#b91c1c'
  colorRgb: 185,28,28
  cwe: CWE-926
  cvss: N/A (technique class spanning exported Activities/Services/Receivers/Providers; flagship in-the-wild case CVE-2021-25337 was exploited as part of a real attack chain per Google Project Zero)
  standard: OWASP MASVS-PLATFORM-1 (MASTG-TEST-0029 / MASTG-TEST-0364-0366)
hero:
  titleMain: 'Insecure '
  titleGrad: IPC
  titleTail: ' via Exported Components'
  topbar: Insecure IPC via Exported Android Components
  lead:
    en: 'All three research passes converged cleanly on scope and mapping (unlike the 15.12 entry, where the CWE choice was contested): the core defect is an exported Activity, Service, BroadcastReceiver, or ContentProvider reachable by any other app on the device with zero privileges, that performs a sensitive action -- reads/writes private data, triggers a privileged operation, or exposes a post-authentication screen -- without validating the caller. This is CWE-926 (Improper Export of Android Application Components), whose own MITRE text names all three component families this entry covers, and is distinct from the sibling entries: 15.11''s WebView bridge (CWE-749) is a different mechanism, and 15.12''s Intent redirection (CWE-940/926) is specifically about a trusted deputy forwarding an attacker-controlled Intent -- 15.13 covers the component simply being reachable and unprotected in the first place. The single most important corrective finding, confirmed identically by all three passes: Android 12 (API 31) did NOT change any default value for android:exported -- it made the attribute mandatory to declare explicitly whenever a component has an intent-filter, and the build/install fails without it. The historical implicit default (intent-filter present -> exported=true) is unchanged for older targets. ContentProviders had an earlier, separate default flip -- to exported=false -- at API 17 (Android 4.2), only when the app''s target/minSdkVersion is 17+. A second, well-documented but under-appreciated finding all three teams independently flagged: parameterized selectionArgs on a ContentProvider protects only the selection clause -- the projection (column list) is not automatically sanitized, and an unwhitelisted projection can pull data from entirely different tables through a single exposed URI.'
    pl: 'Wszystkie trzy przejścia badawcze zbiegły się czysto co do zakresu i mapowania (w przeciwieństwie do wpisu 15.12, gdzie wybór CWE był sporny): pierwotną wadą jest wyeksportowana Activity, Service, BroadcastReceiver, albo ContentProvider osiągalna przez dowolną inną apkę na urządzeniu z zerowymi uprawnieniami, która wykonuje wrażliwą akcję -- czyta/pisze prywatne dane, wyzwala uprzywilejowaną operację, albo wystawia ekran po-uwierzytelnieniu -- bez walidacji wywołującego. To CWE-926 (Improper Export of Android Application Components), którego własny tekst MITRE nazywa wszystkie trzy rodziny komponentów które ten wpis pokrywa, i jest odrębne od siostrzanych wpisów: mostek WebView 15.11 (CWE-749) to inny mechanizm, a Intent redirection 15.12 (CWE-940/926) dotyczy konkretnie zaufanego pośrednika przekazującego kontrolowany przez atakującego Intent -- 15.13 pokrywa sam komponent będący osiągalnym i niechronionym w pierwszej kolejności. Pojedyncze najważniejsze ustalenie korygujące, potwierdzone identycznie przez wszystkie trzy przejścia: Android 12 (API 31) NIE zmienił żadnej wartości domyślnej dla android:exported -- uczynił atrybut obowiązkowym do jawnej deklaracji ilekroć komponent ma intent-filter, a build/instalacja zawodzi bez tego. Historyczna domyślna wartość niejawna (obecny intent-filter -> exported=true) jest niezmieniona dla starszych celów. ContentProvider miał wcześniejszą, osobną zmianę domyślnej wartości -- na exported=false -- w API 17 (Android 4.2), tylko gdy target/minSdkVersion apki to 17+. Drugie, dobrze udokumentowane ale niedocenione ustalenie które wszystkie trzy zespoły niezależnie oflagowały: sparametryzowane selectionArgs na ContentProvider chroni tylko klauzulę selection -- projection (lista kolumn) nie jest automatycznie sanityzowana, a niewhitelistowana projection może wyciągnąć dane z zupełnie innych tabel przez pojedynczy wystawiony URI.'
  metrics:
  - k: CVE-2021-25337
    v:
      en: 'Samsung clipboard ContentProvider: exploited as part of a real in-the-wild attack chain (Google Project Zero)'
      pl: 'ContentProvider schowka Samsung: wykorzystane jako część prawdziwego łańcucha ataku in-the-wild (Google Project Zero)'
  - k: CWE-926
    v:
      en: MITRE's own definition names Activities, Services, and Content Providers directly -- confirmed by all 3 teams as the clean best-fit
      pl: Własna definicja MITRE nazywa bezpośrednio Activities, Services, i Content Providers -- potwierdzone przez wszystkie 3 zespoły jako czyste najlepsze dopasowanie
  - k: API 17 vs API 31
    v:
      en: 'two separate, often-conflated default-export changes: ContentProvider (4.2) vs mandatory declaration (Android 12)'
      pl: 'dwie osobne, często mylone zmiany domyślnego eksportu: ContentProvider (4.2) vs obowiązkowa deklaracja (Android 12)'
  - k: selectionArgs
    v:
      en: protects only the selection clause -- the projection column list remains a common, under-protected SQL injection vector
      pl: chroni tylko klauzulę selection -- lista kolumn projection pozostaje powszechnym, niedostatecznie chronionym wektorem SQL injection
  sources:
  - label: CWE-926 -- Improper Export of Android Application Components
    url: https://cwe.mitre.org/data/definitions/926.html
  - label: Android -- android:exported risk page
    url: https://developer.android.com/privacy-and-security/risks/android-exported
  - label: Android -- SQL injection risk page
    url: https://developer.android.com/privacy-and-security/risks/sql-injection
