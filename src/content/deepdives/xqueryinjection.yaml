meta:
  id: xqueryinjection
  threatId: '1.19'
  severity: Critical
  color: '#0e7490'
  colorRgb: 14,116,144
  cwe: CWE-652
  cvss: '9.1'
  standard: OWASP A03:2021
hero:
  titleMain: 'XQuery '
  titleGrad: Injection
  titleTail: ''
  topbar: XQuery Injection
  lead:
    en: SQL injection's exact analog for XML databases -- but with a higher ceiling. XPath injection is constrained to node selection; XQuery is a full, Turing-complete functional language (W3C spec), and its native XML databases ship extension modules that turn a confirmed injection into arbitrary file read/write or OS command execution. BaseX's proc:system() runs a real shell command from inside a stylesheet-equivalent query, no gadget chain required. Unlike SQLi's vast CVE corpus, all three independent research passes found no confirmed, named product CVE for this class -- a genuinely thin, largely academic area, reported honestly here rather than manufacturing an incident that doesn't exist.
    pl: Dokładny odpowiednik SQL injection dla baz danych XML -- ale z wyższym sufitem. Wstrzyknięcie XPath jest ograniczone do selekcji węzłów; XQuery to pełny, Turing-zupełny język funkcyjny (specyfikacja W3C), a jego natywne bazy danych XML dostarczają moduły rozszerzeń które zamieniają potwierdzone wstrzyknięcie w dowolny odczyt/zapis pliku albo wykonanie polecenia OS. proc:system() BaseX uruchamia prawdziwe polecenie powłoki z wnętrza zapytania odpowiadającego arkuszowi stylów, bez potrzeby łańcucha gadżetów. W przeciwieństwie do ogromnego korpusu CVE SQLi, wszystkie trzy niezależne przejścia badawcze nie znalazły żadnego potwierdzonego, nazwanego CVE produktu dla tej klasy -- naprawdę wąski, głównie akademicki obszar, zgłoszony tu uczciwie zamiast wymyślania nieistniejącego incydentu.
  metrics:
  - k: CWE-652
    v:
      en: Weakness ID (child of CWE-91 + CWE-943)
      pl: ID słabości (dziecko CWE-91 + CWE-943)
