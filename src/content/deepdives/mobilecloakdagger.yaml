meta:
  id: mobilecloakdagger
  threatId: '15.21'
  severity: High
  color: '#78350f'
  colorRgb: 120,53,15
  cwe: CWE-1021
  cvss: N/A (technique class; no single CVE covers the original two-permission combination -- see incidents)
  standard: OWASP MASVS-PLATFORM (MASTG-TEST-0035 Testing for Overlay Attacks; MASTG-KNOW-0022 Overlay Attacks, which explicitly names Cloak & Dagger)
hero:
  titleMain: 'Cloak & Dagger '
  titleGrad: (Overlay + Accessibility)
  titleTail: ''
  topbar: Cloak & Dagger -- Android Overlay + Accessibility Service Attack
  lead:
    en: 'All three research passes independently fetched the original source -- Fratantonio, Qian, Chung & Lee''s "Cloak and Dagger: From Two Permissions to Complete Control of the UI Feedback Loop," IEEE S&P 2017 (Distinguished Practical Paper Award), demonstrated against Android 5.1.1 through 7.1.2 -- and converged on the same core distinction from this catalog''s 15.15 (Tapjacking) entry: 15.15 covers passive tap interception via a deceptive overlay alone; this entry is specifically the SYSTEM_ALERT_WINDOW + BIND_ACCESSIBILITY_SERVICE combination, which grants "complete control of the UI feedback loop" -- the overlay hides what''s really happening (the cloak) while the accessibility service reads the screen and injects synthetic taps and keystrokes (the dagger). The overlay''s own first job is bootstrapping: clickjacking the user into enabling the accessibility service in the first place. Once both are live, the attacker can silently walk through permission dialogs to reach "god-mode" (all permissions granted, no conscious user approval), log keystrokes and PINs via accessibility events, and unlock the device with the screen kept off. In the authors'' own user study of 20 subjects, none detected they were under attack. A finding unanimous across all three research passes and directly relevant to defenses documented elsewhere in this catalog: FLAG_SECURE, which blocks screenshot and screen-recording capture, does NOT block accessibility-tree reading -- a malicious accessibility service reads the structured text/labels of every on-screen field directly, without ever capturing a pixel. Google''s response to the original research was primarily a platform behavior change (removing the silent SYSTEM_ALERT_WINDOW auto-grant, tightened in Android 8.0) rather than a single patched CVE for the combination itself -- and, all three passes confirm, that closed only the frictionless bootstrapping bug. The underlying overlay+accessibility combination remains a live, actively weaponized pattern in 2019-2025 Android banking trojans (Cerberus, TeaBot, Xenomorph, Crocodilus, Herodotus) that simply social-engineer the user into manually granting accessibility instead.'
    pl: 'Wszystkie trzy przejścia badawcze niezależnie pobrały pierwotne źródło -- "Cloak and Dagger: From Two Permissions to Complete Control of the UI Feedback Loop" Fratantonio, Qian, Chung i Lee, IEEE S&P 2017 (Distinguished Practical Paper Award), zademonstrowane przeciwko Android 5.1.1 do 7.1.2 -- i zbiegły się na tym samym podstawowym rozróżnieniu od wpisu 15.15 (Tapjacking) tego katalogu: 15.15 obejmuje pasywne przechwytywanie dotknięć przez samą zwodniczą nakładkę; ten wpis to konkretnie kombinacja SYSTEM_ALERT_WINDOW + BIND_ACCESSIBILITY_SERVICE, która daje "pełną kontrolę nad pętlą sprzężenia zwrotnego UI" -- nakładka ukrywa co się naprawdę dzieje (płaszcz) podczas gdy usługa dostępności odczytuje ekran i wstrzykuje syntetyczne dotknięcia i naciśnięcia klawiszy (sztylet). Pierwszym zadaniem samej nakładki jest bootstrapping: clickjacking użytkownika by włączył usługę dostępności w pierwszej kolejności. Gdy obie są aktywne, atakujący może po cichu przejść przez dialogi uprawnień by osiągnąć "god-mode" (wszystkie uprawnienia przyznane, bez świadomej zgody użytkownika), logować naciśnięcia klawiszy i PIN przez zdarzenia dostępności, i odblokować urządzenie przy wyłączonym ekranie. We własnym badaniu autorów z 20 uczestnikami, żaden nie wykrył że jest atakowany. Ustalenie jednomyślne we wszystkich trzech przejściach badawczych i bezpośrednio istotne dla obron udokumentowanych gdzie indziej w tym katalogu: FLAG_SECURE, który blokuje przechwytywanie zrzutu ekranu i nagrywania ekranu, NIE blokuje odczytu drzewa dostępności -- złośliwa usługa dostępności odczytuje strukturalny tekst/etykiety każdego pola na ekranie bezpośrednio, nigdy nie przechwytując piksela. Odpowiedź Google na pierwotne badania była głównie zmianą zachowania platformy (usunięcie cichego auto-przyznawania SYSTEM_ALERT_WINDOW, zaostrzone w Android 8.0) zamiast pojedynczego załatanego CVE dla samej kombinacji -- i, wszystkie trzy przejścia potwierdzają, to zamknęło tylko bezpodstawny błąd bootstrappingu. Podstawowa kombinacja nakładka+dostępność pozostaje żywym, aktywnie uzbrojonym wzorcem w trojanach bankowych Android 2019-2025 (Cerberus, TeaBot, Xenomorph, Crocodilus, Herodotus) które po prostu socjotechnicznie skłaniają użytkownika do ręcznego przyznania dostępności zamiast tego.'
  metrics:
  - k: 20 / 20
    v:
      en: subjects in the original user study, none of whom detected they were under attack
      pl: uczestników oryginalnego badania, żaden nie wykrył że jest atakowany
  - k: TeaBot / Anatsa
    v:
      en: banking trojan confirmed (Cleafy) to combine overlay phishing with accessibility auto-acceptance of permission dialogs
      pl: trojan bankowy potwierdzony (Cleafy) łączący phishing przez nakładkę z automatycznym akceptowaniem dialogów uprawnień przez dostępność
  - k: SecuriDropper (2023)
    v:
      en: documented dropper bypassing Android 13's Restricted Settings via a session-based install API that mimics a legitimate marketplace install
      pl: udokumentowany dropper omijający Restricted Settings Android 13 przez sesyjne API instalacji które naśladuje legalną instalację ze sklepu
  - k: No single CVE
    v:
      en: the original two-permission combination itself was never assigned one CVE -- Google treated it largely as a platform design change
      pl: sama pierwotna kombinacja dwóch uprawnień nigdy nie otrzymała jednego CVE -- Google potraktowało to głównie jako zmianę projektu platformy
