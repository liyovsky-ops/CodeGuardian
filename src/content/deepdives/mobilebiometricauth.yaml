meta:
  id: mobilebiometricauth
  threatId: '15.19'
  severity: High
  color: '#db2777'
  colorRgb: 219,39,119
  cwe: CWE-287
  cvss: N/A (technique class; flagship modern case CVE-2024-26322 -- ownCloud Android -- CVSS 4.0; presentation-attack research (Cisco Talos) reports ~80% average spoofing success across tested devices)
  standard: OWASP MASVS-AUTH (MASTG-TEST-0018 Android / MASTG-TEST-0064 iOS; newer MASTG-TEST-0266 "References to APIs for Event-Bound Biometric Authentication")
hero:
  titleMain: 'Insecure Biometric '
  titleGrad: Authentication
  titleTail: ''
  topbar: Insecure Biometric Authentication Implementation (Android + iOS)
  lead:
    en: 'All three research passes converged on the same core distinction this catalog''s 15.17 entry already established for Keystore keys generally, now applied specifically to the biometric-prompt APIs: event-bound authentication (the app checks a boolean/callback result -- Android''s onAuthenticationSucceeded() with no CryptoObject, iOS''s evaluatePolicy() success closure) versus crypto-bound authentication (the prompt is tied to releasing a hardware-backed key, so the TEE/Secure Enclave itself enforces the gate, not app code). All three teams independently found and described the identical bypass tooling by name: the WithSecure Labs Frida scripts fingerprint-bypass.js (fabricates a success callback with a null CryptoObject) and fingerprint-bypass-via-exception-handling.js (for apps that pass a CryptoObject but never actually use its cipher), plus objection''s ios ui biometrics_bypass (hooks LAContext''s evaluatePolicy reply block to force success) -- and all three confirmed these fail outright against a genuinely crypto-bound implementation. A sharp nuance one research pass surfaced, worth stating precisely: Google and Apple''s own primary documentation does NOT contain a blunt "event-bound is insecure" warning -- CryptoObject is presented as an optional enhancement, not a mandate. The strong, explicit warnings about this exact failure mode come from OWASP MASTG and independent researchers (WithSecure, SecuRing), not from the platform vendors themselves, which likely explains why the pattern remains common. A second, equally important finding unanimous across all three teams: presentation attacks against the sensor itself -- fake fingerprints, photos or masks for face unlock -- are a genuinely distinct attack class from software hooking, confirmed by Cisco Talos research achieving roughly 80% average spoofing success across eight tested device classes using 3D-printed fingerprint molds. Crypto-binding, the fix for hooking, does nothing against this: if the real sensor is fooled, the hardware legitimately releases the key.'
    pl: 'Wszystkie trzy przejścia badawcze zbiegły się na tym samym podstawowym rozróżnieniu które własny wpis 15.17 tego katalogu już ustalił dla kluczy Keystore ogólnie, teraz zastosowanym konkretnie do API monitów biometrycznych: uwierzytelnienie oparte na zdarzeniu (apka sprawdza wynik boolean/callback -- onAuthenticationSucceeded() Android bez CryptoObject, closure sukcesu evaluatePolicy() iOS) w porównaniu do uwierzytelnienia związanego kryptograficznie (monit jest związany ze zwolnieniem klucza wspartego sprzętowo, więc sam TEE/Secure Enclave egzekwuje bramkę, nie kod apki). Wszystkie trzy zespoły niezależnie znalazły i opisały identyczne narzędzie obejścia po nazwie: skrypty Frida WithSecure Labs fingerprint-bypass.js (fabrykuje callback sukcesu z pustym CryptoObject) i fingerprint-bypass-via-exception-handling.js (dla apek które przekazują CryptoObject ale nigdy faktycznie nie używają jego szyfru), plus ios ui biometrics_bypass objection (zaczepia blok reply evaluatePolicy LAContext by wymusić sukces) -- i wszystkie trzy potwierdziły że one całkowicie zawodzą przeciw naprawdę związanej kryptograficznie implementacji. Ostry niuans który ujawniło jedno przejście badawcze, warty precyzyjnego stwierdzenia: własna pierwotna dokumentacja Google i Apple NIE zawiera bezpośredniego ostrzeżenia "oparte na zdarzeniu jest niebezpieczne" -- CryptoObject jest przedstawiane jako opcjonalne ulepszenie, nie nakaz. Silne, jawne ostrzeżenia o dokładnie tym trybie awarii pochodzą od OWASP MASTG i niezależnych badaczy (WithSecure, SecuRing), nie od samych dostawców platform, co prawdopodobnie wyjaśnia dlaczego wzorzec pozostaje powszechny. Drugie, równie ważne ustalenie jednomyślne we wszystkich trzech zespołach: ataki prezentacji przeciwko samemu czujnikowi -- fałszywe odciski palców, zdjęcia albo maski dla odblokowania twarzą -- to naprawdę odrębna klasa ataku od zaczepiania oprogramowania, potwierdzona badaniami Cisco Talos osiągającymi około 80% średniego sukcesu spoofingu w ośmiu testowanych klasach urządzeń używając form odcisków palców drukowanych 3D. Wiązanie kryptograficzne, naprawa dla zaczepiania, nic nie robi przeciw temu: jeśli prawdziwy czujnik zostanie oszukany, sprzęt legalnie zwalnia klucz.'
  metrics:
  - k: CVE-2024-26322
    v:
      en: 'ownCloud Android: biometric authentication bypass with physical access, fixed in 4.2.0'
      pl: 'ownCloud Android: obejście uwierzytelnienia biometrycznego z fizycznym dostępem, naprawione w 4.2.0'
  - k: ~80%
    v:
      en: average fake-fingerprint spoofing success across 8 tested device classes (Cisco Talos, 2020), confirmed by all 3 research passes
      pl: średni sukces spoofingu fałszywym odciskiem palca w 8 testowanych klasach urządzeń (Cisco Talos, 2020), potwierdzone przez wszystkie 3 przejścia badawcze
  - k: Bitwarden, Dashlane, Signal
    v:
      en: named password-manager/messenger apps demonstrated bypassable at specific versions (SEC Consult, 2023) via the event-bound pattern
      pl: nazwane apki menedżera haseł/komunikatora zademonstrowane jako omijalne w konkretnych wersjach (SEC Consult, 2023) przez wzorzec oparty na zdarzeniu
  - k: Two distinct attacks
    v:
      en: hooking (defeated by crypto-binding) and sensor presentation attacks (not defeated by crypto-binding) require different defenses entirely
      pl: zaczepianie (pokonane przez wiązanie kryptograficzne) i ataki prezentacji czujnika (niepokonane przez wiązanie kryptograficzne) wymagają zupełnie różnych obron
  sources:
