meta:
  id: xxe
  threatId: cat_1_research11
  severity: Critical
  color: '#0ea5e9'
  colorRgb: 14,165,233
  cwe: CWE-611
  cvss: '7.5'
  standard: OWASP A05:2021
hero:
  titleMain: 'XML External '
  titleGrad: Entity
  titleTail: ' (XXE)'
  topbar: XML External Entity (XXE) Injection
  lead:
    en: XXE happens when an XML parser resolves external entities from untrusted input — a DOCTYPE declaring <!ENTITY x SYSTEM "file:///etc/passwd"> makes the parser fetch that file and embed it inline. Parameter entities and an attacker-hosted external DTD extend this to blind, out-of-band exfiltration even with zero reflection, and the same entity mechanism can point at internal URLs for SSRF or cloud metadata credential theft. A base file-read scenario scores CVSS 7.5, but real chains (XXE → SSRF → admin takeover, as in Zimbra CVE-2019-9670) escalate to full RCE.
    pl: XXE zdarza się, gdy parser XML rozwiązuje encje zewnętrzne z niezaufanego wejścia — DOCTYPE deklarujący <!ENTITY x SYSTEM "file:///etc/passwd"> powoduje że parser pobiera ten plik i wstawia go inline. Encje parametryczne i zewnętrzny DTD hostowany przez atakującego rozszerzają to na ślepą eksfiltrację out-of-band nawet bez żadnego odbicia, a ten sam mechanizm encji może wskazywać na wewnętrzne URL-e dla SSRF lub kradzieży poświadczeń z metadanych chmury. Podstawowy scenariusz odczytu pliku ocenia się na CVSS 7.5, ale realne łańcuchy (XXE → SSRF → przejęcie admina, jak w Zimbra CVE-2019-9670) eskalują do pełnego RCE.
  metrics:
  - k: CWE-611
    v:
      en: Weakness ID
      pl: ID słabości
  - k: '7.5'
